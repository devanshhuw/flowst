utine scheduled to run in the background: asyncio.create_task(coro)."},{"term":"Semaphore","def":"Limits how many coroutines may do something at the same time."}],"explain":"asyncio handles thousands of waiting tasks in one thread. Every `await` is a point where Python may switch to another coroutine, so never call blocking functions (like time.sleep) inside coroutines: use `await asyncio.sleep`.","example":{"code":"import asyncio\nasync def fetch(name, delay):              # async def makes a coroutine function\n    await asyncio.sleep(delay)             # await pauses THIS coroutine; others can run\n    return f\"{name} done\"\nasync def main():\n    results = await asyncio.gather(fetch(\"a\", 0.2), fetch(\"b\", 0.1))   # run both at once\n    print(results)                         # ['a done', 'b done'] (in call order)\nasyncio.run(main())                        # start the event loop\n"},"mistakes":["Calling a coroutine function without `await`: you get a coroutine object and a \"never awaited\" warning.","Using `time.sleep(1)` inside a coroutine: it blocks everything. Use `await asyncio.sleep(1)`.","Calling `asyncio.run` inside an already running loop (like in some notebooks): `await` the coroutine instead."],"exercises":[{"title":"double_later","prompt":"Write `async def double_later(n)` that waits 0.01 seconds with `asyncio.sleep` and then returns `n * 2`.","starter":"import asyncio\n\nasync def double_later(n):\n    pass\n","solution":"import asyncio\n\nasync def double_later(n):\n    await asyncio.sleep(0.01)\n    return n * 2","hint":"","tests":[{"expected":"8","append":"import asyncio\nprint(asyncio.run(double_later(4)))"}],"local_only":false},{"title":"gather_squares","prompt":"Write `async def gather_squares(nums)` that computes every square in its own coroutine (each awaiting `asyncio.sleep(0.01)`), runs them concurrently with `asyncio.gather` and returns the list of squares.","starter":"import asyncio\n\nasync def gather_squares(nums):\n    pass\n","solution":"import asyncio\n\nasync def square(n):\n    await asyncio.sleep(0.01)\n    return n * n\n\nasync def gather_squares(nums):\n    return list(await asyncio.gather(*(square(n) for n in nums)))","hint":"","tests":[{"expected":"[1, 4, 9]\n[]","append":"import asyncio\nprint(asyncio.run(gather_squares([1, 2, 3])))\nprint(asyncio.run(gather_squares([])))"}],"local_only":false},{"title":"first_result","prompt":"Write `async def first_result(delay, timeout)` that waits `delay` seconds using `asyncio.wait_for(asyncio.sleep(delay), timeout)`; return `\"ok\"`, or `\"timeout\"` if it took longer than `timeout`.","starter":"import asyncio\n\nasync def first_result(delay, timeout):\n    pass\n","solution":"import asyncio\n\nasync def first_result(delay, timeout):\n    try:\n        await asyncio.wait_for(asyncio.sleep(delay), timeout)\n        return \"ok\"\n    except asyncio.TimeoutError:\n        return \"timeout\"","hint":"","tests":[{"expected":"ok\ntimeout","append":"import asyncio\nprint(asyncio.run(first_result(0.01, 0.5)))\nprint(asyncio.run(first_result(0.5, 0.05)))"}],"local_only":false}],"quiz":[{"q":"What does await do?","options":["Pauses this coroutine so others can run","Blocks the whole program","Starts a thread"],"answer":0,"why":"It is a switching point."},{"q":"What starts the event loop?","options":["asyncio.run(main())","await main","main()"],"answer":0,"why":"run creates and runs the loop."},{"q":"What does asyncio.gather do?","options":["Runs coroutines concurrently and collects results","Gathers files","Sorts tasks"],"answer":0,"why":"Results come back in call order."},{"q":"Which sleeps correctly inside a coroutine?","options":["time.sleep(1)","await asyncio.sleep(1)","sleep(1)"],"answer":1,"why":"time.sleep blocks the event loop."},{"q":"What happens if you forget await?","options":["SyntaxError","It runs anyway","You get a coroutine object that never ran"],"answer":2,"why":"Python warns it was never awaited."}],"challenge":{"title":"run_limited","prompt":"Write `async def run_limited(n_tasks, limit)` that starts `n_tasks` coroutines at once, each sleeping 0.01 s, but never lets more than `limit` run simultaneously (use `asyncio.Semaphore`). Return the highest number that ran at the same time.","starter":"import asyncio\n\nasync def run_limited(n_tasks, limit):\n    pass\n","solution":"import asyncio\n\nasync def run_limited(n_tasks, limit):\n    sem = asyncio.Semaphore(limit)\n    running = 0\n    peak = 0\n\n    async def job():\n        nonlocal running, peak\n        async with sem:\n            running += 1\n            peak = max(peak, running)\n            await asyncio.sleep(0.01)\n            running -= 1\n\n    await asyncio.gather(*(job() for _ in range(n_tasks)))\n    return peak","hint":"async with sem: wraps the part that must be limited.","tests":[{"expected":"3\n2","append":"import asyncio\nprint(asyncio.run(run_limited(10, 3)))\nprint(asyncio.run(run_limited(2, 5)))"}],"local_only":false}},{"id":53,"track":"PRO","slug":"sqlite","title":"SQLite databases","terms":[{"term":"database","def":"Organised storage that you can search and update quickly, even with millions of rows."},{"term":"SQL","def":"Structured Query Language: the language for talking to databases (CREATE, INSERT, SELECT, UPDATE, DELETE)."},{"term":"table / row / column","def":"A table holds rows (records); each row has the same columns (fields)."},{"term":"primary key","def":"A column whose value uniquely identifies each row."},{"term":"sqlite3","def":"The module for SQLite, a full database stored in a single file (or in memory). No server needed."},{"term":"placeholder ?","def":"Marks where a value goes: execute(\"... WHERE age > ?\", (30,)). It prevents SQL injection."},{"term":"commit","def":"Saves the changes you made. Until then they can be undone."}],"explain":"SQLite is a real SQL database that ships with Python. Always pass values through `?` placeholders; never build SQL by gluing strings together with user input, because that allows SQL injection attacks.","example":{"code":"import sqlite3\ncon = sqlite3.connect(\":memory:\")            # a database in memory (use \"app.db\" for a file)\ncon.execute(\"CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER)\")\ncon.execute(\"INSERT INTO users (name, age) VALUES (?, ?)\", (\"Ada\", 36))   # ? keeps data safe\ncon.executemany(\"INSERT INTO users (name, age) VALUES (?, ?)\", [(\"Bo\", 25), (\"Cy\", 41)])\ncon.commit()                                 # save the changes\nfor row in con.execute(\"SELECT name, age FROM users WHERE age > ? ORDER BY age\", (30,)):\n    print(row)                               # ('Ada', 36) then ('Cy', 41)\nprint(con.execute(\"SELECT COUNT(*) FROM users\").fetchone()[0])   # 3\ncon.close()\n"},"mistakes":["Building SQL with f-strings and user input: `f\"... WHERE name = '{name}'\"` can be attacked. Use `?`.","Forgetting `commit()` on a file database: your inserts vanish when the program ends.","Passing a single value without a tuple: `execute(sql, (5))` is wrong, write `execute(sql, (5,))`."],"exercises":[{"title":"create_db","prompt":"Write `create_db()` returning an in-memory connection with a table `books(title TEXT, year INTEGER)` holding exactly these rows: Dune 1965, Emma 1815, Ulysses 1922.","starter":"import sqlite3\n\ndef create_db():\n    pass\n","solution":"import sqlite3\n\ndef create_db():\n    con = sqlite3.connect(\":memory:\")\n    con.execute(\"CREATE TABLE books (title TEXT, year INTEGER)\")\n    con.executemany(\"INSERT INTO books VALUES (?, ?)\", [(\"Dune\", 1965), (\"Emma\", 1815), (\"Ulysses\", 1922)])\n    con.commit()\n    return con","hint":"","tests":[{"expected":"[('Emma',), ('Ulysses',), ('Dune',)]","append":"con = create_db()\nprint(con.execute('SELECT title FROM books ORDER BY year').fetchall())"}],"local_only":false},{"title":"titles_after","prompt":"`con` has a table `books(title, year)`. Write `titles_after(con, year)` returning the titles published after `year`, alphabetically, as a list of strings. Use a `?` placeholder.","starter":"def titles_after(con, year):\n    pass\n","solution":"def titles_after(con, year):\n    rows = con.execute(\"SELECT title FROM books WHERE year > ? ORDER BY title\", (year,))\n    return [row[0] for row in rows]","hint":"","tests":[{"expected":"['Dune', 'Ulysses']\n[]","append":"import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('CREATE TABLE books (title TEXT, year INTEGER)')\ncon.executemany('INSERT INTO books VALUES (?, ?)', [('Dune', 1965), ('Emma', 1815), ('Ulysses', 1922)])\nprint(titles_after(con, 1900))\nprint(titles_after(con, 2000))"}],"local_only":false},{"title":"average_age","prompt":"`con` has a table `users(name, age)`. Write `average_age(con)` returning the average age using SQL's `AVG`.","starter":"def average_age(con):\n    pass\n","solution":"def average_age(con):\n    return con.execute(\"SELECT AVG(age) FROM users\").fetchone()[0]","hint":"","tests":[{"expected":"30.0","append":"import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('CREATE TABLE users (name TEXT, age INTEGER)')\ncon.executemany('INSERT INTO users VALUES (?, ?)', [('a', 20), ('b', 30), ('c', 40)])\nprint(average_age(con))"}],"local_only":false}],"quiz":[{"q":"What is the safe way to put a value into a query?","options":["String concatenation","An f-string","A ? placeholder"],"answer":2,"why":"It prevents SQL injection."},{"q":"What does commit() do?","options":["Runs a query","Saves the changes","Closes the database"],"answer":1,"why":"Without it file changes may be lost."},{"q":"What does \":memory:\" mean?","options":["A temporary in-memory database","A file named memory","A table"],"answer":0,"why":"It vanishes when the connection closes."},{"q":"Which statement reads rows?","options":["SELECT","DROP","INSERT"],"answer":0,"why":"SELECT ... FROM table."},{"q":"What is a primary key?","options":["The first column","A column that uniquely identifies each row","A password"],"answer":1,"why":"No two rows share it."}],"challenge":{"title":"Notes class","prompt":"Write a `Notes` class backed by an in-memory SQLite database: `add(text)` returns the new note's id (1, 2, ...), `all()` returns every text in insertion order, `search(word)` returns the texts containing `word`.","starter":"import sqlite3\n\nclass Notes:\n    pass\n","solution":"import sqlite3\n\nclass Notes:\n    def __init__(self):\n        self.con = sqlite3.connect(\":memory:\")\n        self.con.execute(\"CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)\")\n\n    def add(self, text):\n        cur = self.con.execute(\"INSERT INTO notes (text) VALUES (?)\", (text,))\n        self.con.commit()\n        return cur.lastrowid\n\n    def all(self):\n        return [r[0] for r in self.con.execute(\"SELECT text FROM notes ORDER BY id\")]\n\n    def search(self, word):\n        rows = self.con.execute(\"SELECT text FROM notes WHERE text LIKE ? ORDER BY id\", (f\"%{word}%\",))\n        return [r[0] for r in rows]","hint":"cursor.lastrowid gives the id of the row you just inserted.","tests":[{"expected":"1 2\n['buy milk', 'call mom']\n['buy milk']","append":"n = Notes()\na = n.add('buy milk')\nb = n.add('call mom')\nprint(a, b)\nprint(n.all())\nprint(n.search('milk'))"}],"local_only":false}},{"id":54,"track":"PRO","slug":"http-apis","title":"HTTP and APIs","terms":[{"term":"HTTP","def":"The protocol of the web: a client sends a request, a server sends back a response."},{"term":"URL","def":"The address of a resource: scheme://host:port/path?query."},{"term":"GET / POST","def":"GET asks for data; POST sends data to the server."},{"term":"status code","def":"A number in the response: 200 OK, 404 not found, 500 server error."},{"term":"query string","def":"The ?key=value&key2=value2 part of a URL. Build it with urllib.parse.urlencode."},{"term":"API","def":"A way for programs to talk to each other. Web APIs usually return JSON."},{"term":"urllib","def":"The standard-library toolbox for HTTP: urllib.request, urllib.parse, urllib.error."}],"explain":"Almost every service offers an HTTP API. You send a request to a URL, check the status code and parse the JSON body. Third-party packages like `requests` make this nicer, but `urllib` is always available. The exercises start a tiny local server so everything works offline.","example":{"code":"import json, os, threading, urllib.parse, urllib.request\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nos.environ[\"NO_PROXY\"] = \"*\"                 # skip any system proxy for local requests\nclass Api(BaseHTTPRequestHandler):            # a tiny local \"API\" so this works offline\n    def do_GET(self):\n        body = json.dumps({\"path\": self.path}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *args):\n        pass\nserver = HTTPServer((\"127.0.0.1\", 0), Api)    # port 0 = pick any free port\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nquery = urllib.parse.urlencode({\"q\": \"python\", \"page\": 2})\nurl = f\"http://127.0.0.1:{server.server_port}/search?{query}\"\nwith urllib.request.urlopen(url) as response:\n    print(response.status)                    # 200\n    data = json.load(response)\nprint(data[\"path\"])                           # /search?q=python&page=2\nserver.shutdown()\n"},"mistakes":["Building URLs by gluing strings: spaces and special characters break. Use `urlencode`.","Not checking the status code: urllib raises HTTPError for 4xx/5xx, so wrap calls in try/except.","Forgetting a timeout: `urlopen(url, timeout=10)` stops a hung server from freezing your program."],"exercises":[{"title":"build_url","prompt":"Write `build_url(base, **params)` returning `base?key=value&...` with the values properly encoded (use `urllib.parse.urlencode`). Return just `base` when there are no params.","starter":"from urllib.parse import urlencode\n\ndef build_url(base, **params):\n    pass\n","solution":"from urllib.parse import urlencode\n\ndef build_url(base, **params):\n    if not params:\n        return base\n    return base + \"?\" + urlencode(params)","hint":"","tests":[{"expected":"http://x.com/s?q=a+b&n=2\nhttp://x.com","append":"print(build_url('http://x.com/s', q='a b', n=2))\nprint(build_url('http://x.com'))"}],"local_only":false},{"title":"get_json","prompt":"Write `get_json(url)` that fetches the URL with `urllib.request.urlopen` and returns the JSON body as Python data.","starter":"import json\nimport urllib.request\n\ndef get_json(url):\n    pass\n","solution":"import json\nimport urllib.request\n\ndef get_json(url):\n    with urllib.request.urlopen(url, timeout=10) as response:\n        return json.load(response)","hint":"","tests":[{"expected":"{'ok': True, 'n': 3}","append":"import json, os, threading\nos.environ[\"NO_PROXY\"] = \"*\"\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == \"/missing\":\n            self.send_response(404)\n            self.end_headers()\n            return\n        body = json.dumps({\"ok\": True, \"n\": 3}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def do_POST(self):\n        size = int(self.headers[\"Content-Length\"])\n        data = json.loads(self.rfile.read(size))\n        body = json.dumps({\"received\": data}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *args):\n        pass\nserver = HTTPServer((\"127.0.0.1\", 0), H)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f\"http://127.0.0.1:{server.server_port}\"\nprint(get_json(base + '/data'))\nserver.shutdown()"}],"local_only":true},{"title":"status_of","prompt":"Write `status_of(url)` returning the HTTP status code of a GET request, including error codes like 404 (catch `urllib.error.HTTPError`).","starter":"import urllib.error\nimport urllib.request\n\ndef status_of(url):\n    pass\n","solution":"import urllib.error\nimport urllib.request\n\ndef status_of(url):\n    try:\n        with urllib.request.urlopen(url, timeout=10) as response:\n            return response.status\n    except urllib.error.HTTPError as err:\n        return err.code","hint":"","tests":[{"expected":"200 404","append":"import json, os, threading\nos.environ[\"NO_PROXY\"] = \"*\"\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == \"/missing\":\n            self.send_response(404)\n            self.end_headers()\n            return\n        body = json.dumps({\"ok\": True, \"n\": 3}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def do_POST(self):\n        size = int(self.headers[\"Content-Length\"])\n        data = json.loads(self.rfile.read(size))\n        body = json.dumps({\"received\": data}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *args):\n        pass\nserver = HTTPServer((\"127.0.0.1\", 0), H)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f\"http://127.0.0.1:{server.server_port}\"\nprint(status_of(base + '/ok'), status_of(base + '/missing'))\nserver.shutdown()"}],"local_only":true}],"quiz":[{"q":"What does status code 404 mean?","options":["Not found","OK","Server error"],"answer":0,"why":"The resource does not exist."},{"q":"Which method sends data to a server?","options":["HEAD","GET","POST"],"answer":2,"why":"GET only asks for data."},{"q":"What is the safe way to build a query string?","options":["urllib.parse.urlencode","split()","String concatenation"],"answer":0,"why":"It escapes special characters."},{"q":"What does urlopen raise for a 404?","options":["HTTPError","KeyError","Nothing"],"answer":0,"why":"Catch urllib.error.HTTPError."},{"q":"Why set a timeout?","options":["It is faster","It is required","A hung server would freeze your program"],"answer":2,"why":"Always set one."}],"challenge":{"title":"post_json","prompt":"Write `post_json(url, data)` that sends `data` as a JSON **POST** request (header `Content-Type: application/json`) and returns the parsed JSON response.","starter":"import json\nimport urllib.request\n\ndef post_json(url, data):\n    pass\n","solution":"import json\nimport urllib.request\n\ndef post_json(url, data):\n    request = urllib.request.Request(url, data=json.dumps(data).encode(), headers={\"Content-Type\": \"application/json\"}, method=\"POST\")\n    with urllib.request.urlopen(request, timeout=10) as response:\n        return json.load(response)","hint":"urllib.request.Request(url, data=bytes, headers=..., method=\"POST\")","tests":[{"expected":"{'received': {'a': 1}}","append":"import json, os, threading\nos.environ[\"NO_PROXY\"] = \"*\"\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == \"/missing\":\n            self.send_response(404)\n            self.end_headers()\n            return\n        body = json.dumps({\"ok\": True, \"n\": 3}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def do_POST(self):\n        size = int(self.headers[\"Content-Length\"])\n        data = json.loads(self.rfile.read(size))\n        body = json.dumps({\"received\": data}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def log_message(self, *args):\n        pass\nserver = HTTPServer((\"127.0.0.1\", 0), H)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f\"http://127.0.0.1:{server.server_port}\"\nprint(post_json(base + '/echo', {'a': 1}))\nserver.shutdown()"}],"local_only":true}},{"id":55,"track":"PRO","slug":"argparse","title":"Command-line tools with argparse","terms":[{"term":"CLI","def":"Command-line interface: a program you run in a terminal with arguments, like `git commit -m msg`."},{"term":"argument","def":"A value given to the program on the command line."},{"term":"positional argument","def":"A required value identified by position: `copy SOURCE DEST`."},{"term":"option / flag","def":"A named argument starting with -- (or -): --times 3 or --verbose."},{"term":"argparse","def":"The standard module that parses sys.argv, validates it and writes --help for you."},{"term":"exit code","def":"A number a program returns to the system: 0 means success, anything else means an error."},{"term":"subcommand","def":"A mode such as `git add` or `git commit`, built with add_subparsers()."}],"explain":"`argparse` turns a list of strings (normally `sys.argv[1:]`) into a tidy object of typed values, rejects bad input with a clear message and generates `--help`. Passing the list explicitly, as below, makes your parser easy to test.","example":{"code":"import argparse\nparser = argparse.ArgumentParser(description=\"Greet someone\")\nparser.add_argument(\"name\")                              # positional (required)\nparser.add_argument(\"--times\", type=int, default=1, help=\"how many times\")   # option\nparser.add_argument(\"--shout\", action=\"store_true\")      # flag: True when present\nargs = parser.parse_args([\"Ada\", \"--times\", \"2\", \"--shout\"])   # normally: parse_args() reads sys.argv\nfor _ in range(args.times):\n    msg = f\"Hello, {args.name}!\"\n    print(msg.upper() if args.shout else msg)\n"},"mistakes":["Calling `parse_args()` in code you want to test: pass a list, `parse_args(argv)`.","Forgetting `type=int`: numbers arrive as strings.","On bad input argparse prints usage and exits with code 2 (SystemExit): catch it in tests."],"exercises":[{"title":"parse","prompt":"Write `parse(argv)` returning the parsed arguments: one or more whole numbers `numbers` (positional, `nargs=\"+\"`) and an option `--op` that must be `sum` or `max` (default `sum`).","starter":"import argparse\n\ndef parse(argv):\n    pass\n","solution":"import argparse\n\ndef parse(argv):\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"numbers\", type=int, nargs=\"+\")\n    parser.add_argument(\"--op\", choices=[\"sum\", \"max\"], default=\"sum\")\n    return parser.parse_args(argv)","hint":"","tests":[{"expected":"[1, 2, 3] max\nsum","append":"ns = parse(['1', '2', '3', '--op', 'max'])\nprint(ns.numbers, ns.op)\nprint(parse(['4']).op)"}],"local_only":false},{"title":"main","prompt":"Write `main(argv)`: parse the same arguments (numbers and `--op sum|max`) and **print** the sum or the maximum.","starter":"import argparse\n\ndef main(argv):\n    pass\n","solution":"import argparse\n\ndef main(argv):\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"numbers\", type=int, nargs=\"+\")\n    parser.add_argument(\"--op\", choices=[\"sum\", \"max\"], default=\"sum\")\n    args = parser.parse_args(argv)\n    print(sum(args.numbers) if args.op == \"sum\" else max(args.numbers))","hint":"","tests":[{"expected":"7\n9","append":"main(['3', '4'])\nmain(['3', '9', '--op', 'max'])"}],"local_only":false},{"title":"parse_flags","prompt":"Write `parse_flags(argv)` with a counting flag `-v/--verbose` (`action=\"count\"`, default 0) and `--name` (default `world`).","starter":"import argparse\n\ndef parse_flags(argv):\n    pass\n","solution":"import argparse\n\ndef parse_flags(argv):\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"-v\", \"--verbose\", action=\"count\", default=0)\n    parser.add_argument(\"--name\", default=\"world\")\n    return parser.parse_args(argv)","hint":"","tests":[{"expected":"2\n0\nworld\nAda","append":"print(parse_flags(['-vv']).verbose)\nprint(parse_flags([]).verbose)\nprint(parse_flags([]).name)\nprint(parse_flags(['--name', 'Ada']).name)"}],"local_only":false}],"quiz":[{"q":"What does action=\"store_true\" create?","options":["A required value","A list","A flag that is True when present"],"answer":2,"why":"Used for switches like --verbose."},{"q":"What does parse_args() read by default?","options":["input()","sys.argv","A file"],"answer":1,"why":"The command-line arguments."},{"q":"What happens on invalid arguments?","options":["Silent default","A KeyError","Usage message and exit code 2"],"answer":2,"why":"argparse calls sys.exit(2)."},{"q":"Which makes an option take a number?","options":["number=True","cast=int","type=int"],"answer":2,"why":"Otherwise it is a string."},{"q":"What is an exit code of 0?","options":["Failure","Warning","Success"],"answer":2,"why":"Non-zero means an error."}],"challenge":{"title":"parse_strict","prompt":"Write `parse_strict(argv)` with an option `--count` that must be a whole number from 1 to 10. Use a custom `type` function raising `argparse.ArgumentTypeError` for anything else, so bad input makes argparse exit with code 2.","starter":"import argparse\n\ndef parse_strict(argv):\n    pass\n","solution":"import argparse\n\ndef bounded(text):\n    value = int(text)\n    if not 1 <= value <= 10:\n        raise argparse.ArgumentTypeError(\"must be 1-10\")\n    return value\n\ndef parse_strict(argv):\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--count\", type=bounded, default=1)\n    return parser.parse_args(argv)","hint":"A type function may raise ValueError or ArgumentTypeError to reject a value.","tests":[{"expected":"5\n1\nexit 2\nexit 2","append":"import contextlib, io\nprint(parse_strict(['--count', '5']).count)\nprint(parse_strict([]).count)\nwith contextlib.redirect_stderr(io.StringIO()):\n    for bad in (['--count', '50'], ['--count', 'x']):\n        try:\n            parse_strict(bad)\n        except SystemExit as e:\n            print('exit', e.code)"}],"local_only":false}},{"id":56,"track":"PRO","slug":"packaging","title":"Packaging a project","terms":[{"term":"package","def":"A folder of Python modules with an __init__.py that can be imported by name."},{"term":"pyproject.toml","def":"The standard configuration file describing a project: name, version, dependencies and how to build it."},{"term":"src layout","def":"Keeping your package under src/ so tests import the installed code, not the loose folder."},{"term":"version (semver)","def":"MAJOR.MINOR.PATCH: bump MAJOR for breaking changes, MINOR for new features, PATCH for fixes."},{"term":"entry point","def":"A command (like `greet`) that pip creates and that runs one of your functions."},{"term":"wheel / sdist","def":"The files `python -m build` produces: a ready-to-install wheel and a source archive."},{"term":"editable install","def":"pip install -e . links your folder so edits take effect immediately."}],"explain":"Packaging turns a folder of scripts into something others can `pip install`. The minimum is a package folder and a `pyproject.toml`. In this chapter you create the files from Python, exactly as a project scaffolding tool would.","example":{"code":"from pathlib import Path\nroot = Path(\"mypkg_demo\")\n(root / \"src\" / \"greeter\").mkdir(parents=True, exist_ok=True)\n(root / \"src\" / \"greeter\" / \"__init__.py\").write_text('def hello(name):\\n    return f\"Hello, {name}!\"\\n')\n(root / \"pyproject.toml\").write_text('[project]\\nname = \"greeter\"\\nversion = \"0.1.0\"\\ndescription = \"A tiny greeting package\"\\n\\n[build-system]\\nrequires = [\"setuptools\"]\\nbuild-backend = \"setuptools.build_meta\"\\n')\nimport sys\nsys.path.insert(0, str(root / \"src\"))      # make it importable without installing\nimport greeter\nprint(greeter.hello(\"Ada\"))\nprint((root / \"pyproject.toml\").read_text().splitlines()[1])   # name = \"greeter\"\n# next steps in a real terminal:  pip install build ; python -m build ; pip install -e .\n"},"mistakes":["Forgetting `__init__.py`: the folder may still import in new Python versions, but tools and older setups treat it as a plain folder.","Naming the package like a standard module (`email`, `test`), which shadows it.","Never bumping the version: users cannot tell releases apart."],"exercises":[{"title":"Create a package","prompt":"From your program create the package `calc` as `src/calc/__init__.py` containing `def add(a, b): return a + b`. Put `src` on `sys.path`, import `calc` and print `calc.add(2, 3)`.","starter":"# Write your code below\n","solution":"from pathlib import Path\nimport sys\n\npkg = Path(\"src\") / \"calc\"\npkg.mkdir(parents=True, exist_ok=True)\n(pkg / \"__init__.py\").write_text(\"def add(a, b):\\n    return a + b\\n\")\nsys.path.insert(0, \"src\")\nimport calc\nprint(calc.add(2, 3))","hint":"","tests":[{"expected":"5"}],"local_only":false},{"title":"make_pyproject","prompt":"Write `make_pyproject(name, version)` returning the text of a minimal `pyproject.toml`: it starts with a `[project]` table containing `name = \"...\"` and `version = \"...\"`, followed by a `[build-system]` table for setuptools.","starter":"def make_pyproject(name, version):\n    pass\n","solution":"def make_pyproject(name, version):\n    return (\n        \"[project]\\n\"\n        f'name = \"{name}\"\\n'\n        f'version = \"{version}\"\\n'\n        \"\\n\"\n        \"[build-system]\\n\"\n        'requires = [\"setuptools\"]\\n'\n        'build-backend = \"setuptools.build_meta\"\\n'\n    )","hint":"","tests":[{"expected":"True True True True","append":"text = make_pyproject('demo', '1.2.3')\nprint(text.startswith('[project]'), 'name = \"demo\"' in text, 'version = \"1.2.3\"' in text, '[build-system]' in text)"}],"local_only":true},{"title":"bump_minor","prompt":"Write `version_tuple(text)` (\"1.2.3\" becomes (1, 2, 3)) and `bump_minor(text)` returning the next minor version with the patch reset to 0 (\"1.2.3\" becomes \"1.3.0\").","starter":"def version_tuple(text):\n    pass\n\ndef bump_minor(text):\n    pass\n","solution":"def version_tuple(text):\n    return tuple(int(p) for p in text.split(\".\"))\n\ndef bump_minor(text):\n    major, minor, patch = version_tuple(text)\n    return f\"{major}.{minor + 1}.0\"","hint":"","tests":[{"expected":"(1, 2, 3)\n1.3.0\n0.10.0","append":"print(version_tuple('1.2.3'))\nprint(bump_minor('1.2.3'))\nprint(bump_minor('0.9.9'))"}],"local_only":false}],"quiz":[{"q":"What makes a folder a regular package?","options":["An __init__.py file","A README","A .toml file"],"answer":0,"why":"It marks the folder as importable."},{"q":"What does pyproject.toml hold?","options":["Passwords","Your tests","Project metadata and build settings"],"answer":2,"why":"Name, version, dependencies, build backend."},{"q":"Which part of 2.5.1 changes for a bug fix?","options":["The first number","The middle number","The last number (patch)"],"answer":2,"why":"Semantic versioning: MAJOR.MINOR.PATCH."},{"q":"What does pip install -e . do?","options":["Links your folder so edits take effect","Uploads to PyPI","Deletes the folder"],"answer":0,"why":"Editable install for development."},{"q":"What does python -m build create?","options":["A virtual environment","A wheel and a source archive","Documentation"],"answer":1,"why":"Files you can upload or install."}],"challenge":{"title":"scaffold","prompt":"Write `scaffold(root, name)` that creates a project skeleton under the folder `root` with the files `pyproject.toml`, `README.md`, `src/<name>/__init__.py` (containing `__version__ = \"0.1.0\"`) and `tests/test_basic.py`, then returns the sorted list of the file paths relative to `root` using forward slashes.","starter":"from pathlib import Path\n\ndef scaffold(root, name):\n    pass\n","solution":"from pathlib import Path\n\ndef scaffold(root, name):\n    base = Path(root)\n    (base / \"src\" / name).mkdir(parents=True, exist_ok=True)\n    (base / \"tests\").mkdir(parents=True, exist_ok=True)\n    (base / \"pyproject.toml\").write_text(f'[project]\\nname = \"{name}\"\\nversion = \"0.1.0\"\\n')\n    (base / \"README.md\").write_text(f\"# {name}\\n\")\n    (base / \"src\" / name / \"__init__.py\").write_text('__version__ = \"0.1.0\"\\n')\n    (base / \"tests\" / \"test_basic.py\").write_text(f\"import {name}\\n\\n\\ndef test_version():\\n    assert {name}.__version__\\n\")\n    return sorted(p.relative_to(base).as_posix() for p in base.rglob(\"*\") if p.is_file())","hint":"Path.rglob(\"*\") walks every file and folder below a path.","tests":[{"expected":"['README.md', 'pyproject.toml', 'src/tiny/__init__.py', 'tests/test_basic.py']","append":"print(scaffold('proj', 'tiny'))"}],"local_only":false}},{"id":57,"track":"PRO","slug":"performance-profiling","title":"Performance and profiling","terms":[{"term":"profiling","def":"Measuring where a program spends its time, instead of guessing."},{"term":"bottleneck","def":"The slowest part of a program: the only place worth optimising."},{"term":"timeit","def":"A module that times small snippets reliably by running them many times."},{"term":"Big-O","def":"A way to describe how the work grows with the input size: O(n) doubles when the input doubles, O(n squared) quadruples."},{"term":"memoization","def":"Remembering results of earlier calls (functools.lru_cache or a dict) so they are not computed again."},{"term":"cProfile","def":"The built-in profiler that reports how long each function took."}],"explain":"Make it correct first, then measure, then fix the real bottleneck. The biggest wins usually come from a better algorithm or data structure (a set instead of a list, a dict cache, a sieve) rather than clever tricks.","example":{"code":"import timeit, cProfile, pstats, io\ndata_list = list(range(10000))\ndata_set = set(data_list)\nslow = timeit.timeit(lambda: 9999 in data_list, number=200)    # scans the list: O(n)\nfast = timeit.timeit(lambda: 9999 in data_set, number=200)    # hash lookup: O(1)\nprint(slow > fast)                            # True: sets are far faster for lookups\ndef slow_sum():\n    return sum(i * i for i in range(200000))\nprofiler = cProfile.Profile()\nprofiler.enable()\nslow_sum()\nprofiler.disable()\nout = io.StringIO()\npstats.Stats(profiler, stream=out).sort_stats(\"cumulative\").print_stats(3)\nprint(out.getvalue()[:300])                   # which functions took the time\n"},"mistakes":["Optimising before measuring: you may speed up code that was never slow.","Timing once: results vary. Repeat with `timeit` and compare.","Checking `x in a_list` inside a loop: that hides an O(n squared) loop. Convert the list to a set first."],"exercises":[{"title":"has_duplicates","prompt":"Write `has_duplicates(items)` returning True when any value appears twice. It must be fast enough for 30 000 items (think: set).","starter":"def has_duplicates(items):\n    for i in range(len(items)):\n        for j in range(i + 1, len(items)):\n            if items[i] == items[j]:\n                return True\n    return False\n","solution":"def has_duplicates(items):\n    return len(set(items)) != len(items)","hint":"A set drops duplicates: compare lengths.","tests":[{"expected":"True\nFalse\nTrue\nTrue","append":"import time\nprint(has_duplicates([1, 2, 3, 1]))\nprint(has_duplicates([1, 2, 3]))\nbig = list(range(30000)) + [29999]\nt0 = time.time()\nprint(has_duplicates(big))\nprint(time.time() - t0 < 1)"}],"local_only":false},{"title":"fib_memo","prompt":"Write `fib_memo(n)` computing Fibonacci numbers (0, 1, 1, 2, ...) fast, so that `fib_memo(90)` returns instantly. Cache earlier results in a dict.","starter":"def fib_memo(n):\n    if n < 2:\n        return n\n    return fib_memo(n - 1) + fib_memo(n - 2)\n","solution":"def fib_memo(n, memo={0: 0, 1: 1}):\n    if n not in memo:\n        memo[n] = fib_memo(n - 1) + fib_memo(n - 2)\n    return memo[n]","hint":"Without a cache the recursion repeats the same work millions of times.","tests":[{"expected":"2880067194370816120\n55","append":"print(fib_memo(90))\nprint(fib_memo(10))"}],"local_only":false},{"title":"common_items","prompt":"Write `common_items(a, b)` returning the sorted list of values present in both lists. It must handle two lists of 50 000 items in well under a second.","starter":"def common_items(a, b):\n    result = []\n    for x in a:\n        if x in b:\n            result.append(x)\n    return sorted(result)\n","solution":"def common_items(a, b):\n    return sorted(set(a) & set(b))","hint":"","tests":[{"expected":"16667\n[0, 6, 12]\nTrue","append":"import time\na = list(range(0, 100000, 2))\nb = list(range(0, 100000, 3))\nt0 = time.time()\nr = common_items(a, b)\nel = time.time() - t0\nprint(len(r))\nprint(r[:3])\nprint(el < 1)"}],"local_only":false}],"quiz":[{"q":"What should you do before optimising?","options":["Add threads","Measure with a profiler","Rewrite in C"],"answer":1,"why":"Find the real bottleneck."},{"q":"Why is x in my_set faster than x in my_list?","options":["Hash lookup instead of scanning","Sets are smaller","Lists are sorted"],"answer":0,"why":"O(1) versus O(n)."},{"q":"What does memoization do?","options":["Writes comments","Remembers results to avoid recomputing","Compresses data"],"answer":1,"why":"lru_cache or a dict."},{"q":"What does O(n squared) mean?","options":["Always slow","Twice as slow","Work grows with the square of the input"],"answer":2,"why":"Doubling the input quadruples the work."},{"q":"Which tool shows time per function?","options":["print","cProfile","len"],"answer":1,"why":"The built-in profiler."}],"challenge":{"title":"primes_up_to","prompt":"Write `primes_up_to(n)` returning all primes up to n using the Sieve of Eratosthenes. It must find the primes up to 1 000 000 in well under a few seconds.","starter":"def primes_up_to(n):\n    primes = []\n    for k in range(2, n + 1):\n        if all(k % d for d in range(2, int(k ** 0.5) + 1)):\n            primes.append(k)\n    return primes\n","solution":"def primes_up_to(n):\n    if n < 2:\n        return []\n    sieve = bytearray([1]) * (n + 1)\n    sieve[0] = sieve[1] = 0\n    for i in range(2, int(n ** 0.5) + 1):\n        if sieve[i]:\n            sieve[i * i::i] = bytearray(len(range(i * i, n + 1, i)))\n    return [i for i, flag in enumerate(sieve) if flag]","hint":"Cross out the multiples of each prime instead of testing every number.","tests":[{"expected":"78498\n[2, 3, 5, 7]\nTrue","append":"import time\nt0 = time.time()\nbig = primes_up_to(1000000)\nel = time.time() - t0\nprint(len(big))\nprint(primes_up_to(10))\nprint(el < 3)"}],"local_only":false}},{"id":58,"track":"PRO","slug":"design-patterns","title":"Design patterns","terms":[{"term":"design pattern","def":"A named, proven solution to a common design problem."},{"term":"strategy","def":"Pass the behaviour in (often as a function) so it can be swapped."},{"term":"factory","def":"A function or method that decides which class to create."},{"term":"observer","def":"Objects subscribe to events and are notified when something happens (callbacks)."},{"term":"singleton","def":"Exactly one shared instance. In Python a module-level object or cached function is usually enough."},{"term":"pythonic","def":"Using Python's features (functions as values, modules, duck typing) so patterns become much shorter than in other languages."}],"explain":"Patterns are vocabulary: when you say \"it is an observer\" other developers instantly know the shape. Python needs fewer classes for them because functions are values and modules are singletons. Do not force a pattern where simple code works.","example":{"code":"# Strategy: pass the behaviour in as a function\ndef total(prices, discount):\n    return sum(discount(p) for p in prices)\nprint(total([100, 50], lambda p: p * 0.9))      # 135.0\n# Factory: one function decides which class to build\nclass Dog:\n    def speak(self): return \"Woof\"\nclass Cat:\n    def speak(self): return \"Meow\"\ndef make_pet(kind):\n    return {\"dog\": Dog, \"cat\": Cat}[kind]()\nprint(make_pet(\"cat\").speak())                  # Meow\n# Observer: objects subscribe to events\nclass Button:\n    def __init__(self):\n        self.listeners = []\n    def on_click(self, fn):\n        self.listeners.append(fn)\n    def click(self):\n        for fn in self.listeners:\n            fn()\nb = Button()\nb.on_click(lambda: print(\"clicked!\"))\nb.click()                                       # clicked!\n"},"mistakes":["Using a pattern because it sounds professional: start with the simplest code that works.","Singletons hidden in global state make testing hard. Pass the shared object in instead.","Copying Java-style patterns into Python: often a function or a dict does the job."],"exercises":[{"title":"apply_all","prompt":"Write `apply_all(values, strategy)` returning a list with `strategy` applied to every value.","starter":"def apply_all(values, strategy):\n    pass\n","solution":"def apply_all(values, strategy):\n    return [strategy(v) for v in values]","hint":"","tests":[{"expected":"[10, 20, 30]\n['A', 'B']","append":"print(apply_all([1, 2, 3], lambda x: x * 10))\nprint(apply_all(['a', 'b'], str.upper))"}],"local_only":false},{"title":"make_shape","prompt":"`Square` and `Circle` exist. Write the factory `make_shape(kind, size)` returning a `Square` for `\"square\"` or a `Circle` for `\"circle\"`, and raising `ValueError` for anything else.","starter":"class Square:\n    def __init__(self, size):\n        self.size = size\n    def area(self):\n        return self.size ** 2\n\nclass Circle:\n    def __init__(self, size):\n        self.size = size\n    def area(self):\n        return 3.14159 * self.size ** 2\n\ndef make_shape(kind, size):\n    pass\n","solution":"class Square:\n    def __init__(self, size):\n        self.size = size\n    def area(self):\n        return self.size ** 2\n\nclass Circle:\n    def __init__(self, size):\n        self.size = size\n    def area(self):\n        return 3.14159 * self.size ** 2\n\ndef make_shape(kind, size):\n    shapes = {\"square\": Square, \"circle\": Circle}\n    if kind not in shapes:\n        raise ValueError(f\"unknown shape: {kind}\")\n    return shapes[kind](size)","hint":"","tests":[{"expected":"9\n3.14\nunknown","append":"print(round(make_shape('square', 3).area(), 2))\nprint(round(make_shape('circle', 1).area(), 2))\ntry:\n    make_shape('hex', 1)\nexcept ValueError:\n    print('unknown')"}],"local_only":false},{"title":"EventEmitter","prompt":"Write `EventEmitter` with `on(name, fn)` to register a listener and `emit(name, *args)` to call every listener of that event with the arguments. Emitting an event nobody listens to does nothing.","starter":"class EventEmitter:\n    pass\n","solution":"class EventEmitter:\n    def __init__(self):\n        self.listeners = {}\n\n    def on(self, name, fn):\n        self.listeners.setdefault(name, []).append(fn)\n\n    def emit(self, name, *args):\n        for fn in self.listeners.get(name, []):\n            fn(*args)","hint":"","tests":[{"expected":"hello Ada\nhey Ada","append":"e = EventEmitter()\ne.on('hi', lambda n: print('hello', n))\ne.on('hi', lambda n: print('hey', n))\ne.emit('hi', 'Ada')\ne.emit('none')"}],"local_only":false}],"quiz":[{"q":"What is the strategy pattern?","options":["Subscribing to events","Creating one instance","Passing the behaviour in so it can be swapped"],"answer":2,"why":"In Python often just a function argument."},{"q":"What does a factory do?","options":["Decides which class to instantiate","Sorts a list","Stores data"],"answer":0,"why":"make_pet(\"cat\") returns a Cat."},{"q":"What is the observer pattern?","options":["A decorator","Listeners get notified of events","A loop"],"answer":1,"why":"Callbacks registered with on_click."},{"q":"How is a singleton often done in Python?","options":["A special keyword","A module-level object","A loop"],"answer":1,"why":"Modules are imported only once."},{"q":"What is a risk of patterns?","options":["They are slow","They are forbidden","Overcomplicating simple code"],"answer":2,"why":"Use them when they fit."}],"challenge":{"title":"get_config","prompt":"Write `get_config()` returning the **same** settings dict every time it is called (create it on first use with `{\"debug\": False}`), so changes made through one reference are seen through all.","starter":"def get_config():\n    pass\n","solution":"from functools import lru_cache\n\n@lru_cache(maxsize=None)\ndef get_config():\n    return {\"debug\": False}","hint":"Cache the result so the dict is created only once.","tests":[{"expected":"True True\nFalse","append":"a = get_config()\nb = get_config()\na['x'] = 1\nprint(b['x'] == 1, a is b)\nprint(get_config()['debug'])"}],"local_only":false}},{"id":59,"track":"PRO","slug":"metaclasses-descriptors","title":"Metaclasses and descriptors","terms":[{"term":"metaclass","def":"The class of a class. By default it is `type`; a custom one can change how classes are built."},{"term":"type(name, bases, dict)","def":"Creates a class at run time."},{"term":"descriptor","def":"An object with __get__ and/or __set__ that controls how an attribute is read or written on another class."},{"term":"__set_name__","def":"A hook that tells a descriptor the attribute name it was assigned to."},{"term":"__init_subclass__","def":"A hook that runs on the parent class whenever a subclass is created, simpler than a metaclass for registries."},{"term":"__call__ (on a metaclass)","def":"Runs when you call the class to create an instance: it can reuse an old instance (singleton)."}],"explain":"In Python even classes are objects, created by `type`. Descriptors power properties, methods and dataclass fields. Metaclasses are the deepest hook: most programs never need one, and `__init_subclass__` or class decorators are usually simpler. Know they exist and what problem they solve.","example":{"code":"print(type(5), type(int), type(type))     # <class 'int'> <class 'type'> <class 'type'>\nDog = type(\"Dog\", (), {\"sound\": lambda self: \"Woof\"})   # build a class with type()\nprint(Dog().sound())                      # Woof\nclass Positive:                           # a descriptor: controls attribute access\n    def __set_name__(self, owner, name):\n        self.name = \"_\" + name\n    def __get__(self, obj, objtype=None):\n        return getattr(obj, self.name)\n    def __set__(self, obj, value):\n        if value <= 0:\n            raise ValueError(\"must be positive\")\n        setattr(obj, self.name, value)\nclass Item:\n    price = Positive()\n    def __init__(self, price):\n        self.price = price                # goes through Positive.__set__\nprint(Item(5).price)                      # 5\nclass Registry(type):                     # a metaclass: its instances are classes\n    classes = []\n    def __new__(mcs, name, bases, ns):\n        cls = super().__new__(mcs, name, bases, ns)\n        mcs.classes.append(name)\n        return cls\nclass A(metaclass=Registry): pass\nclass B(metaclass=Registry): pass\nprint(Registry.classes)                   # ['A', 'B']\n"},"mistakes":["Reaching for a metaclass first: try a class decorator or `__init_subclass__`.","Storing descriptor data on the descriptor itself: it is shared by all instances. Store it on `obj`.","Mixing up `__get__(self, obj, objtype)` arguments: `obj` is None when accessed on the class."],"exercises":[{"title":"make_class","prompt":"Write `make_class(name, attrs)` that uses `type()` to build and return a class with the given name and class attributes (a dict).","starter":"def make_class(name, attrs):\n    pass\n","solution":"def make_class(name, attrs):\n    return type(name, (), attrs)","hint":"","tests":[{"expected":"Point 1 5","append":"C = make_class('Point', {'x': 1, 'y': 5})\nprint(C.__name__, C().x, C().y)"}],"local_only":false},{"title":"Typed descriptor","prompt":"Write the descriptor class `Typed(expected_type)`: assigning a value of the wrong type raises `TypeError`. `Person` already uses it.","starter":"class Typed:\n    pass\n\nclass Person:\n    name = Typed(str)\n    age = Typed(int)\n\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n","solution":"class Typed:\n    def __init__(self, expected_type):\n        self.expected_type = expected_type\n\n    def __set_name__(self, owner, name):\n        self.private = \"_\" + name\n\n    def __get__(self, obj, objtype=None):\n        return getattr(obj, self.private)\n\n    def __set__(self, obj, value):\n        if not isinstance(value, self.expected_type):\n            raise TypeError(f\"expected {self.expected_type.__name__}\")\n        setattr(obj, self.private, value)\n\nclass Person:\n    name = Typed(str)\n    age = Typed(int)\n\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age","hint":"","tests":[{"expected":"Ada 36\nexpected int","append":"p = Person('Ada', 36)\nprint(p.name, p.age)\ntry:\n    Person('Bo', 'x')\nexcept TypeError as e:\n    print(e)"}],"local_only":false},{"title":"Plugin registry","prompt":"Write the base class `Plugin` that records the names of all its subclasses in a class attribute `registry` (a list). Use `__init_subclass__`.","starter":"class Plugin:\n    pass\n","solution":"class Plugin:\n    registry = []\n\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        Plugin.registry.append(cls.__name__)","hint":"","tests":[{"expected":"['A', 'B']","append":"class A(Plugin):\n    pass\nclass B(Plugin):\n    pass\nprint(Plugin.registry)"}],"local_only":false}],"quiz":[{"q":"What is the metaclass of a normal class?","options":["class","type","object"],"answer":1,"why":"Classes are instances of type."},{"q":"What can a descriptor control?","options":["File access","Imports","Reading and writing an attribute"],"answer":2,"why":"__get__ and __set__."},{"q":"What does type(\"X\", (), {}) do?","options":["Deletes X","Creates a new class named X","Returns the type of X"],"answer":1,"why":"Three-argument type builds a class."},{"q":"What does __init_subclass__ run on?","options":["Every instance","The module","The parent, whenever a subclass is created"],"answer":2,"why":"A simple alternative to metaclasses."},{"q":"When should you use a metaclass?","options":["For every class","Always","Rarely: when simpler hooks are not enough"],"answer":2,"why":"They are powerful and hard to read."}],"challenge":{"title":"Singleton metaclass","prompt":"Write the metaclass `Singleton` so that a class created with `metaclass=Singleton` always returns the same instance, however often it is called (override `__call__`).","starter":"class Singleton(type):\n    pass\n","solution":"class Singleton(type):\n    _instances = {}\n\n    def __call__(cls, *args, **kwargs):\n        if cls not in Singleton._instances:\n            Singleton._instances[cls] = super().__call__(*args, **kwargs)\n        return Singleton._instances[cls]","hint":"The metaclass's __call__ runs when you write Config().","tests":[{"expected":"True\n5","append":"class Config(metaclass=Singleton):\n    def __init__(self):\n        self.n = 0\na = Config()\nb = Config()\nprint(a is b)\na.n = 5\nprint(b.n)"}],"local_only":false}},{"id":60,"track":"PRO","slug":"capstone","title":"Capstone: a task manager","terms":[{"term":"capstone","def":"A final project that combines many skills into one working program."},{"term":"requirements","def":"A clear list of what the program must do. Write them first."},{"term":"architecture","def":"How the program is split into parts: here a data model, storage, a command-line interface and tests."},{"term":"separation of concerns","def":"Each part has one job: the model knows nothing about the terminal, the CLI knows nothing about JSON."},{"term":"definition of done","def":"Tests pass, the README explains how to run it, and the code is tidy."}],"explain":"You now know enough Python to build real tools. This capstone builds a small task manager the way professionals do: model first (dataclasses), then storage (JSON), then the command-line interface (argparse), then tests. The five exercises add one layer at a time; the mini challenge assembles the finished program. After that, tackle the projects.","example":{"code":"import argparse, json\nfrom dataclasses import dataclass, asdict\n@dataclass\nclass Task:                                   # 1. the data model\n    title: str\n    done: bool = False\ndef save(tasks, path):                        # 2. storage\n    with open(path, \"w\") as f:\n        json.dump([asdict(t) for t in tasks], f)\ndef load(path):\n    try:\n        with open(path) as f:\n            return [Task(**d) for d in json.load(f)]\n    except FileNotFoundError:\n        return []\ndef main(argv):                               # 3. the command-line interface\n    parser = argparse.ArgumentParser(prog=\"tasks\")\n    sub = parser.add_subparsers(dest=\"cmd\", required=True)\n    sub.add_parser(\"list\")\n    add = sub.add_parser(\"add\")\n    add.add_argument(\"title\")\n    args = parser.parse_args(argv)\n    tasks = load(\"tasks.json\")\n    if args.cmd == \"add\":\n        tasks.append(Task(args.title))\n        save(tasks, \"tasks.json\")\n        print(\"added\", args.title)\n    else:\n        for i, t in enumerate(tasks, 1):\n            print(f\"[{'x' if t.done else ' '}] {i} {t.title}\")\nmain([\"add\", \"write docs\"])\nmain([\"list\"])                                # [ ] 1 write docs\n"},"mistakes":["Writing everything in one big function: split into model, storage and interface so each part can be tested.","Skipping tests until the end: write a test for each new function right away.","Changing the data format without a plan: old saved files stop loading. Version your files."],"exercises":[{"title":"Task model","prompt":"Write a dataclass `Task` with `title: str` and `done: bool = False`, a method `to_dict()` returning `{\"title\": ..., \"done\": ...}` and a classmethod `from_dict(d)` creating a Task from such a dict.","starter":"from dataclasses import dataclass\n\n","solution":"from dataclasses import dataclass\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n    def to_dict(self):\n        return {\"title\": self.title, \"done\": self.done}\n\n    @classmethod\n    def from_dict(cls, d):\n        return cls(d[\"title\"], d[\"done\"])","hint":"","tests":[{"expected":"{'title': 'a', 'done': False}\nTask(title='b', done=True)","append":"print(Task('a').to_dict())\nprint(Task.from_dict({'title': 'b', 'done': True}))"}],"local_only":false},{"title":"TaskBoard","prompt":"`Task` is given. Write `TaskBoard` with `add(title)` (returns the new task's id: 1, 2, ...), `complete(task_id)` (raises `ValueError(\"no such task\")` for an unknown id) and `pending()` (titles of tasks not done).","starter":"from dataclasses import dataclass\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\nclass TaskBoard:\n    pass\n","solution":"from dataclasses import dataclass\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\nclass TaskBoard:\n    def __init__(self):\n        self.tasks = []\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]","hint":"","tests":[{"expected":"1 2\n['b']\nno such task","append":"b = TaskBoard()\nprint(b.add('a'), b.add('b'))\nb.complete(1)\nprint(b.pending())\ntry:\n    b.complete(9)\nexcept ValueError as e:\n    print(e)"}],"local_only":false},{"title":"save and load","prompt":"`Task` and `TaskBoard` are given. Write `save(board, path)` storing the tasks as JSON and `load(path)` returning a TaskBoard with the same tasks.","starter":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n\n@dataclass\nclass TaskBoard:\n    tasks: list = field(default_factory=list)\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]\n\n\ndef save(board, path):\n    pass\n\n\ndef load(path):\n    pass\n","solution":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n\n@dataclass\nclass TaskBoard:\n    tasks: list = field(default_factory=list)\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]\n\n\ndef save(board, path):\n    import json\n    from dataclasses import asdict\n    with open(path, \"w\") as f:\n        json.dump([asdict(t) for t in board.tasks], f)\n\n\ndef load(path):\n    import json\n    board = TaskBoard()\n    with open(path) as f:\n        board.tasks = [Task(**d) for d in json.load(f)]\n    return board","hint":"","tests":[{"expected":"['x']\n[False, True]","append":"b = TaskBoard()\nb.add('x')\nb.add('y')\nb.complete(2)\nsave(b, 't.json')\nb2 = load('t.json')\nprint(b2.pending())\nprint([t.done for t in b2.tasks])"}],"local_only":false},{"title":"format_board","prompt":"`Task` and `TaskBoard` are given. Write `format_board(board)` returning the text shown by the `list` command: one line per task like `[ ] 1 write docs` or `[x] 2 ship`, or `no tasks` when the board is empty.","starter":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n\n@dataclass\nclass TaskBoard:\n    tasks: list = field(default_factory=list)\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]\n\n\ndef format_board(board):\n    pass\n","solution":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n\n@dataclass\nclass TaskBoard:\n    tasks: list = field(default_factory=list)\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]\n\n\ndef format_board(board):\n    if not board.tasks:\n        return \"no tasks\"\n    lines = []\n    for i, t in enumerate(board.tasks, 1):\n        mark = \"x\" if t.done else \" \"\n        lines.append(f\"[{mark}] {i} {t.title}\")\n    return \"\\n\".join(lines)","hint":"","tests":[{"expected":"no tasks\n[ ] 1 write docs\n[x] 2 ship","append":"b = TaskBoard()\nprint(format_board(b))\nb.add('write docs')\nb.add('ship')\nb.complete(2)\nprint(format_board(b))"}],"local_only":false}],"quiz":[{"q":"What should you write before the code?","options":["The tests for every future feature","The README footer","The requirements"],"answer":2,"why":"Know what \"done\" means first."},{"q":"What is separation of concerns?","options":["Splitting functions in two","Each part has one job","Using many files"],"answer":1,"why":"The model does not know about the terminal."},{"q":"Why return data instead of printing in model code?","options":["print is slow","print is forbidden","It is easy to test and reuse"],"answer":2,"why":"The interface layer decides how to show it."},{"q":"Which format did the capstone use for storage?","options":["JSON","Pickle","SQLite"],"answer":0,"why":"Human-readable and built in."},{"q":"What does \"definition of done\" usually include?","options":["Tests, README and clean code","Only that it runs once","A logo"],"answer":0,"why":"Finished means shippable."}],"challenge":{"title":"Task manager CLI","prompt":"The model, storage and board classes are given. Write `main(argv)` with argparse subcommands: `add TITLE` (prints `added 1: TITLE` with the new id), `done ID` (prints `completed ID`) and `list` (prints the tasks as `[ ] 1 title` / `[x] 2 title`, or `no tasks`). Keep the tasks between calls in the file `tasks.json` in the current folder (create it on first use).","starter":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n\n@dataclass\nclass TaskBoard:\n    tasks: list = field(default_factory=list)\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]\n\n\nimport argparse\nimport json\nimport os\nfrom dataclasses import asdict\n\n\ndef load_board(path=\"tasks.json\"):\n    board = TaskBoard()\n    if os.path.exists(path):\n        with open(path) as f:\n            board.tasks = [Task(**d) for d in json.load(f)]\n    return board\n\n\ndef save_board(board, path=\"tasks.json\"):\n    with open(path, \"w\") as f:\n        json.dump([asdict(t) for t in board.tasks], f)\n\n\ndef main(argv):\n    pass\n","solution":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Task:\n    title: str\n    done: bool = False\n\n\n@dataclass\nclass TaskBoard:\n    tasks: list = field(default_factory=list)\n\n    def add(self, title):\n        self.tasks.append(Task(title))\n        return len(self.tasks)\n\n    def complete(self, task_id):\n        if not 1 <= task_id <= len(self.tasks):\n            raise ValueError(\"no such task\")\n        self.tasks[task_id - 1].done = True\n\n    def pending(self):\n        return [t.title for t in self.tasks if not t.done]\n\n\nimport argparse\nimport json\nimport os\nfrom dataclasses import asdict\n\n\ndef load_board(path=\"tasks.json\"):\n    board = TaskBoard()\n    if os.path.exists(path):\n        with open(path) as f:\n            board.tasks = [Task(**d) for d in json.load(f)]\n    return board\n\n\ndef save_board(board, path=\"tasks.json\"):\n    with open(path, \"w\") as f:\n        json.dump([asdict(t) for t in board.tasks], f)\n\n\ndef main(argv):\n    parser = argparse.ArgumentParser(prog=\"tasks\")\n    sub = parser.add_subparsers(dest=\"cmd\", required=True)\n    add = sub.add_parser(\"add\")\n    add.add_argument(\"title\")\n    done = sub.add_parser(\"done\")\n    done.add_argument(\"id\", type=int)\n    sub.add_parser(\"list\")\n    args = parser.parse_args(argv)\n    board = load_board()\n    if args.cmd == \"add\":\n        task_id = board.add(args.title)\n        save_board(board)\n        print(f\"added {task_id}: {args.title}\")\n    elif args.cmd == \"done\":\n        board.complete(args.id)\n        save_board(board)\n        print(f\"completed {args.id}\")\n    else:\n        if not board.tasks:\n            print(\"no tasks\")\n        for i, t in enumerate(board.tasks, 1):\n            print(f\"[{'x' if t.done else ' '}] {i} {t.title}\")","hint":"Use sub = parser.add_subparsers(dest=\"cmd\") and one sub.add_parser(...) per command.","tests":[{"expected":"no tasks\nadded 1: write docs\nadded 2: ship\ncompleted 2\n[ ] 1 write docs\n[x] 2 ship","append":"main(['list'])\nmain(['add', 'write docs'])\nmain(['add', 'ship'])\nmain(['done', '2'])\nmain(['list'])"}],"local_only":false}}],"projects":[{"slug":"number-guessing-game","level":1,"order":1,"title":"Number guessing game","requires":9,"goal":"Build the classic game: the computer picks a secret number and the player guesses until they find it, with \"too low\" / \"too high\" hints.","requirements":["`check_guess(secret, guess)` returns `\"too low\"`, `\"too high\"` or `\"correct\"`.","`play(secret)` reads guesses with `input()` (no prompt text), prints the hint for each one, and returns how many guesses it took.","`main()` picks a random secret from 1 to 100 (already written for you)."],"milestones":[{"title":"Compare one guess","detail":"Write `check_guess` and try it with a few numbers in the terminal."},{"title":"Loop until correct","detail":"Use a `while` loop in `play` that counts attempts."},{"title":"Play for real","detail":"Run the whole game with Run and win it yourself."}],"hints":["Three outcomes: use `if`, `if`, then a final `return`.","Keep a counter `attempts` and add 1 after each `input()`.","Print the hint, then `return attempts` only when the hint is `\"correct\"`."],"starter":"import random\n\ndef check_guess(secret, guess):\n    \"\"\"Return 'too low', 'too high' or 'correct'.\"\"\"\n    pass\n\ndef play(secret):\n    \"\"\"Read guesses with input() until the secret is found. Print each hint. Return the number of attempts.\"\"\"\n    pass\n\ndef main():\n    secret = random.randint(1, 100)\n    print('I am thinking of a number from 1 to 100. Guess it!')\n    tries = play(secret)\n    print(f'You got it in {tries} tries!')\nif __name__ == '__main__':\n    main()\n","solution":"import random\n\n\ndef check_guess(secret, guess):\n    if guess < secret:\n        return \"too low\"\n    if guess > secret:\n        return \"too high\"\n    return \"correct\"\n\n\ndef play(secret):\n    attempts = 0\n    while True:\n        guess = int(input())\n        attempts += 1\n        result = check_guess(secret, guess)\n        print(result)\n        if result == \"correct\":\n            return attempts\n\n\ndef main():\n    secret = random.randint(1, 100)\n    print(\"I am thinking of a number from 1 to 100. Guess it!\")\n    tries = play(secret)\n    print(f\"You got it in {tries} tries!\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"too low\ntoo high\ncorrect","append":"print(check_guess(5, 3))\nprint(check_guess(5, 8))\nprint(check_guess(5, 5))"},{"expected":"too high\ntoo low\ncorrect\n3","stdin":"50\n25\n37\n","append":"print(play(37))"},{"expected":"correct\n1","stdin":"9\n","append":"print(play(9))"}],"extend":["Limit the player to 7 guesses and reveal the number if they lose.","Let the player choose the range (easy, medium, hard).","Handle text that is not a number with try/except."],"local_only":false},{"slug":"calculator","level":1,"order":2,"title":"Command-line calculator","requires":8,"goal":"Write a calculator that reads one line like `12 * 3` and prints the answer.","requirements":["`calculate(a, op, b)` supports `+ - * /`. Dividing by zero returns the text `error: division by zero`; any other operator returns `error: unknown operator`.","`format_number(x)` shows whole floats without `.0` (36.0 becomes `36`) and keeps real decimals (3.5 stays `3.5`).","`main()` reads `a op b` from one input line (given)."],"milestones":[{"title":"The four operations","detail":"Handle + - * / with if/elif."},{"title":"Errors as text","detail":"Return the error messages instead of crashing."},{"title":"Pretty numbers","detail":"Implement format_number and run the whole program."}],"hints":["Compare `op` with each symbol in turn.","Check `b == 0` before dividing.","A float is whole when `x == int(x)`."],"starter":"def calculate(a, op, b):\n    \"\"\"Apply op (+ - * /) to a and b. Return an error string for division by zero or an unknown operator.\"\"\"\n    pass\n\ndef format_number(x):\n    \"\"\"36.0 -> '36', 3.5 -> '3.5'.\"\"\"\n    pass\n\ndef main():\n    a, op, b = input().split()\n    result = calculate(float(a), op, float(b))\n    print(result if isinstance(result, str) else format_number(result))\nif __name__ == '__main__':\n    main()\n","solution":"def calculate(a, op, b):\n    if op == \"+\":\n        return a + b\n    if op == \"-\":\n        return a - b\n    if op == \"*\":\n        return a * b\n    if op == \"/\":\n        if b == 0:\n            return \"error: division by zero\"\n        return a / b\n    return \"error: unknown operator\"\n\n\ndef format_number(x):\n    if isinstance(x, float) and x == int(x):\n        return str(int(x))\n    return str(x)\n\n\ndef main():\n    a, op, b = input().split()\n    result = calculate(float(a), op, float(b))\n    print(result if isinstance(result, str) else format_number(result))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"5\n5.0\n5\n2.5","append":"print(calculate(2, '+', 3))\nprint(calculate(2.5, '*', 2))\nprint(format_number(5.0))\nprint(format_number(2.5))"},{"expected":"36","stdin":"12 * 3\n"},{"expected":"3.5","stdin":"7 / 2\n"},{"expected":"error: division by zero","stdin":"5 / 0\n"},{"expected":"error: unknown operator","stdin":"2 ^ 3\n"}],"extend":["Support `**`, `//` and `%`.","Let the calculator keep running until the user types `quit`.","Remember the previous answer as `ans`."],"local_only":false},{"slug":"tip-splitter","level":1,"order":3,"title":"Tip splitter","requires":6,"goal":"Split a restaurant bill, including a tip, between friends.","requirements":["`split_bill(total, tip_percent, people)` returns what each person pays, rounded to 2 decimals.","It raises `ValueError(\"people must be at least 1\")` when `people` is less than 1.","`main()` reads the total, the tip percentage and the number of people (three lines) and prints `Each person pays $X.XX` (given)."],"milestones":[{"title":"The maths","detail":"total plus tip, divided by the number of people."},{"title":"Guard the input","detail":"Reject fewer than 1 person with ValueError."},{"title":"Run it","detail":"Try 45.50, 15, 3 in the terminal."}],"hints":["tip amount = total * tip_percent / 100.","Use `round(value, 2)`.","`raise ValueError(\"people must be at least 1\")` before dividing."],"starter":"def split_bill(total, tip_percent, people):\n    \"\"\"Return each person's share (total plus tip, divided by people), rounded to 2 decimals. Raise ValueError('people must be at least 1') if people < 1.\"\"\"\n    pass\n\ndef main():\n    total = float(input())\n    tip = float(input())\n    people = int(input())\n    print(f'Each person pays ${split_bill(total, tip, people):.2f}')\nif __name__ == '__main__':\n    main()\n","solution":"def split_bill(total, tip_percent, people):\n    if people < 1:\n        raise ValueError(\"people must be at least 1\")\n    grand_total = total * (1 + tip_percent / 100)\n    return round(grand_total / people, 2)\n\n\ndef main():\n    total = float(input())\n    tip = float(input())\n    people = int(input())\n    print(f\"Each person pays ${split_bill(total, tip, people):.2f}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"30.0\n40.0\npeople must be at least 1","append":"print(split_bill(100, 20, 4))\nprint(split_bill(80, 0, 2))\ntry:\n    split_bill(10, 10, 0)\nexcept ValueError as e:\n    print(e)"},{"expected":"Each person pays $30.00","stdin":"100\n20\n4\n"},{"expected":"Each person pays $17.44","stdin":"45.50\n15\n3\n"}],"extend":["Round the tip up to a whole number of cents per person.","Let people give different shares.","Ask whether service was good, ok or bad and pick the tip for them."],"local_only":false},{"slug":"temperature-converter","level":1,"order":4,"title":"Temperature converter","requires":6,"goal":"Convert temperatures between Celsius (C), Fahrenheit (F) and Kelvin (K).","requirements":["`convert(value, from_unit, to_unit)` returns the converted number rounded to 2 decimals as a float.","Unknown units raise `ValueError(\"unknown unit\")`.","A good design converts everything through Celsius, so you need only 2 x 3 formulas instead of 6.","`main()` reads `value FROM TO`, for example `100 C F`, and prints `212.0 F` (given)."],"milestones":[{"title":"Into Celsius","detail":"Write to_celsius for C, F and K."},{"title":"Out of Celsius","detail":"Write from_celsius for C, F and K."},{"title":"Combine","detail":"convert = from_celsius(to_celsius(...))"}],"hints":["F to C: (f - 32) * 5 / 9. K to C: k - 273.15.","C to F: c * 9 / 5 + 32. C to K: c + 273.15.","Remember `round(x, 2)` and float(value)."],"starter":"def to_celsius(value, unit):\n    \"\"\"Convert value from unit (C, F or K) to Celsius. Raise ValueError('unknown unit') otherwise.\"\"\"\n    pass\n\ndef from_celsius(celsius, unit):\n    \"\"\"Convert a Celsius value to unit (C, F or K).\"\"\"\n    pass\n\ndef convert(value, from_unit, to_unit):\n    \"\"\"Convert between any two units, rounded to 2 decimals.\"\"\"\n    pass\n\ndef main():\n    value, source, target = input().split()\n    print(f'{convert(float(value), source, target)} {target}')\nif __name__ == '__main__':\n    main()\n","solution":"def to_celsius(value, unit):\n    if unit == \"C\":\n        return float(value)\n    if unit == \"F\":\n        return (value - 32) * 5 / 9\n    if unit == \"K\":\n        return value - 273.15\n    raise ValueError(\"unknown unit\")\n\n\ndef from_celsius(celsius, unit):\n    if unit == \"C\":\n        return celsius\n    if unit == \"F\":\n        return celsius * 9 / 5 + 32\n    if unit == \"K\":\n        return celsius + 273.15\n    raise ValueError(\"unknown unit\")\n\n\ndef convert(value, from_unit, to_unit):\n    return round(from_celsius(to_celsius(value, from_unit), to_unit), 2)\n\n\ndef main():\n    value, source, target = input().split()\n    print(f\"{convert(float(value), source, target)} {target}\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"-40.0\n26.85\n5.0","append":"print(convert(-40, 'C', 'F'))\nprint(convert(300, 'K', 'C'))\nprint(convert(5, 'C', 'C'))"},{"expected":"unknown unit","append":"try:\n    convert(1, 'X', 'C')\nexcept ValueError as e:\n    print(e)"},{"expected":"212.0 F","stdin":"100 C F\n"},{"expected":"0.0 C","stdin":"32 F C\n"},{"expected":"273.15 K","stdin":"0 C K\n"}],"extend":["Add Rankine (R) as a fourth unit.","Print a small conversion table from 0 to 100 degrees.","Reject temperatures below absolute zero."],"local_only":false},{"slug":"rock-paper-scissors","level":1,"order":5,"title":"Rock, paper, scissors","requires":8,"goal":"Build the hand game: work out who wins a round and keep a score over many rounds.","requirements":["`winner(a, b)` returns `\"player1\"`, `\"player2\"` or `\"tie\"` for the choices `rock`, `paper`, `scissors`; any other choice raises `ValueError(\"invalid choice\")`.","`score(rounds)` takes a list of `(a, b)` pairs and returns `{\"player1\": n, \"player2\": n, \"ties\": n}`.","`main()` plays one round against a random computer choice (given)."],"milestones":[{"title":"Who beats whom","detail":"Store the rules in a dictionary."},{"title":"One round","detail":"Implement winner with validation."},{"title":"A whole match","detail":"Loop over rounds in score."}],"hints":["A dict `{\"rock\": \"scissors\", ...}` says what each choice beats.","If `BEATS[a] == b` then player 1 wins.","Count results in a dict that starts with three zeros."],"starter":"import random\nBEATS = {'rock': 'scissors', 'scissors': 'paper', 'paper': 'rock'}\n\ndef winner(a, b):\n    \"\"\"Return 'player1', 'player2' or 'tie'. Raise ValueError('invalid choice') for unknown choices.\"\"\"\n    pass\n\ndef score(rounds):\n    \"\"\"Return {'player1': n, 'player2': n, 'ties': n} for a list of (a, b) rounds.\"\"\"\n    pass\n\ndef main():\n    mine = input('rock, paper or scissors? ').strip().lower()\n    theirs = random.choice(list(BEATS))\n    print(f'computer chose {theirs}')\n    result = winner(mine, theirs)\n    print('It is a tie.' if result == 'tie' else 'You win!' if result == 'player1' else 'You lose.')\nif __name__ == '__main__':\n    main()\n","solution":"import random\n\nBEATS = {\"rock\": \"scissors\", \"scissors\": \"paper\", \"paper\": \"rock\"}\n\n\ndef winner(a, b):\n    for choice in (a, b):\n        if choice not in BEATS:\n            raise ValueError(\"invalid choice\")\n    if a == b:\n        return \"tie\"\n    return \"player1\" if BEATS[a] == b else \"player2\"\n\n\ndef score(rounds):\n    totals = {\"player1\": 0, \"player2\": 0, \"ties\": 0}\n    for a, b in rounds:\n        result = winner(a, b)\n        totals[\"ties\" if result == \"tie\" else result] += 1\n    return totals\n\n\ndef main():\n    mine = input(\"rock, paper or scissors? \").strip().lower()\n    theirs = random.choice(list(BEATS))\n    print(f\"computer chose {theirs}\")\n    result = winner(mine, theirs)\n    print(\"It is a tie.\" if result == \"tie\" else (\"You win!\" if result == \"player1\" else \"You lose.\"))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"player1\nplayer2\ntie\ninvalid choice","append":"print(winner('rock', 'scissors'))\nprint(winner('rock', 'paper'))\nprint(winner('paper', 'paper'))\ntry:\n    winner('rock', 'lizard')\nexcept ValueError as e:\n    print(e)"},{"expected":"{'player1': 2, 'player2': 1, 'ties': 1}","append":"print(score([('rock', 'scissors'), ('paper', 'rock'), ('rock', 'paper'), ('scissors', 'scissors')]))"}],"extend":["Add lizard and Spock (the 5-choice version).","Play best of 5 and announce the champion.","Make the computer smarter: it remembers what you played most."],"local_only":false},{"slug":"todo-list-cli","level":2,"order":6,"title":"To-do list (command line)","requires":16,"goal":"Build a to-do manager you control with typed commands: `add buy milk`, `done 1`, `remove 2`, `list`, `quit`.","requirements":["Tasks are a list of dicts like `{\"title\": \"buy milk\", \"done\": False}`.","`run_command(tasks, line)` executes one command and **returns** the text to show (it does not print): `added: TITLE`, `completed: TITLE`, `removed: TITLE`, a numbered list (`1. [x] title`, `2. [ ] title`) or `no tasks`.","A number that does not exist returns `error: no task N`; anything unknown returns `error: unknown command`.","`main()` reads commands until `quit` and prints each result (given)."],"milestones":[{"title":"Add and list","detail":"Support `add` and `list` first."},{"title":"Complete and remove","detail":"Add `done N` and `remove N` with number checking."},{"title":"Errors","detail":"Return clear error messages for bad input."}],"hints":["`line.split(maxsplit=1)` separates the command from the rest of the text.","Task numbers shown to the user start at 1 but list indexes start at 0.","Build the list text with `enumerate(tasks, 1)` and `\"\\n\".join(...)`."],"starter":"def run_command(tasks, line):\n    \"\"\"Run one command ('add TITLE', 'done N', 'remove N', 'list') on the tasks list and return the text to display.\"\"\"\n    pass\n\ndef main():\n    tasks = []\n    while True:\n        line = input()\n        if line.strip().lower() == 'quit':\n            break\n        print(run_command(tasks, line))\nif __name__ == '__main__':\n    main()\n","solution":"def run_command(tasks, line):\n    parts = line.strip().split(maxsplit=1)\n    if not parts:\n        return \"error: unknown command\"\n    command = parts[0].lower()\n    argument = parts[1] if len(parts) > 1 else \"\"\n    if command == \"add\" and argument:\n        tasks.append({\"title\": argument, \"done\": False})\n        return f\"added: {argument}\"\n    if command in (\"done\", \"remove\") and argument.isdigit():\n        number = int(argument)\
