\n    def do_POST(self):\n        size = int(self.headers[\"Content-Length\"])\n        data = json.loads(self.rfile.read(size))\n        self._send(201, {\"created\": data})\n    def log_message(self, *args):\n        pass\nserver = HTTPServer((\"127.0.0.1\", 0), H)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f\"http://127.0.0.1:{server.server_port}\"\ntry:\n    ApiClient(base).get('/flaky')\nexcept ApiError as e:\n    print(e.status)\nprint(ApiClient(base, retries=2).get('/flaky'))\nserver.shutdown()"},{"expected":"0","append":"os_env = __import__('os').environ\nos_env['NO_PROXY'] = '*'\ntry:\n    ApiClient('http://127.0.0.1:1').get('/x')\nexcept ApiError as e:\n    print(e.status)"}],"extend":["Add an `Authorization` header with an API key.","Add a `delete` method and a `put` method.","Back off exponentially between retries (0.5 s, 1 s, 2 s)."],"local_only":true},{"slug":"file-organizer","level":4,"order":21,"title":"File organizer (argparse)","requires":55,"goal":"Write a command-line tool that tidies a messy folder by moving each file into a sub-folder named after its type.","requirements":["`category_of(filename)` returns `images` (`.jpg .jpeg .png .gif`), `docs` (`.pdf .txt .md .docx`), `code` (`.py .js .html .css`) or `other`; the file ending is compared case-insensitively. `CATEGORIES` is given.","`organize(folder, dry_run=False)` moves every *file* directly inside `folder` (ignore sub-folders) into `folder/<category>/` and returns a dict `{category: sorted list of final file names}` with the categories sorted.","If the target name already exists, add `_1`, `_2`, ... before the ending (`a.png` becomes `a_1.png`) instead of overwriting.","With `dry_run=True` nothing is changed (not even new folders) but the same dict is returned.","`main(argv=None)` uses argparse: `FOLDER` and `--dry-run`; it prints `moved N files` or `would move N files`."],"milestones":[{"title":"Categories","detail":"Map file endings to folders."},{"title":"Moving files","detail":"pathlib + shutil.move, with collision handling."},{"title":"The command line","detail":"argparse with a positional argument and a flag."}],"hints":["`Path(name).suffix.lower()` gives `.png`.","Create the destination folder with `mkdir(exist_ok=True)` only when not in dry-run mode.","`Path.stem` is the name without ending, `Path.suffix` the ending."],"starter":"import argparse\nimport shutil\nfrom pathlib import Path\nCATEGORIES = {'images': {'.jpg', '.jpeg', '.png', '.gif'}, 'docs': {'.pdf', '.txt', '.md', '.docx'}, 'code': {'.py', '.js', '.html', '.css'}}\n\ndef category_of(filename):\n    \"\"\"Return the category folder name for a file name.\"\"\"\n    pass\n\ndef unique_target(folder, name):\n    \"\"\"Return a path in folder that does not exist yet (add _1, _2 ... before the ending).\"\"\"\n    pass\n\ndef organize(folder, dry_run=False):\n    \"\"\"Move files into category folders (or only plan it when dry_run). Return {category: sorted names}.\"\"\"\n    pass\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description='Sort the files of a folder into sub-folders by type.')\n    parser.add_argument('folder')\n    parser.add_argument('--dry-run', action='store_true', help='only show what would happen')\n    args = parser.parse_args(argv)\n    result = organize(args.folder, args.dry_run)\n    count = sum((len(names) for names in result.values()))\n    print(f'{('would move' if args.dry_run else 'moved')} {count} files')\nif __name__ == '__main__':\n    main()\n","solution":"import argparse\nimport shutil\nfrom pathlib import Path\n\nCATEGORIES = {\n    \"images\": {\".jpg\", \".jpeg\", \".png\", \".gif\"},\n    \"docs\": {\".pdf\", \".txt\", \".md\", \".docx\"},\n    \"code\": {\".py\", \".js\", \".html\", \".css\"},\n}\n\n\ndef category_of(filename):\n    suffix = Path(filename).suffix.lower()\n    for category, suffixes in CATEGORIES.items():\n        if suffix in suffixes:\n            return category\n    return \"other\"\n\n\ndef unique_target(folder, name):\n    target = folder / name\n    counter = 1\n    while target.exists():\n        path = Path(name)\n        target = folder / f\"{path.stem}_{counter}{path.suffix}\"\n        counter += 1\n    return target\n\n\ndef organize(folder, dry_run=False):\n    root = Path(folder)\n    moved = {}\n    for item in sorted(root.iterdir()):\n        if not item.is_file():\n            continue\n        category = category_of(item.name)\n        destination = root / category\n        target = unique_target(destination, item.name)\n        moved.setdefault(category, []).append(target.name)\n        if not dry_run:\n            destination.mkdir(exist_ok=True)\n            shutil.move(str(item), str(target))\n    return {category: sorted(names) for category, names in sorted(moved.items())}\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=\"Sort the files of a folder into sub-folders by type.\")\n    parser.add_argument(\"folder\")\n    parser.add_argument(\"--dry-run\", action=\"store_true\", help=\"only show what would happen\")\n    args = parser.parse_args(argv)\n    result = organize(args.folder, args.dry_run)\n    count = sum(len(names) for names in result.values())\n    print(f\"{'would move' if args.dry_run else 'moved'} {count} files\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"images docs other\n{'code': ['c.py'], 'docs': ['b.PDF', 'notes.txt'], 'images': ['a.png', 'e.jpg'], 'other': ['d.xyz']}\n['a.png', 'b.PDF', 'c.py', 'd.xyz', 'e.jpg', 'notes.txt', 'subdir']\n{'code': ['c.py'], 'docs': ['b.PDF', 'notes.txt'], 'images': ['a.png', 'e.jpg'], 'other': ['d.xyz']}\n['code', 'docs', 'images', 'other', 'subdir']\n{'images': ['a_1.png']}\n['a.png', 'a_1.png', 'e.jpg']","append":"import os\nos.mkdir('inbox')\nfor name in ['a.png', 'b.PDF', 'c.py', 'd.xyz', 'notes.txt', 'e.jpg']:\n    open(os.path.join('inbox', name), 'w').close()\nos.mkdir(os.path.join('inbox', 'subdir'))\nprint(category_of('x.JPG'), category_of('x.md'), category_of('Makefile'))\nprint(organize('inbox', dry_run=True))\nprint(sorted(os.listdir('inbox')))\nprint(organize('inbox'))\nprint(sorted(os.listdir('inbox')))\nopen(os.path.join('inbox', 'a.png'), 'w').close()\nprint(organize('inbox'))\nprint(sorted(os.listdir(os.path.join('inbox', 'images'))))"},{"expected":"would move 2 files\nTrue\nmoved 2 files\n['docs', 'images']","append":"import os\nos.mkdir('box')\nopen(os.path.join('box', 'x.png'), 'w').close()\nopen(os.path.join('box', 'y.txt'), 'w').close()\nmain(['box', '--dry-run'])\nprint(sorted(os.listdir('box')) == ['x.png', 'y.txt'])\nmain(['box'])\nprint(sorted(os.listdir('box')))"}],"extend":["Add `--by-date` to sort into folders named after the modification month.","Add an `--undo` option that reverses the last run (hint: write a log file).","Skip hidden files and report them."],"local_only":false},{"slug":"unit-tested-utility-library","level":4,"order":22,"title":"Unit-tested utility library","requires":48,"goal":"Write a small library of helpers **and** the unit tests that prove it works. Your tests are graded too: they must catch deliberately broken versions of your functions.","requirements":["`slugify(text)`: lower-case words (letters and digits) joined by single hyphens, punctuation removed.","`chunk(items, size)`: successive slices of length `size` (the last may be shorter); `size < 1` raises `ValueError`.","`flatten(nested)`: a flat list from arbitrarily nested lists/tuples.","`clamp(x, lo, hi)`: `x` limited to the range; `lo > hi` raises `ValueError`.","`is_palindrome(text)`: True when the letters and digits read the same both ways, ignoring case and punctuation.","`word_frequencies(text)`: dict of word to count (lower-case, letters and apostrophes), sorted by word.","`TestUtils(unittest.TestCase)` with **at least 12 tests** covering every function, including the edge cases. A hidden check replaces each function with a broken version: your tests must fail every time."],"milestones":[{"title":"The functions","detail":"Implement the six helpers."},{"title":"Happy paths","detail":"One test per normal behaviour."},{"title":"Edge cases","detail":"Empty input, invalid arguments, boundaries: tests that would catch a lazy implementation."}],"hints":["Test what the function should do for normal, boundary and invalid inputs.","A test for `chunk` that only checks an exact multiple would not catch a function that returns `[items]`.","Use `with self.assertRaises(ValueError):` for the invalid cases."],"starter":"import re\nimport unittest\nfrom collections import Counter\n\ndef slugify(text):\n    \"\"\"Lower-case words (letters/digits) joined by single hyphens.\"\"\"\n    pass\n\ndef chunk(items, size):\n    \"\"\"Split items into lists of `size` (ValueError if size < 1).\"\"\"\n    pass\n\ndef flatten(nested):\n    \"\"\"Flatten nested lists/tuples into one list.\"\"\"\n    pass\n\ndef clamp(x, lo, hi):\n    \"\"\"Limit x to lo..hi (ValueError if lo > hi).\"\"\"\n    pass\n\ndef is_palindrome(text):\n    \"\"\"Ignoring case and punctuation, does the text read the same backwards?\"\"\"\n    pass\n\ndef word_frequencies(text):\n    \"\"\"Sorted dict of lower-case word counts.\"\"\"\n    pass\n\n\nclass TestUtils(unittest.TestCase):\n    pass\n","solution":"import re\nimport unittest\nfrom collections import Counter\n\n\ndef slugify(text):\n    return \"-\".join(re.findall(r\"[a-z0-9]+\", text.lower()))\n\n\ndef chunk(items, size):\n    if size < 1:\n        raise ValueError(\"size must be at least 1\")\n    return [items[i:i + size] for i in range(0, len(items), size)]\n\n\ndef flatten(nested):\n    result = []\n    for item in nested:\n        if isinstance(item, (list, tuple)):\n            result.extend(flatten(item))\n        else:\n            result.append(item)\n    return result\n\n\ndef clamp(x, lo, hi):\n    if lo > hi:\n        raise ValueError(\"lo must not exceed hi\")\n    return max(lo, min(x, hi))\n\n\ndef is_palindrome(text):\n    cleaned = [c.lower() for c in text if c.isalnum()]\n    return cleaned == cleaned[::-1]\n\n\ndef word_frequencies(text):\n    words = re.findall(r\"[a-z']+\", text.lower())\n    return dict(sorted(Counter(words).items()))\n\n\nclass TestUtils(unittest.TestCase):\n    def test_slugify_basic(self):\n        self.assertEqual(slugify(\"Hello World\"), \"hello-world\")\n\n    def test_slugify_punctuation(self):\n        self.assertEqual(slugify(\"  Python, 3.12 rocks!  \"), \"python-3-12-rocks\")\n\n    def test_chunk_even(self):\n        self.assertEqual(chunk([1, 2, 3, 4], 2), [[1, 2], [3, 4]])\n\n    def test_chunk_remainder(self):\n        self.assertEqual(chunk([1, 2, 3], 2), [[1, 2], [3]])\n\n    def test_chunk_invalid(self):\n        with self.assertRaises(ValueError):\n            chunk([1], 0)\n\n    def test_flatten_deep(self):\n        self.assertEqual(flatten([1, [2, [3, [4]]]]), [1, 2, 3, 4])\n\n    def test_flatten_flat(self):\n        self.assertEqual(flatten([1, 2]), [1, 2])\n\n    def test_clamp_inside(self):\n        self.assertEqual(clamp(5, 0, 10), 5)\n\n    def test_clamp_low(self):\n        self.assertEqual(clamp(-3, 0, 10), 0)\n\n    def test_clamp_high(self):\n        self.assertEqual(clamp(30, 0, 10), 10)\n\n    def test_palindrome_true(self):\n        self.assertTrue(is_palindrome(\"A man, a plan, a canal: Panama\"))\n\n    def test_palindrome_false(self):\n        self.assertFalse(is_palindrome(\"python\"))\n\n    def test_frequencies(self):\n        self.assertEqual(word_frequencies(\"a b a\"), {\"a\": 2, \"b\": 1})\n\n    def test_frequencies_case(self):\n        self.assertEqual(word_frequencies(\"The the\"), {\"the\": 2})\n","tests":[{"expected":"hello-world [[1, 2], [3, 4], [5]] [1, 2, 3] 10 True {'a': 1, 'b': 2}\nTrue True\n6","append":"import io, unittest\nprint(slugify('Hello, World!'), chunk([1, 2, 3, 4, 5], 2), flatten([1, [2, [3]]]), clamp(15, 0, 10), is_palindrome('Racecar'), word_frequencies('b a b'))\ndef run():\n    suite = unittest.defaultTestLoader.loadTestsFromTestCase(TestUtils)\n    r = unittest.TextTestRunner(stream=io.StringIO()).run(suite)\n    return r.testsRun, r.wasSuccessful()\nn, ok = run()\nprint(n >= 12, ok)\nmutants = {'slugify': lambda t: t, 'chunk': lambda items, size: [items], 'flatten': lambda n: n, 'clamp': lambda x, lo, hi: x, 'is_palindrome': lambda t: True, 'word_frequencies': lambda t: {}}\nkilled = 0\nfor name, broken in mutants.items():\n    original = getattr(_solution, name)\n    setattr(_solution, name, broken)\n    if not run()[1]:\n        killed += 1\n    setattr(_solution, name, original)\nprint(killed)"}],"extend":["Measure your coverage with `python -m trace` or the third-party `coverage` package.","Add property-style tests that try many random inputs.","Add type hints and check them with mypy."],"local_only":false},{"slug":"async-downloader","level":5,"order":23,"title":"Async downloader simulation","requires":52,"goal":"Simulate downloading many files at the same time with asyncio, with a limit on how many run at once and a callback when each one finishes.","requirements":["`download(name, size_kb, speed_kb_s)` is a coroutine that \"downloads\" by sleeping `size_kb / speed_kb_s` seconds and returns `(name, size_kb)`.","`download_all(files, limit=3, on_done=None)` takes `(name, size_kb, speed_kb_s)` tuples, runs them concurrently but never more than `limit` at once (use a `Semaphore`) and returns the results in the same order as `files`.","`on_done(name)` is called as soon as each download finishes (so in completion order). `limit < 1` raises `ValueError(\"limit must be at least 1\")`.","`summarize(results)` returns text like `3 files, 600 KB` (`1 file, 5 KB` for a single file)."],"milestones":[{"title":"One download","detail":"A coroutine that sleeps."},{"title":"Many at once","detail":"asyncio.gather over worker coroutines."},{"title":"A limit and a callback","detail":"Semaphore and on_done."}],"hints":["`await asyncio.sleep(seconds)` simulates waiting for the network.","`async with semaphore:` wraps the part that must be limited.","`asyncio.gather(*coroutines)` keeps the order of its arguments in its results."],"starter":"import asyncio\n\nasync def download(name, size_kb, speed_kb_s):\n    \"\"\"Sleep size_kb / speed_kb_s seconds and return (name, size_kb).\"\"\"\n    pass\n\nasync def download_all(files, limit=3, on_done=None):\n    \"\"\"Download every file concurrently (at most `limit` at a time). Return the results in input order; call on_done(name) as each one finishes.\"\"\"\n    pass\n\ndef summarize(results):\n    \"\"\"Return 'N files, T KB' (singular 'file' for one).\"\"\"\n    pass\n\ndef main():\n    files = [('a.zip', 300, 1000), ('b.zip', 100, 1000), ('c.zip', 200, 1000)]\n    results = asyncio.run(download_all(files, 2, lambda name: print('finished', name)))\n    print(summarize(results))\nif __name__ == '__main__':\n    main()\n","solution":"import asyncio\n\n\nasync def download(name, size_kb, speed_kb_s):\n    await asyncio.sleep(size_kb / speed_kb_s)\n    return name, size_kb\n\n\nasync def download_all(files, limit=3, on_done=None):\n    if limit < 1:\n        raise ValueError(\"limit must be at least 1\")\n    semaphore = asyncio.Semaphore(limit)\n\n    async def worker(name, size_kb, speed_kb_s):\n        async with semaphore:\n            result = await download(name, size_kb, speed_kb_s)\n        if on_done:\n            on_done(result[0])\n        return result\n\n    return list(await asyncio.gather(*(worker(*spec) for spec in files)))\n\n\ndef summarize(results):\n    total = sum(size for _, size in results)\n    word = \"file\" if len(results) == 1 else \"files\"\n    return f\"{len(results)} {word}, {total} KB\"\n\n\ndef main():\n    files = [(\"a.zip\", 300, 1000), (\"b.zip\", 100, 1000), (\"c.zip\", 200, 1000)]\n    results = asyncio.run(download_all(files, 2, lambda name: print(\"finished\", name)))\n    print(summarize(results))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"[('a', 300), ('b', 100), ('c', 200)]\n['b', 'c', 'a']","append":"import asyncio\nfiles = [('a', 300, 1000), ('b', 100, 1000), ('c', 200, 1000)]\nprint(asyncio.run(download_all(files, 3)))\ndone = []\nasyncio.run(download_all(files, 3, done.append))\nprint(done)"},{"expected":"True True","append":"import asyncio, time\nfiles = [('a', 300, 1000), ('b', 300, 1000), ('c', 300, 1000)]\nt0 = time.time()\nasyncio.run(download_all(files, 3))\nfast = time.time() - t0\nt0 = time.time()\nasyncio.run(download_all(files, 1))\nslow = time.time() - t0\nprint(fast < 0.6, slow >= 0.85)"},{"expected":"3 files, 600 KB\n1 file, 5 KB\nlimit must be at least 1","append":"import asyncio\nprint(summarize([('a', 100), ('b', 200), ('c', 300)]))\nprint(summarize([('x', 5)]))\ntry:\n    asyncio.run(download_all([('a', 1, 1)], 0))\nexcept ValueError as e:\n    print(e)"}],"extend":["Add a retry when a download \"fails\" (raise an error randomly).","Show a progress line `2/5 done` while downloading.","Add a timeout per file with `asyncio.wait_for`."],"local_only":false},{"slug":"lru-cache","level":5,"order":24,"title":"LRU cache","requires":40,"goal":"Implement a Least-Recently-Used cache: a fixed-size dictionary that throws away the entry nobody has touched for the longest time.","requirements":["`LRUCache(capacity)` raises `ValueError(\"capacity must be at least 1\")` for a capacity below 1.","`get(key, default=None)` returns the value (and marks the key as the most recently used) or `default` for a missing key; it counts `hits` and `misses`.","`put(key, value)` stores or updates a value (the key becomes the most recently used). When the cache grows beyond `capacity`, the least recently used key is removed.","`len(cache)`, `key in cache` (which must **not** change the usage order), `keys()` (from least to most recently used) and `info()` returning `{\"hits\", \"misses\", \"size\", \"capacity\"}`."],"milestones":[{"title":"Store and read","detail":"A dict with )\n            self.hits += 1\n            return self._data[key]\n        self.misses += 1\n        return default\n\n    def put(self, key, value):\n        if key in self._data:\n            self._data.move_to_end(key)\n        self._data[key] = value\n        if len(self._data) > self.capacity:\n            self._data.popitem(last=False)\n\n    def __len__(self):\n        return len(self._data)\n\n    def __contains__(self, key):\n        return key in self._data\n\n    def keys(self):\n        return list(self._data)\n\n    def info(self):\n        return {\"hits\": self.hits, \"misses\": self.misses, \"size\": len(self), \"capacity\": self.capacity}\n\n\ndef main():\n    cache = LRUCache(2)\n    cache.put(\"a\", 1)\n    cache.put(\"b\", 2)\n    cache.get(\"a\")\n    cache.put(\"c\", 3)\n    print(cache.keys(), cache.info())\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"1\nFalse True True\n['a', 'c']\n2\n['c', 'a']\n10\nnone","append":"c = LRUCache(2)\nc.put('a', 1)\nc.put('b', 2)\nprint(c.get('a'))\nc.put('c', 3)\nprint('b' in c, 'a' in c, 'c' in c)\nprint(c.keys())\nprint(len(c))\nc.put('a', 10)\nprint(c.keys())\nprint(c.get('a'))\nprint(c.get('zzz', 'none'))"},{"expected":"{'hits': 2, 'misses': 1, 'size': 1, 'capacity': 1}\n['b', 'c']","append":"c = LRUCache(1)\nc.put('x', 1)\nc.get('x')\nc.get('y')\nc.get('x')\nprint(c.info())\nd = LRUCache(2)\nd.put('a', 1)\nd.put('b', 2)\n'a' in d\nd.put('c', 3)\nprint(d.keys())"},{"expected":"capacity must be at least 1","append":"try:\n    LRUCache(0)\nexcept ValueError as e:\n    print(e)"}],"extend":["Re-implement it with your own doubly linked list and a dict.","Add a time-to-live (TTL) for each entry.","Turn it into a decorator `@lru(maxsize=3)` for functions."],"local_only":false},{"slug":"expression-interpreter","level":5,"order":25,"title":"Mini tokenizer and expression interpreter","requires":40,"goal":"Write a tiny language: turn the text `2 + 3 * (4 - x)` into tokens, then evaluate it with a recursive-descent parser that respects operator precedence.","requirements":["`tokenize(text)` returns a list of tokens: whole numbers as `int`, numbers with a dot as `float`, names (letters/underscore) as `str`, and the operators `+ - * / ^ ( )` as one-character strings. Whitespace is ignored; any other character raises `ValueError(\"unexpected character 'X'\")`.","`evaluate(text, variables=None)` returns the value. Precedence from low to high: `+ -`, `* /`, unary minus, `^` (power, **right**-associative: `2 ^ 3 ^ 2` is 512). Parentheses group.","Names are looked up in the `variables` dict (`unknown name 'q'` when missing).","Errors raise `ValueError`: `division by zero`, `unexpected end` (like `2 +`), `unbalanced parentheses`, `unexpected token` (like `2 3`).","Design hint: one method per precedence level (`expr`, `term`, `unary`, `power`, `atom`) in a `Parser` class."],"milestones":[{"title":"Tokens","detail":"A regular expression that finds numbers, names and symbols."},{"title":"Precedence","detail":"expr -> term -> unary -> power -> atom."},{"title":"Errors and variables","detail":"Clear ValueErrors; variable lookup."}],"hints":["A grammar: expr = term (('+'|'-') term)*; term = unary (('*'|'/') unary)*; atom = number | name | '(' expr ')'.","Each method consumes tokens with `self.next()` and peeks with `self.peek()`.","For right-associative `^`: after the base, if the next token is `^`, return `base ** self.unary()`."],"starter":"import re\nTOKEN = re.compile('\\\\s*(?:(\\\\d+\\\\.\\\\d+|\\\\d+)|([A-Za-z_]\\\\w*)|(.))')\n\ndef tokenize(text):\n    \"\"\"Split the text into numbers, names and operator symbols; raise ValueError for other characters.\"\"\"\n    pass\n\nclass Parser:\n\n    def __init__(self, tokens, variables):\n        \"\"\"Remember the tokens, the position (start at 0) and the variables.\"\"\"\n        pass\n\n    def peek(self):\n        return self.tokens[self.pos] if self.pos < len(self.tokens) else None\n\n    def next(self):\n        token = self.peek()\n        self.pos += 1\n        return token\n\n    def expr(self):\n        \"\"\"Handle + and - (lowest precedence).\"\"\"\n        pass\n\n    def term(self):\n        \"\"\"Handle * and /; raise ValueError('division by zero').\"\"\"\n        pass\n\n    def unary(self):\n        \"\"\"Handle a leading minus.\"\"\"\n        pass\n\n    def power(self):\n        \"\"\"Handle ^ (right-associative).\"\"\"\n        pass\n\n    def atom(self):\n        \"\"\"A number, a variable name or a parenthesised expression.\"\"\"\n        pass\n\ndef evaluate(text, variables=None):\n    \"\"\"Tokenize, parse, check that every token was used, and return the value.\"\"\"\n    pass\n\ndef main():\n    while True:\n        try:\n            line = input('calc> ')\n        except EOFError:\n            break\n        if line.strip() in ('quit', 'exit'):\n            break\n        try:\n            print(evaluate(line))\n        except ValueError as error:\n            print('error:', error)\nif __name__ == '__main__':\n    main()\n","solution":"import re\n\nTOKEN = re.compile(r\"\\s*(?:(\\d+\\.\\d+|\\d+)|([A-Za-z_]\\w*)|(.))\")\n\n\ndef tokenize(text):\n    text = text.strip()\n    tokens = []\n    pos = 0\n    while pos < len(text):\n        match = TOKEN.match(text, pos)\n        number, name, other = match.groups()\n        if number is not None:\n            tokens.append(float(number) if \".\" in number else int(number))\n        elif name is not None:\n            tokens.append(name)\n        else:\n            if other not in \"+-*/^()\":\n                raise ValueError(f\"unexpected character '{other}'\")\n            tokens.append(other)\n        pos = match.end()\n    return tokens\n\n\nclass Parser:\n    def __init__(self, tokens, variables):\n        self.tokens = tokens\n        self.pos = 0\n        self.variables = variables\n\n    def peek(self):\n        return self.tokens[self.pos] if self.pos < len(self.tokens) else None\n\n    def next(self):\n        token = self.peek()\n        self.pos += 1\n        return token\n\n    def expr(self):\n        value = self.term()\n        while self.peek() in (\"+\", \"-\"):\n            op = self.next()\n            right = self.term()\n            value = value + right if op == \"+\" else value - right\n        return value\n\n    def term(self):\n        value = self.unary()\n        while self.peek() in (\"*\", \"/\"):\n            op = self.next()\n            right = self.unary()\n            if op == \"*\":\n                value = value * right\n            else:\n                if right == 0:\n                    raise ValueError(\"division by zero\")\n                value = value / right\n        return value\n\n    def unary(self):\n        if self.peek() == \"-\":\n            self.next()\n            return -self.unary()\n        return self.power()\n\n    def power(self):\n        base = self.atom()\n        if self.peek() == \"^\":\n            self.next()\n            return base ** self.unary()\n        return base\n\n    def atom(self):\n        token = self.next()\n        if token is None:\n            raise ValueError(\"unexpected end\")\n        if isinstance(token, (int, float)):\n            return token\n        if token == \"(\":\n            value = self.expr()\n            if self.next() != \")\":\n                raise ValueError(\"unbalanced parentheses\")\n            return value\n        if token == \")\":\n            raise ValueError(\"unbalanced parentheses\")\n        if token in (\"+\", \"-\", \"*\", \"/\", \"^\"):\n            raise ValueError(f\"unexpected '{token}'\")\n        if token in self.variables:\n            return self.variables[token]\n        raise ValueError(f\"unknown name '{token}'\")\n\n\ndef evaluate(text, variables=None):\n    parser = Parser(tokenize(text), variables or {})\n    value = parser.expr()\n    if parser.peek() is not None:\n        raise ValueError(\"unbalanced parentheses\" if parser.peek() == \")\" else \"unexpected token\")\n    return value\n\n\ndef main():\n    while True:\n        try:\n            line = input(\"calc> \")\n        except EOFError:\n            break\n        if line.strip() in (\"quit\", \"exit\"):\n            break\n        try:\n            print(evaluate(line))\n        except ValueError as error:\n            print(\"error:\", error)\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"[3, '+', 4.5, '*', '(', 2, '-', 'x', ')']\n[]","append":"print(tokenize('3 + 4.5 * (2 - x)'))\nprint(tokenize('   '))"},{"expected":"14\n20\n512\n-3\n2.5\n-4\n42\n0.5\n4.0","append":"print(evaluate('2 + 3 * 4'))\nprint(evaluate('(2 + 3) * 4'))\nprint(evaluate('2 ^ 3 ^ 2'))\nprint(evaluate('-5 + 2'))\nprint(evaluate('10 / 4'))\nprint(evaluate('-2 ^ 2'))\nprint(evaluate('x * 2 + y', {'x': 21, 'y': 0}))\nprint(evaluate('2 ^ -1'))\nprint(evaluate('8 / 2'))"},{"expected":"division by zero\nunexpected end\nunbalanced parentheses\nunexpected character '$'\nunknown name 'q'\nunexpected token\nunbalanced parentheses","append":"for bad in ['7 / 0', '2 +', '(1 + 2', '2 $ 3', 'q + 1', '2 3', '1 + 2)']:\n    try:\n        evaluate(bad)\n    except ValueError as e:\n        print(e)"}],"extend":["Add functions such as `sqrt(16)` and `max(1, 2)`.","Allow assignments (`x = 4 * 2`) that store variables between lines.","Build an abstract syntax tree first, then evaluate it (and print it)."],"local_only":false},{"slug":"tiny-web-server","level":5,"order":26,"title":"Tiny web server (http.server)","requires":54,"goal":"Build a small web server with the standard library: an HTML page, a few JSON endpoints and a POST endpoint that stores notes.","requirements":["`make_server(port=0)` returns an `HTTPServer` bound to `127.0.0.1` (port 0 picks a free port). Each server keeps its own list of notes.","`GET /` returns `<h1>Hello<\/h1>` as `text/html`.","`GET /api/echo?msg=hi` returns JSON `{\"msg\": \"hi\"}`; `GET /api/add?a=2&b=3` returns `{\"sum\": 5}` or status 400 with `{\"error\": ...}` when a or b is not an integer.","`POST /api/notes` with a JSON body `{\"text\": \"...\"}` stores the note and returns status **201** with `{\"id\": n}` (ids start at 1); invalid bodies get status 400. `GET /api/notes` lists the notes as `[{\"id\": 1, \"text\": \"...\"}, ...]`.","Everything else returns status 404 and `{\"error\": \"not found\"}`. JSON responses use the `application/json` content type."],"milestones":[{"title":"Static page","detail":"Handler class with do_GET and a reply helper."},{"title":"JSON endpoints","detail":"parse_qs for the query, json.dumps for the answer."},{"title":"Storing data","detail":"do_POST reads Content-Length bytes and parses JSON."}],"hints":["`urllib.parse.urlparse(self.path)` splits path and query; `parse_qs(query)` gives lists.","Always send `Content-Length` and call `end_headers()` before writing the body.","A closure variable (`notes = []` in make_server) can hold the per-server state."],"starter":"import json\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nfrom urllib.parse import parse_qs, urlparse\n\ndef make_server(port=0):\n    \"\"\"Create the HTTPServer with a handler class implementing the routes. Return the server (do not start it).\"\"\"\n    pass\n\ndef main():\n    server = make_server(8000)\n    print('serving on http://127.0.0.1:8000  (Ctrl+C to stop)')\n    server.serve_forever()\nif __name__ == '__main__':\n    main()\n","solution":"import json\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nfrom urllib.parse import parse_qs, urlparse\n\n\ndef make_server(port=0):\n    notes = []\n\n    class Handler(BaseHTTPRequestHandler):\n        def reply(self, status, body, content_type=\"application/json\"):\n            raw = body.encode() if isinstance(body, str) else json.dumps(body).encode()\n            self.send_response(status)\n            self.send_header(\"Content-Type\", content_type)\n            self.send_header(\"Content-Length\", str(len(raw)))\n            self.end_headers()\n            self.wfile.write(raw)\n\n        def do_GET(self):\n            url = urlparse(self.path)\n            query = parse_qs(url.query)\n            if url.path == \"/\":\n                self.reply(200, \"<h1>Hello<\/h1>\", \"text/html; charset=utf-8\")\n            elif url.path == \"/api/echo\":\n                self.reply(200, {\"msg\": query.get(\"msg\", [\"\"])[0]})\n            elif url.path == \"/api/add\":\n                try:\n                    total = int(query[\"a\"][0]) + int(query[\"b\"][0])\n                except (KeyError, ValueError):\n                    self.reply(400, {\"error\": \"a and b must be integers\"})\n                else:\n                    self.reply(200, {\"sum\": total})\n            elif url.path == \"/api/notes\":\n                self.reply(200, notes)\n            else:\n                self.reply(404, {\"error\": \"not found\"})\n\n        def do_POST(self):\n            if self.path != \"/api/notes\":\n                self.reply(404, {\"error\": \"not found\"})\n                return\n            size = int(self.headers.get(\"Content-Length\") or 0)\n            try:\n                text = json.loads(self.rfile.read(size))[\"text\"]\n            except (ValueError, KeyError, TypeError):\n                self.reply(400, {\"error\": \"send JSON with a text field\"})\n                return\n            notes.append({\"id\": len(notes) + 1, \"text\": text})\n            self.reply(201, {\"id\": len(notes)})\n\n        def log_message(self, *args):\n            pass\n\n    return HTTPServer((\"127.0.0.1\", port), Handler)\n\n\ndef main():\n    server = make_server(8000)\n    print(\"serving on http://127.0.0.1:8000  (Ctrl+C to stop)\")\n    server.serve_forever()\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"(200, 'text/html', '<h1>Hello<\/h1>')\n(200, 'application/json', {'msg': 'hi there'})\n(200, 'application/json', {'sum': 5})\n400\n(404, 'application/json', {'error': 'not found'})","append":"import json, os, threading, urllib.request, urllib.error\nos.environ['NO_PROXY'] = '*'\nserver = make_server()\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f'http://127.0.0.1:{server.server_port}'\ndef fetch(path, data=None):\n    body = None if data is None else json.dumps(data).encode()\n    req = urllib.request.Request(base + path, data=body, method='GET' if data is None else 'POST')\n    try:\n        with urllib.request.urlopen(req, timeout=5) as r:\n            status, kind, raw = r.status, r.headers.get_content_type(), r.read().decode()\n    except urllib.error.HTTPError as e:\n        status, kind, raw = e.code, e.headers.get_content_type(), e.read().decode()\n    return status, kind, (json.loads(raw) if kind == 'application/json' else raw)\nprint(fetch('/'))\nprint(fetch('/api/echo?msg=hi%20there'))\nprint(fetch('/api/add?a=2&b=3'))\nprint(fetch('/api/add?a=x&b=3')[0])\nprint(fetch('/nope'))\nserver.shutdown()"},{"expected":"(201, 'application/json', {'id': 1})\n(201, 'application/json', {'id': 2})\n[{'id': 1, 'text': 'first'}, {'id': 2, 'text': 'second'}]\n400\n404","append":"import json, os, threading, urllib.request, urllib.error\nos.environ['NO_PROXY'] = '*'\nserver = make_server()\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f'http://127.0.0.1:{server.server_port}'\ndef fetch(path, data=None):\n    body = None if data is None else json.dumps(data).encode()\n    req = urllib.request.Request(base + path, data=body, method='GET' if data is None else 'POST')\n    try:\n        with urllib.request.urlopen(req, timeout=5) as r:\n            status, kind, raw = r.status, r.headers.get_content_type(), r.read().decode()\n    except urllib.error.HTTPError as e:\n        status, kind, raw = e.code, e.headers.get_content_type(), e.read().decode()\n    return status, kind, (json.loads(raw) if kind == 'application/json' else raw)\nprint(fetch('/api/notes', {'text': 'first'}))\nprint(fetch('/api/notes', {'text': 'second'}))\nprint(fetch('/api/notes')[2])\nprint(fetch('/api/notes', {'nope': 1})[0])\nprint(fetch('/api/other', {'text': 'x'})[0])\nserver.shutdown()"}],"extend":["Add `DELETE /api/notes/<id>`.","Serve static files from a folder safely (watch out for `..` in paths!).","Store the notes in a SQLite database."],"local_only":true},{"slug":"publishable-package","level":5,"order":27,"title":"Publishable Python package (final capstone)","requires":56,"goal":"Your final project: write a program that generates a complete, installable Python package called `textkit` (source, tests, metadata, command-line tool), exactly as a project scaffolding tool would.","requirements":["`build_package(root)` creates these files under `root` and returns their relative paths (forward slashes) as a sorted list: `LICENSE`, `README.md`, `pyproject.toml`, `src/textkit/__init__.py`, `src/textkit/cli.py`, `tests/test_textkit.py`.","`src/textkit/__init__.py` defines `__version__ = \"0.1.0\"`, `slugify(text)` (lower-case words joined by hyphens), `word_count(text)` and `truncate(text, n)` (cut to `n` characters in total, ending in `...` when shortened).","`src/textkit/cli.py` defines `main(argv=None)` with argparse: `--version`, and the sub-commands `slug TEXT`, `count TEXT` and `truncate TEXT --n N`, each printing its result.","`pyproject.toml` has a `[project]` table with `name = \"textkit\"` and `version = \"0.1.0\"`, a `[project.scripts]` table with `textkit = \"textkit.cli:main\"` and a `[build-system]` table; the project uses the `src` layout.","`tests/test_textkit.py` contains at least 3 unit tests and must pass when run from the package folder with `PYTHONPATH=src python -m unittest discover -s tests`.","The hidden checks import your generated package, call its functions and CLI, inspect `pyproject.toml` and run your generated tests."],"milestones":[{"title":"Layout","detail":"Decide the files and create the folders with pathlib."},{"title":"The package","detail":"Write the three functions and the CLI as strings."},{"title":"Prove it works","detail":"Generate the tests and run them yourself."}],"hints":["Keep each file's text in a constant; loop over a dict of `relative_path: content`.","`path.parent.mkdir(parents=True, exist_ok=True)` creates missing folders.","Run your own generator in the terminal, then `cd textkit-project` and run `PYTHONPATH=src python -m unittest discover -s tests` (on Windows use `set PYTHONPATH=src` first)."],"starter":"from pathlib import Path\n\n\ndef build_package(root):\n    \"\"\"Create the `textkit` project under the folder `root` and return the sorted list of the files you created,\n    as paths relative to `root` using forward slashes. See the requirements above for the files and their contents.\"\"\"\n    pass\n\n\ndef main():\n    print(build_package(\"textkit-project\"))\n\n\nif __name__ == \"__main__\":\n    main()\n","solution":"from pathlib import Path\n\nPYPROJECT = \"\"\"[project]\nname = \"textkit\"\nversion = \"0.1.0\"\ndescription = \"Tiny text helpers\"\nreadme = \"README.md\"\nrequires-python = \">=3.10\"\nlicense = {text = \"MIT\"}\n\n[project.scripts]\ntextkit = \"textkit.cli:main\"\n\n[build-system]\nrequires = [\"setuptools>=61\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[tool.setuptools.packages.find]\nwhere = [\"src\"]\n\"\"\"\n\nREADME = \"\"\"# textkit\n\nTiny text helpers: `slugify`, `word_count` and `truncate`.\n\n    pip install .\n    textkit slug \"Hello World\"\n\"\"\"\n\nLICENSE = \"\"\"MIT License\n\nCopyright (c) 2024 The textkit authors\n\nPermission is hereby granted, free of charge, to any person obtaining a copy of this software and associated\ndocumentation files (the \"Software\"), to deal in the Software without restriction, including without limitation the\nrights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND.\n\"\"\"\n\nINIT = \"\"\"import re\n\n__version__ = \"0.1.0\"\n\n\ndef slugify(text):\n    return \"-\".join(re.findall(r\"[a-z0-9]+\", text.lower()))\n\n\ndef word_count(text):\n    return len(text.split())\n\n\ndef truncate(text, n):\n    if len(text) <= n:\n        return text\n    return text[: max(0, n - 3)] + \"...\"\n\"\"\"\n\nCLI = \"\"\"import argparse\n\nfrom textkit import __version__, slugify, truncate, word_count\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(prog=\"textkit\")\n    parser.add_argument(\"--version\", action=\"version\", version=f\"textkit {__version__}\")\n    sub = parser.add_subparsers(dest=\"command\", required=True)\n    sub.add_parser(\"slug\").add_argument(\"text\")\n    sub.add_parser(\"count\").add_argument(\"text\")\n    shorten = sub.add_parser(\"truncate\")\n    shorten.add_argument(\"text\")\n    shorten.add_argument(\"--n\", type=int, default=20)\n    args = parser.parse_args(argv)\n    if args.command == \"slug\":\n        print(slugify(args.text))\n    elif args.command == \"count\":\n        print(word_count(args.text))\n    else:\n        print(truncate(args.text, args.n))\n\"\"\"\n\nTESTS = \"\"\"import unittest\n\nfrom textkit import slugify, truncate, word_count\n\n\nclass TestTextkit(unittest.TestCase):\n    def test_slugify(self):\n        self.assertEqual(slugify(\"Hello World!\"), \"hello-world\")\n\n    def test_word_count(self):\n        self.assertEqual(word_count(\"a b  c\"), 3)\n\n    def test_truncate_short(self):\n        self.assertEqual(truncate(\"abc\", 6), \"abc\")\n\n    def test_truncate_long(self):\n        self.assertEqual(truncate(\"abcdefghij\", 6), \"abc...\")\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n\"\"\"\n\n\ndef build_package(root):\n    base = Path(root)\n    files = {\n        \"pyproject.toml\": PYPROJECT,\n        \"README.md\": README,\n        \"LICENSE\": LICENSE,\n        \"src/textkit/__init__.py\": INIT,\n        \"src/textkit/cli.py\": CLI,\n        \"tests/test_textkit.py\": TESTS,\n    }\n    for relative, content in files.items():\n        path = base / relative\n        path.parent.mkdir(parents=True, exist_ok=True)\n        path.write_text(content, encoding=\"utf-8\")\n    return sorted(files)\n\n\ndef main():\n    print(build_package(\"textkit-project\"))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"['LICENSE', 'README.md', 'pyproject.toml', 'src/textkit/__init__.py', 'src/textkit/cli.py', 'tests/test_textkit.py']\n0.1.0 hello-world 3 abc... abc\nhello-world\nabc...\nTrue True True\nTrue True\nTrue","append":"import os, subprocess, sys\nfiles = build_package('pkg')\nprint(files)\nsys.path.insert(0, os.path.join('pkg', 'src'))\nimport textkit\nfrom textkit import cli\nprint(textkit.__version__, textkit.slugify('Hello World!'), textkit.word_count('a b  c'), textkit.truncate('abcdefghij', 6), textkit.truncate('abc', 6))\ncli.main(['slug', 'Hello World'])\ncli.main(['truncate', 'abcdefghij', '--n', '6'])\ntext = open(os.path.join('pkg', 'pyproject.toml')).read()\nprint('name = \"textkit\"' in text, 'version = \"0.1.0\"' in text, '[project.scripts]' in text and 'textkit = \"textkit.cli:main\"' in text)\nenv = dict(os.environ, PYTHONPATH='src')\nr = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests'], cwd='pkg', env=env, capture_output=True, text=True)\nprint(r.returncode == 0, 'OK' in r.stderr)\nprint(open(os.path.join('pkg', 'tests', 'test_textkit.py')).read().count('def test_') >= 3)"}],"extend":["Add a `LICENSE` of your choice and a `CHANGELOG.md`.","Build the wheel with `python -m build` and install it into a fresh virtual environment.","Publish to TestPyPI (https://test.pypi.org) and install it from there."],"local_only":true}]}</script>

"use strict";
// ---- util.js ----
// Small DOM helpers shared by every module.
const $ = (sel, root = document) => root.querySelector(sel);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** Create an element: el("div", {class: "x", onclick: fn}, child, "text"...) */
function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

/** Tiny markdown: paragraphs, `code`, **bold** and "- " bullet lists. Returns safe HTML. */
function md(text) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return String(text).split(/\n{2,}/).map(par => {
    const lines = par.split("\n");
    if (lines.every(l => /^\s*[-*] /.test(l))) {
      return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
    }
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("");
}

function debounce(fn, ms) {
  let t = null;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function toast(message, kind = "ok") {
  const box = $("#toasts");
  const node = el("div", { class: "toast" + (kind === "err" ? " err" : "") }, message);
  box.append(node);
  setTimeout(() => node.remove(), kind === "err" ? 6000 : 3500);
}

/** Global event bus (progress changes, run state, ...). */
const bus = new EventTarget();
const emit = (name, detail) => bus.dispatchEvent(new CustomEvent(name, { detail }));
const on = (name, fn) => bus.addEventListener(name, e => fn(e.detail));

/** Copy text to the clipboard; falls back to a hidden textarea when the Clipboard API is unavailable. */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* fall through */ }
  const ta = el("textarea", { style: "position:fixed;opacity:0" });
  ta.value = text; document.body.append(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { /* ignore */ }
  ta.remove();
  return ok;
}

function icon(name, size = 16, cls = "") {

// ---- engine.js ----
// Runs Python in the browser with Pyodide, inside a Web Worker so the page never freezes
// and a runaway program can be killed. If workers are unavailable it falls back to the main thread.
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
const ENGINE_PY = "# FLOWST browser engine. This file runs inside Pyodide (Python in WebAssembly) in a Web Worker.\n# The page sets a global `_emit(text)` before running it; every byte the program prints goes there.\nimport asyncio\nimport asyncio.base_events as _be\nimport atexit as _atexit\nimport builtins\nimport code as _code\nimport io\nimport json\nimport linecache\nimport os\nimport random\nimport shutil\nimport sys\nimport tempfile\nimport traceback\n\n\nclass _NeedInput(BaseException):\n    \"\"\"Raised inside input() when the terminal must ask the learner for another line.\"\"\"\n\n\nclass _Out(io.TextIOBase):\n    def writable(self):\n        return True\n\n    def write(self, s):\n        if not isinstance(s, str):\n            raise TypeError(\"write() argument must be str, not \" + type(s).__name__)\n        if s:\n            _emit(s)\n        return len(s)\n\n    def flush(self):\n        pass\n\n    def isatty(self):\n        return False\n\n    @property\n    def encoding(self):\n        return \"utf-8\"\n\n\nclass _In(io.TextIOBase):\n    def __init__(self, lines, interactive):\n        self.lines = lines\n        self.interactive = interactive\n\n    def readable(self):\n        return True\n\n    def isatty(self):\n        return False\n\n    def readline(self, size=-1):\n        if self.lines:\n            value = self.lines.pop(0)\n            if self.interactive:                 # the terminal replays the run, so show what was typed\n                _emit(value + \"\\n\")\n            return value + \"\\n\"\n        if self.interactive:\n            raise _NeedInput()\n        return \"\"\n\n    def read(self, size=-1):\n        rest = \"\".join(line + \"\\n\" for line in self.lines)\n        self.lines.clear()\n        return rest\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        line = self.readline()\n        if not line:\n            raise StopIteration\n        return line\n\n\ndef _input(prompt=\"\"):\n    if prompt:\n        sys.stdout.write(str(prompt))\n    line = sys.stdin.readline()\n    if line == \"\":\n        raise EOFError(\"EOF when reading a line\")\n    return line.rstrip(\"\\n\")\n\n\n# ---- asyncio: a loop with a virtual clock, because a browser tab cannot block waiting on timers --------\nimport time as _time\n\n_clock = {\"offset\": 0.0}          # virtual seconds the asyncio loop has \"slept\"\n\n\ndef _patch_clock():\n    for name in (\"time\", \"monotonic\", \"perf_counter\"):\n        original = getattr(_time, name)\n        setattr(_time, name, (lambda fn: lambda: fn() + _clock[\"offset\"])(original))\n\n\n_patch_clock()\n\n\nclass _Selector:\n    def __init__(self, loop):\n        self.loop = loop\n\n    def select(self, timeout=None):\n        if timeout and timeout > 0:\n            self.loop._vtime += timeout\n            _clock[\"offset\"] += timeout\n        return []\n\n    def close(self):\n        pass\n\n    def get_map(self):\n        return {}\n\n\nclass _VirtualLoop(_be.BaseEventLoop):\n    def __init__(self):\n        super().__init__()\n        self._vtime = 0.0\n        self._selector = _Selector(self)\n\n    def time(self):\n        return self._vtime\n\n    def _process_events(self, event_list):\n        pass\n\n    def _write_to_self(self):\n        pass\n\n\nclass _Policy(asyncio.DefaultEventLoopPolicy):\n    def new_event_loop(self):\n        return _VirtualLoop()\n\n\ndef _arun(main, *, debug=None, **kwargs):\n    loop = _VirtualLoop()\n    asyncio.set_event_loop(loop)\n    try:\n        return loop.run_until_complete(main)\n    finally:\n        try:\n            loop.run_until_complete(loop.shutdown_asyncgens())\n        finally:\n            asyncio.set_event_loop(None)\n            loop.close()\n\n\ndef _install_asyncio():\n    import warnings\n    with warnings.catch_warnings():\n        warnings.simplefilter(\"ignore\")\n        asyncio.set_event_loop_policy(_Policy())\n    asyncio.run = _arun\n\n\n_install_asyncio()\n\n\n# ---- running programs ---------------------------------------------------------------------------------\nclass _Swap:\n    \"\"\"Swap in our streams, input() and argv; restore everything on exit.\"\"\"\n\n    def __init__(self, stdin):\n        self.stdin = stdin\n\n    def __enter__(self):\n        self.saved = (sys.stdout, sys.stderr, sys.stdin, builtins.input, list(sys.argv))\n        out = _Out()\n        sys.stdout = sys.stderr = out\n        sys.stdin = self.stdin\n        builtins.input = _input\n        return self\n\n    def __exit__(self, *exc):\n        sys.stdout, sys.stderr, sys.stdin, builtins.input = self.saved[:4]\n        sys.argv[:] = self.saved[4]\n        return False\n\n\ndef _reset_logging():\n    logging = sys.modules.get(\"logging\")\n    if logging is None:\n        return\n    root = logging.getLogger()\n    for handler in root.handlers[:]:\n        root.removeHandler(handler)\n    root.setLevel(logging.WARNING)\n\n\ndef _flowst_run(req_json):\n    req = json.loads(req_json)\n    files = req[\"files\"]\n    entry = req.get(\"entry\", \"main.py\")\n    interactive = bool(req.get(\"interactive\"))\n    lines = list(req.get(\"inputs\") or [])\n    if interactive and \"seed\" in req:\n        random.seed(req[\"seed\"])\n    workdir = tempfile.mkdtemp(prefix=\"flowst\")\n    for name, source in files.items():\n        with open(os.path.join(workdir, name), \"w\", encoding=\"utf-8\") as fh:\n            fh.write(source)\n    previous_cwd = os.getcwd()\n    saved_path = list(sys.path)\n    modules_before = set(sys.modules)\n    linecache.clearcache()\n    os.chdir(workdir)\n    sys.path.insert(0, workdir)\n    exit_code, need_input = 0, False\n    with _Swap(_In(lines, interactive)):\n        sys.argv[:] = [entry]\n        try:\n            namespace = {\"__name__\": \"__main__\", \"__file__\": entry, \"__builtins__\": builtins, \"__doc__\": None}\n            try:\n                exec(compile(files[entry], entry, \"exec\"), namespace)\n            finally:\n                try:\n                    _atexit._run_exitfuncs()\n                except BaseException:\n                    pass\n        except SystemExit as exc:\n            if exc.code is None:\n                exit_code = 0\n            elif isinstance(exc.code, int):\n                exit_code = exc.code\n            else:\n                print(exc.code, file=sys.stderr)\n                exit_code = 1\n        except _NeedInput:\n            need_input = True\n        except BaseException:\n            etype, value, tb = sys.exc_info()\n            tb = tb.tb_next if tb is not None else None      # hide this function's own frame\n            _emit(\"\".join(traceback.format_exception(etype, value, tb)))\n            exit_code = 1\n    sys.path[:] = saved_path\n    os.chdir(previous_cwd)\n    for name in set(sys.modules) - modules_before:\n        module = sys.modules.get(name)\n        path = getattr(module, \"__file__\", None) or \"\"\n        if path.startswith(workdir) or os.path.basename(path) in files:\n            sys.modules.pop(name, None)\n    _reset_logging()\n    shutil.rmtree(workdir, ignore_errors=True)\n    linecache.clearcache()\n    return json.dumps({\"exit_code\": exit_code, \"need_input\": need_input})\n\n\n# ---- the REPL ----------------------------------------------------------------------------------------\n_repl = None\n\n\ndef _repl_input(prompt=\"\"):\n    raise EOFError(\"input() is not available in the browser REPL. Use the Script tab for programs that read input.\")\n\n\ndef _flowst_version():\n    return sys.version.split()[0]\n\n\ndef _flowst_repl_new():\n    global _repl\n    _repl = _code.InteractiveConsole({\"__name__\": \"__main__\", \"__doc__\": None})\n    return _flowst_version()\n\n\ndef _flowst_repl_push(line):\n    with _Swap(_In([], False)):\n        builtins.input = _repl_input\n        more = _repl.push(line)\n    return json.dumps({\"more\": bool(more)})\n\n\ndef _flowst_repl_reset():\n    _repl.resetbuffer()\n";
let FORCE_MAIN = false;

/** Worker program. Serialised with toString(), so it must not use anything from the outer scope. */
function workerBody(scope, loadScript, cfg) {
  const post = m => scope.postMessage(m);
  let py = null;
  let loaded = false;
  const fns = {};
  const message = err => String((err && err.message) || err);
  // Some hosts (sandboxed previews) proxy fetch() and cannot clone URL objects, which Pyodide passes. Always hand fetch a string.
  if (globalThis.fetch && !globalThis.fetch.__flowstSafe) {
    const nativeFetch = globalThis.fetch;
    const safeFetch = (input, init) => nativeFetch.call(globalThis, input instanceof URL ? input.href : input, init);
    safeFetch.__flowstSafe = true;
    globalThis.fetch = safeFetch;
  }
  // When WebAssembly cannot start, Pyodide only prints a console warning and then waits forever: turn that into a clear error.
  const nativeWarn = console.warn.bind(console);
  console.warn = (...args) => {
    nativeWarn(...args);
    if (!loaded && /wasm instantiation failed/i.test(String(args[0]))) post({ t: "fatal", msg: "Python could not start because WebAssembly is blocked in this view. Open the file directly in Chrome, Edge or Firefox and try again." });
  };
  setTimeout(() => { if (!loaded) post({ t: "fatal", msg: "Python is taking too long to load. Check your internet connection, or open the file directly in Chrome, Edge or Firefox." }); }, 90000);
  const ready = (async () => {
    post({ t: "status", msg: "Downloading Python" });
    await loadScript(cfg.url + "pyodide.js");
    py = await globalThis.loadPyodide({ indexURL: cfg.url });
    py.globals.set("_emit", text => post({ t: "out", text }));
    py.runPython(cfg.prelude);
    for (const n of ["_flowst_run", "_flowst_version", "_flowst_repl_new", "_flowst_repl_push", "_flowst_repl_reset"]) fns[n] = py.globals.get(n);
    loaded = true;
    console.warn = nativeWarn;
    post({ t: "ready", version: fns._flowst_version() });
  })();
  ready.catch(err => post({ t: "fatal", msg: message(err) }));
  scope.onmessage = async ev => {
    const m = ev.data;
    try {
      await ready;
      let result = {};
      if (m.t === "run") {
        if (/\bsqlite3\b/.test(Object.values(m.req.files).join("\n"))) await py.loadPackage("sqlite3");
        result = JSON.parse(fns._flowst_run(JSON.stringify(m.req)));
      } else if (m.t === "repl-new") fns._flowst_repl_new();
      else if (m.t === "repl-push") result = JSON.parse(fns._flowst_repl_push(m.line));
      else if (m.t === "repl-reset") fns._flowst_repl_reset();
      post({ t: "done", id: m.id, result });
    } catch (err) {
      post({ t: "out", text: "\n" + message(err) + "\n" });
      post({ t: "done", id: m.id, result: { exit_code: 1, fatal: true } });
    }
  };
}

class Engine {
  constructor(label) { this.label = label; this.mainMode = FORCE_MAIN; this.queue = Promise.resolve(); this.spawn(); }

  spawn() {
    this.version = ""; this.isReady = false; this.status = "Starting Python"; this.cur = null; this.nextId = 1;
    this.ready = new Promise((resolve, reject) => { this._ok = resolve; this._fail = reject; });
    this.ready.catch(() => {});
    this.start();
  }

  start() {
    const cfg = { url: PYODIDE_URL, prelude: ENGINE_PY };
    if (!this.mainMode) {
      try {
        const src = "(" + workerBody.toString() + ")(self, function (u) { importScripts(u); }, " + JSON.stringify(cfg) + ");";
        const blobUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        const worker = new Worker(blobUrl);
        const endpoint = { post: m => worker.postMessage(m), kill: () => { worker.terminate(); URL.revokeObjectURL(blobUrl); } };
        this.endpoint = endpoint;
        worker.onmessage = e => { if (this.endpoint === endpoint) this.onMsg(e.data); };
        worker.onerror = e => {
          if (this.endpoint !== endpoint) return;
          e.preventDefault();
          if (!this.isReady) { endpoint.kill(); FORCE_MAIN = true; this.mainMode = true; this.start(); }   // workers blocked: use the main thread
          else this.onMsg({ t: "fatal", msg: e.message || "The Python worker crashed." });
        };
        return;
      } catch (err) { /* fall through to the main thread */ }
    }
    this.mainMode = true;
    const endpoint = { post: m => setTimeout(() => scope.onmessage({ data: m }), 0), kill() {} };
    const scope = { postMessage: m => setTimeout(() => { if (this.endpoint === endpoint) this.onMsg(m); }, 0), onmessage: null };
    const loadScript = url => new Promise((resolve, reject) => {
      if (globalThis.loadPyodide) return resolve();
      const s = document.createElement("script");
      s.src = url; s.onload = () => resolve();
      s.onerror = () => reject(new Error("Could not download Python from the internet. Check your connection and reload the page."));
      document.head.append(s);
    });
    this.endpoint = endpoint;
    workerBody(scope, loadScript, cfg);
  }

  onMsg(m) {
    if (m.t === "status") { this.status = m.msg; if (this.onStatus) this.onStatus(m.msg); }
    else if (m.t === "ready") { this.version = m.version; this.isReady = true; this.status = "Python " + m.version; this._ok(); if (this.onStatus) this.onStatus(this.status); }
    else if (m.t === "fatal") {
      this.status = "Python failed to load"; this._fail(new Error(/importScripts|NetworkError|Failed to fetch|download/i.test(m.msg)
        ? "Could not download Python from the internet. Check your connection and reload the page." : m.msg));
      if (this.cur) { clearTimeout(this.cur.timer); const c = this.cur; this.cur = null; c.resolve({ exit_code: 1, fatal: true }); }
    } else if (m.t === "out") { if (this.cur && this.cur.onOut) this.cur.onOut(m.text); }
    else if (m.t === "done") {
      if (this.cur && this.cur.id === m.id) { clearTimeout(this.cur.timer); const c = this.cur; this.cur = null; c.resolve(m.result); }
    }
  }

  enqueue(fn) { const p = this.queue.then(fn, fn); this.queue = p.catch(() => {}); return p; }

  async _send(msg, { onOut, limitMs } = {}) {
    await this.ready;
    return new Promise(resolve => {
      const id = this.nextId++;
      msg.id = id;
      const cur = { id, onOut, resolve, timer: null };
      this.cur = cur;
      if (limitMs && !this.mainMode) cur.timer = setTimeout(() => { this.restart(); resolve({ exit_code: null, timed_out: true }); }, limitMs);
      this.endpoint.post(msg);
    });
  }

  /** req: {files, entry, inputs, interactive, seed}. Resolves {exit_code, need_input} or {timed_out} / {stopped}. */
  run(req, opts) { return this.enqueue(() => this._send({ t: "run", req }, opts)); }
  replNew() { return this.enqueue(() => this._send({ t: "repl-new" })); }
  replPush(line, opts) { return this.enqueue(() => this._send({ t: "repl-push", line }, opts)); }
  replReset() { return this.enqueue(() => this._send({ t: "repl-reset" })); }

  restart() {
    if (this.cur) clearTimeout(this.cur.timer);
    this.cur = null;
    this.endpoint.kill();
    this.spawn();
  }

  /** Stop the running program (the worker is replaced, which takes a moment). */
  stopCurrent() {
    if (!this.cur || this.mainMode) return false;
    const c = this.cur;
    this.restart();
    c.resolve({ exit_code: null, stopped: true });
    return true;
  }
}

const engines = (() => {
  let script = null, repl = null;
  return { script: () => (script = script || new Engine("script")), repl: () => (repl = repl || new Engine("repl")), hasRepl: () => !!repl };
})();

// ---- api.js ----
// The FLOWST server, rebuilt to run inside the page: same endpoints the interface already calls,
// answered from the lesson data embedded in this file, with progress kept in localStorage and
// answers graded by running the learner's code with the in-browser Python engine.

const DATA = JSON.parse(document.getElementById("flowst-data").textContent);
const TRACKS = ["BOOT", "CORE", "BUILD", "OOP", "PRO"];
const XP = { exercise: 20, quizPerQuestion: 4, challenge: 60, projectBase: 100, projectPerLevel: 50, levelStep: 250 };
const TITLES = ["Hatchling", "Scripter", "Coder", "Builder", "Hacker", "Engineer", "Architect", "Wizard", "Sage", "Pythonista"];
const MAX_CODE_BYTES = 200000;

const text = v => (Array.isArray(v) ? v.join("\n") : String(v));
const chapterIds = DATA.chapters.map(c => c.id);
const chapters = new Map(DATA.chapters.map(c => [c.id, c]));
const projects = new Map(DATA.projects.map(p => [p.slug, p]));

class ApiError extends Error { constructor(status, message) { super(message); this.status = status; } }

// ---- settings and progress storage ------------------------------------------------------------------
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage disabled: progress lasts until reload */ } },
};
// Mode: "learn" opens every chapter, "study" opens them one at a time. An old unlock-all setting counts as learn.
const getMode = () => store.get("flowst:mode") || (store.get("flowst:unlock-all") === "1" ? "learn" : null);
const unlockAll = () => new URLSearchParams(location.search).get("unlock") === "all" || getMode() === "learn";

const defaults = () => ({ version: 1, xp: 0, streak: { count: 0, best: 0, last_day: "" }, chapters: {}, projects: {}, code: {}, last: {} });
let PROG = (() => {
  try { const d = JSON.parse(store.get("flowst:data:v1")); if (d && d.version === 1) return { ...defaults(), ...d }; } catch { /* start fresh */ }
  return defaults();
})();
const save = () => store.set("flowst:data:v1", JSON.stringify(PROG));

const pad = n => String(n).padStart(2, "0");
const dayString = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dayString(new Date());
const yesterday = () => dayString(new Date(Date.now() - 864e5));

function touchStreak() {
  const s = PROG.streak;
  if (s.last_day === today()) return;
  s.count = s.last_day === yesterday() ? s.count + 1 : 1;
  s.best = Math.max(s.best, s.count);
  s.last_day = today();
}
function award(xp) { touchStreak(); PROG.xp += xp; return xp; }

function stats() {
  const level = Math.floor(PROG.xp / XP.levelStep) + 1;
  const streak = { ...PROG.streak };
  if (streak.last_day && streak.last_day < yesterday()) streak.count = 0;
  return { xp: PROG.xp, level, level_floor: (level - 1) * XP.levelStep, level_next: level * XP.levelStep, title: TITLES[Math.min(level - 1, TITLES.length - 1)], streak };
}

const chapterRec = id => (PROG.chapters[id] ||= { exercises: {}, attempts: {}, quiz_best: 0, quiz_total: 0, challenge: false, complete: false });
const completedChapters = () => new Set(Object.entries(PROG.chapters).filter(([, v]) => v.complete).map(([k]) => Number(k)));
const projectRec = slug => (PROG.projects[slug] ||= { status: "started", milestones: [], hints: 0, attempts: 0 });

function solutionAvailable(cid, key) {
  const ch = PROG.chapters[cid] || {};
  const done = key === "c" ? ch.challenge : (ch.exercises || {})[key];
  return !!done || ((ch.attempts || {})[key] || 0) >= 3;
}
const projectSolutionUnlocked = slug => ["completed", "gave_up"].includes((PROG.projects[slug] || {}).status);

function unlockedChapters() {
  if (unlockAll()) return [...chapterIds];
  const done = completedChapters();
  return chapterIds.filter((id, i) => i === 0 || done.has(chapterIds[i - 1]));
}
const projectUnlocked = slug => unlockAll() || completedChapters().has(projects.get(slug).requires);

function chapterOr404(cid) {
  if (!chapters.has(cid)) throw new ApiError(404, "no such chapter");
  if (!unlockedChapters().includes(cid)) throw new ApiError(403, "chapter locked: pass the mini challenge of the previous chapter first");
  return chapters.get(cid);
}
function projectOr404(slug) {
  if (!projects.has(slug)) throw new ApiError(404, "no such project");
  if (!projectUnlocked(slug)) throw new ApiError(403, `project locked: complete chapter ${projects.get(slug).requires} first`);
  return projects.get(slug);
}

// ---- public views of the content ---------------------------------------------------------------------
function publicTask(index, t) {
  return { index, title: t.title, prompt: text(t.prompt), starter: text(t.starter), hint: t.hint || "", tests: t.tests.length,
    mode: t.tests.some(x => x.append) ? "function" : "program", local_only: !!t.local_only };
}
function publicChapter(cid) {
  const c = chapters.get(cid);
  return { id: c.id, track: c.track, slug: c.slug, title: c.title, terms: c.terms.map(t => ({ term: t.term, def: t.def })), explain: text(c.explain),
    example: { code: text(c.example.code) }, mistakes: c.mistakes.map(text), exercises: c.exercises.map((e, i) => publicTask(i, e)),
    quiz: c.quiz.map(q => ({ q: q.q, options: q.options })), challenge: publicTask(0, c.challenge) };
}
function publicProject(slug, hintsShown) {
  const p = projects.get(slug);
  return { slug, level: p.level, title: p.title, requires: p.requires, goal: text(p.goal), requirements: p.requirements, milestones: p.milestones,
    starter: text(p.starter), extend: p.extend, hints: p.hints.slice(0, hintsShown).map(text), hints_total: p.hints.length, tests: p.tests.length, local_only: !!p.local_only };
}

function glossary() {
  const seen = new Map();
  for (const c of DATA.chapters) for (const t of c.terms) {
    const key = t.term.toLowerCase();
    if (!seen.has(key)) seen.set(key, { term: t.term, def: t.def, chapter: c.id, chapter_title: c.title });
  }
  return [...seen.values()].sort((a, b) => a.term.toLowerCase().localeCompare(b.term.toLowerCase()));
}

function countOf(haystack, needle) { let n = 0, i = haystack.indexOf(needle); while (i !== -1) { n++; i = haystack.indexOf(needle, i + needle.length); } return n; }
function search(query, limit = 20) {
  const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const scored = [];
  const consider = (weighted, hit) => {
    let score = 0;
    for (const w of words) {
      const found = weighted.reduce((sum, [weight, body]) => sum + weight * countOf(body.toLowerCase(), w), 0);
      if (!found) return;
      score += found;
    }
    const body = [...weighted].reverse().map(x => x[1]).find(b => b.toLowerCase().includes(words[0])) || "";
    const i = body.toLowerCase().indexOf(words[0]);
    hit.snippet = body ? body.slice(Math.max(0, i - 40), i + 80).split(/\s+/).filter(Boolean).join(" ") : "";
    scored.push([score, hit]);
  };
  for (const c of DATA.chapters) {
    consider([[6, c.title], [1, text(c.explain)], [1, text(c.example.code)], [2, c.terms.map(t => `${t.term} ${t.def}`).join(" ")]],
      { type: "chapter", id: c.id, title: `${pad(c.id)} ${c.title}` });
    for (const t of c.terms) consider([[8, t.term], [2, t.def]], { type: "term", id: c.id, title: `term: ${t.term}` });
  }
  for (const p of DATA.projects) consider([[6, p.title], [2, text(p.goal)], [1, p.requirements.join(" ")]], { type: "project", id: p.slug, title: `project: ${p.title}` });
  scored.sort((a, b) => b[0] - a[0]);
  return scored.slice(0, limit).map(s => s[1]);
}

// ---- plain-English error hints (same wording as the local server) ---------------------------------------
const ERROR_HINTS = {
  SyntaxError: "Python could not understand the grammar of your code. Look at the line shown (and the one above it): a missing colon, quote or closing bracket is the usual cause.",
  IndentationError: "The spaces at the start of a line do not line up. Lines inside a block (after a colon) must be indented by the same amount; lines outside it must not be.",
  NameError: "You used a name Python has never heard of. Check the spelling and capitalisation, and make sure the variable is created (assigned) before this line runs.",
  UnboundLocalError: "A variable inside a function is used before it was given a value - often because the same name is assigned later in that function.",
  TypeError: "An operation got a value of the wrong type: for example adding a number to text, calling something that is not a function, or passing the wrong number of arguments.",
  IndexError: "You asked for a list position that does not exist. Positions start at 0 and the last valid position is len(list) - 1.",
  KeyError: "The dictionary has no such key. Check the spelling of the key, or use .get(key) to avoid the error.",
  ZeroDivisionError: "You divided by zero, which is impossible. Check the value on the right-hand side of /, // or %.",
  ValueError: "The value has the right type but unusable content, like int('abc'). Check or clean the data before converting it.",
  AttributeError: "The object does not have the attribute or method you asked for. Check the spelling and what type the value really is.",
  ImportError: "Python could not import that name. Check the spelling; standard-library modules need no install, other packages do.",
  ModuleNotFoundError: "Python could not find that module. Check the spelling; standard-library modules need no install, other packages do (pip install).",
  FileNotFoundError: "The file or folder does not exist at that path. Remember each run starts in a fresh, empty folder, so create the file first.",
  PermissionError: "Python is not allowed to open that path. Use a file inside the current folder instead.",
  RecursionError: "A function kept calling itself without stopping. Add a base case that returns without recursing.",
  KeyboardInterrupt: "The program was interrupted (Ctrl+C or the Stop button).",
  EOFError: "input() was called but there was nothing left to read. Type a line in the terminal, or check how many times you call input().",
  StopIteration: "next() was called on an iterator that has no more items.",
