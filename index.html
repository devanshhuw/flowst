  OverflowError: "A number became too large for this operation.",
  MemoryError: "The program tried to use more memory than is available.",
  UnicodeDecodeError: "Python could not decode bytes as text. Open the file with the right encoding, e.g. open(name, encoding='utf-8').",
};
const ERROR_ALIASES = { TabError: "IndentationError" };
const EXC_LINE = /^(?:[A-Za-z_]\w*\.)*([A-Za-z_]\w*(?:Error|Exception|Interrupt|Iteration|Exit))(?::[ ]?(.*))?$/;
const REFINE = [
  [/name '(\w+)' is not defined/, "'{0}' is not defined here: is it misspelled, or created later/in another scope?"],
  [/can only concatenate str/, "You are joining text and a number with +. Convert the number with str(), or use an f-string."],
  [/unsupported operand type/, "The two values on either side of the operator cannot be combined. Check their types (print(type(x)))."],
  [/not subscriptable/, "You used [] on something that is not a list, string, tuple or dict - is the value None?"],
  [/positional argument/, "The number of arguments in the call does not match the function definition."],
  [/object is not callable/, "You put () after something that is not a function - maybe a variable has the same name as a function."],
  [/invalid literal for int/, "int() only converts text that looks like a whole number, e.g. '42'."],
  [/'NoneType' object has no attribute/, "A value is None here - often a function forgot to return it."],
  [/expected ':'/, "Add a colon ':' at the end of that line."],
  [/was never closed|unexpected EOF|unterminated/, "A bracket or quote was opened and never closed."],
  [/No module named '([\w.]+)'/, "There is no module called '{0}'. Check the spelling."],
];

function explainError(output) {
  if (!output || (!output.includes("Traceback (most recent call last)") && !output.includes('File "'))) return null;
  const lines = output.split("\n").filter(l => l.trim());
  for (const line of lines.slice(-40).reverse()) {
    const m = EXC_LINE.exec(line);
    if (!m) continue;
    const name = m[1], msg = m[2] || "";
    let hint = ERROR_HINTS[ERROR_ALIASES[name] || name] || `Your program raised ${name}. Read the traceback from the bottom up: the last line says what happened, the lines above say where.`;
    for (const [rx, extra] of REFINE) {
      const mm = rx.exec(msg);
      if (mm) { hint += " " + extra.replace(/\{(\d)\}/g, (_, i) => mm[Number(i) + 1]); break; }
    }
    const nums = [...output.matchAll(/File "[^"]*(?:main|solution)\.py", line (\d+)/g)];
    return { error: name, message: msg, hint, line: nums.length ? Number(nums[nums.length - 1][1]) : null };
  }
  return null;
}

// ---- grading ---------------------------------------------------------------------------------------------
const normalize = t => t.replace(/\r\n?/g, "\n").trim().split("\n").map(l => l.replace(/\s+$/, "")).join("\n");
const clip = t => (t.length <= 2000 ? t : t.slice(0, 2000) + "\n... (output shortened)");
const indent = s => s.split("\n").map(l => (l.trim() ? "    " + l : l)).join("\n");
const splitLines = s => (s ? s.replace(/\r\n?/g, "\n").replace(/\n$/, "").split("\n") : []);

function buildHarness(append) {
  const body = indent(append.replace(/^\n+|\n+$/g, "")) || "    pass";
  return "import contextlib as _cl, io as _io\nwith _cl.redirect_stdout(_io.StringIO()):\n    import solution as _solution\n" +
    'globals().update({k: v for k, v in vars(_solution).items() if not k.startswith("__")})\n\n\ndef _flowst_tests():\n' + body +
    '\n\n\nif __name__ == "__main__":\n    _flowst_tests()\n';
}

async function grade(code, tests, limitMs) {
  const engine = engines.script();
  const results = [];
  let passedCount = 0, shown = false, hint = null;
  for (let i = 0; i < tests.length; i++) {
    const test = tests[i], stdin = test.stdin || "", append = test.append || "";
    const files = append ? { "solution.py": code, "main.py": buildHarness(append) } : { "main.py": code };
    let output = "";
    const run = await engine.run({ files, inputs: splitLines(stdin), interactive: false }, { onOut: t => { output += t; }, limitMs });
    if (run.fatal && !output) throw new ApiError(500, "The Python engine could not start. Check your internet connection and reload the page.");
    const ok = run.exit_code === 0 && normalize(output) === normalize(test.expected);
    if (ok) { passedCount++; results.push({ n: i + 1, ok: true }); continue; }
    const entry = { n: i + 1, ok: false };
    if (!shown) {
      shown = true;
      let actual = output;
      if (run.timed_out) actual += `\n[stopped: time limit of ${Math.round(limitMs / 1000)}s exceeded]`;
      Object.assign(entry, { stdin, call: append.trim(), expected: clip(test.expected), actual: clip(actual), timed_out: !!run.timed_out });
      hint = explainError(output);
    }
    results.push(entry);
  }
  return { passed: passedCount === tests.length && tests.length > 0, passed_count: passedCount, total: tests.length, results, hint };
}

const selfMarked = n => ({ passed: true, self_marked: true, passed_count: n, total: n, results: Array.from({ length: n }, (_, i) => ({ n: i + 1, ok: true })), hint: null });

// ---- routes ----------------------------------------------------------------------------------------------
const need = (body, key, type) => {
  if (typeof body[key] !== type) throw new ApiError(400, `'${key}' must be a ${type}`);
  return body[key];
};

async function check(b) {
  const kind = need(b, "kind", "string"), code = need(b, "code", "string");
  if (new Blob([code]).size > MAX_CODE_BYTES) throw new ApiError(413, "code is too large");
  if (kind === "exercise" || kind === "challenge") {
    const cid = need(b, "chapter", "number"), ch = chapterOr404(cid);
    let task, key, index = 0;
    if (kind === "exercise") {
      index = need(b, "index", "number");
      if (!(index >= 0 && index < ch.exercises.length)) throw new ApiError(404, "no such exercise");
      task = ch.exercises[index]; key = String(index);
    } else { task = ch.challenge; key = "c"; }
    const result = task.local_only && b.self_check ? selfMarked(task.tests.length) : await grade(code, task.tests, 10000);
    const rec = chapterRec(cid);
    rec.attempts[key] = (rec.attempts[key] || 0) + 1;
    let gained = 0, newly = false, next = null;
    if (kind === "exercise") {
      if (result.passed && !rec.exercises[key]) { rec.exercises[key] = true; gained = award(XP.exercise); }
    } else if (result.passed && !rec.challenge) {
      rec.challenge = true; rec.complete = true; newly = true; gained = award(XP.challenge);
      const at = chapterIds.indexOf(cid);
      next = at + 1 < chapterIds.length ? chapterIds[at + 1] : null;
    }
    save();
    return { result, xp_gained: gained, chapter_complete: newly, unlocked_next: next, solution_available: solutionAvailable(cid, key) || !!task.local_only, stats: stats() };
  }
  if (kind === "project") {
    const slug = need(b, "slug", "string"), p = projectOr404(slug);
    const result = p.local_only && b.self_check ? selfMarked(p.tests.length) : await grade(code, p.tests, 15000);
    const rec = projectRec(slug);
    rec.attempts += 1;
    let gained = 0;
    if (result.passed && rec.status !== "completed") { rec.status = "completed"; gained = award(XP.projectBase + XP.projectPerLevel * p.level); }
    save();
    return { result, xp_gained: gained, stats: stats(), solution_available: projectSolutionUnlocked(slug) };
  }
  throw new ApiError(400, "kind must be exercise, challenge or project");
}

const ROUTES = [
  ["GET", /^\/api\/meta$/, () => ({ tracks: TRACKS,
    chapters: DATA.chapters.map(c => ({ id: c.id, slug: c.slug, title: c.title, track: c.track })),
    projects: DATA.projects.map(p => ({ slug: p.slug, title: p.title, level: p.level, requires: p.requires })),
    version: DATA.version, standalone: true, unlock_all: unlockAll(), mode: getMode(), python: "Python in your browser" })],
  ["GET", /^\/api\/progress$/, () => ({ ...JSON.parse(JSON.stringify(PROG)), stats: stats(), unlocked: unlockedChapters(),
    projects_unlocked: DATA.projects.filter(p => projectUnlocked(p.slug)).map(p => p.slug) })],
  ["POST", /^\/api\/progress\/code$/, (m, q, b) => {
    const key = need(b, "key", "string"), code = need(b, "code", "string");
    if (!/^[\w:.-]{1,60}$/.test(key)) throw new ApiError(400, "invalid key");
    if (code.length > MAX_CODE_BYTES) throw new ApiError(413, "code is too large to save");
    if (!(key in PROG.code) && Object.keys(PROG.code).length >= 600) throw new ApiError(413, "too many saved files");
    PROG.code[key] = code; save(); return { ok: true };
  }],
  ["POST", /^\/api\/progress\/last$/, (m, q, b) => {
    const kind = need(b, "kind", "string"), id = String(b.id ?? "");
    if (!["chapter", "project", "page"].includes(kind) || id.length > 80) throw new ApiError(400, "invalid location");
    PROG.last = { kind, id }; save(); return { ok: true };
  }],
  ["POST", /^\/api\/progress\/reset$/, (m, q, b) => {
    if (b.confirm !== true) throw new ApiError(400, 'send {"confirm": true} to reset all progress');
    PROG = defaults(); save();
    try { Object.keys(localStorage).filter(k => k.startsWith("flowst:code:")).forEach(k => localStorage.removeItem(k)); } catch { /* ignore */ }
    return { ok: true };
  }],
  ["POST", /^\/api\/mode$/, (m, q, b) => {
    if (!["learn", "study"].includes(b.mode)) throw new ApiError(400, "mode must be learn or study");
    store.set("flowst:mode", b.mode); return { ok: true, mode: b.mode };
  }],
  ["POST", /^\/api\/settings$/, (m, q, b) => { store.set("flowst:unlock-all", b.unlock_all ? "1" : "0"); return { ok: true }; }],
  ["GET", /^\/api\/chapters\/(\d+)$/, m => { const id = Number(m[1]); chapterOr404(id); return publicChapter(id); }],
  ["GET", /^\/api\/chapters\/(\d+)\/solution\/(\d+|c)$/, m => {
    const cid = Number(m[1]), key = m[2], ch = chapterOr404(cid);
    const task = key === "c" ? ch.challenge : ch.exercises[Number(key)];
    if (!task) throw new ApiError(404, "no such exercise");
    if (!task.local_only && !solutionAvailable(cid, key)) throw new ApiError(403, "the solution unlocks after you pass it or try three times");
    return { solution: text(task.solution) };
  }],
  ["POST", /^\/api\/quiz$/, (m, q, b) => {
    const cid = need(b, "chapter", "number"), ch = chapterOr404(cid), answers = b.answers;
    if (!Array.isArray(answers) || answers.length !== ch.quiz.length) throw new ApiError(400, "send one answer per question");
    const results = ch.quiz.map((qq, i) => ({ correct: answers[i] === qq.answer, answer: qq.answer, why: qq.why }));
    const score = results.filter(r => r.correct).length;
    const rec = chapterRec(cid);
    let gained = 0;
    if (score > rec.quiz_best) { gained = award((score - rec.quiz_best) * XP.quizPerQuestion); rec.quiz_best = score; }
    rec.quiz_total = results.length; save();
    return { score, total: results.length, results, xp_gained: gained, stats: stats() };
  }],
  ["POST", /^\/api\/check$/, (m, q, b) => check(b)],
  ["GET", /^\/api\/projects\/([\w-]+)$/, m => {
    projectOr404(m[1]);
    const st = JSON.parse(JSON.stringify(PROG.projects[m[1]] || { status: "new", milestones: [], hints: 0, attempts: 0 }));
    return { ...publicProject(m[1], st.hints), state: st };
  }],
  ["GET", /^\/api\/projects\/([\w-]+)\/solution$/, m => {
    const p = projectOr404(m[1]);
    if (!p.local_only && !projectSolutionUnlocked(m[1])) throw new ApiError(403, "the solution unlocks when you pass the checks or give up");
    return { solution: text(p.solution) };
  }],
  ["POST", /^\/api\/projects\/([\w-]+)\/hint$/, m => {
    const p = projectOr404(m[1]), rec = projectRec(m[1]);
    rec.hints = Math.min(p.hints.length, rec.hints + 1); save();
    return { hints: publicProject(m[1], rec.hints).hints, hints_total: p.hints.length };
  }],
  ["POST", /^\/api\/projects\/([\w-]+)\/milestone$/, (m, q, b) => {
    const p = projectOr404(m[1]), index = need(b, "index", "number");
    if (!(index >= 0 && index < p.milestones.length)) throw new ApiError(400, "no such milestone");
    const rec = projectRec(m[1]), marks = new Set(rec.milestones);
    if (b.done === false) marks.delete(index); else marks.add(index);
    rec.milestones = [...marks].sort((a, c) => a - c); touchStreak(); save();
    return { milestones: rec.milestones };
  }],
  ["POST", /^\/api\/projects\/([\w-]+)\/giveup$/, m => {
    projectOr404(m[1]);
    const rec = projectRec(m[1]);
    if (rec.status !== "completed") rec.status = "gave_up";
    save(); return { ok: true };
  }],
  ["GET", /^\/api\/search$/, (m, q) => ({ results: search((q.get("q") || "").slice(0, 100)) })],
  ["GET", /^\/api\/glossary$/, () => ({ terms: glossary() })],
];

async function request(method, path, body = {}) {
  const url = new URL(path, "http://flowst.local");
  for (const [m, rx, fn] of ROUTES) {
    const match = rx.exec(url.pathname);
    if (match && m === method) return JSON.parse(JSON.stringify(await fn(match, url.searchParams, body)));
  }
  throw new ApiError(404, "unknown endpoint");
}

const api = {
  get: path => request("GET", path),
  post: (path, body = {}) => request("POST", path, body),
};

setTimeout(() => engines.script(), 400);     // start loading Python in the background

// Client-side cache of meta + progress, and code autosave (server file + localStorage mirror).


const state = { meta: null, progress: null };

async function loadMeta() {
  state.meta = await api.get("/api/meta");
  return state.meta;
}

async function refreshProgress() {
  state.progress = await api.get("/api/progress");
  try { localStorage.setItem("flowst:progress", JSON.stringify(state.progress)); } catch { /* storage disabled */ }
  emit("progress", state.progress);
  return state.progress;
}

const isUnlocked = id => !!state.progress && state.progress.unlocked.includes(id);
const isDone = id => !!state.progress && !!(state.progress.chapters[String(id)] || {}).complete;
const chapterState = id => (state.progress && state.progress.chapters[String(id)]) || { exercises: {}, attempts: {}, quiz_best: 0 };
const projectStatus = slug => ((state.progress && state.progress.projects[slug]) || {}).status || "new";

/** Saved code: server copy first, then the localStorage mirror, then the fallback. */
function savedCode(key, fallback = "") {
  const server = state.progress && state.progress.code && state.progress.code[key];
  if (typeof server === "string") {
    let local = null;
    try { local = localStorage.getItem("flowst:code:" + key); } catch { /* ignore */ }
    return local !== null ? local : server;
  }
  try {
    const local = localStorage.getItem("flowst:code:" + key);
    if (local !== null) return local;
  } catch { /* ignore */ }
  return fallback;
}

const pending = new Map();
function flush(key) {
  const code = pending.get(key);
  pending.delete(key);
  if (code !== undefined) api.post("/api/progress/code", { key, code }).then(() => { if (state.progress) state.progress.code[key] = code; }).catch(() => {});
}
const flushers = {};
function saveCode(key, code) {
  try { localStorage.setItem("flowst:code:" + key, code); } catch { /* ignore */ }
  pending.set(key, code);
  (flushers[key] ||= debounce(() => flush(key), 700))();
}
window.addEventListener("pagehide", () => [...pending.keys()].forEach(flush));

// ---- editor.js ----
// Hand-built code editor: textarea (input) layered over a highlighted <pre> (display).

const KEYWORDS = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const BUILTINS = new Set("print len range int str float bool list dict set tuple input open type isinstance sorted sum min max abs round enumerate zip map filter any all reversed super object Exception ValueError TypeError KeyError IndexError NameError AttributeError ZeroDivisionError StopIteration property staticmethod classmethod repr id iter next format divmod pow chr ord hex bin oct vars dir getattr setattr hasattr callable frozenset bytes".split(" "));
const TOKEN_RE = /(#[^\n]*)|((?:[rRbBuUfF]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*(?:"|(?=\n)|$)|'(?:\\.|[^'\\\n])*(?:'|(?=\n)|$)))|(\b0[xXbBoO][\da-fA-F_]+\b|\b\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?j?\b|\.\d+\b)|(@[A-Za-z_][\w.]*)|([A-Za-z_]\w*)|([\s\S])/g;

/** Python syntax highlighter: returns safe HTML. */
function highlight(src) {
  let out = "", prev = "", m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(src)) !== null) {
    const [tok, com, str, num, dec, word] = m;
    if (com) out += `<span class="t-com">${esc(tok)}</span>`;
    else if (str) out += `<span class="t-str">${esc(tok)}</span>`;
    else if (num) out += `<span class="t-num">${esc(tok)}</span>`;
    else if (dec) out += `<span class="t-dec">${esc(tok)}</span>`;
    else if (word) {
      let cls = "";
      if (KEYWORDS.has(word)) cls = "t-kw";
      else if (prev === "def" || prev === "class") cls = "t-def";
      else if (word === "self" || word === "cls") cls = "t-self";
      else if (BUILTINS.has(word)) cls = "t-bi";
      out += cls ? `<span class="${cls}">${esc(word)}</span>` : esc(word);
      prev = word;
      continue;
    } else out += esc(tok);
    if (tok.trim()) prev = tok;
  }
  return out;
}

const LINE_H = 22, PAD = 20, BORDER = 2;
const PAIRS = { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'" };
const CLOSERS = new Set([")", "]", "}"]);
const isWord = ch => /\w/.test(ch || "");

class CodeEditor {
  constructor(parent, { value = "", onChange = null, onRun = null, minRows = 6, maxRows = 22, fill = false } = {}) {
    this.onChange = onChange; this.onRun = onRun; this.minRows = minRows; this.maxRows = maxRows; this.fill = fill;
    this.gutter = el("div", { class: "ed-gutter", "aria-hidden": "true" });
    this.code = el("code");
    this.hl = el("pre", { class: "ed-hl", "aria-hidden": "true" }, this.code);
    this.ta = el("textarea", { class: "ed-ta", spellcheck: "false", autocapitalize: "off", autocomplete: "off", autocorrect: "off", wrap: "off", "aria-label": "Python code editor" });
    this.root = el("div", { class: "ed" }, this.gutter, el("div", { class: "ed-body" }, this.hl, this.ta));
    parent.append(this.root);
    this.ta.value = value;
    this.ta.addEventListener("input", () => { this.render(); if (this.onChange) this.onChange(this.ta.value); });
    this.ta.addEventListener("scroll", () => this.sync());
    this.ta.addEventListener("keydown", e => this.onKey(e));
    this.render();
  }

  get value() { return this.ta.value; }
  setValue(v) { this.ta.value = v; this.render(); if (this.onChange) this.onChange(v); }
  focus() { this.ta.focus(); }

  render() {
    const v = this.ta.value;
    this.code.innerHTML = highlight(v) + "\n\n";          // extra lines keep both layers equally scrollable
    const n = v.split("\n").length;
    this.gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n") + "\n\n";
    if (!this.fill) {
      const rows = Math.max(this.minRows, Math.min(this.maxRows, n + 1));
      this.root.style.height = rows * LINE_H + PAD + BORDER + "px";
    }
    this.sync();
  }

  sync() {
    this.hl.scrollTop = this.ta.scrollTop; this.hl.scrollLeft = this.ta.scrollLeft;
    this.gutter.scrollTop = this.ta.scrollTop;
  }

  insert(text) {
    this.ta.focus();
    if (!document.execCommand("insertText", false, text)) {    // keeps native undo; fallback if unsupported
      const { selectionStart: s, selectionEnd: e } = this.ta;
      this.ta.setRangeText(text, s, e, "end");
      this.ta.dispatchEvent(new Event("input"));
    }
  }

  replaceRange(start, end, text) {
    this.ta.setSelectionRange(start, end);
    this.insert(text);
  }

  lineBounds(s, e) {
    const v = this.ta.value;
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    let le = e > s && v[e - 1] === "\n" ? e - 1 : e;
    const nl = v.indexOf("\n", le);
    le = nl === -1 ? v.length : nl;
    return [ls, le];
  }

  indentLines(s, e) {
    const [ls, le] = this.lineBounds(s, e);
    const block = this.ta.value.slice(ls, le).split("\n").map(l => "    " + l).join("\n");
    this.replaceRange(ls, le, block);
    this.ta.setSelectionRange(ls, ls + block.length);
  }

  dedentLines(s, e) {
    const [ls, le] = this.lineBounds(s, e);
    const lines = this.ta.value.slice(ls, le).split("\n");
    const block = lines.map(l => l.replace(/^( {1,4}|\t)/, "")).join("\n");
    if (block === lines.join("\n")) return;
    this.replaceRange(ls, le, block);
    this.ta.setSelectionRange(s === e ? Math.max(ls, s - (lines[0].length - block.split("\n")[0].length)) : ls, s === e ? Math.max(ls, s - (lines[0].length - block.split("\n")[0].length)) : ls + block.length);
  }

  onKey(e) {
    const ta = this.ta, v = ta.value, s = ta.selectionStart, en = ta.selectionEnd;
    const prevCh = v[s - 1], nextCh = v[s];
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (this.onRun) this.onRun(v); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === "Tab") {
      e.preventDefault();
      if (e.shiftKey) this.dedentLines(s, en);
      else if (s !== en && v.slice(s, en).includes("\n")) this.indentLines(s, en);
      else this.insert("    ");
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const line = v.slice(ls, s);
      let indent = /^[ \t]*/.exec(line)[0];
      if (line.trimEnd().endsWith(":")) indent += "    ";
      else if (/^\s*(return|pass|break|continue|raise)\b/.test(line) && indent.length >= 4) indent = indent.slice(0, -4);
      if (PAIRS[prevCh] && PAIRS[prevCh] === nextCh && prevCh !== '"' && prevCh !== "'") {
        this.insert("\n" + indent + "    \n" + indent.replace(/ {4}$/, ""));
        const pos = s + 1 + indent.length + 4;
        ta.setSelectionRange(pos, pos);
      } else this.insert("\n" + indent);
      return;
    }
    if (e.key === "Backspace" && s === en) {
      if (PAIRS[prevCh] && PAIRS[prevCh] === nextCh) { e.preventDefault(); this.replaceRange(s - 1, s + 1, ""); return; }
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length > 0 && /^ +$/.test(before)) {        // delete one indent level at a time
        e.preventDefault();
        this.replaceRange(s - (((before.length - 1) % 4) + 1), s, "");
      }
      return;
    }
    if (CLOSERS.has(e.key) && nextCh === e.key && s === en) { e.preventDefault(); ta.setSelectionRange(s + 1, s + 1); return; }
    if (PAIRS[e.key]) {
      const close = PAIRS[e.key], quote = e.key === close;
      if (s !== en) { e.preventDefault(); this.insert(e.key + v.slice(s, en) + close); ta.setSelectionRange(s + 1, en + 1); return; }
      if (quote) {
        const before = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
        const inside = (before.split(e.key).length - 1) % 2 === 1;          // an odd number of this quote so far: we are inside a string
        const word = (/[A-Za-z_]\w*$/.exec(before) || [""])[0];
        const prefix = /^[rRbBuUfF]{1,2}$/.test(word);                       // f"..." / r"..." : the letter is a string prefix, not a word
        if (inside && nextCh === e.key) { e.preventDefault(); ta.setSelectionRange(s + 1, s + 1); return; }   // type over the closing quote
        if (inside) return;                                                  // closing a string by hand: insert just the quote
        if (isWord(prevCh) && !prefix) return;                               // an apostrophe in a word: don't pair
        if (prevCh === e.key && v[s - 2] === e.key) return;                  // third quote of a triple-quoted string
      } else if (isWord(nextCh)) return;
      e.preventDefault();
      this.insert(e.key + close);
      ta.setSelectionRange(s + 1, s + 1);
    }
  }
}

// ---- terminal.js ----
// Browser terminal: shows a streamed process, takes keyboard input inline (input() and the REPL).


const ANSI = /\x1b\[[0-9;?]*[ -/]*[@-~]/g;
const TRACE_START = /Traceback \(most recent call last\):|^[ \t]*File ".*", line \d+/m;
const KEEP_CHARS = 300000;

class Terminal {
  constructor(parent, { mode = "script", name = "terminal" } = {}) {
    this.mode = mode; this.name = name;
    this.root = el("div", { class: "term", tabindex: "-1", "aria-label": name });
    this.out = el("pre", { class: "term-out", "aria-live": "off" });
    this.root.append(this.out);
    parent.append(this.root);
    this.prompt = el("span", { class: "term-prompt" });
    this.input = el("input", { class: "term-in", type: "text", spellcheck: "false", autocomplete: "off", autocapitalize: "off", "aria-label": "terminal input" });
    this.inputWrap = el("span", { class: "term-line-in" }, this.prompt, this.input);
    this.running = false; this.inTrace = false; this.waiting = false; this.runId = 0; this.buf = ""; this.inputs = []; this.code = ""; this.seed = 1;
    this.history = []; this.hIdx = 0; this.promptText = ""; this.focusTimer = null;
    this.reset();
    this.printIdle();
    this.input.addEventListener("keydown", e => this.onKey(e));
    this.input.addEventListener("input", () => this.fit());
    this.root.addEventListener("mouseup", () => { if (this.running && !String(window.getSelection())) this.input.focus(); });
  }

  // ---- rendering ----------------------------------------------------------
  reset() {
    this.out.textContent = "";
    this.chars = 0; this.cur = null; this.curCls = null;
    if (this.running) this.out.append(this.inputWrap);
  }

  _newSpan(cls) {
    const node = document.createTextNode("");
    const span = el("span", { class: cls || "" }, node);
    this.out.insertBefore(span, this.inputWrap.parentNode === this.out ? this.inputWrap : null);
    this.cur = { span, node }; this.curCls = cls;
  }

  _put(text, cls) {
    if (!this.cur || this.curCls !== cls) this._newSpan(cls);
    this.cur.node.appendData(text);
    this.chars += text.length;
  }

  print(text, cls = "") {
    const stick = this.root.scrollHeight - this.root.scrollTop - this.root.clientHeight < 48;
    for (const part of text.replace(ANSI, "").split(/(\r\n|\n|\r)/)) {
      if (part === "") continue;
      if (part === "\r\n" || part === "\n") this._put("\n", cls);
      else if (part === "\r") { if (this.cur) this.cur.node.data = this.cur.node.data.replace(/[^\n]*$/, ""); }
      else this._put(part, cls);
    }
    this._trim();
    if (stick) this.root.scrollTop = this.root.scrollHeight;
  }

  _trim() {
    while (this.chars > KEEP_CHARS) {
      const first = this.out.firstChild;
      if (!first || (this.cur && first === this.cur.span)) {
        if (this.cur) { this.cur.node.deleteData(0, Math.floor(this.chars / 2)); this.chars -= Math.floor(this.chars / 2); }
        break;
      }
      this.chars -= first.textContent.length;
      first.remove();
    }
  }

  printIdle() {
    this.print(this.mode === "repl" ? "Interactive Python in your browser. The session starts when you open this tab.\n" : "Output appears here. Press Ctrl+Enter in the editor to run.\n", "t-dim");
  }

  fit() { this.input.style.width = Math.max(1, this.input.value.length + 1) + "ch"; }

  setRunning(running) {
    this.running = running;
    if (running) { this.out.append(this.inputWrap); this.fit(); } else this.inputWrap.remove();
    this.root.classList.toggle("running", running);
    emit("run-state", { terminal: this.name, running });
  }

  // ---- running programs in the browser ---------------------------------------------------------
  async start(mode, code = "") {
    await this.stop();
    this.mode = mode; this.inTrace = false; this.waiting = false;
    const id = ++this.runId;
    this.reset();
    this.setRunning(true);
    if (mode === "repl") return this.startRepl(id);
    this.code = code; this.inputs = []; this.seed = (Math.random() * 1e9) | 0;
    return this.runScript(id);
  }

  async _engineReady(engine, id) {
    if (engine.isReady) return true;
    this.print("Loading Python (the first time takes a few seconds)...\n", "t-dim");
    try { await engine.ready; } catch (err) {
      if (id !== this.runId) return false;
      this.print(`\n${err.message}\n`, "t-err");
      this.finish(null);
      return false;
    }
    return id === this.runId;
  }

  /** Scripts that call input() are replayed from the top with each new answer, so one run needs no blocking read. */
  async runScript(id) {
    const engine = engines.script();
    if (!(await this._engineReady(engine, id))) return;
    this.reset(); this.inTrace = false; this.buf = ""; this.waiting = false;
    this.prompt.textContent = ""; this.promptText = ""; this.fit();
    this.print("$ python main.py\n", "t-dim");
    const started = performance.now();
    const res = await engine.run({ files: { "main.py": this.code }, inputs: [...this.inputs], interactive: true, seed: this.seed },
      { onOut: t => { if (id === this.runId) { this.buf += t; this.onOut(t); } }, limitMs: 10000 });
    if (id !== this.runId) return;
    if (res.need_input) { this.waiting = true; this.input.focus(); this.root.scrollTop = this.root.scrollHeight; return; }
    if (res.timed_out) this.print("\n[stopped: time limit of 10 seconds exceeded]\n", "t-dim");
    else if (res.stopped) return;
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    this.finish(res.timed_out ? null : res.exit_code, seconds);
  }

  async startRepl(id) {
    const engine = engines.repl();
    if (!(await this._engineReady(engine, id))) return;
    await engine.replNew();
    if (id !== this.runId) return;
    this.print(`$ python -i   (Python ${engine.version}, running in your browser)\n`, "t-dim");
    this.promptText = ">>> "; this.prompt.textContent = ">>> "; this.fit(); this.waiting = true;
    this.input.focus();
  }

  finish(code, seconds = "0.0") {
    if (this.cur && !this.cur.node.data.endsWith("\n")) this.print("\n");
    if (code !== null) this.print(`[finished with exit code ${code} in ${seconds}s]\n`, "t-dim");
    const h = code ? explainError(this.buf) : null;
    if (h) this.onHint(h);
    this.prompt.textContent = ""; this.promptText = ""; this.waiting = false;
    this.setRunning(false);
  }

  onOut(text) {
    const m = this.inTrace ? null : TRACE_START.exec(text);
    if (m) {
      if (m.index > 0) this.print(text.slice(0, m.index), "");
      this.inTrace = true;
      text = text.slice(m.index);
    }
    this.print(text, this.inTrace ? "t-err" : "");
  }

  onHint(h) {
    const box = el("div", { class: "hint" }, el("b", {}, `${h.error}`), h.line ? ` (line ${h.line})` : "", el("br"), h.hint);
    this.out.insertBefore(box, this.inputWrap.parentNode === this.out ? this.inputWrap : null);
    this.cur = null; this.curCls = null;
    this.root.scrollTop = this.root.scrollHeight;
  }

  async stop() {
    if (!this.running) return;
    const mode = this.mode;
    this.runId++;
    if (mode === "repl") { if (engines.hasRepl()) engines.repl().restart(); }
    else engines.script().stopCurrent();
    if (this.cur && !this.cur.node.data.endsWith("\n")) this.print("\n");
    this.print(mode === "repl" ? "[session ended]\n" : "[stopped]\n", "t-dim");
    this.prompt.textContent = ""; this.promptText = ""; this.waiting = false;
    this.setRunning(false);
  }

  async interrupt() {
    if (!this.running) return;
    if (this.mode === "script") return this.stop();
    const engine = engines.repl();
    if (this.waiting) {            // idle at the prompt: drop the half-typed block
      await engine.replReset();
      this.promptText = ">>> "; this.prompt.textContent = ">>> "; this.fit();
      return;
    }
    const id = ++this.runId;       // busy: replace the session, like a hard Ctrl+C
    engine.restart();
    this.print("\nKeyboardInterrupt (the REPL was restarted, earlier variables are gone)\n", "t-err");
    this.waiting = false;
    await engine.replNew();
    if (id !== this.runId) return;
    this.promptText = ">>> "; this.prompt.textContent = ">>> "; this.waiting = true; this.fit(); this.input.focus();
  }

  clear() { this.reset(); }

  // ---- keyboard ------------------------------------------------------------------------
  async submit(value) {
    if (!this.running || !this.waiting) return;
    this.waiting = false;
    this.input.value = ""; this.fit();
    if (this.mode === "script") {
      this.inputs.push(value);
      this.runScript(this.runId);              // replay with the new answer
      return;
    }
    this.print(this.promptText + value + "\n", "t-in");
    this.prompt.textContent = ""; this.promptText = "";
    if (value.trim() && this.history[this.history.length - 1] !== value) this.history.push(value);
    this.hIdx = this.history.length;
    const id = this.runId, engine = engines.repl();
    this.inTrace = false;
    const res = await engine.replPush(value, { onOut: t => { if (id === this.runId) this.onOut(t); } });
    if (id !== this.runId) return;
    this.inTrace = false;
    if (this.cur && !this.cur.node.data.endsWith("\n")) this.print("\n");
    this.promptText = res && res.more ? "... " : ">>> ";
    this.prompt.textContent = this.promptText; this.fit(); this.waiting = true;
    this.input.focus();
    this.root.scrollTop = this.root.scrollHeight;
  }

  onKey(e) {
    const key = e.key.toLowerCase();
    if (e.key === "Enter") { e.preventDefault(); this.submit(this.input.value); }
    else if (e.key === "ArrowUp" && this.history.length) {
      e.preventDefault(); this.hIdx = Math.max(0, this.hIdx - 1); this.input.value = this.history[this.hIdx] ?? ""; this.fit();
    } else if (e.key === "ArrowDown" && this.history.length) {
      e.preventDefault(); this.hIdx = Math.min(this.history.length, this.hIdx + 1); this.input.value = this.history[this.hIdx] ?? ""; this.fit();
    } else if (e.ctrlKey && key === "l") { e.preventDefault(); this.clear(); }
    else if (e.ctrlKey && key === "c" && this.input.selectionStart === this.input.selectionEnd) { e.preventDefault(); this.print("^C\n", "t-dim"); this.interrupt(); }
    else if (e.ctrlKey && key === "d" && !this.input.value && this.mode === "repl" && this.running) { e.preventDefault(); this.stop(); }
  }
}

// ---- dock.js ----
// The practice terminal dock: Script tab (editor + output) and REPL tab. Available on every page.





const STARTER = '# Practice here: write any Python and press Ctrl+Enter.\nname = input("Your name? ")\nprint(f"Hello, {name}!")\n';

class Dock {
  constructor() {
    this.root = document.getElementById("dock");
    this.root.setAttribute("role", "dialog");
    this.root.setAttribute("aria-modal", "true");
    this.root.setAttribute("aria-label", "Practice terminal");
    this.backdrop = el("div", { id: "dock-backdrop", onclick: () => this.close() });
    this.root.after(this.backdrop);
    this.viaPlayground = false;
    this.tab = "script";
    this.full = false;
    this.replStarted = false;
    this.runBtn = el("button", { class: "btn small", title: "Run (Ctrl+Enter)", onclick: () => this.run() });
    this.stopBtn = el("button", { class: "btn danger small", title: "Stop the program", onclick: () => this.terminal().stop(), disabled: true, html: `${icon("stop", 12)} Stop` });
    this.tabScript = el("button", { class: "btn alt small", onclick: () => this.show("script") }, "Script");
    this.tabRepl = el("button", { class: "btn alt small", onclick: () => this.show("repl") }, "REPL");
    this.fullBtn = el("button", { class: "icon-btn", title: "Toggle full screen", onclick: () => this.setFull(!this.full), html: icon("maximize", 16) });
    this.status = el("span", { class: "state" }, "Idle");
    this.restartBtn = el("button", { class: "btn ghost small", id: "repl-restart", title: "Restart the REPL", onclick: () => this.restartRepl(), html: `${icon("reset", 14)} Restart` });
    const closeBtn = el("button", { class: "icon-btn", title: "Close (Esc)", "aria-label": "Close practice terminal", onclick: () => this.close(), html: icon("x", 16) });
    const bar = el("div", { class: "dock-bar" },
      el("div", { class: "dock-top" },
        el("span", { class: "dock-tab" }, "Practice terminal"),
        el("span", { class: "sp" }), el("span", { class: "dock-hint" }, "Esc to close"), this.fullBtn, closeBtn),
      el("div", { class: "dock-tools" }, this.tabScript, this.tabRepl, this.runBtn, this.stopBtn,
        el("button", { class: "btn ghost small", title: "Clear output (Ctrl+L)", onclick: () => this.terminal().clear() }, "Clear"),
        this.restartBtn, this.status));
    this.paneScript = el("div", { class: "dock-pane pane-script on" });
    this.paneRepl = el("div", { class: "dock-pane pane-repl" });
    this.root.append(el("div", { id: "dock-resize", title: "Drag to resize" }), bar, el("div", { class: "dock-body" }, this.paneScript, this.paneRepl));
    this.editor = new CodeEditor(this.paneScript, {
      value: STARTER, fill: true, onRun: () => this.run(),
      onChange: code => saveCode("scratch", code),
    });
    this.scriptTerm = new Terminal(this.paneScript, { mode: "script", name: "script" });
    this.replTerm = new Terminal(this.paneRepl, { mode: "repl", name: "repl" });
    on("run-state", d => this.onState(d));
    this.initResize();
    this.show("script");
  }

  terminal() { return this.tab === "repl" ? this.replTerm : this.scriptTerm; }

  restoreScratch() { this.editor.setValue(savedCode("scratch", STARTER)); }

  onState({ terminal, running }) {
    if (terminal === this.terminal().name) {
      this.runBtn.innerHTML = running ? `${icon("play", 12)} Running` : `${icon("play", 12)} Run`;
      this.runBtn.disabled = running && this.tab === "script";
      this.stopBtn.disabled = !running;
      this.status.textContent = running ? "Running" : "Idle";
      this.status.classList.toggle("run", running);
    }
    emit("status", { running: this.scriptTerm.running });
  }

  show(tab) {
    this.tab = tab;
    this.paneScript.classList.toggle("on", tab === "script");
    this.paneRepl.classList.toggle("on", tab === "repl");
    this.tabScript.classList.toggle("on", tab === "script");
    this.tabRepl.classList.toggle("on", tab === "repl");
    this.restartBtn.style.display = tab === "repl" ? "" : "none";
    this.onState({ terminal: this.terminal().name, running: this.terminal().running });
    if (tab === "repl" && !this.replTerm.running && !this.replStarted) { this.replStarted = true; this.replTerm.start("repl"); }
    (tab === "repl" ? this.replTerm.input : this.editor.ta).focus();
  }

  open(tab = this.tab) {
    this.root.classList.remove("hidden");
    this.show(tab);
    emit("dock", { open: true });
  }

  close() { this.viaPlayground = false; this.setFull(false); this.root.classList.add("hidden"); emit("dock", { open: false }); }
  toggle() { this.root.classList.contains("hidden") ? this.open() : this.close(); }
  isOpen() { return !this.root.classList.contains("hidden"); }

  setFull(full) {
    this.full = full;
    this.root.classList.toggle("full", full);
    this.fullBtn.innerHTML = icon(full ? "minimize" : "maximize", 16);
    if (full) this.open();
    emit("dock", { open: this.isOpen(), full });
  }

  run() {
    if (this.tab === "repl") { if (!this.replTerm.running) this.replTerm.start("repl"); return; }
    this.scriptTerm.start("script", this.editor.value);
  }

  restartRepl() { this.replTerm.start("repl"); }

  /** Put code in the script editor, open the dock and (optionally) run it. */
  load(code, { run = true } = {}) {
    this.open("script");
    this.editor.setValue(code);
    if (run) this.run();
  }

  initResize() {
    const handle = this.root.querySelector("#dock-resize");
    handle.addEventListener("pointerdown", e => {
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      const move = ev => {
        const h = Math.min(window.innerHeight - 160, Math.max(180, window.innerHeight - ev.clientY));
        this.root.style.setProperty("--dock-h", h + "px");
      };
      const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
  }
}

let dock = null;
function initDock() { dock = new Dock(); return dock; }

// ---- tasks.js ----
// Reusable learning widgets: sections, code blocks, callouts, auto-graded task cards and the quiz.






/** A page section with an h2 heading. Sections feed the "On this page" list. */
function section(id, title, children) {
  return el("section", { id: "sec-" + id, "data-toc": title }, el("h2", {}, title), ...[].concat(children));
}

function callout(kind, iconName, children) {
  return el("div", { class: "callout " + kind }, el("span", { html: icon(iconName, 18) }), el("div", {}, ...[].concat(children)));
}

/** Highlighted code with an optional header bar: run in the terminal, copy. */
function codeBlock(code, { title = "", run = false } = {}) {
  const gutter = Array.from({ length: code.replace(/\n+$/, "").split("\n").length }, (_, i) => i + 1).join("\n");
  const pre = el("pre", { class: "code", html: `<span class="gut" aria-hidden="true">${gutter}</span><code>${highlight(code)}</code>` });
  if (!title && !run) return el("div", { class: "codeblock" }, pre);
  const copy = el("button", { class: "btn ghost small", title: "Copy code", html: `${icon("copy", 14)} Copy` });
  copy.addEventListener("click", async () => {
    const ok = await copyText(code);
    copy.innerHTML = ok ? `${icon("check", 14)} Copied` : "Copy failed";
    setTimeout(() => { copy.innerHTML = `${icon("copy", 14)} Copy`; }, 1600);
  });
  const bar = el("div", { class: "codeblock-bar" }, el("span", {}, title), el("span", { class: "sp" }), copy,
    run ? el("button", { class: "btn small", title: "Run this code in the practice terminal", onclick: () => dock.load(code), html: `${icon("play", 13)} Try it` }) : "");
  return el("div", { class: "codeblock" }, bar, pre);
}

function resultView(r) {
  const res = r.result;
  const root = el("div", { class: "result " + (res.passed ? "pass" : "fail"), role: "status" });
  root.append(el("div", { class: "head" },
    el("span", { class: res.passed ? "ok" : "bad", html: icon(res.passed ? "check-circle" : "alert", 18) }),
    res.self_marked ? "Marked as done" : res.passed ? `All ${res.total} tests passed` : `${res.passed_count} of ${res.total} tests passed`,
    r.xp_gained ? el("span", { class: "xp" }, `+${r.xp_gained} XP`) : ""));
  const marks = el("div", { class: "tests" });
  for (const t of res.results) marks.append(el("span", { class: t.ok ? "ok" : "bad", title: `Test ${t.n}`, html: icon(t.ok ? "check" : "x", 13) }));
  root.append(marks);
  const bad = res.results.find(t => !t.ok);
  if (bad && bad.actual !== undefined) {
    root.append(el("div", { class: "muted" }, `Test ${bad.n} failed` + (bad.timed_out ? " (time limit)" : "")));
    if (bad.call) root.append(el("div", {}, el("span", { class: "lab" }, "The hidden test runs: "), el("code", {}, bad.call)));
    if (bad.stdin) root.append(el("div", {}, el("span", { class: "lab" }, "Input given: "), el("code", {}, JSON.stringify(bad.stdin))));
    root.append(el("div", { class: "cmp" },
      el("div", {}, el("div", { class: "lab" }, "Expected"), el("pre", {}, bad.expected)),
      el("div", {}, el("div", { class: "lab" }, "Your output"), el("pre", {}, bad.actual))));
  }
  if (res.hint) root.append(el("div", { class: "hintbox" }, el("b", {}, `${res.hint.error}: `), res.hint.hint));
  return root;
}

/**
 * An editor with Run / Check buttons.
 * opts: title, prompt, starter, hint, key (autosave key), tests (count), done,
 *       body(code) -> POST body for /api/check, solutionUrl (or null), onResult(response)
 */
function taskCard(opts) {
  const result = el("div");
  const status = el("span", { class: "status-chip" + (opts.done ? " done" : "") }, opts.done ? (opts.localOnly ? "Done" : "Passed") : opts.localOnly ? "Self-check" : `${opts.tests} hidden tests`);
  const editor = new CodeEditor(document.createElement("div"), {

  const run = () => dock.load(editor.value);
  const check = el("button", { class: "btn", onclick: () => doCheck(), html: `${icon("check", 15)} ${opts.localOnly ? "Mark as done" : "Check"}` });
  const hintBox = el("div", { class: "hintbox", hidden: true }, opts.hint || "No hint for this one. Re-read the example above.");
  const solutionBox = el("div");

function quizView(chapter, best) {
  const answers = Array(chapter.quiz.length).fill(null);
  const rows = [];
  const root = el("div");
  chapter.quiz.forEach((q, qi) => {
    const labels = [];
    const wrap = el("div", { class: "q" }, el("div", { class: "qt" }, `${qi + 1}. ${q.q}`));
    q.options.forEach((opt, oi) => {
      const input = el("input", { type: "radio", name: `quiz${chapter.id}_${qi}` });
      input.addEventListener("change", () => { answers[qi] = oi; });
      const label = el("label", { class: "opt" }, input, el("span", {}, opt));
      labels.push(label); wrap.append(label);
    });
    rows.push({ wrap, labels });
    root.append(wrap);
  });
  const summary = el("span", { class: "muted" }, best ? `Best score: ${best}/${chapter.quiz.length}` : "");
  const submit = el("button", { class: "btn", onclick: async () => {
    if (answers.includes(null)) { toast("Answer every question first.", "err"); return; }
    submit.disabled = true;
    try {
      const r = await api.post("/api/quiz", { chapter: chapter.id, answers });
      r.results.forEach((res, qi) => {
        const { wrap, labels } = rows[qi];
        labels.forEach((l, oi) => {
          l.classList.remove("right", "wrong");
          if (oi === res.answer) l.classList.add("right");
          else if (oi === answers[qi]) l.classList.add("wrong");
        });
        wrap.querySelector(".why")?.remove();
        wrap.append(el("div", { class: "why" }, res.why));
      });
      summary.replaceChildren(el("b", { class: r.score === r.total ? "ok" : "warn" }, `Score ${r.score}/${r.total}`),
        r.xp_gained ? el("span", { class: "muted" }, `  +${r.xp_gained} XP`) : "", el("span", { class: "muted" }, "  Change your answers and submit again to improve."));
      await refreshProgress();
    } catch (err) { toast(err.message, "err"); } finally { submit.disabled = false; }
  } }, "Submit answers");
  root.append(el("div", { class: "row" }, submit, summary));
  return root;
}

/** The article column plus the "On this page" list built from its sections. */
function docPage(article, { toc = true, cls = "" } = {}) {
  const page = el("div", { class: "page" + (cls ? " " + cls : "") }, article);
  const secs = toc ? [...article.querySelectorAll(":scope > section[data-toc]")] : [];
  if (secs.length > 1) {
    const links = secs.map(s => el("a", { href: "#", "data-target": s.id, onclick: e => { e.preventDefault(); s.scrollIntoView({ behavior: "smooth", block: "start" }); } }, s.dataset.toc));
    page.append(el("aside", { class: "toc", "aria-label": "On this page" }, el("div", { class: "toc-title", html: `${icon("menu", 14)} On this page` }), el("nav", {}, ...links)));
  } else page.classList.add("wide-less");
  return page;
}

const overlay = () => document.getElementById("overlay");
function closeOverlay() { const o = overlay(); o.hidden = true; o.replaceChildren(); }
const openOverlayCount = () => (overlay().hidden ? 0 : 1);
const overlayOpen = () => !overlay().hidden;

function openModal(content) {
  const o = overlay();
  o.replaceChildren(el("div", { class: "modal", role: "dialog", "aria-modal": "true" }, ...[].concat(content)));
  o.hidden = false;
  o.className = "overlay";

}

function searchOverlay() {
  const input = el("input", { type: "text", id: "search-input", placeholder: "Search chapters, terms and projects", "aria-label": "Search", autocomplete: "off" });
  const results = el("div", { class: "modal-body" });
  let hits = [], sel = 0, timer = null;
  const hrefOf = h => (h.type === "project" ? `#/project/${h.id}` : `#/chapter/${h.id}`);
  const draw = () => results.replaceChildren(...(hits.length
    ? hits.map((h, i) => el("a", { class: "hit" + (i === sel ? " sel" : ""), href: hrefOf(h), onclick: closeOverlay },
      el("span", { class: "kind" }, h.type === "project" ? "Project" : "Chapter"), el("b", {}, h.title), el("span", { class: "sn" }, h.snippet || "")))
    : [el("div", { class: "empty" }, input.value ? "No matches. Try another word." : "Type to search. Try \"loop\", \"dictionary\" or \"class\".")]));
  input.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = input.value.trim();
      try { hits = q ? (await api.get("/api/search?q=" + encodeURIComponent(q))).results : []; } catch { hits = []; }
      sel = 0; draw();
    }, 120);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(hits.length - 1, sel + 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    else if (e.key === "Enter" && hits[sel]) { const h = hits[sel]; closeOverlay(); location.hash = hrefOf(h); }
  });
  openModal([el("div", { class: "modal-head", html: icon("search", 18) }, input), results]);
  draw();
  input.focus();
}

function buildSidebar(activeHash = location.hash) {
  const side = $("#sidebar");

  const group = (key, title, count, items, defaultOpen) => {

  side.replaceChildren(top);

    const chapters = state.meta.chapters.filter(c => c.track === track);

      done: isDone(c.id), locked: !isUnlocked(c.id) })), track === "BOOT"));

  const unlocked = new Set(state.progress.projects_unlocked);
  for (let level = 1; level <= 5; level++) {

  if (!hadTree) side.querySelector(".nav-item.active")?.scrollIntoView({ block: "center" });
}

// ---- "On this page" scroll-spy ------------------------------------------------------------------
let spyCleanup = null;
function initToc() {
  if (spyCleanup) spyCleanup();
  spyCleanup = null;
  const links = [...main.querySelectorAll(".toc a[data-target]")];
  if (!links.length) return;
  const targets = links.map(a => document.getElementById(a.dataset.target));
  let ticking = false;
  const update = () => {
    ticking = false;
    const line = main.getBoundingClientRect().top + 120;
    let idx = 0;
    targets.forEach((t, i) => { if (t && t.getBoundingClientRect().top <= line) idx = i; });
    if (main.scrollTop + main.clientHeight >= main.scrollHeight - 4) idx = targets.length - 1;
    links.forEach((a, i) => a.classList.toggle("on", i === idx));
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  main.addEventListener("scroll", onScroll, { passive: true });
  spyCleanup = () => main.removeEventListener("scroll", onScroll);
  update();
}

// ---- router ----------------------------------------------------------------------------------
async function route() {
  toggleNav(false);
  if (dock && dock.viaPlayground && !location.hash.startsWith("#/playground")) dock.close();
  const hash = location.hash || "#/";
  let m, title = "Learn Python";
  try {
    if ((m = /^#\/chapter\/(\d+)$/.exec(hash))) {
      await chapterView(main, Number(m[1]));
      const c = state.meta.chapters.find(x => x.id === Number(m[1]));
      if (c) title = c.title;
      api.post("/api/progress/last", { kind: "chapter", id: m[1] }).catch(() => {});
      state.progress.last = { kind: "chapter", id: m[1] };
    } else if ((m = /^#\/project\/([\w-]+)$/.exec(hash))) {
      await projectView(main, m[1]);
      const p = state.meta.projects.find(x => x.slug === m[1]);
      if (p) title = p.title;
      api.post("/api/progress/last", { kind: "project", id: m[1] }).catch(() => {});
      state.progress.last = { kind: "project", id: m[1] };
    } else if (hash === "#/projects") { projectsView(main); title = "Projects"; }
    else if (hash === "#/pets") { petsView(main); title = "Pets"; }
    else if (hash === "#/glossary") { await glossaryView(main); title = "Glossary"; }
    else if (hash === "#/playground") { playgroundView(main); title = "Playground"; }
    else if (hash === "#/mode") { modeView(main); title = "Choose your mode"; }
    else homeView(main);
  } catch (err) {
    main.replaceChildren(el("div", { class: "page center" }, el("div", { class: "doc" },
      el("h1", {}, "Something went wrong"), el("p", { class: "bad" }, err.message), el("a", { class: "btn", href: "#/" }, "Back to overview"))));
  }
  main.scrollTop = 0;
  buildSidebar(hash);
  buildTopbar();
  initToc();
  document.title = `${title} | FLOWST`;
}

// ---- keyboard --------------------------------------------------------------------------------
function typing(target) {
  return target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable);
}

function chapterStep(delta) {
  const m = /^#\/chapter\/(\d+)$/.exec(location.hash);
  if (!m) return;
  const ids = state.meta.chapters.map(c => c.id);
  const target = ids[ids.indexOf(Number(m[1])) + delta];
  if (target) location.hash = `#/chapter/${target}`;
}

window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (overlayOpen()) { closeOverlay(); e.preventDefault(); }
    else if (document.body.classList.contains("nav-open")) { toggleNav(false); e.preventDefault(); }
    else if (dock && dock.isOpen()) { const onPlayground = location.hash.startsWith("#/playground"); dock.close(); if (onPlayground) location.hash = "#/"; e.preventDefault(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "`") { e.preventDefault(); dock.toggle(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); searchOverlay(); return; }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); chapterStep(-1); return; }
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); chapterStep(1); return; }
  if (typing(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); searchOverlay(); }
  else if (e.key === "?") { e.preventDefault(); shortcutsOverlay(); }
});

/** Draw a pet as an SVG of 1x1 rects (12 wide, 3 rows of headroom for a hat). */
function petSvg(type, { level = 1, hat, scale = 4 } = {}) {
  const d = PET_DEF[type] || PET_DEF.cat, pal = d.pal;
  const rects = [], eyes = [];
  d.rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const ch = row[x]; let w = 1;
      if (ch === ".") { x++; continue; }
      if (ch === "e") { eyes.push(`<rect class="pe" x="${x}" y="${y + 3}" width="1" height="1"/>`); x++; continue; }
      while (x + w < row.length && row[x + w] === ch) w++;
      rects.push(`<rect x="${x}" y="${y + 3}" width="${w}" height="1" fill="${pal[ch]}"/>`);
      x += w;
    }
  });
  const h = hat === undefined ? petHat(level) : hat;
  let hatSvg = "";
  if (h) h.rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ".") hatSvg += `<rect x="${x + 3}" y="${y}" width="1" height="1" fill="${PET_HAT_COLORS[ch]}"/>`; }));
  return `<svg viewBox="0 0 12 15" width="${12 * scale}" height="${15 * scale}" shape-rendering="crispEdges" role="img" aria-hidden="true" style="--pe:${pal.e};--pb:${pal.b}">${rects.join("")}${eyes.join("")}${hatSvg}</svg>`;
}

class Pet {
  constructor(type, role = "guide") {
    this.type = type; this.role = role;
    this.name = role === "main" ? petPref.name : PET_DEF[type].nick;
    this.mode = "idle"; this.timer = null; this.sayT = null; this.level = 0; this.dead = false;
    this.x = 20 + Math.random() * Math.max(40, innerWidth - 120);
    this.bubble = el("div", { class: "pet-bubble", hidden: true, role: "status", onclick: e => e.stopPropagation(), onmouseenter: () => clearTimeout(this.sayT), onmouseleave: () => { this.sayT = setTimeout(() => this.hush(), 2500); } });
    this.fx = el("div", { class: "pet-fx", "aria-hidden": "true" });
    this.body = el("div", { class: "pet-body" });
    this.el = el("div", { class: "pet idle" + (role === "main" ? " main" : " guide"), role: "button", tabindex: "0", onclick: () => this.poke(), onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.poke(); } } }, this.bubble, this.fx, this.body);
    document.body.append(this.el);
    petList.push(this);
    this.draw(); this.place(this.x);
  }
  draw() {
    this.level = petLevel();
    this.body.innerHTML = petSvg(this.type, { level: this.level, hat: this.role === "main" ? undefined : null });
    this.el.setAttribute("aria-label", this.role === "main" ? `Your pet ${this.name}. Press to pet it.` : `${this.name} the ${PET_DEF[this.type].name.toLowerCase()}. Press for a tip or a quiz.`);
  }
  place(x, dur = 0) {
    const max = Math.max(8, innerWidth - this.el.offsetWidth - 8);
    this.x = Math.min(Math.max(8, x), max);
    this.el.style.setProperty("--dur", dur + "s");
    this.el.style.left = this.x + "px";
  }
  setMode(m) { this.mode = m; this.el.classList.remove("idle", "walk", "sleep", "happy", "oops"); this.el.classList.add(m); }
  fxAdd(html, n = 1) {
    for (let i = 0; i < n; i++) {
      const s = el("span", { class: "pet-float", style: `left:${8 + Math.random() * 28}px;animation-delay:${i * 0.18}s`, html });
      this.fx.append(s); setTimeout(() => s.remove(), 1800 + i * 180);
    }
  }
  hush() { this.bubble.hidden = true; }
  /** Stop where it stands so the bubble (and quiz buttons) hold still. */
  freeze() {
    clearTimeout(this.timer);
    this.place(this.el.getBoundingClientRect().left, 0);
    if (this.mode === "walk") this.setMode("idle");
    this.timer = setTimeout(() => this.think(), 1500);
  }
  say(content, ms = 4500) {
    if (this.dead) return;
    clearTimeout(this.sayT);
    if (this.bubble.hidden && this.mode === "walk") this.freeze();
    this.bubble.replaceChildren(el("b", { class: "pet-who" }, this.name), typeof content === "string" ? el("span", {}, content) : content);
    this.bubble.hidden = false;
    const c = this.x + this.el.offsetWidth / 2, w = Math.min(240, innerWidth - 24), left = c < w / 2 + 8, right = c > innerWidth - w / 2 - 8;
    Object.assign(this.bubble.style, { left: left ? "0" : right ? "auto" : "50%", right: right ? "0" : "auto", transform: left || right ? "none" : "translateX(-50%)" });
    const br = this.bubble.getBoundingClientRect();
    this.bubble.style.setProperty("--tail", Math.max(6, Math.min(br.width - 14, this.x + this.el.offsetWidth / 2 - br.left - 4)) + "px");
    this.sayT = setTimeout(() => this.hush(), ms);
  }

function petGuidesFor(hash) {
  const n = PET_ORDER.length;
  let m;
  if ((m = /^#\/chapter\/(\d+)$/.exec(hash))) { const c = Number(m[1]); return [PET_ORDER[(c + 5) % n], PET_ORDER[(c * 3 + 2) % n]]; }
  if ((m = /^#\/project\/([\w-]+)$/.exec(hash))) { const i = Math.max(0, DATA.projects.findIndex(p => p.slug === m[1])); return [PET_ORDER[(i * 5 + 3) % n]]; }
  if (hash.startsWith("#/pets") || hash.startsWith("#/mode")) return [];
  if (hash.startsWith("#/glossary")) return ["owl"];
  if (hash.startsWith("#/playground")) return ["robot"];

  return [PET_ORDER[(d * 3) % n], PET_ORDER[(d * 3 + 7) % n]];
}
/** The chapters where a pet type shows up as a guide. */

    want.push(t);

  petList.filter(p => p.role === "guide" && !want.includes(p.type)).forEach(p => p.destroy());
  const fresh = [];
  want.forEach(t => {
    if (petList.some(p => p.role === "guide" && p.type === t)) return;
    const g = new Pet(t, "guide"); fresh.push(g); petMet.add(t);
    setTimeout(() => g.think(), 600 + Math.random() * 2400);
  });
  const m = /^#\/chapter\/(\d+)$/.exec(hash);
  if (m && fresh.length && Math.random() < 0.7) setTimeout(() => { if (!fresh[0].dead && petList.every(p => p.bubble.hidden)) fresh[0].say(`Chapter ${m[1]}! I'm ${fresh[0].name}. Click me for a tip or a quiz.`, 5000); }, 1400);
}
function petSync() {

  const lv = petLevel(), seen = Number(store.get("flowst:pet-level") || 1);

  if (lv > seen) {

    const hat = PET_HATS.find(h => h.lv === lv);
    petMain.cheer(hat ? `Level ${lv}! New gear: ${hat.name}.` : `Level ${lv}! Nice work.`, 5);
    petList.forEach(p => { if (p !== petMain) p.cheer(null, 3); });

}
const petGhOk = () => petPref.gh && Date.now() - petClock.born > 90000 && Date.now() - petClock.gh > 240000;
function petTalk() {
  if (document.hidden || !petPref.show || !petList.length || petList.some(p => !p.bubble.hidden)) return;
  const guides = petList.filter(p => p.role === "guide");
  const who = guides.length && Math.random() < 0.75 ? petPick(guides) : petMain;
  const onChapter = /^#\/chapter\/\d+$/.test(location.hash);
  const opts = [["tip", onChapter ? 5 : 3], ["fact", 1], ["zen", 1], ["nudge", 1], ["quiz", who.role === "guide" ? 1.6 : 0], ["github", petGhOk() ? 1.1 : 0]];
  let r = Math.random() * opts.reduce((a, o) => a + o[1], 0), kind = "tip";

}
function petInit() {

  }, 1200);

      } else if (/Project complete/i.test(message)) { petMain.cheer("Project complete! That is real code.", 6); petList.forEach(p => p !== petMain && p.cheer(null, 4)); }
      else if (/Chapter complete/i.test(message)) { petMain.cheer("Chapter complete!", 5); petList.forEach(p => p !== petMain && p.cheer(null, 3)); }
      else if (/^\+\d+ XP/.test(message)) { petMain.cheer(null, 2); setTimeout(petSync, 800); }

// ---- pixel logo: chunky gold block letters with a stepped gradient and two outline echoes ----
const LOGO_GLYPHS = {
  F: ["#######", "#######", "##.....", "######.", "######.", "##.....", "##.....", "##.....", "##....."],
  L: ["##.....", "##.....", "##.....", "##.....", "##.....", "##.....", "##.....", "#######", "#######"],
  O: [".#####.", "#######", "##...##", "##...##", "##...##", "##...##", "##...##", "#######", ".#####."],
  W: ["##.....##", "##.....##", "##.....##", "##..#..##", "##..#..##", "##.###.##", "#########", "#########", "###...###"],
  S: [".######.", "########", "##......", "##......", ".######.", "......##", "......##", "########", ".######."],
  T: ["########", "########", "...##...", "...##...", "...##...", "...##...", "...##...", "...##...", "...##..."],
};
let logoSeq = 0;
function flowstLogo(height = 28, word = "FLOWST") {
  const id = "lg" + (++logoSeq), gap = 1, rows = 9, rects = [], edges = [];
  let x0 = 0;
  for (const ch of word) {
    const g = LOGO_GLYPHS[ch]; if (!g) continue;
    const on = (x, y) => g[y] && g[y][x] === "#";
    g.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        if (row[x] !== "#") { x++; continue; }
        let w = 1; while (x + w < row.length && row[x + w] === "#") w++;
        rects.push(`M${x0 + x} ${y}h${w}v1h-${w}z`); x += w;
      }
      for (let x = 0; x < row.length; x++) if (on(x, y)) {
        if (!on(x, y - 1)) edges.push(`M${x0 + x} ${y}h1`);
        if (!on(x, y + 1)) edges.push(`M${x0 + x} ${y + 1}h1`);
        if (!on(x - 1, y)) edges.push(`M${x0 + x} ${y}v1`);
        if (!on(x + 1, y)) edges.push(`M${x0 + x + 1} ${y}v1`);
      }
    });
    x0 += g[0].length + gap;
  }
  const w = x0 - gap, e = 0.6, pad = e * 2 + 0.2, vw = w + pad, vh = rows + pad, edge = edges.join("");
  return `<svg class="flogo" viewBox="0 0 ${vw.toFixed(2)} ${vh.toFixed(2)}" height="${height}" width="${(height * vw / vh).toFixed(1)}" shape-rendering="crispEdges" role="img" aria-label="${word}">`
    + `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="${rows}"><stop offset="0" stop-color="#ffd90a"/><stop offset=".3" stop-color="#ffd000"/><stop offset=".76" stop-color="#ffb300"/><stop offset=".765" stop-color="#cf8a33"/><stop offset="1" stop-color="#c47f2e"/></linearGradient></defs>`
    + `<g fill="none" stroke="#d99a34" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linecap="square"><path d="${edge}" transform="translate(${e * 2} ${e * 2})" opacity=".55" vector-effect="non-scaling-stroke"/><path d="${edge}" transform="translate(${e} ${e})" opacity=".9" vector-effect="non-scaling-stroke"/></g>`
    + `<path d="${rects.join("")}" fill="url(#${id})"/></svg>`;
}

  if (e.key === "[") { e.preventDefault(); togglePanel("left"); }
  else if (e.key === "]") { e.preventDefault(); togglePanel("right"); }
  else if (e.key === ",") { e.preventDefault(); settingsOverlay(); }
});
applySettings();

// ---- boot ------------------------------------------------------------------------------------
async function boot() {
  try {
    await loadMeta();
    await refreshProgress();
  } catch (err) {
    main.replaceChildren(el("div", { class: "page center" }, el("div", { class: "doc" },
      el("h1", {}, "Cannot reach the FLOWST server"),
      el("p", { class: "bad" }, err.message),
      el("p", {}, "Start it again with ", el("code", {}, "python -m serve local"), " and reload this page."))));
    return;
  }
  initDock();
  dock.restoreScratch();
  buildFooter();
  $("#scrim").addEventListener("click", () => toggleNav(false));
  on("progress", () => { buildSidebar(); buildTopbar(); buildFooter(); });
  on("dock", () => { $("#term-toggle")?.classList.toggle("on", dock.isOpen()); });
  window.addEventListener("hashchange", route);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", buildTopbar);
  if (!state.meta.mode && (!location.hash || location.hash === "#/")) location.hash = "#/mode";
  else if (!location.hash) {
    const last = state.progress.last;
    if (last && last.kind === "chapter" && isUnlocked(Number(last.id))) location.hash = `#/chapter/${last.id}`;
    else if (last && last.kind === "project") location.hash = `#/project/${last.id}`;
  }
  await route();
  emit("ready");
  if (!state.progress.last || !state.progress.last.kind) toast("Welcome to FLOWST. Press ? for keyboard shortcuts.");
}

petInit();
boot();

  </script>
</body>
</html>
