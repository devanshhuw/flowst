.dtable-wrap { margin: 0 0 22px; overflow-x: auto; border: 1px solid var(--line-strong); border-radius: 0; background: var(--bg); clip-path: none; }
.dtable { width: 100%; border-collapse: collapse; font: 400 14px/1.5 var(--font-sans); }
.dtable th, .dtable td { padding: 12px 20px; text-align: left; vertical-align: middle; border-left: 1px solid var(--line); }
.dtable th:first-child, .dtable td:first-child { border-left: 0; }
.dtable thead th { padding-top: 13px; padding-bottom: 13px; font: 700 13px/1.4 var(--font-sans); color: var(--fg); border-bottom: 1px solid var(--line); }
.dtable tbody tr + tr td { border-top: 1px solid var(--line); }
.dtable tbody tr:nth-child(even) { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.dtable tbody tr:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.dtable td { color: var(--fg-2); }
.dtable th:first-child, .dtable td:first-child { width: 24%; min-width: 150px; }
.dtable td.num, .dtable th.num { white-space: nowrap; width: 130px; }
.dtable td.num .dchip { white-space: nowrap; }
.dchip { display: inline-block; padding: 3px 9px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 13%, var(--bg)); color: var(--fg); font: 500 12.5px/1.5 var(--font-mono); overflow-wrap: break-word; word-break: normal; text-decoration: none; }
a.dchip:hover { color: var(--accent); }
@media (max-width: 640px) { .dtable th, .dtable td { padding: 10px 12px; } .dtable th:first-child, .dtable td:first-child { width: 34%; min-width: 0; } }


/* ---- pixel logo ---- */
.flogo { display: block; flex: none; overflow: visible; }
.flogo path { vector-effect: non-scaling-stroke; }
.flogo path[fill] { vector-effect: none; }
.brand { padding-right: 18px; }
.brand .flogo { height: 26px; width: auto; }
.f-left .flogo { height: 14px; width: auto; }
.hero-logo { margin: 0 0 22px; padding: 18px 22px; display: flex; width: fit-content; max-width: 100%; background: color-mix(in srgb, var(--fg) 4%, var(--bg)); border: 1px solid var(--line); }
.hero-logo .flogo { height: 64px; width: auto; max-width: 100%; }
@media (max-width: 640px) { .hero-logo { padding: 12px 14px; } .hero-logo .flogo { height: 44px; } .brand .flogo { height: 22px; } }


/* ---- settings and hidden side panels ---- */
@media (min-width: 901px) {
  body.hide-side #body { grid-template-columns: minmax(0, 1fr); }
  body.hide-side #sidebar { display: none; }
}
body.hide-toc .toc { display: none; }
body.hide-toc .page { grid-template-columns: minmax(0, 780px); }
body.no-pets .pet { display: none; }
body.calm .pet, body.calm .pet * { animation: none !important; transition: none !important; }
@media (max-width: 1120px) { .panel-right { display: none; } }
@media (max-width: 900px) { .panel-left { display: none; } }
@media (max-width: 640px) { .theme-btn { display: none; } }
.modal:has(.set-h) { width: min(560px, 100%); max-height: 82vh; }
.set-h { margin: 6px 12px 8px; }
.set-group { margin: 0 4px 12px; border: 1px solid var(--line); }
.set-title { padding: 8px 14px; font: 600 12px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--fg) 4%, transparent); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.set-row.set-btns { cursor: default; }
.set-row b { display: block; font-weight: 600; color: var(--fg); }
.set-row small { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.set-b { display: flex; gap: 8px; flex: none; }
.switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 44px; height: 24px; margin: 0; cursor: pointer; border: 2px solid var(--line-strong); border-radius: 0; background: var(--surface-2); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--muted); transition: left .12s steps(3); }
.switch:checked { border-color: var(--accent); background: var(--accent-soft); }
.switch:checked::after { left: 22px; background: var(--accent); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.set-foot { display: flex; justify-content: space-between; gap: 10px; padding: 4px 12px 10px; }
@media (max-width: 520px) { .set-row.set-btns { flex-wrap: wrap; } }

  <script type="application/json" id="flowst-data">{"version":"1.0.0","chapters":[{"id":1,"track":"BOOT","slug":"hello-world","title":"Hello World and how Python runs","terms":[{"term":"program","def":"A list of instructions a computer follows, written in a programming language."},{"term":"Python","def":"A friendly programming language. Its interpreter reads your file and carries out the instructions."},{"term":"interpreter","def":"The program (python) that reads your code line by line and does what it says."},{"term":"function","def":"A named action. You use it by writing its name followed by parentheses, like print(...)."},{"term":"string","def":"Text written inside quotes, like \"hello\". Python treats it as letters, not as an instruction."},{"term":"comment","def":"A note for humans that starts with #. Python ignores everything after it on that line."},{"term":"run","def":"To make Python carry out a program from the first line to the last."}],"explain":"Python reads your program from the top to the bottom and does one line at a time. The most useful first function is `print()`: whatever you put inside the parentheses is shown on the screen. Text must be wrapped in quotes so Python knows it is text and not an instruction.","example":{"code":"# This line is a comment: Python ignores it\nprint(\"Hello, World!\")        # print() shows text on the screen\nprint(\"Python runs line by line\")  # every print starts a new line\nprint(2 + 3)                  # print() can also show the result of maths\n"},"mistakes":["Forgetting the quotes: `print(Hello)` raises NameError because Python looks for something called Hello.","Mismatched quotes or a missing closing bracket: `print(\"Hi)` raises SyntaxError. Open and close everything.","Wrong capital letters: Python is case-sensitive, so `Print(\"Hi\")` does not work. The function is `print`."],"exercises":[{"title":"Say hello","prompt":"Print exactly: `Hello, FLOWST!`","starter":"# Write your code below\n","solution":"print(\"Hello, FLOWST!\")","hint":"print(\"...\") with your text inside the quotes.","tests":[{"expected":"Hello, FLOWST!"}],"local_only":false},{"title":"Two lines","prompt":"Print two lines: `Line one` and then `Line two`.","starter":"# Write your code below\n","solution":"print(\"Line one\")\nprint(\"Line two\")","hint":"Use two print() calls.","tests":[{"expected":"Line one\nLine two"}],"local_only":false},{"title":"Do the math","prompt":"Print the result of 7 times 6 (a number, not text). Use `*` for times.","starter":"# Write your code below\n","solution":"print(7 * 6)","hint":"No quotes around maths: print(7 * 6).","tests":[{"expected":"42"}],"local_only":false}],"quiz":[{"q":"What does print(\"Hi\") do?","options":["Asks the user for Hi","Saves Hi to a file","Shows Hi on the screen"],"answer":2,"why":"print() displays whatever is inside the parentheses."},{"q":"Which line is a comment?","options":["// note to self","# note to self","print(note)"],"answer":1,"why":"In Python a comment starts with #."},{"q":"What happens with print(Hello) (no quotes)?","options":["It prints nothing","It prints Hello","NameError: Python looks for a name Hello"],"answer":2,"why":"Without quotes, Hello is treated as a name that does not exist."},{"q":"In what order does Python run the lines?","options":["Top to bottom, one at a time","Bottom to top","All at once"],"answer":0,"why":"Python executes statements in order, from the first line to the last."},{"q":"What does print(2 + 3) show?","options":["2 + 3","23","5"],"answer":2,"why":"Python calculates 2 + 3 first, then prints the result."}],"challenge":{"title":"Banner","prompt":"Print exactly these three lines:\n\n`*****`\n`Python`\n`*****`","starter":"# Write your code below\n","solution":"print(\"*****\")\nprint(\"Python\")\nprint(\"*****\")","hint":"Three print() calls.","tests":[{"expected":"*****\nPython\n*****"}],"local_only":false}},{"id":2,"track":"BOOT","slug":"variables","title":"Variables","terms":[{"term":"variable","def":"A name that points to a stored value, like a labelled box."},{"term":"assignment","def":"Storing a value under a name with a single equals sign: score = 10."},{"term":"value","def":"The actual piece of data a variable holds, such as 10 or \"Mia\"."},{"term":"identifier","def":"A name you choose. It may contain letters, digits and underscores but cannot start with a digit or contain spaces."},{"term":"snake_case","def":"The Python style for names: lowercase words joined by underscores, e.g. total_price."},{"term":"type()","def":"A function that tells you what kind of value something is, e.g. int (whole number) or str (text)."},{"term":"reassign","def":"Giving an existing variable a new value. The old value is forgotten."}],"explain":"A variable lets you give a value a name so you can use it again. The `=` sign does not mean \"equals\" here: it means \"store the value on the right under the name on the left\". Python works out the right side first.","example":{"code":"age = 12                 # create a variable called age holding 12\nname = \"Mia\"             # text goes in quotes\nprint(name, age)         # print can show several things, separated by spaces\nage = age + 1            # reassign: take the old value, add 1, store it back\nprint(age)               # 13\nprint(type(age))         # <class 'int'>\n"},"mistakes":["Using a variable before creating it: `print(total)` first and `total = 5` later raises NameError.","Starting a name with a digit or using a space: `2nd_place = 1` and `my score = 3` are SyntaxErrors.","Mixing up `=` and `==`: a single `=` stores a value; `==` (chapter 7) compares two values."],"exercises":[{"title":"Swap","prompt":"`a` is 5 and `b` is 9. Swap their values using a third variable, so the program prints 9 and then 5.","starter":"a = 5\nb = 9\n# swap the values here\nprint(a)\nprint(b)\n","solution":"a = 5\nb = 9\ntemp = a\na = b\nb = temp\nprint(a)\nprint(b)","hint":"Save one value in temp before overwriting it.","tests":[{"expected":"9\n5"}],"local_only":false},{"title":"Price rise","prompt":"Create `price` with the value 20, add 5 to it, then print `price`.","starter":"# Write your code below\n","solution":"price = 20\nprice = price + 5\nprint(price)","hint":"price = price + 5","tests":[{"expected":"25"}],"local_only":false},{"title":"What type?","prompt":"Store 3.14 in a variable called `pi` and print its type.","starter":"# Write your code below\n","solution":"pi = 3.14\nprint(type(pi))","hint":"print(type(pi))","tests":[{"expected":"<class 'float'>"}],"local_only":false}],"quiz":[{"q":"What does score = 10 do?","options":["Checks if score equals 10","Prints 10","Stores 10 under the name score"],"answer":2,"why":"A single = is assignment."},{"q":"Which is a valid variable name?","options":["my score","2nd_place","total_price"],"answer":2,"why":"Names cannot start with a digit or contain spaces."},{"q":"After x = 3 and x = x + 2, what is x?","options":["5","2","3"],"answer":0,"why":"The right side uses the old value: 3 + 2, then stores 5."},{"q":"What does type(\"hi\") report?","options":["<class 'int'>","<class 'text'>","<class 'str'>"],"answer":2,"why":"Text values have the type str (string)."},{"q":"Which style does Python prefer for names?","options":["UPPER-KEBAB","snake_case","CamelCase for variables"],"answer":1,"why":"Variables use lowercase words joined by underscores."}],"challenge":{"title":"Score keeper","prompt":"Start with `score = 0`. Add 10, then add 5, then print `Score: 15` using `print(\"Score:\", score)`.","starter":"# Write your code below\n","solution":"score = 0\nscore = score + 10\nscore = score + 5\nprint(\"Score:\", score)","hint":"Reassign score twice, then print.","tests":[{"expected":"Score: 15"}],"local_only":false}},{"id":3,"track":"BOOT","slug":"numbers-operators","title":"Numbers and operators","terms":[{"term":"int","def":"A whole number such as 7 or -3."},{"term":"float","def":"A number with a decimal point such as 3.5. Called \"floating point\"."},{"term":"operator","def":"A symbol that does something with values: + - * / // % **."},{"term":"floor division //","def":"Division that throws away the fraction: 7 // 2 is 3."},{"term":"modulo %","def":"The remainder after division: 7 % 2 is 1. Great for \"is it even?\" checks."},{"term":"precedence","def":"The order operators are applied: ** first, then * / // %, then + -. Brackets override it."},{"term":"augmented assignment","def":"A shortcut such as x += 5, which means x = x + 5."}],"explain":"Python is a powerful calculator. `/` always gives a float (7 / 2 is 3.5). Use `//` for the whole part and `%` for the remainder. Brackets control the order of operations, just like in maths class.","example":{"code":"print(7 + 2)        # 9   addition\nprint(7 - 2)        # 5   subtraction\nprint(7 * 2)        # 14  multiplication\nprint(7 / 2)        # 3.5 division always gives a float\nprint(7 // 2)       # 3   floor division: whole part only\nprint(7 % 2)        # 1   modulo: the remainder\nprint(2 ** 5)       # 32  power\nprint((1 + 2) * 3)  # 9   brackets first\nx = 10\nx += 5              # same as x = x + 5\nprint(x)            # 15\n"},"mistakes":["Expecting `/` to give a whole number: `10 / 2` is `5.0` (a float). Use `//` when you want an int.","Forgetting precedence: `2 + 3 * 4` is 14, not 20. Add brackets: `(2 + 3) * 4`.","Using `^` for power: in Python `^` is something else. Write `2 ** 3`."],"exercises":[{"title":"Remainder","prompt":"Print the remainder when 47 is divided by 5.","starter":"# Write your code below\n","solution":"print(47 % 5)","hint":"The % operator.","tests":[{"expected":"2"}],"local_only":false},{"title":"Seconds in a day","prompt":"Print how many seconds are in one day (24 hours, 60 minutes, 60 seconds). Let Python multiply.","starter":"# Write your code below\n","solution":"print(24 * 60 * 60)","hint":"","tests":[{"expected":"86400"}],"local_only":false},{"title":"Average","prompt":"`a`, `b`, `c` are 7, 10 and 13. Print their average (it should show 10.0).","starter":"a = 7\nb = 10\nc = 13\n# print the average\n","solution":"a = 7\nb = 10\nc = 13\nprint((a + b + c) / 3)","hint":"Add them in brackets, then divide by 3.","tests":[{"expected":"10.0"}],"local_only":false}],"quiz":[{"q":"What is 7 // 2?","options":["3","3.5","4"],"answer":0,"why":"Floor division keeps only the whole part."},{"q":"What is 7 % 2?","options":["1","0.5","3"],"answer":0,"why":"% gives the remainder: 7 = 3*2 + 1."},{"q":"What type is the result of 10 / 2?","options":["float","int","str"],"answer":0,"why":"Regular division always returns a float: 5.0."},{"q":"What is 2 + 3 * 4?","options":["20","24","14"],"answer":2,"why":"Multiplication happens before addition."},{"q":"What does x += 5 do?","options":["Sets x to 5","Compares x with 5","Adds 5 to x"],"answer":2,"why":"It is shorthand for x = x + 5."}],"challenge":{"title":"Pizza party","prompt":"17 slices are shared equally between 4 people. Print how many slices each person gets, then print how many are left over (two lines).","starter":"# Write your code below\n","solution":"print(17 // 4)\nprint(17 % 4)","hint":"// for each, % for the leftovers.","tests":[{"expected":"4\n1"}],"local_only":false}},{"id":4,"track":"BOOT","slug":"strings","title":"Strings","terms":[{"term":"string (str)","def":"A sequence of characters in quotes. Single or double quotes both work."},{"term":"concatenation","def":"Joining strings together with +: \"ab\" + \"cd\" is \"abcd\"."},{"term":"index","def":"The position of a character. Counting starts at 0, so \"Python\"[0] is \"P\"."},{"term":"slice","def":"A piece of a string: text[start:stop] includes start but stops before stop."},{"term":"len()","def":"A function returning how many items (characters) something contains."},{"term":"escape sequence","def":"A backslash code inside a string, e.g. \\n for a new line or \\\" for a quote."}],"explain":"A string is an ordered row of characters. Every character has a position (index) starting from 0, and negative numbers count from the end. Slices let you cut out any piece. Strings cannot be changed in place; every operation gives you a new string.","example":{"code":"word = \"Python\"\nprint(len(word))       # 6 characters\nprint(word[0])         # P  (counting starts at 0)\nprint(word[-1])        # n  (negative counts from the end)\nprint(word[0:3])       # Pyt (start included, stop excluded)\nprint(word[2:])        # thon\nprint(word[-2:])       # on\nprint(\"Hi \" + word)    # + joins strings\nprint(\"ha\" * 3)        # hahaha\nprint(\"Line1\\nLine2\")  # \\n starts a new line\n"},"mistakes":["Off-by-one: the first character is `[0]`, and `text[0:3]` gives only 3 characters (0, 1, 2).","Joining text and numbers: `\"Age: \" + 5` raises TypeError. Use `str(5)` or an f-string (next chapter).","Trying to change a letter: `word[0] = \"J\"` raises TypeError because strings are immutable."],"exercises":[{"title":"First and last","prompt":"`word` is \"keyboard\". Print its first letter and then its last letter, on separate lines.","starter":"word = \"keyboard\"\n","solution":"word = \"keyboard\"\nprint(word[0])\nprint(word[-1])","hint":"Index 0 and index -1.","tests":[{"expected":"k\nd"}],"local_only":false},{"title":"Cut a slice","prompt":"`word` is \"programming\". Print only the middle part \"gram\" using a slice.","starter":"word = \"programming\"\n","solution":"word = \"programming\"\nprint(word[3:7])","hint":"gram starts at index 3 and stops before index 7.","tests":[{"expected":"gram"}],"local_only":false},{"title":"Na na na","prompt":"Print `na` repeated 4 times followed by ` Batman` (one line, no spaces between the nas).","starter":"# Write your code below\n","solution":"print(\"na\" * 4 + \" Batman\")","hint":"Repetition with * and joining with +.","tests":[{"expected":"nananana Batman"}],"local_only":false}],"quiz":[{"q":"What is \"Python\"[1]?","options":["y","t","P"],"answer":0,"why":"Index 0 is P, index 1 is y."},{"q":"What is \"Python\"[-1]?","options":["o","n","P"],"answer":1,"why":"Negative indexes count from the end."},{"q":"What does \"abcdef\"[1:3] give?","options":["bcd","bc","abc"],"answer":1,"why":"From index 1 up to (not including) index 3."},{"q":"What is len(\"hello\")?","options":["6","4","5"],"answer":2,"why":"There are 5 characters."},{"q":"What does \"ab\" * 3 give?","options":["aaabbb","ab3","ababab"],"answer":2,"why":"String repetition repeats the whole string."}],"challenge":{"title":"Measure and cut","prompt":"`text` is \"mississippi\". Print its length, and then its last four letters (two lines).","starter":"text = \"mississippi\"\n","solution":"text = \"mississippi\"\nprint(len(text))\nprint(text[-4:])","hint":"len(text) and text[-4:]","tests":[{"expected":"11\nippi"}],"local_only":false}},{"id":5,"track":"BOOT","slug":"fstrings-string-methods","title":"f-strings and string methods","terms":[{"term":"f-string","def":"A string starting with f where {expressions} are replaced by their values: f\"Hi {name}\"."},{"term":"method","def":"A function that belongs to a value, called with a dot: \"hi\".upper()."},{"term":".strip()","def":"Removes spaces (and newlines) from both ends of a string."},{"term":".split()","def":"Cuts a string into a list of pieces at a separator."},{"term":".join()","def":"Glues a list of strings into one string using a separator."},{"term":".replace()","def":"Returns a copy of the string with one piece swapped for another."},{"term":"in","def":"Checks whether a smaller string is inside a bigger one: \"cat\" in \"concatenate\" is True."}],"explain":"f-strings are the clearest way to mix text and values. String methods are built-in tools attached to strings. Remember that methods return a *new* string; they never change the original.","example":{"code":"name = \"ada lovelace\"\nprint(name.title())              # Ada Lovelace\nprint(name.upper())              # ADA LOVELACE\nprint(f\"Hello, {name.title()}!\")  # f-string: {} holds any expression\nage = 36\nprint(f\"{name} will be {age + 1}\")  # maths inside the braces\nprint(\"  spaces  \".strip())       # spaces\nprint(\"a,b,c\".split(\",\"))        # ['a', 'b', 'c']\nprint(\"-\".join([\"x\", \"y\", \"z\"])) # x-y-z\nprint(\"cat\" in \"concatenate\")    # True\n"},"mistakes":["Forgetting the `f`: `\"Hi {name}\"` prints the braces literally. It must be `f\"Hi {name}\"`.","Expecting methods to change the original: `name.upper()` alone does nothing visible; use `name = name.upper()`.","Using `+` with numbers inside text: prefer `f\"Total: {total}\"` over `\"Total: \" + total` (TypeError)."],"exercises":[{"title":"Score line","prompt":"`name` is \"Sam\" and `score` is 90. Use an f-string to print `Sam scored 90 points`.","starter":"name = \"Sam\"\nscore = 90\n","solution":"name = \"Sam\"\nscore = 90\nprint(f\"{name} scored {score} points\")","hint":"print(f\"{name} scored ...\")","tests":[{"expected":"Sam scored 90 points"}],"local_only":false},{"title":"Tidy up","prompt":"`raw` is \"  hELLo wORLD  \". Print it with the outer spaces removed and each word capitalised (Hello World).","starter":"raw = \"  hELLo wORLD  \"\n","solution":"raw = \"  hELLo wORLD  \"\nprint(raw.strip().title())","hint":"Chain the methods: raw.strip().title()","tests":[{"expected":"Hello World"}],"local_only":false},{"title":"Cats to dogs","prompt":"`sentence` is \"I like cats\". Print it with `cats` replaced by `dogs`.","starter":"sentence = \"I like cats\"\n","solution":"sentence = \"I like cats\"\nprint(sentence.replace(\"cats\", \"dogs\"))","hint":"","tests":[{"expected":"I like dogs"}],"local_only":false}],"quiz":[{"q":"What does f\"{2 + 3}\" produce?","options":["5","2 + 3","{2 + 3}"],"answer":0,"why":"The braces hold an expression that is evaluated."},{"q":"What does \" hi \".strip() return?","options":["hi"," hi","hi "],"answer":0,"why":"strip() removes spaces from both ends."},{"q":"What does \"a-b-c\".split(\"-\") return?","options":["['a', 'b', 'c']","'abc'","['a-b-c']"],"answer":0,"why":"It cuts at each separator and returns a list."},{"q":"Which makes text upper-case?","options":["upper(\"hi\")","\"hi\".up","\"hi\".upper()"],"answer":2,"why":"upper() is a string method called with a dot."},{"q":"What is \"sun\" in \"sunday\"?","options":["True","3","False"],"answer":0,"why":"in checks whether the first string is inside the second."}],"challenge":{"title":"Colour list","prompt":"`colours` is \"red,green,blue\". Print the colours upper-case and joined with ` & ` (RED & GREEN & BLUE).","starter":"colours = \"red,green,blue\"\n","solution":"colours = \"red,green,blue\"\nprint(\" & \".join(colours.upper().split(\",\")))","hint":"split(\",\") then \" & \".join(...) and .upper()","tests":[{"expected":"RED & GREEN & BLUE"}],"local_only":false}},{"id":6,"track":"BOOT","slug":"input-type-casting","title":"input() and type casting","terms":[{"term":"input()","def":"A function that pauses the program, waits for the user to type a line and press Enter, and returns it as a string."},{"term":"type casting","def":"Converting a value from one type to another, e.g. int(\"5\") turns text into the number 5."},{"term":"int()","def":"Converts text or a float to a whole number. Fails with ValueError if the text is not a number."},{"term":"float()","def":"Converts text or an int to a decimal number."},{"term":"str()","def":"Converts any value to text."},{"term":"prompt","def":"The message shown to the user by input(\"Your name? \")."}],"explain":"`input()` always gives you text, even if the user types digits. To do maths you must cast the text with `int()` or `float()`. Casting can fail: `int(\"abc\")` raises ValueError.","example":{"code":"name = input(\"Your name? \")      # waits for the user; the answer is always text\nage = int(input(\"Your age? \"))   # int() converts the text into a whole number\nprint(f\"{name} will be {age + 1} next year\")\nprice = float(\"2.50\")            # float() converts text to a decimal number\nprint(price * 2)                 # 5.0\nprint(str(7) + \"8\")              # str() converts a number to text: 78\n"},"mistakes":["Forgetting to cast: `input() + 1` raises TypeError because the input is text. Use `int(input()) + 1`.","Casting text that is not a number: `int(\"3.5\")` and `int(\"abc\")` both raise ValueError.","Calling `input` without parentheses: `name = input` stores the function itself, it does not ask anything."],"exercises":[{"title":"Greeter","prompt":"Read a name from the input and print `Hello, <name>!`","starter":"# Write your code below\n","solution":"name = input()\nprint(f\"Hello, {name}!\")","hint":"name = input()","tests":[{"expected":"Hello, Ana!","stdin":"Ana\n"},{"expected":"Hello, Bob!","stdin":"Bob\n"}],"local_only":false},{"title":"Double it","prompt":"Read a whole number and print twice its value.","starter":"# Write your code below\n","solution":"n = int(input())\nprint(n * 2)","hint":"Cast with int() before doing maths.","tests":[{"expected":"42","stdin":"21\n"},{"expected":"-8","stdin":"-4\n"}],"local_only":false},{"title":"Add two","prompt":"Read two whole numbers (one per line) and print their sum.","starter":"# Write your code below\n","solution":"a = int(input())\nb = int(input())\nprint(a + b)","hint":"","tests":[{"expected":"7","stdin":"3\n4\n"},{"expected":"8","stdin":"10\n-2\n"}],"local_only":false}],"quiz":[{"q":"What type does input() always return?","options":["str","float","int"],"answer":0,"why":"Even if the user types digits, you receive text."},{"q":"What does int(\"12\") + 1 give?","options":["121","Error","13"],"answer":2,"why":"The text is cast to 12 first."},{"q":"What happens with int(\"abc\")?","options":["It prints abc","ValueError","0"],"answer":1,"why":"The text is not a valid whole number."},{"q":"What does float(\"2.5\") * 2 give?","options":["5","2.52.5","5.0"],"answer":2,"why":"float makes it a decimal number, so the result is 5.0."},{"q":"What does str(3) + \"4\" give?","options":["7","Error","34"],"answer":2,"why":"Both are text, so + joins them."}],"challenge":{"title":"Rectangle area","prompt":"Read a width and a height (decimal numbers, one per line) and print the area.","starter":"# Write your code below\n","solution":"w = float(input())\nh = float(input())\nprint(w * h)","hint":"Use float() for both.","tests":[{"expected":"10.0","stdin":"2.5\n4\n"},{"expected":"9.0","stdin":"3\n3\n"}],"local_only":false}},{"id":7,"track":"BOOT","slug":"booleans-comparisons","title":"Booleans and comparisons","terms":[{"term":"boolean (bool)","def":"A value that is either True or False."},{"term":"comparison operator","def":"Compares two values and gives a bool: == != < > <= >=."},{"term":"==","def":"Asks \"are these equal?\" (not to be confused with = which stores a value)."},{"term":"and / or / not","def":"Combine or flip booleans: and needs both True, or needs at least one, not flips the value."},{"term":"truthiness","def":"Every value counts as True or False in a condition. 0, \"\", [] and None are False; most other values are True."}],"explain":"Programs make decisions by asking yes/no questions. A comparison produces a boolean, and `and`, `or`, `not` combine several questions into one.","example":{"code":"print(5 > 3)            # True\nprint(5 == 5)           # True  (== asks \"are they equal?\")\nprint(\"a\" != \"b\")       # True\nage = 15\nprint(age >= 13 and age < 20)   # True: both sides must be True\nprint(not (age > 18))           # True: not flips True/False\nprint(bool(0), bool(\"\"), bool(\"hi\"))   # False False True\n"},"mistakes":["Using `=` instead of `==` in a comparison: `if x = 5` is a SyntaxError.","Comparing text with numbers: `\"5\" == 5` is False because one is str and the other is int.","Writing `x == 1 or 2`: this does not mean \"x is 1 or 2\". Write `x == 1 or x == 2`."],"exercises":[{"title":"Even?","prompt":"Print whether 17 is an even number (True or False), using the remainder operator.","starter":"# Write your code below\n","solution":"print(17 % 2 == 0)","hint":"An even number has remainder 0 when divided by 2.","tests":[{"expected":"False"}],"local_only":false},{"title":"Teenager","prompt":"Read an age and print True if it is from 13 to 19 inclusive, otherwise False.","starter":"# Write your code below\n","solution":"age = int(input())\nprint(age >= 13 and age <= 19)","hint":"Combine two comparisons with and.","tests":[{"expected":"True","stdin":"15\n"},{"expected":"False","stdin":"20\n"},{"expected":"True","stdin":"13\n"},{"expected":"False","stdin":"12\n"}],"local_only":false},{"title":"Same word","prompt":"Read two words (one per line) and print True if they are equal ignoring upper/lower case.","starter":"# Write your code below\n","solution":"a = input()\nb = input()\nprint(a.lower() == b.lower())","hint":".lower() both before comparing.","tests":[{"expected":"True","stdin":"Python\npython\n"},{"expected":"False","stdin":"a\nb\n"}],"local_only":false}],"quiz":[{"q":"What is 3 == 3.0?","options":["False","Error","True"],"answer":2,"why":"Python compares the numeric values, which are equal."},{"q":"What does True and False give?","options":["False","True","Error"],"answer":0,"why":"and needs both sides to be True."},{"q":"What does not (5 > 3) give?","options":["True","5","False"],"answer":2,"why":"5 > 3 is True; not flips it."},{"q":"Which operator asks \"are these different?\"","options":["<>","=!","!="],"answer":2,"why":"!= means not equal."},{"q":"What is bool(\"\") ?","options":["False","True","None"],"answer":0,"why":"An empty string is falsy."}],"challenge":{"title":"Leap year","prompt":"Read a year and print True if it is a leap year: divisible by 4 and not by 100, unless it is divisible by 400.","starter":"# Write your code below\n","solution":"y = int(input())\nprint((y % 4 == 0 and y % 100 != 0) or y % 400 == 0)","hint":"(div by 4 and not by 100) or div by 400","tests":[{"expected":"True","stdin":"2024\n"},{"expected":"False","stdin":"1900\n"},{"expected":"True","stdin":"2000\n"},{"expected":"False","stdin":"2023\n"}],"local_only":false}},{"id":8,"track":"BOOT","slug":"if-elif-else","title":"if / elif / else","terms":[{"term":"condition","def":"An expression that is True or False, used to decide what to do."},{"term":"if statement","def":"Runs an indented block only when its condition is True."},{"term":"block","def":"A group of lines indented the same amount under a line ending with a colon."},{"term":"indentation","def":"The spaces at the start of a line. In Python it is part of the grammar: 4 spaces per level."},{"term":"elif","def":"\"else if\": checked only when the earlier conditions were False."},{"term":"else","def":"The fallback block that runs when no condition matched."}],"explain":"Python picks the first branch whose condition is True and skips the rest. Always end the `if`/`elif`/`else` line with a colon and indent the block below it.","example":{"code":"temp = int(input(\"Temperature? \"))\nif temp >= 30:               # the line ends with a colon\n    print(\"Hot\")             # the indented block runs only when the condition is True\nelif temp >= 15:             # elif: checked only if the earlier conditions were False\n    print(\"Nice\")\nelse:                        # else: nothing above matched\n    print(\"Cold\")\n"},"mistakes":["Forgetting the colon: `if x > 3` raises SyntaxError. The line must end with `:`.","Wrong indentation: lines in the block must be indented equally, otherwise IndentationError.","Order of branches: with `if x > 5` before `if x > 10`, the second one is never reached. Check the biggest first."],"exercises":[{"title":"Sign","prompt":"Read an integer and print `positive`, `negative` or `zero`.","starter":"# Write your code below\n","solution":"n = int(input())\nif n > 0:\n    print(\"positive\")\nelif n < 0:\n    print(\"negative\")\nelse:\n    print(\"zero\")","hint":"","tests":[{"expected":"positive","stdin":"5\n"},{"expected":"negative","stdin":"-2\n"},{"expected":"zero","stdin":"0\n"}],"local_only":false},{"title":"Grade","prompt":"Read a score. Print `A` for 90 or more, `B` for 80+, `C` for 70+, otherwise `F`.","starter":"# Write your code below\n","solution":"s = int(input())\nif s >= 90:\n    print(\"A\")\nelif s >= 80:\n    print(\"B\")\nelif s >= 70:\n    print(\"C\")\nelse:\n    print(\"F\")","hint":"Check the highest threshold first.","tests":[{"expected":"A","stdin":"95\n"},{"expected":"B","stdin":"85\n"},{"expected":"C","stdin":"70\n"},{"expected":"F","stdin":"10\n"},{"expected":"A","stdin":"90\n"}],"local_only":false},{"title":"FizzBuzz for one","prompt":"Read n. Print `FizzBuzz` if divisible by 3 and 5, `Fizz` if by 3, `Buzz` if by 5, else the number itself.","starter":"# Write your code below\n","solution":"n = int(input())\nif n % 15 == 0:\n    print(\"FizzBuzz\")\nelif n % 3 == 0:\n    print(\"Fizz\")\nelif n % 5 == 0:\n    print(\"Buzz\")\nelse:\n    print(n)","hint":"Test the combined case first.","tests":[{"expected":"FizzBuzz","stdin":"15\n"},{"expected":"Fizz","stdin":"9\n"},{"expected":"Buzz","stdin":"10\n"},{"expected":"7","stdin":"7\n"}],"local_only":false}],"quiz":[{"q":"What must an if line end with?","options":["A colon :","A semicolon ;","Nothing"],"answer":0,"why":"The colon introduces the indented block."},{"q":"When does the else block run?","options":["Always","Only when all conditions are True","When no earlier condition was True"],"answer":2,"why":"else is the fallback."},{"q":"How many branches of one if/elif/else chain can run?","options":["All of them","At most one","Exactly two"],"answer":1,"why":"Python runs the first matching branch only."},{"q":"What does indentation do in Python?","options":["Is only decoration","Makes code faster","Defines which lines belong to a block"],"answer":2,"why":"Indentation is part of Python's grammar."},{"q":"Which is the correct elif?","options":["elif x > 3:","elseif (x > 3)","else if x > 3:"],"answer":0,"why":"Python spells it elif and needs the colon."}],"challenge":{"title":"Triangle type","prompt":"Read three side lengths (one per line). Print `equilateral` if all are equal, `isosceles` if exactly two are equal, otherwise `scalene`.","starter":"# Write your code below\n","solution":"a = int(input())\nb = int(input())\nc = int(input())\nif a == b == c:\n    print(\"equilateral\")\nelif a == b or b == c or a == c:\n    print(\"isosceles\")\nelse:\n    print(\"scalene\")","hint":"Check \"all equal\" before \"two equal\".","tests":[{"expected":"equilateral","stdin":"3\n3\n3\n"},{"expected":"isosceles","stdin":"3\n3\n4\n"},{"expected":"scalene","stdin":"3\n4\n5\n"},{"expected":"isosceles","stdin":"5\n4\n4\n"}],"local_only":false}},{"id":9,"track":"BOOT","slug":"while-loops","title":"while loops","terms":[{"term":"loop","def":"Code that repeats."},{"term":"while loop","def":"Repeats its block as long as its condition stays True."},{"term":"iteration","def":"One pass through the body of a loop."},{"term":"counter","def":"A variable that changes each iteration, usually to end the loop."},{"term":"infinite loop","def":"A loop whose condition never becomes False. Stop it with Ctrl+C or the Stop button."}],"explain":"A `while` loop checks its condition before every pass. Something inside the loop must change the condition, otherwise the loop never ends.","example":{"code":"count = 3\nwhile count > 0:         # repeat while the condition is True\n    print(count)\n    count -= 1           # change something, or the loop never ends!\nprint(\"Liftoff!\")\n"},"mistakes":["Forgetting to update the counter: `while n > 0:` with no `n -= 1` runs forever.","Off-by-one: `while n < 5` stops at 4; use `<=` if you want to include 5.","Starting with a false condition: the loop body then never runs at all."],"exercises":[{"title":"Countdown","prompt":"Print 5, 4, 3, 2, 1 (one per line) and then `Go!`.","starter":"# Write your code below\n","solution":"n = 5\nwhile n > 0:\n    print(n)\n    n -= 1\nprint(\"Go!\")","hint":"","tests":[{"expected":"5\n4\n3\n2\n1\nGo!"}],"local_only":false},{"title":"Sum to n","prompt":"Read n and print 1 + 2 + ... + n using a while loop.","starter":"# Write your code below\n","solution":"n = int(input())\ni = 1\ntotal = 0\nwhile i <= n:\n    total += i\n    i += 1\nprint(total)","hint":"","tests":[{"expected":"10","stdin":"4\n"},{"expected":"5050","stdin":"100\n"},{"expected":"1","stdin":"1\n"}],"local_only":false},{"title":"Until zero","prompt":"Read numbers (one per line) until a 0 is entered, then print the total of the numbers entered before the 0.","starter":"# Write your code below\n","solution":"total = 0\nn = int(input())\nwhile n != 0:\n    total += n\n    n = int(input())\nprint(total)","hint":"","tests":[{"expected":"8","stdin":"5\n3\n0\n"},{"expected":"0","stdin":"0\n"}],"local_only":false}],"quiz":[{"q":"When is a while condition checked?","options":["Only once","Before every pass","After the loop"],"answer":1,"why":"If it is False at the start, the body never runs."},{"q":"What causes an infinite loop?","options":["A condition that never becomes False","Using print","Using break"],"answer":0,"why":"Nothing in the body makes the condition False."},{"q":"What does n -= 1 do?","options":["Subtracts 1 from n","Compares n with 1","Sets n to -1"],"answer":0,"why":"It is short for n = n - 1."},{"q":"How many times does `i = 0; while i < 3: i += 1` run its body?","options":["2","4","3"],"answer":2,"why":"i takes the values 0, 1, 2 inside the loop."},{"q":"How can you stop a running infinite loop?","options":["Ctrl+C / the Stop button","Closing print","Typing exit in the code"],"answer":0,"why":"Both interrupt the program from outside."}],"challenge":{"title":"Digit sum","prompt":"Read a non-negative whole number and print the sum of its digits, using a while loop with `%` and `//`.","starter":"# Write your code below\n","solution":"n = int(input())\ntotal = 0\nwhile n > 0:\n    total += n % 10\n    n //= 10\nprint(total)","hint":"n % 10 is the last digit, n // 10 removes it.","tests":[{"expected":"10","stdin":"1234\n"},{"expected":"9","stdin":"9\n"},{"expected":"0","stdin":"0\n"},{"expected":"45","stdin":"123456789\n"}],"local_only":false}},{"id":10,"track":"BOOT","slug":"for-loops-range","title":"for loops and range","terms":[{"term":"for loop","def":"Repeats its block once for every item in a sequence."},{"term":"sequence","def":"An ordered collection, like a string or range."},{"term":"range()","def":"Produces numbers: range(stop), range(start, stop), range(start, stop, step). The stop value is excluded."},{"term":"loop variable","def":"The name that takes each item in turn: in `for i in range(3)` it is i."},{"term":"accumulator","def":"A variable (often total = 0) updated inside a loop to build a result."}],"explain":"Use `for` when you know what to loop over; use `while` when you loop until something happens. `range(5)` counts 0 to 4: it stops *before* the stop number.","example":{"code":"for i in range(3):            # range(3) gives 0, 1, 2\n    print(i)\nfor n in range(1, 6, 2):      # start, stop (excluded), step\n    print(n)                  # 1 3 5\nfor letter in \"abc\":          # a string is a sequence of letters\n    print(letter)\ntotal = 0\nfor x in range(1, 5):\n    total += x                # accumulate a result\nprint(total)                  # 10\n"},"mistakes":["Expecting range(5) to include 5: it gives 0, 1, 2, 3, 4. Use range(1, 6) for 1 to 5.","Changing the loop variable inside the loop and expecting it to affect the next pass: each pass gets a fresh value.","Forgetting to start the accumulator before the loop: `total += x` raises NameError if total does not exist."],"exercises":[{"title":"One to five","prompt":"Print the numbers 1 to 5, one per line.","starter":"# Write your code below\n","solution":"for i in range(1, 6):\n    print(i)","hint":"","tests":[{"expected":"1\n2\n3\n4\n5"}],"local_only":false},{"title":"Times table","prompt":"Read n and print its table for 1 to 5 in the form `3 x 1 = 3`.","starter":"# Write your code below\n","solution":"n = int(input())\nfor i in range(1, 6):\n    print(f\"{n} x {i} = {n * i}\")","hint":"","tests":[{"expected":"3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15","stdin":"3\n"},{"expected":"7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35","stdin":"7\n"}],"local_only":false},{"title":"Even sum","prompt":"Read n and print the sum of the even numbers from 1 to n (inclusive).","starter":"# Write your code below\n","solution":"n = int(input())\ntotal = 0\nfor i in range(2, n + 1, 2):\n    total += i\nprint(total)","hint":"range(2, n + 1, 2)","tests":[{"expected":"30","stdin":"10\n"},{"expected":"12","stdin":"7\n"},{"expected":"0","stdin":"1\n"}],"local_only":false}],"quiz":[{"q":"What does range(3) produce?","options":["0, 1, 2, 3","0, 1, 2","1, 2, 3"],"answer":1,"why":"It starts at 0 and stops before 3."},{"q":"What does range(2, 10, 3) produce?","options":["2, 5, 8, 11","3, 6, 9","2, 5, 8"],"answer":2,"why":"Start 2, step 3, stop before 10."},{"q":"What does `for ch in \"hi\"` loop over?","options":["h then i","the whole word once","numbers 0 and 1"],"answer":0,"why":"A string is a sequence of characters."},{"q":"When is for better than while?","options":["When you know the sequence to loop over","Only for numbers","Never"],"answer":0,"why":"for walks through a known sequence."},{"q":"What is the sum after `t=0; for x in range(1,4): t+=x`?","options":["3","6","10"],"answer":1,"why":"1 + 2 + 3 = 6."}],"challenge":{"title":"Star triangle","prompt":"Read n and print n lines: line 1 has one `*`, line 2 has two, and so on.","starter":"# Write your code below\n","solution":"n = int(input())\nfor i in range(1, n + 1):\n    print(\"*\" * i)","hint":"Repeat \"*\" i times.","tests":[{"expected":"*\n**\n***","stdin":"3\n"},{"expected":"*","stdin":"1\n"},{"expected":"*\n**\n***\n****\n*****","stdin":"5\n"}],"local_only":false}},{"id":11,"track":"CORE","slug":"break-continue-pass","title":"break, continue and pass","terms":[{"term":"break","def":"Leaves the nearest loop immediately."},{"term":"continue","def":"Skips the rest of this pass and jumps to the next iteration."},{"term":"pass","def":"A statement that does nothing. It is a placeholder where Python needs a block."},{"term":"sentinel value","def":"A special input (like 0 or \"quit\") that tells a loop to stop."},{"term":"flag","def":"A boolean variable that remembers whether something happened."}],"explain":"`break` and `continue` give you fine control inside loops. Use `break` when the job is done (for example you found the item) and `continue` to skip items you do not want to process.","example":{"code":"for n in range(1, 10):\n    if n == 3:\n        continue          # skip the rest of this pass, go to the next n\n    if n == 6:\n        break             # leave the loop completely\n    print(n)              # prints 1 2 4 5\nfor x in range(2):\n    pass                  # pass does nothing: a placeholder for code you will write later\n"},"mistakes":["Using `break` outside a loop is a SyntaxError.","`break` only leaves the innermost loop; an outer loop keeps going.","In a `while` loop, putting `continue` before the counter update can create an infinite loop."],"exercises":[{"title":"First match","prompt":"Print the first whole number from 1 upwards that is divisible by both 7 and 8. Use a loop and `break`.","starter":"# Write your code below\n","solution":"n = 1\nwhile True:\n    if n % 7 == 0 and n % 8 == 0:\n        print(n)\n        break\n    n += 1","hint":"A while True loop that breaks when it finds the number.","tests":[{"expected":"56"}],"local_only":false},{"title":"Positives only","prompt":"Read numbers (one per line) until 0 is entered. Print the sum of the positive numbers only (skip negatives with `continue`).","starter":"# Write your code below\n","solution":"total = 0\nwhile True:\n    n = int(input())\n    if n == 0:\n        break\n    if n < 0:\n        continue\n    total += n\nprint(total)","hint":"","tests":[{"expected":"9","stdin":"5\n-3\n4\n0\n"},{"expected":"0","stdin":"-1\n0\n"}],"local_only":false},{"title":"Until a vowel","prompt":"Read a word and print its letters one per line, stopping before the first vowel (a, e, i, o, u).","starter":"# Write your code below\n","solution":"word = input()\nfor ch in word:\n    if ch in \"aeiou\":\n        break\n    print(ch)","hint":"","tests":[{"expected":"p\ny\nt\nh","stdin":"python\n"},{"expected":"s\nt\nr","stdin":"street\n"}],"local_only":false}],"quiz":[{"q":"What does break do?","options":["Skips one pass","Stops the program","Leaves the loop"],"answer":2,"why":"break ends the innermost loop."},{"q":"What does continue do?","options":["Skips to the next iteration","Restarts the program","Leaves the loop"],"answer":0,"why":"The rest of the body is skipped for this pass."},{"q":"What is pass for?","options":["A placeholder that does nothing","Passing a test","Skipping a loop"],"answer":0,"why":"Python needs some statement in an empty block."},{"q":"Which prints 1 2?","options":["for i in range(1,5):\n if i==3: break\n print(i)","for i in range(1,3): pass","for i in range(1,5):\n if i==3: continue\n print(i)"],"answer":0,"why":"break at 3 stops after printing 1 and 2."},{"q":"A \"sentinel\" value is...","options":["An input that tells the loop to stop","A comment","A kind of loop"],"answer":0,"why":"For example typing 0 or quit."}],"challenge":{"title":"Prime or not","prompt":"Read n (2 or more). Print `prime` if it has no divisors between 2 and n-1, else `not prime`.","starter":"# Write your code below\n","solution":"n = int(input())\nprime = True\nfor d in range(2, n):\n    if n % d == 0:\n        prime = False\n        break\nprint(\"prime\" if prime else \"not prime\")","hint":"Use a flag and break at the first divisor.","tests":[{"expected":"prime","stdin":"2\n"},{"expected":"not prime","stdin":"15\n"},{"expected":"prime","stdin":"17\n"},{"expected":"not prime","stdin":"49\n"}],"local_only":false}},{"id":12,"track":"CORE","slug":"lists","title":"Lists","terms":[{"term":"list","def":"An ordered, changeable collection written with square brackets: [1, 2, 3]."},{"term":"element","def":"One item inside a list."},{"term":"index","def":"The position of an element, starting at 0. Negative indexes count from the end."},{"term":"mutable","def":"Can be changed after it is created. Lists are mutable; strings are not."},{"term":".append()","def":"Adds one element at the end of a list."},{"term":"len()","def":"Returns the number of elements."}],"explain":"A list stores many values under one name. You can read, replace, add and remove elements, and loop over them with `for`.","example":{"code":"fruits = [\"apple\", \"banana\", \"cherry\"]   # a list uses square brackets\nprint(fruits[0])             # apple (index starts at 0)\nprint(fruits[-1])            # cherry\nfruits[1] = \"blueberry\"      # lists can be changed (they are mutable)\nfruits.append(\"date\")        # add to the end\nprint(len(fruits))           # 4\nprint(\"apple\" in fruits)     # True\nfor fruit in fruits:         # loop over every element\n    print(fruit.upper())\n"},"mistakes":["IndexError: `fruits[3]` on a 3-item list. The last valid index is `len(fruits) - 1`.","Forgetting that `append` changes the list and returns None: `x = items.append(1)` makes x None.","Using round brackets for a list: `(1, 2)` is a tuple, not a list."],"exercises":[{"title":"First, last, size","prompt":"`nums` is `[4, 8, 15, 16, 23, 42]`. Print its first element, its last element and its length (three lines).","starter":"nums = [4, 8, 15, 16, 23, 42]\n","solution":"nums = [4, 8, 15, 16, 23, 42]\nprint(nums[0])\nprint(nums[-1])\nprint(len(nums))","hint":"","tests":[{"expected":"4\n42\n6"}],"local_only":false},{"title":"Squares","prompt":"Read n. Build a list of the squares of 1..n with a loop and `append`, then print the list.","starter":"# Write your code below\n","solution":"n = int(input())\nsquares = []\nfor i in range(1, n + 1):\n    squares.append(i * i)\nprint(squares)","hint":"","tests":[{"expected":"[1, 4, 9, 16]","stdin":"4\n"},{"expected":"[1]","stdin":"1\n"}],"local_only":false},{"title":"Totals","prompt":"`scores` is `[70, 85, 92, 60]`. With a loop, print the total and then how many scores are 80 or more.","starter":"scores = [70, 85, 92, 60]\n","solution":"scores = [70, 85, 92, 60]\ntotal = 0\ncount = 0\nfor s in scores:\n    total += s\n    if s >= 80:\n        count += 1\nprint(total)\nprint(count)","hint":"","tests":[{"expected":"307\n2"}],"local_only":false}],"quiz":[{"q":"What is [10, 20, 30][1]?","options":["20","30","10"],"answer":0,"why":"Index 1 is the second element."},{"q":"What does list.append(5) do?","options":["Adds 5 at the start","Returns a new list","Adds 5 at the end"],"answer":2,"why":"append changes the list in place."},{"q":"What is len([1, [2, 3]])?","options":["2","1","3"],"answer":0,"why":"The inner list counts as one element."},{"q":"Which is a list?","options":["{1, 2}","(1, 2)","[1, 2]"],"answer":2,"why":"Square brackets make a list."},{"q":"What error does [1, 2][5] raise?","options":["IndexError","ValueError","KeyError"],"answer":0,"why":"The index is out of range."}],"challenge":{"title":"Unique in order","prompt":"Read a line of whole numbers separated by spaces. Print a list of the numbers without duplicates, keeping the order in which they first appear.","starter":"# Write your code below\n","solution":"nums = [int(x) for x in input().split()]\nunique = []\nfor n in nums:\n    if n not in unique:\n        unique.append(n)\nprint(unique)","hint":"Loop and only append values that are `not in` the new list. (A shorter way to convert is in chapter 31; here you can convert with a loop.)","tests":[{"expected":"[1, 2, 3, 4]","stdin":"1 2 2 3 1 4\n"},{"expected":"[5]","stdin":"5 5 5\n"},{"expected":"[3, 2, 1]","stdin":"3 2 1\n"}],"local_only":false}},{"id":13,"track":"CORE","slug":"list-methods-slicing","title":"List methods and slicing","terms":[{"term":"slice","def":"A piece of a list: items[start:stop:step]. Slicing gives a new list."},{"term":".sort()","def":"Sorts a list in place (changes it)."},{"term":"sorted()","def":"Returns a new sorted list and leaves the original alone."},{"term":".insert()","def":"Adds an element at a chosen position."},{"term":".remove()","def":"Deletes the first element equal to a value."},{"term":".pop()","def":"Removes and returns an element (the last one by default)."},{"term":"sum / min / max","def":"Built-in functions that work on whole lists of numbers."}],"explain":"Lists come with many methods. Methods like `sort()`, `append()` and `remove()` change the list itself, while slices and `sorted()` give you new lists.","example":{"code":"nums = [5, 2, 9, 1]\nnums.sort()                  # sorts in place: [1, 2, 5, 9]\nprint(nums[1:3])             # [2, 5]\nprint(nums[::-1])            # [9, 5, 2, 1] a reversed copy\nnums.insert(0, 7)            # [7, 1, 2, 5, 9]\nnums.remove(2)               # removes the first 2\nlast = nums.pop()            # removes and returns the last item\nprint(last, nums)            # 9 [7, 1, 5]\nprint(sum(nums), min(nums), max(nums))   # 13 1 7\nprint(sorted(nums, reverse=True))        # a new list: [7, 5, 1]\n"},"mistakes":["`x = nums.sort()` makes x None, because sort() changes the list and returns nothing. Use `sorted(nums)` when you want a value.","`remove(value)` raises ValueError if the value is not in the list.","Slices do not raise errors when out of range: `[1, 2][5:9]` is simply `[]`."],"exercises":[{"title":"Second largest","prompt":"`nums` is `[4, 9, 2, 7]`. Print the second largest number.","starter":"nums = [4, 9, 2, 7]\n","solution":"nums = [4, 9, 2, 7]\nnums.sort()\nprint(nums[-2])","hint":"Sort the list and look at index -2.","tests":[{"expected":"7"}],"local_only":false},{"title":"Rotate","prompt":"`items` is `[1, 2, 3, 4, 5]`. Print the list with its first element moved to the end.","starter":"items = [1, 2, 3, 4, 5]\n","solution":"items = [1, 2, 3, 4, 5]\nprint(items[1:] + items[:1])","hint":"Join two slices with +.","tests":[{"expected":"[2, 3, 4, 5, 1]"}],"local_only":false},{"title":"Every other","prompt":"`letters` is `list(\"abcdefg\")`. Print every second letter starting with the first, as a list.","starter":"letters = list(\"abcdefg\")\n","solution":"letters = list(\"abcdefg\")\nprint(letters[::2])","hint":"Use a step of 2.","tests":[{"expected":"['a', 'c', 'e', 'g']"}],"local_only":false}],"quiz":[{"q":"What does [1, 2, 3, 4][1:3] give?","options":["[2, 3]","[2, 3, 4]","[1, 2, 3]"],"answer":0,"why":"From index 1 up to (not including) 3."},{"q":"What does [1, 2, 3][::-1] give?","options":["[3, 2, 1]","[2, 1]","[1, 2, 3]"],"answer":0,"why":"A step of -1 reads the list backwards."},{"q":"What does nums.sort() return?","options":["True","None","The sorted list"],"answer":1,"why":"It sorts in place and returns None."},{"q":"What does [1, 2, 3].pop() return?","options":["3","[1, 2]","1"],"answer":0,"why":"pop() removes and returns the last element."},{"q":"Which leaves the original list unchanged?","options":["sorted(nums)","nums.reverse()","nums.sort()"],"answer":0,"why":"sorted() builds a new list."}],"challenge":{"title":"Median","prompt":"Read whole numbers on one line, separated by spaces. Print the median: the middle number (sorted), or the average of the two middle numbers when there is an even count.","starter":"# Write your code below\n","solution":"nums = sorted(int(x) for x in input().split())\nn = len(nums)\nif n % 2 == 1:\n    print(nums[n // 2])\nelse:\n    print((nums[n // 2 - 1] + nums[n // 2]) / 2)","hint":"sorted(...), then check whether the length is odd.","tests":[{"expected":"3","stdin":"5 1 3\n"},{"expected":"2.5","stdin":"4 1 3 2\n"},{"expected":"7","stdin":"7\n"}],"local_only":false}},{"id":14,"track":"CORE","slug":"tuples","title":"Tuples","terms":[{"term":"tuple","def":"An ordered collection that cannot be changed, written with round brackets: (3, 4)."},{"term":"immutable","def":"Cannot be modified after creation."},{"term":"packing","def":"Putting several values into one tuple: t = 1, 2, 3."},{"term":"unpacking","def":"Spreading a tuple into variables: a, b = (1, 2)."},{"term":"swap","def":"Exchanging two variables in one line: a, b = b, a."}],"explain":"Use a tuple for a small fixed group of values that belong together, like a point `(x, y)` or a date. Because tuples cannot change, they are safe to share and can be used as dictionary keys.","example":{"code":"point = (3, 4)               # a tuple uses round brackets\nprint(point[0])              # 3\nx, y = point                 # unpacking: x=3, y=4\nprint(x + y)                 # 7\na, b = 1, 2\na, b = b, a                  # swap without a temporary variable\nprint(a, b)                  # 2 1\nsingle = (5,)                # a one-item tuple needs a trailing comma\nprint(len(single))           # 1\n"},"mistakes":["Forgetting the comma in a one-item tuple: `(5)` is just the number 5; write `(5,)`.","Trying to change a tuple: `point[0] = 9` raises TypeError.","Unpacking into the wrong number of names raises ValueError: `a, b = (1, 2, 3)`."],"exercises":[{"title":"Swap in one line","prompt":"`a` is 5 and `b` is 9. Swap them using tuple swapping and print `a` then `b`.","starter":"a = 5\nb = 9\n","solution":"a = 5\nb = 9\na, b = b, a\nprint(a)\nprint(b)","hint":"","tests":[{"expected":"9\n5"}],"local_only":false},{"title":"Unpack a person","prompt":"`person` is `(\"Ada\", 36, \"London\")`. Unpack it and print `Ada is 36 and lives in London`.","starter":"person = (\"Ada\", 36, \"London\")\n","solution":"person = (\"Ada\", 36, \"London\")\nname, age, city = person\nprint(f\"{name} is {age} and lives in {city}\")","hint":"","tests":[{"expected":"Ada is 36 and lives in London"}],"local_only":false},{"title":"Min and max pair","prompt":"`nums` is `(4, 9, 1, 7)`. Print a tuple containing the smallest and the largest number: `(1, 9)`.","starter":"nums = (4, 9, 1, 7)\n","solution":"nums = (4, 9, 1, 7)\nprint((min(nums), max(nums)))","hint":"","tests":[{"expected":"(1, 9)"}],"local_only":false}],"quiz":[{"q":"What is special about a tuple?","options":["It has no order","It must hold numbers","It cannot be changed"],"answer":2,"why":"Tuples are immutable."},{"q":"Which is a one-item tuple?","options":["(5,)","(5)","[5]"],"answer":0,"why":"The trailing comma makes it a tuple."},{"q":"After a, b = 1, 2 and a, b = b, a what is a?","options":["1","2","3"],"answer":1,"why":"The values were swapped."},{"q":"What does x, y = (3, 4) do?","options":["x is 3 and y is 4","Raises an error","Makes a list"],"answer":0,"why":"That is tuple unpacking."},{"q":"What happens with t = (1, 2); t[0] = 9?","options":["t becomes (9, 2)","Nothing","TypeError"],"answer":2,"why":"Tuples do not support item assignment."}],"challenge":{"title":"Manhattan distance","prompt":"Read two points, each on its own line as `x y`. Print the Manhattan distance |x1-x2| + |y1-y2|.","starter":"# Write your code below\n","solution":"x1, y1 = [int(v) for v in input().split()]\nx2, y2 = [int(v) for v in input().split()]\nprint(abs(x1 - x2) + abs(y1 - y2))","hint":"abs() gives the size of a number without its sign.","tests":[{"expected":"7","stdin":"0 0\n3 4\n"},{"expected":"0","stdin":"1 2\n1 2\n"},{"expected":"12","stdin":"-2 -3\n4 3\n"}],"local_only":false}},{"id":15,"track":"CORE","slug":"sets","title":"Sets","terms":[{"term":"set","def":"An unordered collection of unique values, written {1, 2, 3} or set(items)."},{"term":"unique","def":"Each value can appear only once in a set."},{"term":"union |","def":"All elements that are in either set."},{"term":"intersection &","def":"Elements that are in both sets."},{"term":"difference -","def":"Elements that are in the first set but not the second."},{"term":".add()","def":"Adds one element to a set."}],"explain":"Sets are perfect for removing duplicates and for asking \"what do these two groups have in common?\". They have no order and no indexes, so use `sorted()` when you need a predictable display.","example":{"code":"nums = [1, 2, 2, 3, 3, 3]\nunique = set(nums)           # a set keeps each value once\nprint(sorted(unique))        # [1, 2, 3] (sets have no order, sorted makes a list)\na = {1, 2, 3}\nb = {3, 4}\nprint(sorted(a | b))         # union: [1, 2, 3, 4]\nprint(sorted(a & b))         # intersection: [3]\nprint(sorted(a - b))         # difference: [1, 2]\na.add(10)\nprint(10 in a)               # True (checking a set is very fast)\n"},"mistakes":["`{}` is an empty dictionary, not an empty set. Write `set()` for an empty set.","Indexing a set (`s[0]`) raises TypeError: sets have no positions.","Relying on the printed order of a set: it can differ between runs and values."],"exercises":[{"title":"How many different words","prompt":"Read a line of words and print how many different words it contains.","starter":"# Write your code below\n","solution":"print(len(set(input().split())))","hint":"","tests":[{"expected":"3","stdin":"a b a c b\n"},{"expected":"1","stdin":"x x x\n"}],"local_only":false},{"title":"In common","prompt":"`a` is `[1, 2, 3, 4]` and `b` is `[3, 4, 5]`. Print the sorted list of numbers that are in both.","starter":"a = [1, 2, 3, 4]\nb = [3, 4, 5]\n","solution":"a = [1, 2, 3, 4]\nb = [3, 4, 5]\nprint(sorted(set(a) & set(b)))","hint":"","tests":[{"expected":"[3, 4]"}],"local_only":false},{"title":"Only in the first","prompt":"Using the same `a` and `b`, print the sorted list of numbers that are in `a` but not in `b`.","starter":"a = [1, 2, 3, 4]\nb = [3, 4, 5]\n","solution":"a = [1, 2, 3, 4]\nb = [3, 4, 5]\nprint(sorted(set(a) - set(b)))","hint":"","tests":[{"expected":"[1, 2]"}],"local_only":false}],"quiz":[{"q":"What does set([1, 1, 2]) contain?","options":["Only 2","1 and 2 once each","1, 1, 2"],"answer":1,"why":"Sets drop duplicates."},{"q":"What is {1, 2} & {2, 3}?","options":["{1, 2, 3}","{2}","{1, 3}"],"answer":1,"why":"& is the intersection."},{"q":"What is {1, 2, 3} - {2}?","options":["{1, 2, 3}","{2}","{1, 3}"],"answer":2,"why":"Difference removes the shared elements."},{"q":"How do you make an empty set?","options":["[]","set()","{}"],"answer":1,"why":"{} would be an empty dict."},{"q":"Can you read s[0] on a set?","options":["Yes, the smallest","No, sets have no order","Yes, the first element"],"answer":1,"why":"Sets do not support indexing."}],"challenge":{"title":"Pangram","prompt":"Read a sentence and print `True` if it contains every letter a-z (ignoring case, spaces and punctuation), otherwise `False`.","starter":"# Write your code below\n","solution":"text = input().lower()\nprint(set(\"abcdefghijklmnopqrstuvwxyz\") <= set(text))","hint":"A <= B asks whether every element of A is in B.","tests":[{"expected":"True","stdin":"The quick brown fox jumps over the lazy dog\n"},{"expected":"False","stdin":"Hello world\n"}],"local_only":false}},{"id":16,"track":"CORE","slug":"dictionaries","title":"Dictionaries","terms":[{"term":"dictionary (dict)","def":"A collection of key: value pairs written with curly brackets."},{"term":"key","def":"The label used to look a value up. Keys must be unique and unchangeable (strings, numbers, tuples)."},{"term":"value","def":"The data stored under a key. It can be anything."},{"term":".get()","def":"Looks up a key and returns a default (None) instead of an error when it is missing."},{"term":".items()","def":"Gives (key, value) pairs so you can loop over both."},{"term":"del","def":"Removes a key and its value."}],"explain":"Dictionaries answer questions of the form \"what is the value for this name?\" instantly. Looking up a key that does not exist raises KeyError, so use `in` or `.get()` when you are unsure.","example":{"code":"ages = {\"Ana\": 31, \"Bo\": 25}     # key: value pairs in curly brackets\nprint(ages[\"Ana\"])                # 31\nages[\"Cy\"] = 40                   # add a new pair\nages[\"Bo\"] = 26                   # change a value\nprint(ages.get(\"Zed\", 0))         # 0: get() returns a default instead of an error\nprint(\"Ana\" in ages)              # True: checks the keys\nfor name, age in ages.items():    # loop over key and value together\n    print(name, age)\ndel ages[\"Cy\"]                    # remove a pair\nprint(len(ages))                  # 2\n"},"mistakes":["KeyError: `ages[\"Zed\"]` fails when the key is missing. Use `ages.get(\"Zed\")` or check `\"Zed\" in ages`.","Using a list as a key raises TypeError: keys must be unchangeable.","Expecting `in` to check values: `x in d` checks the keys."],"exercises":[{"title":"Phone book","prompt":"`phones` is `{\"Ann\": \"555-1\", \"Ben\": \"555-2\"}`. Read a name and print the number, or `unknown` when the name is not in the book.","starter":"phones = {\"Ann\": \"555-1\", \"Ben\": \"555-2\"}\n","solution":"phones = {\"Ann\": \"555-1\", \"Ben\": \"555-2\"}\nname = input()\nprint(phones.get(name, \"unknown\"))","hint":"","tests":[{"expected":"555-1","stdin":"Ann\n"},{"expected":"unknown","stdin":"Zed\n"}],"local_only":false},{"title":"Word count","prompt":"Read a line of words. For each different word (in order of first appearance) print `word: count`.","starter":"# Write your code below\n","solution":"counts = {}\nfor w in input().split():\n    counts[w] = counts.get(w, 0) + 1\nfor w, c in counts.items():\n    print(f\"{w}: {c}\")","hint":"counts[w] = counts.get(w, 0) + 1","tests":[{"expected":"a: 2\nb: 1","stdin":"a b a\n"},{"expected":"x: 3","stdin":"x x x\n"}],"local_only":false},{"title":"Flip it","prompt":"`colors` is `{\"red\": 1, \"blue\": 2}`. Build and print a new dictionary with the keys and values swapped: `{1: 'red', 2: 'blue'}`.","starter":"colors = {\"red\": 1, \"blue\": 2}\n","solution":"colors = {\"red\": 1, \"blue\": 2}\nflipped = {}\nfor k, v in colors.items():\n    flipped[v] = k\nprint(flipped)","hint":"","tests":[{"expected":"{1: 'red', 2: 'blue'}"}],"local_only":false}],"quiz":[{"q":"How do you read the value for key \"a\" in d?","options":["d.a","d(a)","d[\"a\"]"],"answer":2,"why":"Use square brackets with the key."},{"q":"What does d.get(\"zzz\", 0) return when the key is missing?","options":["0","None","KeyError"],"answer":0,"why":"The second argument is the default."},{"q":"What does `\"x\" in d` check?","options":["Whether x is a key","The length","Whether x is a value"],"answer":0,"why":"Membership tests the keys."},{"q":"Which can be a dict key?","options":["A list","A string","A dict"],"answer":1,"why":"Keys must be unchangeable (hashable)."},{"q":"What does d.items() give?","options":["Only values","Only keys","(key, value) pairs"],"answer":2,"why":"That is what lets you loop over both."}],"challenge":{"title":"Letter frequency","prompt":"Read a word. Print each distinct letter in alphabetical order with its count, like `a 3`.","starter":"# Write your code below\n","solution":"word = input()\ncounts = {}\nfor ch in word:\n    counts[ch] = counts.get(ch, 0) + 1\nfor ch in sorted(counts):\n    print(ch, counts[ch])","hint":"Loop over sorted(counts) to get alphabetical order.","tests":[{"expected":"a 3\nb 1\nn 2","stdin":"banana\n"},{"expected":"o 2","stdin":"oo\n"}],"local_only":false}},{"id":17,"track":"CORE","slug":"nested-data","title":"Nested data","terms":[{"term":"nested","def":"Placed inside another structure, e.g. a list inside a dictionary."},{"term":"list of dicts","def":"The usual shape of table-like data: one dictionary per row."},{"term":"2D list (matrix)","def":"A list of lists; grid[row][column] reads one cell."},{"term":"chained indexing","def":"Several [] in a row: students[0][\"grades\"][1]."},{"term":"reference","def":"Variables point to values. Two names can point to the same list, so changing one changes both."},{"term":".copy()","def":"Makes a separate (shallow) copy of a list or dict."}],"explain":"Real data is rarely flat. A list of dictionaries is how you represent rows of a table; a list of lists is a grid. Read nested data from the outside in, one index or key at a time.","example":{"code":"students = [\n    {\"name\": \"Ana\", \"grades\": [90, 80]},\n    {\"name\": \"Bo\", \"grades\": [70, 100]},\n]\nprint(students[0][\"name\"])        # Ana\nprint(students[1][\"grades\"][1])   # 100\nstudents[0][\"grades\"].append(85)\nfor s in students:\n    avg = sum(s[\"grades\"]) / len(s[\"grades\"])\n    print(s[\"name\"], avg)         # Ana 85.0, Bo 85.0\ngrid = [[1, 2, 3], [4, 5, 6]]     # a list of lists (rows)\nprint(grid[1][2])                 # 6\n"},"mistakes":["Mixing up the order: `grid[column][row]`. It is `grid[row][column]`.","`b = a` does not copy a list: both names point to the same list. Use `a.copy()`.","`[[0] * 3] * 3` repeats the same inner list three times; changing one row changes all rows."],"exercises":[{"title":"Middle and diagonal","prompt":"`grid` is a 3x3 list of lists with 1..9. Print the middle element and then the sum of the main diagonal (two lines).","starter":"grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\n","solution":"grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\nprint(grid[1][1])\ntotal = 0\nfor i in range(3):\n    total += grid[i][i]\nprint(total)","hint":"","tests":[{"expected":"5\n15"}],"local_only":false},{"title":"Best student","prompt":"`students` is a list of dicts with `name` and `score`. Print the name of the student with the highest score.","starter":"students = [{\"name\": \"Ana\", \"score\": 71}, {\"name\": \"Bo\", \"score\": 88}, {\"name\": \"Cy\", \"score\": 79}]\n","solution":"students = [{\"name\": \"Ana\", \"score\": 71}, {\"name\": \"Bo\", \"score\": 88}, {\"name\": \"Cy\", \"score\": 79}]\nbest = students[0]\nfor s in students:\n    if s[\"score\"] > best[\"score\"]:\n        best = s\nprint(best[\"name\"])","hint":"","tests":[{"expected":"Bo"}],"local_only":false},{"title":"Flatten","prompt":"`rows` is `[[1, 2], [3], [4, 5, 6]]`. Print one flat list with all the numbers: `[1, 2, 3, 4, 5, 6]`.","starter":"rows = [[1, 2], [3], [4, 5, 6]]\n","solution":"rows = [[1, 2], [3], [4, 5, 6]]\nflat = []\nfor row in rows:\n    for n in row:\n        flat.append(n)\nprint(flat)","hint":"","tests":[{"expected":"[1, 2, 3, 4, 5, 6]"}],"local_only":false}],"quiz":[{"q":"How do you read the 2nd grade of the first student?","options":["students.grades[1]","students[0][\"grades\"][1]","students[1][\"grades\"][0]"],"answer":1,"why":"Go outside-in: list index, key, list index."},{"q":"What is grid[1][0] for [[1, 2], [3, 4]]?","options":["3","1","2"],"answer":0,"why":"Row 1, column 0."},{"q":"After b = a (a is a list), what does b.append(1) do?","options":["Raises an error","Also changes a","Leaves a unchanged"],"answer":1,"why":"Both names point to the same list."},{"q":"Which makes a separate copy of a list?","options":["a.copy()","b = a","b == a"],"answer":0,"why":"copy() builds a new list."},{"q":"A list of dicts is mostly used for...","options":["Sorting only","Table-like rows of data","Storing one number"],"answer":1,"why":"Each dict is one row."}],"challenge":{"title":"Group by length","prompt":"`words` is `[\"cat\", \"dog\", \"bird\", \"fish\", \"ant\"]`. Print a dict mapping each word length to the list of words with that length (keys in order of first appearance).","starter":"words = [\"cat\", \"dog\", \"bird\", \"fish\", \"ant\"]\n","solution":"words = [\"cat\", \"dog\", \"bird\", \"fish\", \"ant\"]\ngroups = {}\nfor w in words:\n    if len(w) not in groups:\n        groups[len(w)] = []\n    groups[len(w)].append(w)\nprint(groups)","hint":"Create an empty list the first time you see a length.","tests":[{"expected":"{3: ['cat', 'dog', 'ant'], 4: ['bird', 'fish']}"}],"local_only":false}},{"id":18,"track":"CORE","slug":"functions","title":"Functions","terms":[{"term":"function","def":"A named, reusable block of code."},{"term":"def","def":"The keyword that defines a function: def name(parameters):"},{"term":"parameter","def":"A name inside the parentheses of the definition that receives a value."},{"term":"argument","def":"The actual value you pass in when you call the function."},{"term":"return","def":"Sends a value back to whoever called the function and ends it."},{"term":"docstring","def":"A string on the first line of a function that explains what it does."}],"explain":"Functions let you write code once and use it many times. Defining a function does not run it: it only stores it. Calling it with `name(...)` runs the body. Use `return` to give a result back; `print` only shows something on the screen.","example":{"code":"def greet(name):                        # def defines a function; name is a parameter\n    \"\"\"Return a friendly greeting.\"\"\"   # docstring: what the function does\n    return \"Hello, \" + name + \"!\"       # return sends a value back to the caller\nmessage = greet(\"Ada\")                  # call it: \"Ada\" is the argument\nprint(message)                          # Hello, Ada!\ndef square(n):\n    return n * n\nprint(square(4) + square(3))            # 25\n"},"mistakes":["Defining but never calling: nothing happens until you write `greet(\"Ada\")`.","Using `print` instead of `return`: the caller then receives `None` and cannot use the result.","Forgetting the colon or the indentation after `def`."],"exercises":[{"title":"add","prompt":"Write `add(a, b)` that returns the sum of its two arguments.","starter":"def add(a, b):\n    pass\n","solution":"def add(a, b):\n    return a + b","hint":"return a + b","tests":[{"expected":"5\n0","append":"print(add(2, 3))\nprint(add(-1, 1))"}],"local_only":false},{"title":"is_even","prompt":"Write `is_even(n)` that returns True when n is even and False otherwise.","starter":"def is_even(n):\n    pass\n","solution":"def is_even(n):\n    return n % 2 == 0","hint":"","tests":[{"expected":"True\nFalse\nTrue","append":"print(is_even(4))\nprint(is_even(7))\nprint(is_even(0))"}],"local_only":false},{"title":"longest","prompt":"Write `longest(a, b)` that returns the longer of two strings (the first one if they have the same length).","starter":"def longest(a, b):\n    pass\n","solution":"def longest(a, b):\n    if len(b) > len(a):\n        return b\n    return a","hint":"","tests":[{"expected":"hello\nab\nxy","append":"print(longest('hi', 'hello'))\nprint(longest('ab', 'c'))\nprint(longest('xy', 'zz'))"}],"local_only":false}],"quiz":[{"q":"What does def do?","options":["Deletes a variable","Defines a function","Runs a function"],"answer":1,"why":"def stores the function for later calls."},{"q":"What is the difference between a parameter and an argument?","options":["Argument is in the definition","They are identical","Parameter is in the definition, argument is in the call"],"answer":2,"why":"Parameters are names; arguments are the values."},{"q":"What does a function without return give back?","options":["None","0","An empty string"],"answer":0,"why":"Python returns None by default."},{"q":"What does return do?","options":["Sends a value back and ends the function","Prints the value","Repeats the function"],"answer":0,"why":"Code after return in the same branch does not run."},{"q":"When does the body of a function run?","options":["When you call it","When you define it","Never"],"answer":0,"why":"Defining only stores it."}],"challenge":{"title":"fizzbuzz","prompt":"Write `fizzbuzz(n)` that returns `\"FizzBuzz\"` if n is divisible by 15, `\"Fizz\"` for 3, `\"Buzz\"` for 5 and otherwise the number as a string.","starter":"def fizzbuzz(n):\n    pass\n","solution":"def fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)","hint":"Test 15 first. Return a string with str(n).","tests":[{"expected":"FizzBuzz\nFizz\nBuzz\n8","append":"print(fizzbuzz(15))\nprint(fizzbuzz(3))\nprint(fizzbuzz(5))\nprint(fizzbuzz(8))"}],"local_only":false}},{"id":19,"track":"CORE","slug":"arguments","title":"Arguments: defaults, *args and **kwargs","terms":[{"term":"positional argument","def":"Matched to parameters by order: f(1, 2)."},{"term":"keyword argument","def":"Matched by name: f(b=2, a=1). Order does not matter."},{"term":"default value","def":"A fallback used when the caller does not pass that argument: def f(x, y=10)."},{"term":"*args","def":"Collects any extra positional arguments into a tuple."},{"term":"**kwargs","def":"Collects any extra keyword arguments into a dict."},{"term":"unpacking a call","def":"f(*items) spreads a list into arguments; f(**options) spreads a dict."}],"explain":"Defaults make arguments optional, keywords make calls readable, and `*args` / `**kwargs` let a function accept any number of arguments. Parameters with defaults must come after those without.","example":{"code":"def power(base, exp=2):              # exp has a default value\n    return base ** exp\nprint(power(5))                      # 25\nprint(power(2, 10))                  # 1024\nprint(power(exp=3, base=2))          # 8: keyword arguments, any order\ndef total(*numbers):                 # *args collects extra positional arguments in a tuple\n    return sum(numbers)\nprint(total(1, 2, 3, 4))             # 10\ndef show(**info):                    # **kwargs collects keyword arguments in a dict\n    for key, value in info.items():\n        print(key, value)\nshow(name=\"Ada\", age=36)\n"},"mistakes":["Mutable defaults: `def f(items=[])` shares ONE list between all calls. Use `items=None` and create the list inside.","A parameter with a default before one without: `def f(a=1, b)` is a SyntaxError.","Passing the same argument twice (by position and by keyword) raises TypeError."],"exercises":[{"title":"greet with default","prompt":"Write `greet(name, greeting=\"Hello\")` returning `Hello, Ann!`-style text.","starter":"def greet(name, greeting=\"Hello\"):\n    pass\n","solution":"def greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}!\"","hint":"","tests":[{"expected":"Hello, Ann!\nHi, Bo!","append":"print(greet('Ann'))\nprint(greet('Bo', 'Hi'))"}],"local_only":false},{"title":"average of anything","prompt":"Write `average(*nums)` returning the average of any number of arguments as a float.","starter":"def average(*nums):\n    pass\n","solution":"def average(*nums):\n    return sum(nums) / len(nums)","hint":"","tests":[{"expected":"4.0\n10.0","append":"print(average(2, 4, 6))\nprint(average(10))"}],"local_only":false},{"title":"build_url","prompt":"Write `build_url(host, **params)`. With no params return just the host; otherwise return `host?key=value&key2=value2` in the order given.","starter":"def build_url(host, **params):\n    pass\n","solution":"def build_url(host, **params):\n    if not params:\n        return host\n    parts = []\n    for key, value in params.items():\n        parts.append(f\"{key}={value}\")\n    return host + \"?\" + \"&\".join(parts)","hint":"","tests":[{"expected":"site.com?q=py&page=2\na.org","append":"print(build_url('site.com', q='py', page=2))\nprint(build_url('a.org'))"}],"local_only":false}],"quiz":[{"q":"What does def f(x, y=3) allow?","options":["Only f(1)","Only f(1, 5)","f(1) and f(1, 5)"],"answer":2,"why":"y is optional."},{"q":"What type is *args inside the function?","options":["list","tuple","dict"],"answer":1,"why":"Extra positional arguments are packed into a tuple."},{"q":"What type is **kwargs inside the function?","options":["tuple","set","dict"],"answer":2,"why":"Keyword arguments are packed into a dict."},{"q":"Which call is valid for def f(a, b)?","options":["f(a=1, 2)","f(b=2, a=1)","f(1, 2, 3)"],"answer":1,"why":"Keyword arguments may come in any order, but not before positional ones."},{"q":"Why avoid def f(items=[])?","options":["The same list is shared between calls","It is a SyntaxError","It is slow"],"answer":0,"why":"The default is created once, when the function is defined."}],"challenge":{"title":"describe","prompt":"Write `describe(name, *hobbies, age=None)`. Return `Ana (30) likes: chess, golf`. Omit ` (age)` when age is None, and use `nothing` when there are no hobbies.","starter":"def describe(name, *hobbies, age=None):\n    pass\n","solution":"def describe(name, *hobbies, age=None):\n    text = name\n    if age is no
