def __init__(self):\n        self.is_on = False\n\n    def toggle(self):\n        self.is_on = not self.is_on","hint":"","tests":[{"expected":"False\nTrue\nTrue","append":"x = Light()\nprint(x.is_on)\nx.toggle()\nprint(x.is_on)\nx.toggle()\nx.toggle()\nprint(x.is_on)"}],"local_only":false}],"quiz":[{"q":"What is the first parameter of an instance method?","options":["this","cls","self"],"answer":2,"why":"Python passes the object there."},{"q":"What does a method usually change?","options":["The module","The class name","The object's attributes"],"answer":2,"why":"That is the object's state."},{"q":"What does a leading underscore (_x) mean?","options":["Private by force","Internal, do not use from outside","A constant"],"answer":1,"why":"It is a convention, not enforced."},{"q":"How do you call a method?","options":["obj->method","method(obj)","obj.method()"],"answer":2,"why":"With a dot on the object."},{"q":"What does getattr(c, \"count\") do?","options":["Deletes it","Reads the attribute named \"count\"","Creates it"],"answer":1,"why":"Handy when the name is in a variable."}],"challenge":{"title":"Playlist","prompt":"Write `Playlist` with `add(song)`, `remove(song)`, `count()` (number of songs) and `summary()` returning text like `3 songs: a, b, c` (use `1 song: a` for one song and `0 songs` for none).","starter":"class Playlist:\n    pass\n","solution":"class Playlist:\n    def __init__(self):\n        self.songs = []\n\n    def add(self, song):\n        self.songs.append(song)\n\n    def remove(self, song):\n        self.songs.remove(song)\n\n    def count(self):\n        return len(self.songs)\n\n    def summary(self):\n        n = len(self.songs)\n        if n == 0:\n            return \"0 songs\"\n        word = \"song\" if n == 1 else \"songs\"\n        return f\"{n} {word}: \" + \", \".join(self.songs)","hint":"","tests":[{"expected":"0 songs\n1 song: a\n3 songs: a, b, c\n2","append":"p = Playlist()\nprint(p.summary())\np.add('a')\nprint(p.summary())\np.add('b')\np.add('c')\nprint(p.summary())\np.remove('b')\nprint(p.count())"}],"local_only":false}},{"id":38,"track":"OOP","slug":"inheritance","title":"Inheritance","terms":[{"term":"inheritance","def":"A new class reusing everything from an existing class."},{"term":"parent (base) class","def":"The class being inherited from."},{"term":"child (subclass)","def":"The class that inherits: class Dog(Animal)."},{"term":"override","def":"Define a method in the child with the same name to replace the parent's version."},{"term":"is-a","def":"Inheritance should model \"a Dog is an Animal\"."},{"term":"issubclass / isinstance","def":"Check class relationships and whether an object belongs to a class (or its children)."}],"explain":"Inheritance avoids copy-pasting: put shared behaviour in a parent class and let children add or change what is different. A child automatically has every attribute and method of the parent.","example":{"code":"class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return f\"{self.name} makes a sound\"\nclass Dog(Animal):                   # Dog inherits everything from Animal\n    def speak(self):                 # override: replace the parent's method\n        return f\"{self.name} says Woof\"\nprint(Animal(\"Generic\").speak())     # Generic makes a sound\nprint(Dog(\"Rex\").speak())            # Rex says Woof\nprint(isinstance(Dog(\"Rex\"), Animal))   # True: a Dog is an Animal\n"},"mistakes":["Using inheritance for \"has-a\" relationships: a Car has an Engine, it is not an Engine (see chapter 44).","Forgetting the parent in the class line: `class Dog:` does not inherit anything.","Deep chains of inheritance get hard to follow: prefer shallow hierarchies."],"exercises":[{"title":"Square","prompt":"The class `Shape` has a class attribute `name` and a method `describe()`. Write `Square(Shape)` that only changes `name` to \"square\".","starter":"class Shape:\n    name = \"shape\"\n\n    def describe(self):\n        return f\"I am a {self.name}\"\n\n","solution":"class Shape:\n    name = \"shape\"\n\n    def describe(self):\n        return f\"I am a {self.name}\"\n\nclass Square(Shape):\n    name = \"square\"","hint":"","tests":[{"expected":"I am a square\nI am a shape","append":"print(Square().describe())\nprint(Shape().describe())"}],"local_only":false},{"title":"Penguin","prompt":"`Bird.fly()` returns \"flap\". Write `Penguin(Bird)` that overrides `fly()` to return \"cannot fly\".","starter":"class Bird:\n    def fly(self):\n        return \"flap\"\n\n","solution":"class Bird:\n    def fly(self):\n        return \"flap\"\n\nclass Penguin(Bird):\n    def fly(self):\n        return \"cannot fly\"","hint":"","tests":[{"expected":"flap\ncannot fly","append":"print(Bird().fly())\nprint(Penguin().fly())"}],"local_only":false},{"title":"kind","prompt":"`Animal` and `Dog(Animal)` exist. Write `kind(obj)` returning \"dog\" for a Dog, \"animal\" for any other Animal and \"unknown\" otherwise.","starter":"class Animal:\n    pass\n\nclass Dog(Animal):\n    pass\n\ndef kind(obj):\n    pass\n","solution":"class Animal:\n    pass\n\nclass Dog(Animal):\n    pass\n\ndef kind(obj):\n    if isinstance(obj, Dog):\n        return \"dog\"\n    if isinstance(obj, Animal):\n        return \"animal\"\n    return \"unknown\"","hint":"Check the most specific class first.","tests":[{"expected":"dog\nanimal\nunknown","append":"print(kind(Dog()))\nprint(kind(Animal()))\nprint(kind(5))"}],"local_only":false}],"quiz":[{"q":"What does class Dog(Animal) mean?","options":["Dog inherits from Animal","Dog contains an Animal","Animal inherits from Dog"],"answer":0,"why":"The parent goes in the brackets."},{"q":"What is overriding?","options":["Calling a method twice","Deleting a method","Redefining a parent's method in the child"],"answer":2,"why":"The child's version wins."},{"q":"If Dog(Animal), what is isinstance(Dog(), Animal)?","options":["False","True","Error"],"answer":1,"why":"A Dog is an Animal."},{"q":"Which relationship should inheritance model?","options":["is-a","has-a","uses-a"],"answer":0,"why":"A Dog is an Animal."},{"q":"Does a child need to repeat the parent's methods?","options":["No, it inherits them","Yes","Only __init__"],"answer":0,"why":"That is the point of inheritance."}],"challenge":{"title":"Manager bonus","prompt":"`Employee` has `bonus()` returning 0. Write `Manager(Employee)` whose `bonus()` returns 10% of the salary.","starter":"class Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n\n    def bonus(self):\n        return 0\n\n","solution":"class Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n\n    def bonus(self):\n        return 0\n\nclass Manager(Employee):\n    def bonus(self):\n        return self.salary * 0.1","hint":"Manager inherits __init__, so you only override bonus.","tests":[{"expected":"0\n200.0","append":"print(Employee('A', 1000).bonus())\nprint(Manager('B', 2000).bonus())"}],"local_only":false}},{"id":39,"track":"OOP","slug":"polymorphism-super","title":"Polymorphism and super()","terms":[{"term":"polymorphism","def":"Different classes responding to the same method name in their own way."},{"term":"super()","def":"Gives access to the parent class so a child can extend, not replace, its behaviour."},{"term":"duck typing","def":"\"If it quacks like a duck\": Python cares what an object can do, not what class it is."},{"term":"method resolution order (MRO)","def":"The order in which Python searches a class and its parents for a method."}],"explain":"Polymorphism lets one piece of code work with many kinds of objects: you call `speak()` and each object does the right thing. Use `super().__init__(...)` when a child needs extra setup on top of the parent's.","example":{"code":"class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return \"...\"\nclass Dog(Animal):\n    def __init__(self, name, tricks):\n        super().__init__(name)           # let the parent set up name\n        self.tricks = tricks\n    def speak(self):\n        return \"Woof\"\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"\nfor pet in [Dog(\"Rex\", 2), Cat(\"Tom\"), Animal(\"Blob\")]:\n    print(pet.name, pet.speak())         # same call, different behaviour\n"},"mistakes":["Forgetting `super().__init__(...)` in a child that defines its own `__init__`: the parent's attributes never get set.","Writing `super.__init__()` without the parentheses after super.","Checking types with `type(x) == Dog` everywhere instead of just calling the method."],"exercises":[{"title":"Square from Rectangle","prompt":"`Rectangle(width, height)` has `area()`. Write `Square(Rectangle)` with `__init__(self, side)` that uses `super().__init__`.","starter":"class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    def area(self):\n        return self.width * self.height\n\n","solution":"class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    def area(self):\n        return self.width * self.height\n\nclass Square(Rectangle):\n    def __init__(self, side):\n        super().__init__(side, side)","hint":"","tests":[{"expected":"16\n6","append":"print(Square(4).area())\nprint(Rectangle(2, 3).area())"}],"local_only":false},{"title":"total_area","prompt":"`Rect` and `Tri` both have an `area()` method. Write `total_area(shapes)` returning the sum of the areas of any list of such shapes.","starter":"class Rect:\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n\nclass Tri:\n    def __init__(self, b, h):\n        self.b, self.h = b, h\n    def area(self):\n        return 0.5 * self.b * self.h\n\ndef total_area(shapes):\n    pass\n","solution":"class Rect:\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n\nclass Tri:\n    def __init__(self, b, h):\n        self.b, self.h = b, h\n    def area(self):\n        return 0.5 * self.b * self.h\n\ndef total_area(shapes):\n    total = 0\n    for s in shapes:\n        total += s.area()\n    return total","hint":"","tests":[{"expected":"16.0\n0","append":"print(total_area([Rect(2, 3), Tri(4, 5)]))\nprint(total_area([]))"}],"local_only":false},{"title":"make_noise","prompt":"Write `make_noise(thing)` that returns `thing.speak()`. It must work for any object that has a `speak()` method, whatever its class.","starter":"def make_noise(thing):\n    pass\n","solution":"def make_noise(thing):\n    return thing.speak()","hint":"","tests":[{"expected":"beep\nmoo","append":"class Robot:\n    def speak(self):\n        return 'beep'\nclass Cow:\n    def speak(self):\n        return 'moo'\nprint(make_noise(Robot()))\nprint(make_noise(Cow()))"}],"local_only":false}],"quiz":[{"q":"What is polymorphism?","options":["Many variables","Many files","Same method name, different behaviour per class"],"answer":2,"why":"You call speak() on anything."},{"q":"What does super().__init__(name) do?","options":["Deletes the parent","Creates a new class","Runs the parent's __init__"],"answer":2,"why":"It reuses the parent setup."},{"q":"What is duck typing?","options":["Using an object if it has the needed methods","Checking types strictly","A kind of loop"],"answer":0,"why":"Class membership does not matter."},{"q":"What does the MRO decide?","options":["Which class's method is found first","File order","Variable names"],"answer":0,"why":"Python searches the class, then its parents."},{"q":"A child defines __init__ and forgets super(). What happens?","options":["Parent attributes are not set","Python calls the parent automatically","SyntaxError"],"answer":0,"why":"Only the child's __init__ runs."}],"challenge":{"title":"PrefixLogger","prompt":"`Logger.log(msg)` returns `msg`. Write `PrefixLogger(Logger)` with `__init__(self, prefix)` whose `log(msg)` returns `[PREFIX] msg` by calling `super().log(msg)`.","starter":"class Logger:\n    def log(self, msg):\n        return msg\n\n","solution":"class Logger:\n    def log(self, msg):\n        return msg\n\nclass PrefixLogger(Logger):\n    def __init__(self, prefix):\n        self.prefix = prefix\n\n    def log(self, msg):\n        return f\"[{self.prefix}] {super().log(msg)}\"","hint":"","tests":[{"expected":"x\n[INFO] x","append":"print(Logger().log('x'))\nprint(PrefixLogger('INFO').log('x'))"}],"local_only":false}},{"id":40,"track":"OOP","slug":"dunder-methods","title":"Dunder (magic) methods","terms":[{"term":"dunder method","def":"A method with double underscores on both sides, like __str__. Python calls it for you in special situations."},{"term":"__str__","def":"Controls what print(obj) and str(obj) show. Meant for humans."},{"term":"__repr__","def":"Controls the developer-friendly text shown for debugging and inside lists."},{"term":"__eq__ / __lt__","def":"Define what == and < mean for your objects."},{"term":"__add__","def":"Defines what + means for your objects."},{"term":"__len__ / __getitem__","def":"Make len(obj) and obj[i] work."},{"term":"operator overloading","def":"Giving built-in operators a meaning for your own classes."}],"explain":"Dunder methods let your objects behave like built-in types. You never call them directly: `print(v)` calls `v.__str__()`, `a + b` calls `a.__add__(b)`, `len(x)` calls `x.__len__()`.","example":{"code":"class Vector:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n    def __repr__(self):                  # how the object looks when debugging\n        return f\"Vector({self.x}, {self.y})\"\n    def __str__(self):                   # what print() shows\n        return f\"({self.x}, {self.y})\"\n    def __add__(self, other):            # v1 + v2\n        return Vector(self.x + other.x, self.y + other.y)\n    def __eq__(self, other):             # v1 == v2\n        return self.x == other.x and self.y == other.y\n    def __len__(self):                   # len(v)\n        return 2\nv = Vector(1, 2) + Vector(3, 4)\nprint(v)                                 # (4, 6)\nprint(repr(v))                           # Vector(4, 6)\nprint(v == Vector(4, 6), len(v))         # True 2\n"},"mistakes":["Returning a non-string from `__str__` raises TypeError.","Defining `__eq__` without thinking about `other`: comparing to a number may raise AttributeError. Check `isinstance(other, Vector)`.","Forgetting `return` in `__add__`: the result of `a + b` is then None."],"exercises":[{"title":"Money","prompt":"Write `Money(amount)` where `print(Money(5))` shows `$5.00` and `print(Money(2.5))` shows `$2.50`.","starter":"class Money:\n    def __init__(self, amount):\n        self.amount = amount\n","solution":"class Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __str__(self):\n        return f\"${self.amount:.2f}\"","hint":"","tests":[{"expected":"$5.00\n$2.50","append":"print(Money(5))\nprint(Money(2.5))"}],"local_only":false},{"title":"Point arithmetic","prompt":"Give `Point` an `__add__` that adds coordinates and an `__eq__` that compares them.","starter":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n","solution":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y","hint":"","tests":[{"expected":"4 6\nTrue\nFalse","append":"p = Point(1, 2) + Point(3, 4)\nprint(p.x, p.y)\nprint(Point(1, 1) == Point(1, 1))\nprint(Point(1, 1) == Point(2, 1))"}],"local_only":false},{"title":"Deck","prompt":"Give `Deck` `__len__` and `__getitem__` so `len(d)`, `d[1]` and `list(d)` all work.","starter":"class Deck:\n    def __init__(self, cards):\n        self.cards = cards\n","solution":"class Deck:\n    def __init__(self, cards):\n        self.cards = cards\n\n    def __len__(self):\n        return len(self.cards)\n\n    def __getitem__(self, index):\n        return self.cards[index]","hint":"","tests":[{"expected":"3\nb\n['a', 'b', 'c']","append":"d = Deck(['a', 'b', 'c'])\nprint(len(d))\nprint(d[1])\nprint(list(d))"}],"local_only":false}],"quiz":[{"q":"What does print(obj) call?","options":["obj.__str__()","obj.show()","obj.__print__()"],"answer":0,"why":"__str__ gives the text."},{"q":"What does a + b call?","options":["a.plus(b)","a.__add__(b)","add(a, b)"],"answer":1,"why":"Operators map to dunder methods."},{"q":"Which method makes len(obj) work?","options":["__len__","__length__","__size__"],"answer":0,"why":"len() calls __len__."},{"q":"What should __str__ return?","options":["A number","A string","Nothing"],"answer":1,"why":"Otherwise TypeError."},{"q":"What is __repr__ for?","options":["A clear representation for developers","Reading a file","Repeating the object"],"answer":0,"why":"It appears in lists and the REPL."}],"challenge":{"title":"Version","prompt":"Write `Version(text)` for strings like `\"1.2.10\"`. Support `<` (compare number by number, so 1.2.10 < 1.10.0), `==`, and `str()` returning the original text.","starter":"class Version:\n    def __init__(self, text):\n        self.text = text\n","solution":"class Version:\n    def __init__(self, text):\n        self.text = text\n        self.parts = tuple(int(p) for p in text.split(\".\"))\n\n    def __lt__(self, other):\n        return self.parts < other.parts\n\n    def __eq__(self, other):\n        return self.parts == other.parts\n\n    def __str__(self):\n        return self.text","hint":"Compare tuples of ints, not strings.","tests":[{"expected":"True\nTrue\n['1.2', '1.9', '1.10']","append":"print(Version('1.2.10') < Version('1.10.0'))\nprint(Version('2.0') == Version('2.0'))\nprint([str(v) for v in sorted([Version('1.10'), Version('1.2'), Version('1.9')])])"}],"local_only":false}},{"id":41,"track":"OOP","slug":"property-classmethod-staticmethod","title":"property, classmethod and staticmethod","terms":[{"term":"@property","def":"Makes a method readable like an attribute: obj.area instead of obj.area()."},{"term":"setter","def":"A method decorated with @name.setter that runs when you assign obj.name = value, so you can validate."},{"term":"@classmethod","def":"A method that receives the class (cls) instead of an object. Often used as an alternative constructor."},{"term":"@staticmethod","def":"A plain function that lives inside the class for organisation; it gets neither self nor cls."},{"term":"alternative constructor","def":"A classmethod such as from_string() that builds an object from different input."}],"explain":"Properties let you keep a simple attribute-style interface while adding checks or computing values on demand. `classmethod` and `staticmethod` organise functions that belong with the class but do not need a particular object.","example":{"code":"class Temperature:\n    def __init__(self, celsius):\n        self._celsius = celsius          # leading underscore: internal storage\n    @property\n    def celsius(self):                   # read like an attribute: t.celsius\n        return self._celsius\n    @celsius.setter\n    def celsius(self, value):            # runs on t.celsius = 5, so we can validate\n        if value < -273.15:\n            raise ValueError(\"below absolute zero\")\n        self._celsius = value\n    @property\n    def fahrenheit(self):                # computed on demand\n        return self._celsius * 9 / 5 + 32\n    @classmethod\n    def from_fahrenheit(cls, f):         # alternative constructor: gets the class\n        return cls((f - 32) * 5 / 9)\n    @staticmethod\n    def is_valid(value):                 # no self or cls: just a function in the class\n        return value >= -273.15\nt = Temperature.from_fahrenheit(212)\nprint(t.celsius, t.fahrenheit)           # 100.0 212.0\n"},"mistakes":["Calling a property with parentheses: `t.fahrenheit()` raises TypeError because the property already returned a number.","A property without a setter is read-only: assigning to it raises AttributeError.","Using the same name for the stored attribute and the property causes infinite recursion; store it as `_name`."],"exercises":[{"title":"Circle","prompt":"Write `Circle(radius)` with a `radius` property that raises `ValueError(\"radius must be positive\")` for values 0 or less (also when set later) and a read-only `area` property (3.14159 * radius squared).","starter":"class Circle:\n    pass\n","solution":"class Circle:\n    def __init__(self, radius):\n        self.radius = radius\n\n    @property\n    def radius(self):\n        return self._radius\n\n    @radius.setter\n    def radius(self, value):\n        if value <= 0:\n            raise ValueError(\"radius must be positive\")\n        self._radius = value\n\n    @property\n    def area(self):\n        return 3.14159 * self._radius ** 2","hint":"Assign through the property in __init__ so the check runs there too.","tests":[{"expected":"12.57\nradius must be positive\nradius must be positive","append":"c = Circle(2)\nprint(round(c.area, 2))\ntry:\n    c.radius = -1\nexcept ValueError as e:\n    print(e)\ntry:\n    Circle(0)\nexcept ValueError as e:\n    print(e)"}],"local_only":false},{"title":"from_string","prompt":"Write `Person(name, age)` with a classmethod `from_string(text)` that builds a Person from text like `\"Ada,36\"` (age as an int).","starter":"class Person:\n    pass\n","solution":"class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    @classmethod\n    def from_string(cls, text):\n        name, age = text.split(\",\")\n        return cls(name, int(age))","hint":"","tests":[{"expected":"Ada 36","append":"p = Person.from_string('Ada,36')\nprint(p.name, p.age)"}],"local_only":false},{"title":"is_prime","prompt":"Write a class `MathUtil` with a static method `is_prime(n)` returning True for primes (n >= 2) and False otherwise.","starter":"class MathUtil:\n    pass\n","solution":"class MathUtil:\n    @staticmethod\n    def is_prime(n):\n        if n < 2:\n            return False\n        for d in range(2, n):\n            if n % d == 0:\n                return False\n        return True","hint":"","tests":[{"expected":"True\nFalse\nFalse","append":"print(MathUtil.is_prime(7))\nprint(MathUtil.is_prime(8))\nprint(MathUtil.is_prime(1))"}],"local_only":false}],"quiz":[{"q":"What does @property allow?","options":["Reading a method like an attribute","Hiding a class","Creating a file"],"answer":0,"why":"obj.area instead of obj.area()."},{"q":"What does a classmethod receive first?","options":["self, the object","cls, the class","Nothing"],"answer":1,"why":"That is how it can build objects."},{"q":"A staticmethod receives...","options":["self","Neither self nor cls","cls"],"answer":1,"why":"It is just a function inside the class."},{"q":"What happens when you assign to a property without a setter?","options":["It is ignored","AttributeError","It works"],"answer":1,"why":"It is read-only."},{"q":"Why use a setter?","options":["To make the attribute faster","To validate or react when a value changes","To rename it"],"answer":1,"why":"The assignment runs your code."}],"challenge":{"title":"Read-only balance","prompt":"Write `Account(balance)` with a read-only `balance` property and a `deposit(amount)` method. Assigning to `a.balance` must raise AttributeError.","starter":"class Account:\n    pass\n","solution":"class Account:\n    def __init__(self, balance):\n        self._balance = balance\n\n    @property\n    def balance(self):\n        return self._balance\n\n    def deposit(self, amount):\n        self._balance += amount","hint":"","tests":[{"expected":"15\nread-only","append":"a = Account(10)\na.deposit(5)\nprint(a.balance)\ntry:\n    a.balance = 1\nexcept AttributeError:\n    print('read-only')"}],"local_only":false}},{"id":42,"track":"OOP","slug":"dataclasses","title":"Dataclasses","terms":[{"term":"dataclass","def":"A class decorator that writes __init__, __repr__ and __eq__ for you from a list of annotated fields."},{"term":"field","def":"A class variable with a type annotation, like name: str. Each becomes an __init__ parameter."},{"term":"default_factory","def":"field(default_factory=list) gives every object its own new list as the default."},{"term":"frozen","def":"@dataclass(frozen=True) makes objects unchangeable."},{"term":"order","def":"@dataclass(order=True) adds <, >, <=, >= comparing the fields in order."},{"term":"__post_init__","def":"A method that runs right after the generated __init__, handy for validation."},{"term":"asdict()","def":"Converts a dataclass object to a dict."}],"explain":"Many classes only hold data. A dataclass removes the boilerplate: you list the fields and Python writes the rest. Use `default_factory` for lists and dicts so objects never share them.","example":{"code":"from dataclasses import dataclass, field, asdict\n@dataclass                               # writes __init__, __repr__ and __eq__ for you\nclass Item:\n    name: str\n    price: float\n    tags: list = field(default_factory=list)   # a safe default for mutable values\n    qty: int = 1\na = Item(\"pen\", 1.5)\nprint(a)                                 # Item(name='pen', price=1.5, tags=[], qty=1)\nprint(a == Item(\"pen\", 1.5))             # True\nprint(asdict(a)[\"name\"])                 # pen\n@dataclass(frozen=True, order=True)      # frozen: cannot change; order: supports < >\nclass Version:\n    major: int\n    minor: int\nprint(Version(1, 2) < Version(1, 10))    # True\n"},"mistakes":["`tags: list = []` raises ValueError. Use `field(default_factory=list)`.","Putting a field with a default before one without: `x: int = 0` then `y: int` is a TypeError.","Forgetting the decorator: without `@dataclass` the annotations create no `__init__`."],"exercises":[{"title":"Point","prompt":"Make a dataclass `Point` with `x: int` and `y: int = 0`.","starter":"from dataclasses import dataclass\n\n","solution":"from dataclasses import dataclass\n\n@dataclass\nclass Point:\n    x: int\n    y: int = 0","hint":"","tests":[{"expected":"Point(x=3, y=0)\nPoint(x=1, y=2)","append":"print(Point(3))\nprint(Point(1, 2))"}],"local_only":false},{"title":"Product","prompt":"Make a dataclass `Product` with `name: str`, `price: float`, `qty: int = 1` and a method `total()` returning price times quantity.","starter":"from dataclasses import dataclass\n\n","solution":"from dataclasses import dataclass\n\n@dataclass\nclass Product:\n    name: str\n    price: float\n    qty: int = 1\n\n    def total(self):\n        return self.price * self.qty","hint":"","tests":[{"expected":"10.0\n2.5","append":"print(Product('pen', 2.5, 4).total())\nprint(Product('ink', 2.5).total())"}],"local_only":false},{"title":"Student","prompt":"Make a dataclass `Student` with `name: str` and `grades` (a list that is empty by default and never shared) plus `average()`.","starter":"from dataclasses import dataclass, field\n\n","solution":"from dataclasses import dataclass, field\n\n@dataclass\nclass Student:\n    name: str\n    grades: list = field(default_factory=list)\n\n    def average(self):\n        return sum(self.grades) / len(self.grades)","hint":"","tests":[{"expected":"85.0\n[]","append":"s = Student('Ana')\ns.grades.append(90)\ns.grades.append(80)\nprint(s.average())\nprint(Student('Bo').grades)"}],"local_only":false}],"quiz":[{"q":"What does @dataclass generate?","options":["Only __str__","__init__, __repr__ and __eq__","A database table"],"answer":1,"why":"It saves boilerplate."},{"q":"How do you give a dataclass field an empty list default?","options":["= list","field(default_factory=list)","= []"],"answer":1,"why":"A plain [] would be shared."},{"q":"What does frozen=True do?","options":["Deletes fields","Makes objects unchangeable","Makes it faster"],"answer":1,"why":"Assigning raises FrozenInstanceError."},{"q":"What does order=True add?","options":["Printing","Comparison operators like <","Sorting of fields"],"answer":1,"why":"Objects compare field by field."},{"q":"When does __post_init__ run?","options":["Right after the generated __init__","Before __init__","When printing"],"answer":0,"why":"Use it for validation."}],"challenge":{"title":"Money","prompt":"Make a frozen, ordered dataclass `Money` with `amount: int` and `currency: str`. A negative amount must raise `ValueError` (use `__post_init__`).","starter":"from dataclasses import dataclass\n\n","solution":"from dataclasses import dataclass\n\n@dataclass(frozen=True, order=True)\nclass Money:\n    amount: int\n    currency: str\n\n    def __post_init__(self):\n        if self.amount < 0:\n            raise ValueError(\"negative\")","hint":"","tests":[{"expected":"Money(amount=5, currency='EUR')\nnegative\nfrozen\nTrue","append":"m = Money(5, 'EUR')\nprint(m)\ntry:\n    Money(-1, 'USD')\nexcept ValueError as e:\n    print(e)\ntry:\n    m.amount = 9\nexcept AttributeError:\n    print('frozen')\nprint(Money(1, 'EUR') < Money(2, 'EUR'))"}],"local_only":false}},{"id":43,"track":"OOP","slug":"abstract-classes-protocols","title":"Abstract classes and protocols","terms":[{"term":"abstract class","def":"A class that cannot be instantiated; it defines a contract for its subclasses."},{"term":"ABC","def":"abc.ABC is the base class you inherit from to make a class abstract."},{"term":"@abstractmethod","def":"Marks a method every concrete subclass must implement. Forgetting one makes instantiation fail."},{"term":"interface","def":"A promise about which methods an object has."},{"term":"Protocol","def":"typing.Protocol describes an interface by shape: anything with the right methods fits, no inheritance needed."},{"term":"NotImplementedError","def":"An older way to say \"subclasses must override this\"."}],"explain":"An abstract base class says \"every shape must be able to compute its area\" and refuses to be created itself. A Protocol says the same without forcing inheritance: it relies on duck typing and helps tools check your code.","example":{"code":"from abc import ABC, abstractmethod\nclass Shape(ABC):                        # an abstract base class cannot be instantiated\n    @abstractmethod\n    def area(self):                      # every subclass MUST provide this\n        ...\nclass Square(Shape):\n    def __init__(self, s):\n        self.s = s\n    def area(self):\n        return self.s ** 2\nprint(Square(3).area())                  # 9\ntry:\n    Shape()                              # TypeError: cannot instantiate an abstract class\nexcept TypeError:\n    print(\"cannot create a Shape\")\nfrom typing import Protocol\nclass HasArea(Protocol):                 # \"anything with an area() method fits\"\n    def area(self) -> float: ...\ndef show(item: HasArea):\n    print(item.area())\nshow(Square(2))                          # 4\n"},"mistakes":["Forgetting to implement every abstract method: instantiating the subclass raises TypeError.","Forgetting `ABC` in the class line: `@abstractmethod` then has no effect.","Protocols are not enforced at run time; they are checked by tools such as mypy."],"exercises":[{"title":"Animals","prompt":"`Animal` is abstract with an abstract `sound()` method. Write concrete `Dog` (returns \"Woof\") and `Cow` (returns \"Moo\").","starter":"from abc import ABC, abstractmethod\n\nclass Animal(ABC):\n    @abstractmethod\n    def sound(self):\n        ...\n\n","solution":"from abc import ABC, abstractmethod\n\nclass Animal(ABC):\n    @abstractmethod\n    def sound(self):\n        ...\n\nclass Dog(Animal):\n    def sound(self):\n        return \"Woof\"\n\nclass Cow(Animal):\n    def sound(self):\n        return \"Moo\"","hint":"","tests":[{"expected":"Woof\nMoo\nabstract","append":"print(Dog().sound())\nprint(Cow().sound())\ntry:\n    Animal()\nexcept TypeError:\n    print('abstract')"}],"local_only":false},{"title":"PaymentMethod","prompt":"Write an abstract base class `PaymentMethod` with an abstract method `pay(amount)`.","starter":"from abc import ABC, abstractmethod\n\n","solution":"from abc import ABC, abstractmethod\n\nclass PaymentMethod(ABC):\n    @abstractmethod\n    def pay(self, amount):\n        ...","hint":"","tests":[{"expected":"paid 5 cash\nabstract","append":"class Cash(PaymentMethod):\n    def pay(self, amount):\n        return f'paid {amount} cash'\nprint(Cash().pay(5))\ntry:\n    PaymentMethod()\nexcept TypeError:\n    print('abstract')"}],"local_only":false},{"title":"describe_all","prompt":"Write `describe_all(things)` returning a list with the result of calling `describe()` on every object. The objects can be of completely unrelated classes.","starter":"def describe_all(things):\n    pass\n","solution":"def describe_all(things):\n    return [t.describe() for t in things]","hint":"","tests":[{"expected":"['a robot', 'a tree']","append":"class Robot:\n    def describe(self):\n        return 'a robot'\nclass Tree:\n    def describe(self):\n        return 'a tree'\nprint(describe_all([Robot(), Tree()]))"}],"local_only":false}],"quiz":[{"q":"What happens when you call Shape() for an abstract Shape?","options":["TypeError","A Shape is created","Nothing"],"answer":0,"why":"Abstract classes cannot be instantiated."},{"q":"What does @abstractmethod require?","options":["Subclasses must implement the method","The method must be private","The method must return None"],"answer":0,"why":"Otherwise they remain abstract."},{"q":"What is a Protocol?","options":["An interface described by method names","A network rule","A decorator"],"answer":0,"why":"Duck typing with tool support."},{"q":"Which base class makes a class abstract?","options":["Protocol","ABC","Abstract"],"answer":1,"why":"from abc import ABC."},{"q":"Is a Protocol enforced at run time?","options":["No, tools check it","Only for dataclasses","Yes, always"],"answer":0,"why":"It documents and type-checks."}],"challenge":{"title":"Shape.compare","prompt":"Write the abstract base class `Shape` with an abstract `area()` and a concrete method `compare(other)` that returns `\"bigger\"`, `\"smaller\"` or `\"equal\"` by comparing areas.","starter":"from abc import ABC, abstractmethod\n\n","solution":"from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\n    def compare(self, other):\n        mine, theirs = self.area(), other.area()\n        if mine > theirs:\n            return \"bigger\"\n        if mine < theirs:\n            return \"smaller\"\n        return \"equal\"","hint":"","tests":[{"expected":"bigger\nsmaller\nequal\nabstract","append":"class Sq(Shape):\n    def __init__(self, s):\n        self.s = s\n    def area(self):\n        return self.s * self.s\nclass Rect(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\nprint(Sq(3).compare(Rect(2, 3)))\nprint(Rect(2, 3).compare(Sq(3)))\nprint(Sq(2).compare(Rect(1, 4)))\ntry:\n    Shape()\nexcept TypeError:\n    print('abstract')"}],"local_only":false}},{"id":44,"track":"OOP","slug":"composition-vs-inheritance","title":"Composition vs inheritance","terms":[{"term":"composition","def":"Building an object out of other objects: a Car has an Engine."},{"term":"has-a / is-a","def":"Composition models \"has a\"; inheritance models \"is a\"."},{"term":"delegation","def":"Passing a request on to the contained object: car.start() calls engine.start()."},{"term":"dependency injection","def":"Passing the parts an object needs in through __init__ instead of creating them inside, so they are easy to swap or fake in tests."},{"term":"coupling","def":"How strongly one piece of code depends on another. Less coupling is easier to change."},{"term":"mixin","def":"A small class with one extra ability meant to be combined with others."}],"explain":"A good rule of thumb: prefer composition. Inheritance ties a child tightly to its parent; composition lets you swap parts freely. Reach for inheritance only when the \"is a\" relationship is truly honest.","example":{"code":"class Engine:\n    def start(self):\n        return \"vroom\"\nclass Car:                               # a Car HAS an Engine (composition)\n    def __init__(self, engine):\n        self.engine = engine             # pass the part in: easy to swap or test\n    def start(self):\n        return f\"Car says {self.engine.start()}\"      # delegation\nclass ElectricEngine:\n    def start(self):\n        return \"hummm\"\nprint(Car(Engine()).start())             # Car says vroom\nprint(Car(ElectricEngine()).start())     # Car says hummm\n"},"mistakes":["Inheriting just to reuse code: `class Stack(list)` exposes every list method (insert, sort...) that a stack should not have.","Creating dependencies inside `__init__` (`self.db = Database()`): you cannot test without the real thing.","Long inheritance chains: changing the top class breaks everything below."],"exercises":[{"title":"Library","prompt":"Write `Library` that holds books: `add(title)` and `titles()` (the titles sorted alphabetically).","starter":"class Library:\n    pass\n","solution":"class Library:\n    def __init__(self):\n        self._books = []\n\n    def add(self, title):\n        self._books.append(title)\n\n    def titles(self):\n        return sorted(self._books)","hint":"","tests":[{"expected":"['Dune', 'Emma']","append":"lib = Library()\nlib.add('Emma')\nlib.add('Dune')\nprint(lib.titles())"}],"local_only":false},{"title":"Service with a logger","prompt":"Write `Service(logger)`. Its `run()` calls `logger.log(\"running\")` and returns \"done\".","starter":"class Service:\n    pass\n","solution":"class Service:\n    def __init__(self, logger):\n        self.logger = logger\n\n    def run(self):\n        self.logger.log(\"running\")\n        return \"done\"","hint":"","tests":[{"expected":"done\n['running']","append":"class FakeLogger:\n    def __init__(self):\n        self.messages = []\n    def log(self, m):\n        self.messages.append(m)\nf = FakeLogger()\nprint(Service(f).run())\nprint(f.messages)"}],"local_only":false},{"title":"Stack by composition","prompt":"Write a `Stack` that *contains* a list (it does not inherit from list) with `push(item)`, `pop()`, `peek()` and `is_empty()`.","starter":"class Stack:\n    pass\n","solution":"class Stack:\n    def __init__(self):\n        self._items = []\n\n    def push(self, item):\n        self._items.append(item)\n\n    def pop(self):\n        return self._items.pop()\n\n    def peek(self):\n        return self._items[-1]\n\n    def is_empty(self):\n        return not self._items","hint":"","tests":[{"expected":"True\n2\n2\n1\nFalse","append":"s = Stack()\nprint(s.is_empty())\ns.push(1)\ns.push(2)\nprint(s.peek())\nprint(s.pop())\nprint(s.pop())\ns.push(9)\nprint(s.is_empty())"}],"local_only":false}],"quiz":[{"q":"Which relationship does composition model?","options":["is-a","was-a","has-a"],"answer":2,"why":"A Car has an Engine."},{"q":"What is delegation?","options":["Inheriting","Passing a call to a contained object","Deleting an object"],"answer":1,"why":"car.start() asks the engine."},{"q":"Why pass dependencies into __init__?","options":["It is required","It is faster","Easy to swap and test"],"answer":2,"why":"You can inject a fake in tests."},{"q":"Why is class Stack(list) questionable?","options":["It exposes list methods a stack should not have","It is a SyntaxError","It is slow"],"answer":0,"why":"Composition keeps the interface small."},{"q":"When is inheritance a good fit?","options":["When the child truly is a kind of the parent","Never","Whenever you want to reuse code"],"answer":0,"why":"Check the is-a sentence."}],"challenge":{"title":"Pizza","prompt":"`Topping(name, price)` is given. Write `Pizza(base_price)` with `add_topping(topping)`, `total()` and `description()` such as `Pizza with cheese, ham ($12.50)`.","starter":"class Topping:\n    def __init__(self, name, price):\n        self.name = name\n        self.price = price\n\n","solution":"class Topping:\n    def __init__(self, name, price):\n        self.name = name\n        self.price = price\n\nclass Pizza:\n    def __init__(self, base_price):\n        self.base_price = base_price\n        self.toppings = []\n\n    def add_topping(self, topping):\n        self.toppings.append(topping)\n\n    def total(self):\n        return self.base_price + sum(t.price for t in self.toppings)\n\n    def description(self):\n        names = \", \".join(t.name for t in self.toppings)\n        return f\"Pizza with {names} (${self.total():.2f})\"","hint":"","tests":[{"expected":"12.5\nPizza with cheese, ham ($12.50)","append":"p = Pizza(8)\np.add_topping(Topping('cheese', 1.5))\np.add_topping(Topping('ham', 3))\nprint(p.total())\nprint(p.description())"}],"local_only":false}},{"id":45,"track":"PRO","slug":"type-hints","title":"Type hints","terms":[{"term":"type hint (annotation)","def":"A note about what type a value should have: def f(x: int) -> str."},{"term":"static type checker","def":"A tool such as mypy or pyright that reads hints and finds mistakes without running the program."},{"term":"generic type","def":"A container with its item type: list[int], dict[str, float], tuple[int, str]."},{"term":"X | None","def":"A value that is either X or None (older spelling: Optional[X])."},{"term":"Any","def":"\"I do not care about the type\": switches checking off for that value."},{"term":"runtime","def":"When the program actually runs. Python does NOT enforce hints at runtime."}],"explain":"Hints make code easier to read and let editors and checkers catch bugs early. They are optional and ignored when the program runs, so adding them never changes behaviour.","example":{"code":"def add(a: int, b: int) -> int:        # hints: a and b are ints, the result is an int\n    return a + b\ndef greet(name: str, excited: bool = False) -> str:\n    return name + (\"!\" if excited else \".\")\nprices: dict[str, float] = {\"pen\": 1.5}     # a dict mapping str to float\ndef first(items: list[str]) -> str | None:  # \"a str or None\"\n    return items[0] if items else None\nprint(add(2, 3), greet(\"Ada\", True))\nprint(add.__annotations__)              # hints are stored but NOT enforced at run time\nprint(add(\"a\", \"b\"))                    # runs fine! (a checker like mypy would warn)\n"},"mistakes":["Believing hints are enforced: `add(\"a\", \"b\")` runs happily. Only a checker complains.","Writing `list` instead of `list[int]`: it is valid but says less.","Using `Optional[int]` as if it meant \"optional argument\": it means the value may be None; a default value is separate."],"exercises":[{"title":"scale","prompt":"Write `scale(values: list[float], factor: float) -> list[float]` returning every value multiplied by `factor`, with those type hints.","starter":"def scale(values, factor):\n    pass\n","solution":"def scale(values: list[float], factor: float) -> list[float]:\n    return [v * factor for v in values]","hint":"","tests":[{"expected":"[2.0, 4.0]\nTrue\nlist[float]","append":"print(scale([1.0, 2.0], 2.0))\nprint(scale.__annotations__['factor'] is float)\nprint(scale.__annotations__['values'])"}],"local_only":false},{"title":"find_user","prompt":"Write `find_user(users: dict[str, int], name: str) -> int | None` returning the id stored for `name` or None, with those hints.","starter":"def find_user(users, name):\n    pass\n","solution":"def find_user(users: dict[str, int], name: str) -> int | None:\n    return users.get(name)","hint":"","tests":[{"expected":"1\nNone\nint | None","append":"print(find_user({'a': 1}, 'a'))\nprint(find_user({'a': 1}, 'b'))\nprint(find_user.__annotations__['return'])"}],"local_only":false},{"title":"join","prompt":"Write `join(parts: list[str], sep: str = \",\") -> str` joining the parts with the separator, with those hints.","starter":"def join(parts, sep=\",\"):\n    pass\n","solution":"def join(parts: list[str], sep: str = \",\") -> str:\n    return sep.join(parts)","hint":"","tests":[{"expected":"a,b\na-b\nlist[str]","append":"print(join(['a', 'b']))\nprint(join(['a', 'b'], '-'))\nprint(join.__annotations__['parts'])"}],"local_only":false}],"quiz":[{"q":"What happens at run time when a hint is wrong?","options":["Nothing, hints are not enforced","TypeError","SyntaxError"],"answer":0,"why":"Hints are for people and tools."},{"q":"What does int | None mean?","options":["An int and None","An int or None","Either an int or a float"],"answer":1,"why":"A union of two types."},{"q":"Which tool checks hints?","options":["mypy / pyright","pip","print"],"answer":0,"why":"They are static type checkers."},{"q":"What does -> None mean on a function?","options":["It is not allowed","It returns the word None","It returns nothing useful"],"answer":2,"why":"The function is called for its effect."},{"q":"How do you hint a list of strings?","options":["[str]","list[str]","list(str)"],"answer":1,"why":"Square brackets with the item type."}],"challenge":{"title":"average","prompt":"Write `average(nums: list[float]) -> float | None` returning the mean, or None for an empty list, with those hints.","starter":"def average(nums):\n    pass\n","solution":"def average(nums: list[float]) -> float | None:\n    if not nums:\n        return None\n    return sum(nums) / len(nums)","hint":"","tests":[{"expected":"2.0\nNone\nfloat | None","append":"print(average([1.0, 2.0, 3.0]))\nprint(average([]))\nprint(average.__annotations__['return'])"}],"local_only":false}},{"id":46,"track":"PRO","slug":"regex","title":"Regular expressions","terms":[{"term":"regular expression (regex)","def":"A small pattern language for describing text: \\d{3} means three digits."},{"term":"re module","def":"Python's regex tools: search, match, fullmatch, findall, sub, split."},{"term":"raw string r\"...\"","def":"A string where backslashes are kept as they are. Always use it for patterns."},{"term":"character class","def":"\\d digit, \\w letter/digit/underscore, \\s whitespace, [abc] any of a, b, c."},{"term":"quantifier","def":"How many times: + one or more, * zero or more, ? optional, {n} exactly n."},{"term":"group ( )","def":"Capture part of a match: m.group(1)."},{"term":"anchor","def":"^ start of text, $ end of text."}],"explain":"Regex finds and extracts patterns in text: phone numbers, dates, log lines. Start simple, test on examples and build the pattern up piece by piece. `re.fullmatch` checks the whole string, `re.search` finds the first match, `re.findall` finds all of them.","example":{"code":"import re\ntext = \"Call 555-1234 or 555-9876 today\"\nprint(re.findall(r\"\\d{3}-\\d{4}\", text))      # ['555-1234', '555-9876']\nm = re.search(r\"(\\w+)@(\\w+)\\.com\", \"mail ada@example.com now\")\nprint(m.group(1), m.group(2))                # ada example\nprint(re.sub(r\"\\s+\", \" \", \"too    many   spaces\"))   # too many spaces\nprint(bool(re.fullmatch(r\"[A-Z]\\d{2}\", \"A12\")))      # True\nprint(re.split(r\"[,;]\", \"a,b;c\"))            # ['a', 'b', 'c']\n"},"mistakes":["Forgetting the raw string: `\"\\d\"` is not what you mean; write `r\"\\d\"`.","`re.match` only matches at the start of the text; use `re.search` to look anywhere or `fullmatch` for the entire string.","Greedy matching: `.*` grabs as much as possible; use `.*?` to match as little as possible."],"exercises":[{"title":"find_numbers","prompt":"Write `find_numbers(text)` returning all whole numbers in the text as a list of ints.","starter":"import re\n\ndef find_numbers(text):\n    pass\n","solution":"import re\n\ndef find_numbers(text):\n    return [int(n) for n in re.findall(r\"\\d+\", text)]","hint":"","tests":[{"expected":"[1, 22, 333]\n[]","append":"print(find_numbers('a1 b22 c333'))\nprint(find_numbers('none'))"}],"local_only":false},{"title":"is_valid_time","prompt":"Write `is_valid_time(s)` returning True when `s` is a 24-hour time `HH:MM` (00:00 to 23:59, two digits each).","starter":"import re\n\ndef is_valid_time(s):\n    pass\n","solution":"import re\n\ndef is_valid_time(s):\n    return bool(re.fullmatch(r\"([01]\\d|2[0-3]):[0-5]\\d\", s))","hint":"","tests":[{"expected":"True\nFalse\nFalse\nTrue","append":"print(is_valid_time('23:59'))\nprint(is_valid_time('24:00'))\nprint(is_valid_time('7:30'))\nprint(is_valid_time('00:00'))"}],"local_only":false},{"title":"mask_digits","prompt":"Write `mask_digits(s)` replacing every digit with `#`.","starter":"import re\n\ndef mask_digits(s):\n    pass\n","solution":"import re\n\ndef mask_digits(s):\n    return re.sub(r\"\\d\", \"#\", s)","hint":"","tests":[{"expected":"Card #### ####","append":"print(mask_digits('Card 1234 5678'))"}],"local_only":false}],"quiz":[{"q":"What does r\"\\d+\" match?","options":["One or more digits","A backslash and d","The letter d"],"answer":0,"why":"\\d is a digit and + means one or more."},{"q":"Which function checks that the whole string matches?","options":["re.search","re.findall","re.fullmatch"],"answer":2,"why":"fullmatch must match from start to end."},{"q":"What does re.findall return?","options":["The first match","A list of all matches","True or False"],"answer":1,"why":"Every non-overlapping match."},{"q":"Why use raw strings for patterns?","options":["They are faster","Backslashes stay as written","They are required for letters"],"answer":1,"why":"Otherwise \\d may be mangled."},{"q":"What does ? after a character do?","options":["Negates it","Repeats it","Makes it optional"],"answer":2,"why":"colou?r matches color and colour."}],"challenge":{"title":"parse_log","prompt":"Write `parse_log(line)` for lines like `2024-03-01 ERROR disk full`: return `{'date': ..., 'level': ..., 'message': ...}` when the line is `YYYY-MM-DD LEVEL message` with LEVEL one of INFO, WARN, ERROR; otherwise return None.","starter":"import re\n\ndef parse_log(line):\n    pass\n","solution":"import re\n\ndef parse_log(line):\n    m = re.fullmatch(r\"(\\d{4}-\\d{2}-\\d{2}) (INFO|WARN|ERROR) (.+)\", line)\n    if not m:\n        return None\n    return {\"date\": m.group(1), \"level\": m.group(2), \"message\": m.group(3)}","hint":"","tests":[{"expected":"{'date': '2024-03-01', 'level': 'ERROR', 'message': 'disk full'}\nNone\nNone","append":"print(parse_log('2024-03-01 ERROR disk full'))\nprint(parse_log('garbage'))\nprint(parse_log('2024-03-01 DEBUG x'))"}],"local_only":false}},{"id":47,"track":"PRO","slug":"itertools-functools","title":"itertools and functools","terms":[{"term":"itertools","def":"A module of fast building blocks for loops: chain, combinations, permutations, product, islice, count, groupby."},{"term":"combination","def":"A choice of items where order does not matter: (a, b) is the same as (b, a)."},{"term":"permutation","def":"An arrangement of items where order matters."},{"term":"reduce","def":"functools.reduce folds a list into one value by applying a function again and again."},{"term":"lru_cache","def":"A decorator that remembers results so the same call is never computed twice (memoization)."},{"term":"partial","def":"Creates a new function with some arguments already filled in."}],"explain":"These two modules save you from writing loops by hand. `itertools` produces sequences lazily; `functools` helps with functions as values. Whenever you write a nested loop to generate pairs or arrangements, check itertools first.","example":{"code":"from itertools import chain, combinations, permutations, product, islice, count\nfrom functools import reduce, lru_cache, partial\nprint(list(chain([1, 2], [3])))              # [1, 2, 3]\nprint(list(combinations(\"abc\", 2)))          # [('a', 'b'), ('a', 'c'), ('b', 'c')]\nprint(len(list(permutations(range(3)))))     # 6\nprint(list(product(\"ab\", [1, 2])))           # [('a', 1), ('a', 2), ('b', 1), ('b', 2)]\nprint(list(islice(count(10, 5), 3)))         # [10, 15, 20]\nprint(reduce(lambda a, b: a * b, [1, 2, 3, 4]))   # 24\n@lru_cache(maxsize=None)                      # remembers results: a cache\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\nprint(fib(50))                                # 12586269025, instantly\ndouble = partial(pow, 2)                      # fix the first argument: pow(2, x)\nprint(double(10))                             # 1024\n"},"mistakes":["Looping over a huge `permutations(...)`: the count grows factorially (10 items = 3.6 million).","`reduce` without an initial value raises TypeError on an empty list. Pass one: `reduce(f, items, 1)`.","Caching functions with changing results or unhashable arguments (lists): lru_cache needs hashable arguments."],"exercises":[{"title":"all_pairs","prompt":"Write `all_pairs(items)` returning a list of every 2-item combination (order does not matter, no repeats).","starter":"from itertools import combinations\n\ndef all_pairs(items):\n    pass\n","solution":"from itertools import combinations\n\ndef all_pairs(items):\n    return list(combinations(items, 2))","hint":"","tests":[{"expected":"[(1, 2), (1, 3), (2, 3)]\n[]","append":"print(all_pairs([1, 2, 3]))\nprint(all_pairs([1]))"}],"local_only":false},{"title":"product_of","prompt":"Write `product_of(nums)` returning the product of all numbers using `reduce`; the product of an empty list is 1.","starter":"from functools import reduce\n\ndef product_of(nums):\n    pass\n","solution":"from functools import reduce\n\ndef product_of(nums):\n    return reduce(lambda a, b: a * b, nums, 1)","hint":"","tests":[{"expected":"24\n1","append":"print(product_of([1, 2, 3, 4]))\nprint(product_of([]))"}],"local_only":false},{"title":"fast_fib","prompt":"Write the recursive `fast_fib(n)` (0, 1, 1, 2, ...) and decorate it with `lru_cache` so `fast_fib(60)` is instant.","starter":"from functools import lru_cache\n\ndef fast_fib(n):\n    pass\n","solution":"from functools import lru_cache\n\n@lru_cache(maxsize=None)\ndef fast_fib(n):\n    return n if n < 2 else fast_fib(n - 1) + fast_fib(n - 2)","hint":"","tests":[{"expected":"1548008755920\nTrue","append":"print(fast_fib(60))\nprint(fast_fib.cache_info().hits > 0)"}],"local_only":false}],"quiz":[{"q":"What does list(combinations(\"abc\", 2)) contain?","options":["9 pairs","6 pairs","3 pairs"],"answer":2,"why":"ab, ac, bc: order does not matter."},{"q":"What does reduce(lambda a, b: a + b, [1, 2, 3]) give?","options":["6","3","[1, 2, 3]"],"answer":0,"why":"It folds the list into one value."},{"q":"What does lru_cache do?","options":["Limits memory","Remembers results of previous calls","Sorts lists"],"answer":1,"why":"Same arguments, instant answer."},{"q":"What does partial(pow, 2)(3) give?","options":["8","9","6"],"answer":0,"why":"It calls pow(2, 3)."},{"q":"What does islice(count(), 3) give?","options":["The first 3 items of an endless counter","3 random numbers","An error"],"answer":0,"why":"islice slices any iterator."}],"challenge":{"title":"first_n_primes","prompt":"Write `first_n_primes(n)` returning the first n prime numbers. Use `itertools.count`, `filter` and `islice`.","starter":"from itertools import count, islice\n\ndef first_n_primes(n):\n    pass\n","solution":"from itertools import count, islice\n\ndef is_prime(k):\n    return k > 1 and all(k % d for d in range(2, int(k ** 0.5) + 1))\n\ndef first_n_primes(n):\n    return list(islice(filter(is_prime, count(2)), n))","hint":"","tests":[{"expected":"[2, 3, 5, 7, 11]\n[]","append":"print(first_n_primes(5))\nprint(first_n_primes(0))"}],"local_only":false}},{"id":48,"track":"PRO","slug":"unittest","title":"Testing with unittest","terms":[{"term":"unit test","def":"A small program that checks one piece of your code gives the right result."},{"term":"TestCase","def":"A class (inheriting unittest.TestCase) whose methods named test_... are the tests."},{"term":"assertion","def":"A check such as self.assertEqual(a, b) that fails the test when false."},{"term":"assertRaises","def":"Checks that some code raises a given exception."},{"term":"setUp","def":"A method that runs before every test to prepare fresh data."},{"term":"TDD","def":"Test-driven development: write a failing test first, then the code that makes it pass."}],"explain":"Tests are a safety net: they tell you immediately when a change breaks something. Each test should check one thing, have a clear name and not depend on other tests. Run them with `python -m unittest`.","example":{"code":"import unittest\ndef add(a, b):\n    return a + b\nclass TestAdd(unittest.TestCase):          # a test case: methods that start with test_\n    def test_positive(self):\n        self.assertEqual(add(2, 3), 5)\n    def test_negative(self):\n        self.assertEqual(add(-1, -1), -2)\n    def test_wrong_type(self):\n        with self.assertRaises(TypeError):\n            add(\"a\", 1)\nif __name__ == \"__main__\":\n    unittest.main()                         # runs every test and prints a report\n"},"mistakes":["Test method names must start with `test`, otherwise they are silently skipped.","Tests that depend on each other or on the order they run in. Each must work alone.","Testing too much in one test: when it fails you do not know which part broke."],"exercises":[{"title":"Write tests","prompt":"Write a `TestMax` test case with at least two test methods checking the built-in `max` (for example `max([1, 5, 3])` is 5).","starter":"import unittest\n\nclass TestMax(unittest.TestCase):\n    pass\n","solution":"import unittest\n\nclass TestMax(unittest.TestCase):\n    def test_list(self):\n        self.assertEqual(max([1, 5, 3]), 5)\n\n    def test_negative(self):\n        self.assertEqual(max([-4, -2, -9]), -2)","hint":"","tests":[{"expected":"True True","append":"import io, unittest\nsuite = unittest.defaultTestLoader.loadTestsFromTestCase(TestMax)\nres = unittest.TextTestRunner(stream=io.StringIO()).run(suite)\nprint(res.testsRun >= 2, res.wasSuccessful())"}],"local_only":false},{"title":"TDD: slugify","prompt":"The tests are written for you. Make them pass by writing `slugify(text)`: lower-case, words joined by single hyphens, no outer spaces.","starter":"import unittest\n\ndef slugify(text):\n    pass\n\nclass TestSlug(unittest.TestCase):\n    def test_basic(self):\n        self.assertEqual(slugify(\"Hello World\"), \"hello-world\")\n\n    def test_spaces(self):\n        self.assertEqual(slugify(\"  Python  Rocks \"), \"python-rocks\")\n","solution":"import unittest\n\ndef slugify(text):\n    return \"-\".join(text.lower().split())\n\nclass TestSlug(unittest.TestCase):\n    def test_basic(self):\n        self.assertEqual(slugify(\"Hello World\"), \"hello-world\")\n\n    def test_spaces(self):\n        self.assertEqual(slugify(\"  Python  Rocks \"), \"python-rocks\")","hint":"","tests":[{"expected":"hello-world\npython-rocks\nTrue","append":"import io, unittest\nprint(slugify('Hello World'))\nprint(slugify('  Python  Rocks '))\nres = unittest.TextTestRunner(stream=io.StringIO()).run(unittest.defaultTestLoader.loadTestsFromTestCase(TestSlug))\nprint(res.wasSuccessful())"}],"local_only":false},{"title":"assertRaises","prompt":"`divide(a, b)` is given. Write a `TestDivide` case with a test that uses `assertRaises` to check that dividing by zero raises `ZeroDivisionError`.","starter":"import unittest\n\ndef divide(a, b):\n    return a / b\n\nclass TestDivide(unittest.TestCase):\n    pass\n","solution":"import unittest\n\ndef divide(a, b):\n    return a / b\n\nclass TestDivide(unittest.TestCase):\n    def test_zero(self):\n        with self.assertRaises(ZeroDivisionError):\n            divide(1, 0)","hint":"","tests":[{"expected":"True","append":"import io, unittest\nres = unittest.TextTestRunner(stream=io.StringIO()).run(unittest.defaultTestLoader.loadTestsFromTestCase(TestDivide))\nprint(res.testsRun >= 1 and res.wasSuccessful())"}],"local_only":false}],"quiz":[{"q":"What must a test method's name start with?","options":["test","check","assert"],"answer":0,"why":"unittest only discovers names starting with test."},{"q":"Which assertion checks two values are equal?","options":["assertEqual","assertIs","assertSame"],"answer":0,"why":"assertEqual(a, b)."},{"q":"What does setUp do?","options":["Runs once at the end","Creates the tests","Runs before every test"],"answer":2,"why":"It prepares fresh state."},{"q":"How do you run all tests from a terminal?","options":["python -m unittest","unittest run","python tests"],"answer":0,"why":"The module runner discovers tests."},{"q":"What is the first step of TDD?","options":["Write docs","Write the code","Write a failing test"],"answer":2,"why":"Red, green, refactor."}],"challenge":{"title":"Tests that catch bugs","prompt":"Write `fizzbuzz(n)` (returns \"FizzBuzz\", \"Fizz\", \"Buzz\" or the number as text) **and** a `TestFizz` case with at least 3 tests. A hidden check replaces your function with a broken one: your tests must fail then.","starter":"import unittest\n\ndef fizzbuzz(n):\n    pass\n\nclass TestFizz(unittest.TestCase):\n    pass\n","solution":"import unittest\n\ndef fizzbuzz(n):\n    if n % 15 == 0:\n        return \"FizzBuzz\"\n    if n % 3 == 0:\n        return \"Fizz\"\n    if n % 5 == 0:\n        return \"Buzz\"\n    return str(n)\n\nclass TestFizz(unittest.TestCase):\n    def test_fizz(self):\n        self.assertEqual(fizzbuzz(9), \"Fizz\")\n\n    def test_buzz(self):\n        self.assertEqual(fizzbuzz(10), \"Buzz\")\n\n    def test_fizzbuzz(self):\n        self.assertEqual(fizzbuzz(15), \"FizzBuzz\")\n\n    def test_number(self):\n        self.assertEqual(fizzbuzz(7), \"7\")","hint":"Good tests fail when the code is wrong. Test Fizz, Buzz and FizzBuzz separately.","tests":[{"expected":"True True\nFalse","append":"import io, unittest\ndef run():\n    suite = unittest.defaultTestLoader.loadTestsFromTestCase(TestFizz)\n    r = unittest.TextTestRunner(stream=io.StringIO()).run(suite)\n    return r.testsRun, r.wasSuccessful()\nn, ok = run()\nprint(n >= 3, ok)\n_solution.fizzbuzz = lambda n: str(n)\nprint(run()[1])"}],"local_only":false}},{"id":49,"track":"PRO","slug":"debugging-logging","title":"Debugging and logging","terms":[{"term":"logging","def":"The logging module records messages with a level and a time, much more flexible than print."},{"term":"log level","def":"DEBUG < INFO < WARNING < ERROR < CRITICAL. A logger shows messages at or above its level."},{"term":"logger","def":"An object you create with logging.getLogger(name) and call .info(), .error() ... on."},{"term":"handler","def":"Decides where log messages go: console, a file, a stream."},{"term":"formatter","def":"Decides how a message looks: %(levelname)s %(message)s."},{"term":"debugger (pdb)","def":"A tool that lets you pause the program (breakpoint()) and inspect variables line by line."}],"explain":"Print statements are quick but you have to delete them later. Logging stays in the code, can be switched on or off by level and can go to files. When something is truly puzzling, `breakpoint()` opens the debugger.","example":{"code":"import logging\nlogging.basicConfig(level=logging.INFO, format=\"%(levelname)s: %(message)s\")\nlog = logging.getLogger(\"app\")\nlog.debug(\"hidden: below INFO\")             # not shown\nlog.info(\"starting\")                        # INFO: starting\nlog.warning(\"disk almost full\")             # WARNING: disk almost full\ntry:\n    1 / 0\nexcept ZeroDivisionError:\n    log.exception(\"math failed\")            # ERROR: math failed + the traceback\n# breakpoint()   pauses in the debugger: n = next line, c = continue, p x = print x\n"},"mistakes":["Calling `logging.info(...)` before configuring anything: the default level is WARNING, so INFO is not shown.","Building the message with f-strings in hot loops: use `log.info(\"x=%s\", x)` so it is only formatted if shown.","Leaving `breakpoint()` in code you ship."],"exercises":[{"title":"Configure logging","prompt":"Configure logging so messages go to standard output (`sys.stdout`) in the format `LEVEL:message` at level INFO. Log `ready` at INFO and `hidden` at DEBUG. The program must print only `INFO:ready`.","starter":"# Write your code below\n","solution":"import logging, sys\nlogging.basicConfig(stream=sys.stdout, level=logging.INFO, format=\"%(levelname)s:%(message)s\")\nlog = logging.getLogger(\"demo\")\nlog.info(\"ready\")\nlog.debug(\"hidden\")","hint":"logging.basicConfig(stream=..., level=..., format=...)","tests":[{"expected":"INFO:ready"}],"local_only":false},{"title":"make_logger","prompt":"Write `make_logger(stream)` returning a logger named `t`, level DEBUG, that writes to `stream` in the format `LEVEL message`.","starter":"import logging\n\ndef make_logger(stream):\n    pass\n","solution":"import logging\n\ndef make_logger(stream):\n    logger = logging.getLogger(\"t\")\n    logger.setLevel(logging.DEBUG)\n    handler = logging.StreamHandler(stream)\n    handler.setFormatter(logging.Formatter(\"%(levelname)s %(message)s\"))\n    logger.addHandler(handler)\n    logger.propagate = False\n    return logger","hint":"","tests":[{"expected":"['DEBUG a', 'ERROR b']","append":"import io\nbuf = io.StringIO()\nlg = make_logger(buf)\nlg.debug('a')\nlg.error('b')\nprint(buf.getvalue().splitlines())"}],"local_only":false},{"title":"safe_divide with log","prompt":"Write `safe_divide(a, b, logger)` returning `a / b`; on division by zero call `logger.warning(\"division by zero\")` and return None.","starter":"def safe_divide(a, b, logger):\n    pass\n","solution":"def safe_divide(a, b, logger):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        logger.warning(\"division by zero\")\n        return None","hint":"","tests":[{"expected":"2.5\nNone\n['division by zero']","append":"class Rec:\n    def __init__(self):\n        self.msgs = []\n    def warning(self, m):\n        self.msgs.append(m)\nr = Rec()\nprint(safe_divide(5, 2, r))\nprint(safe_divide(1, 0, r))\nprint(r.msgs)"}],"local_only":false}],"quiz":[{"q":"Which level is the lowest?","options":["DEBUG","ERROR","INFO"],"answer":0,"why":"DEBUG < INFO < WARNING < ERROR < CRITICAL."},{"q":"What does log.exception(\"msg\") add?","options":["The traceback","A new level","A file"],"answer":0,"why":"Use it inside an except block."},{"q":"Why does logging.info() show nothing by default?","options":["It needs a file","It is broken","The default level is WARNING"],"answer":2,"why":"Call basicConfig(level=logging.INFO)."},{"q":"What does breakpoint() do?","options":["Stops Python forever","Opens the debugger","Prints a line"],"answer":1,"why":"You can then step through the code."},{"q":"What decides where messages go?","options":["A handler","A formatter","A level"],"answer":0,"why":"Console, file, stream ..."}],"challenge":{"title":"count_levels","prompt":"Write `count_levels(text)`: each line of `text` starts with a level word (`INFO`, `ERROR`, ...). Return a dict counting the lines per level.","starter":"def count_levels(text):\n    pass\n","solution":"def count_levels(text):\n    counts = {}\n    for line in text.splitlines():\n        level = line.split()[0]\n        counts[level] = counts.get(level, 0) + 1\n    return counts","hint":"","tests":[{"expected":"{'INFO': 2, 'ERROR': 1}\n{}","append":"print(count_levels('INFO a\\nERROR b\\nINFO c'))\nprint(count_levels(''))"}],"local_only":false}},{"id":50,"track":"PRO","slug":"threading","title":"Threading","terms":[{"term":"thread","def":"A separate line of execution inside one program. Several threads can wait at the same time."},{"term":"concurrency","def":"Making progress on several tasks at once, e.g. while waiting for the network."},{"term":"join()","def":"Waits until a thread has finished."},{"term":"race condition","def":"A bug where the result depends on which thread runs first, e.g. two threads updating the same variable."},{"term":"Lock","def":"An object only one thread can hold at a time: use it with `with lock:` to protect shared data."},{"term":"GIL","def":"CPython's global lock: only one thread runs Python code at a time, so threads help with waiting (I/O) but not with heavy calculation."},{"term":"queue.Queue","def":"A thread-safe line where one thread puts work and another takes it."}],"explain":"Use threads when your program spends its time waiting: downloads, files, databases. Always `join()` threads you start, and protect shared data with a `Lock`. For CPU-heavy work use processes (next chapter).","example":{"code":"import threading, time\nresults = []\ndef worker(n):\n    time.sleep(0.1)                      # pretend to wait for a slow download\n    results.append(n * n)\nthreads = [threading.Thread(target=worker, args=(i,)) for i in range(5)]\nfor t in threads:\n    t.start()                            # all five run at the same time\nfor t in threads:\n    t.join()                             # wait until each one is done\nprint(sorted(results))                   # [0, 1, 4, 9, 16]\ncounter = 0\nlock = threading.Lock()\ndef add_many():\n    global counter\n    for _ in range(10000):\n        with lock:                       # only one thread at a time may change counter\n            counter += 1\nworkers = [threading.Thread(target=add_many) for _ in range(4)]\nfor w in workers: w.start()\nfor w in workers: w.join()\nprint(counter)                           # 40000\n"},"mistakes":["Forgetting `args=(x,)` with a trailing comma: `args=(x)` is just x, not a tuple.","Changing shared variables without a lock: `counter += 1` is not atomic, so updates can be lost.","Not joining: the main program may finish before the threads do."],"exercises":[{"title":"parallel_squares","prompt":"Write `parallel_squares(nums)` that starts one thread per number and returns the squares in the original order.","starter":"import threading\n\ndef parallel_squares(nums):\n    pass\n","solution":"import threading\n\ndef parallel_squares(nums):\n    results = [None] * len(nums)\n\n    def work(i, n):\n        results[i] = n * n\n\n    threads = [threading.Thread(target=work, args=(i, n)) for i, n in enumerate(nums)]\n    for t in threads:\n        t.start()\n    for t in threads:\n        t.join()\n    return results","hint":"","tests":[{"expected":"[1, 4, 9, 16]\n[]","append":"print(parallel_squares([1, 2, 3, 4]))\nprint(parallel_squares([]))"}],"local_only":true},{"title":"safe_counter","prompt":"Write `safe_counter(n_threads, per_thread)`: start `n_threads` threads that each add 1 to a shared counter `per_thread` times (use a Lock). Return the final count.","starter":"import threading\n\ndef safe_counter(n_threads, per_thread):\n    pass\n","solution":"import threading\n\ndef safe_counter(n_threads, per_thread):\n    count = 0\n    lock = threading.Lock()\n\n    def work():\n        nonlocal count\n        for _ in range(per_thread):\n            with lock:\n                count += 1\n\n    threads = [threading.Thread(target=work) for _ in range(n_threads)]\n    for t in threads:\n        t.start()\n    for t in threads:\n        t.join()\n    return count","hint":"","tests":[{"expected":"20000","append":"print(safe_counter(4, 5000))"}],"local_only":true},{"title":"Queue worker","prompt":"Write `process(items)`: put the items in a `queue.Queue`, let one worker thread double each item and collect the results, and return the list of doubled items. Use `None` as the stop signal.","starter":"import queue\nimport threading\n\ndef process(items):\n    pass\n","solution":"import queue\nimport threading\n\ndef process(items):\n    q = queue.Queue()\n    results = []\n\n    def worker():\n        while True:\n            item = q.get()\n            if item is None:\n                break\n            results.append(item * 2)\n\n    t = threading.Thread(target=worker)\n    t.start()\n    for item in items:\n        q.put(item)\n    q.put(None)\n    t.join()\n    return results","hint":"","tests":[{"expected":"[2, 4, 6]\n[]","append":"print(process([1, 2, 3]))\nprint(process([]))"}],"local_only":true}],"quiz":[{"q":"What do threads help with most?","options":["Shorter code","Heavy maths","Waiting for I/O (network, files)"],"answer":2,"why":"The GIL limits CPU-bound speed-ups."},{"q":"What does t.join() do?","options":["Waits for the thread to finish","Starts the thread","Kills the thread"],"answer":0,"why":"Always join threads you start."},{"q":"What is a race condition?","options":["A bug depending on thread timing","A fast loop","A sorting method"],"answer":0,"why":"Unprotected shared data."},{"q":"How do you protect shared data?","options":["Use print","Use more threads","with lock:"],"answer":2,"why":"Only one thread may hold the lock."},{"q":"What is Queue good for?","options":["Passing work between threads safely","Reading files","Sorting numbers"],"answer":0,"why":"It is thread-safe."}],"challenge":{"title":"fetch_all","prompt":"Write `fetch_all(delays)`: for each delay run a thread that sleeps that many seconds (simulating a download) and produces `delay * 2`. Return the results in order. The threads must run **at the same time**, so three 0.3 s waits take about 0.3 s, not 0.9 s.","starter":"import threading\nimport time\n\ndef fetch_all(delays):\n    results = []\n    for d in delays:\n        time.sleep(d)\n        results.append(d * 2)\n    return results\n","solution":"import threading\nimport time\n\ndef fetch_all(delays):\n    results = [None] * len(delays)\n\n    def work(i, d):\n        time.sleep(d)\n        results[i] = d * 2\n\n    threads = [threading.Thread(target=work, args=(i, d)) for i, d in enumerate(delays)]\n    for t in threads:\n        t.start()\n    for t in threads:\n        t.join()\n    return results","hint":"Start all threads first, then join them all.","tests":[{"expected":"[0.6, 0.6, 0.6] True","append":"import time\nt0 = time.time()\nout = fetch_all([0.3, 0.3, 0.3])\nprint(out, time.time() - t0 < 0.8)"}],"local_only":true}},{"id":51,"track":"PRO","slug":"multiprocessing","title":"Multiprocessing","terms":[{"term":"process","def":"A separate running copy of Python with its own memory. Processes truly run in parallel on different CPU cores."},{"term":"multiprocessing","def":"The module for starting and managing processes."},{"term":"Pool","def":"A group of worker processes. pool.map(f, items) spreads the items over the workers."},{"term":"CPU-bound","def":"Work limited by calculation speed (maths, images) rather than waiting."},{"term":"pickling","def":"Converting data to bytes to send it to another process. Functions you send must be defined at the top level of a module."},{"term":"__main__ guard","def":"`if __name__ == \"__main__\":` is required around the code that starts processes, because child processes import your file."}],"explain":"Threads share one GIL, so they cannot speed up heavy calculations. Processes can. The cost: starting a process is slower and data must be copied between them, so use them for big jobs only.","example":{"code":"from multiprocessing import Pool, cpu_count\ndef heavy(n):                              # must be defined at the top level\n    return sum(i * i for i in range(n))\nif __name__ == \"__main__\":                 # REQUIRED: child processes import this file\n    with Pool(2) as pool:\n        print(pool.map(heavy, [10, 20, 30]))   # [285, 2470, 8555]\n    print(cpu_count() >= 1)\n"},"mistakes":["Forgetting the `__main__` guard: on Windows and macOS the program starts processes endlessly or crashes.","Sending a lambda or a nested function to a Pool: it cannot be pickled. Use a top-level `def`.","Using processes for tiny tasks: the start-up cost is larger than the saving."],"exercises":[{"title":"parallel_sum_squares","prompt":"Write a top-level `square(n)` and `parallel_sum_squares(numbers)` that uses `Pool(2).map` to square the numbers in worker processes and returns the sum.","starter":"from multiprocessing import Pool\n\ndef parallel_sum_squares(numbers):\n    pass\n","solution":"from multiprocessing import Pool\n\ndef square(n):\n    return n * n\n\ndef parallel_sum_squares(numbers):\n    with Pool(2) as pool:\n        return sum(pool.map(square, numbers))","hint":"Define square at the top level, outside any function.","tests":[{"expected":"30\n0","append":"print(parallel_sum_squares([1, 2, 3, 4]))\nprint(parallel_sum_squares([]))"}],"local_only":true},{"title":"count_primes_parallel","prompt":"Write `count_primes_parallel(limits)` returning, for each limit, how many primes are below or equal to it. Compute the limits in parallel with a Pool.","starter":"from multiprocessing import Pool\n\ndef count_primes_parallel(limits):\n    pass\n","solution":"from multiprocessing import Pool\n\ndef count_primes(limit):\n    count = 0\n    for n in range(2, limit + 1):\n        if all(n % d for d in range(2, int(n ** 0.5) + 1)):\n            count += 1\n    return count\n\ndef count_primes_parallel(limits):\n    with Pool(2) as pool:\n        return pool.map(count_primes, limits)","hint":"","tests":[{"expected":"[4, 10]","append":"print(count_primes_parallel([10, 30]))"}],"local_only":true},{"title":"run_in_process","prompt":"Write `run_in_process(func, arg)` that runs `func(arg)` in a separate `Process` and returns the result, sending it back through a `multiprocessing.Queue`.","starter":"from multiprocessing import Process, Queue\n\ndef run_in_process(func, arg):\n    pass\n","solution":"from multiprocessing import Process, Queue\n\ndef _worker(func, arg, queue):\n    queue.put(func(arg))\n\ndef run_in_process(func, arg):\n    queue = Queue()\n    p = Process(target=_worker, args=(func, arg, queue))\n    p.start()\n    result = queue.get()\n    p.join()\n    return result","hint":"","tests":[{"expected":"5\n3","append":"print(run_in_process(abs, -5))\nprint(run_in_process(len, 'abc'))"}],"local_only":true}],"quiz":[{"q":"Why can processes speed up heavy maths when threads cannot?","options":["Processes are smaller","Each process has its own GIL","Threads cannot run"],"answer":1,"why":"They run on different cores."},{"q":"What must surround the code that starts processes?","options":["if __name__ == \"__main__\":","try/except","a lock"],"answer":0,"why":"Child processes import the file."},{"q":"What does pool.map(f, items) do?","options":["Creates a dictionary","Sorts items","Runs f on the items using the workers"],"answer":2,"why":"The items are spread over the processes."},{"q":"Which cannot be sent to a Pool?","options":["A number","A lambda","A top-level function"],"answer":1,"why":"Lambdas cannot be pickled."},{"q":"When are processes a poor choice?","options":["For tiny, quick tasks","For image processing","For heavy maths"],"answer":0,"why":"Start-up and copying costs dominate."}],"challenge":{"title":"chunked_sum","prompt":"Write `chunked_sum(numbers, workers)`: split `numbers` into `workers` roughly equal chunks, sum every chunk in a separate worker process with a Pool and return the grand total.","starter":"from multiprocessing import Pool\n\ndef chunked_sum(numbers, workers):\n    pass\n","solution":"from multiprocessing import Pool\n\ndef sum_chunk(chunk):\n    return sum(chunk)\n\ndef chunked_sum(numbers, workers):\n    size = max(1, -(-len(numbers) // workers))\n    chunks = [numbers[i:i + size] for i in range(0, len(numbers), size)]\n    with Pool(workers) as pool:\n        return sum(pool.map(sum_chunk, chunks))","hint":"-(-a // b) rounds a / b up.","tests":[{"expected":"500500\n0","append":"print(chunked_sum(list(range(1001)), 4))\nprint(chunked_sum([], 3))"}],"local_only":true}},{"id":52,"track":"PRO","slug":"asyncio","title":"asyncio","terms":[{"term":"coroutine","def":"The result of calling an async def function: a task that can be paused and resumed."},{"term":"async def","def":"Defines a coroutine function."},{"term":"await","def":"Pauses the current coroutine until something finishes, letting others run meanwhile."},{"term":"event loop","def":"The scheduler that runs coroutines one after another whenever they are ready. asyncio.run(main()) starts it."},{"term":"gather()","def":"Runs several coroutines at once and returns their results in order."},{"term":"task","def":"A coro
