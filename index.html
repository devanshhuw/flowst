n        if not 1 <= number <= len(tasks):\n            return f\"error: no task {number}\"\n        task = tasks[number - 1]\n        if command == \"done\":\n            task[\"done\"] = True\n            return f\"completed: {task['title']}\"\n        tasks.pop(number - 1)\n        return f\"removed: {task['title']}\"\n    if command == \"list\":\n        if not tasks:\n            return \"no tasks\"\n        return \"\\n\".join(f\"{i}. [{'x' if t['done'] else ' '}] {t['title']}\" for i, t in enumerate(tasks, 1))\n    return \"error: unknown command\"\n\n\ndef main():\n    tasks = []\n    while True:\n        line = input()\n        if line.strip().lower() == \"quit\":\n            break\n        print(run_command(tasks, line))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"added: buy milk\nadded: call mom\ncompleted: buy milk\n1. [x] buy milk\n2. [ ] call mom\nremoved: call mom\nerror: no task 9\nerror: unknown command\nno tasks","append":"tasks = []\nprint(run_command(tasks, 'add buy milk'))\nprint(run_command(tasks, 'add call mom'))\nprint(run_command(tasks, 'done 1'))\nprint(run_command(tasks, 'list'))\nprint(run_command(tasks, 'remove 2'))\nprint(run_command(tasks, 'done 9'))\nprint(run_command(tasks, 'dance'))\nprint(run_command([], 'list'))"},{"expected":"added: a\nadded: b\ncompleted: a\n1. [x] a\n2. [ ] b","stdin":"add a\nadd b\ndone 1\nlist\nquit\n"}],"extend":["Save the tasks to a file so they survive restarts.","Add priorities and sort by them.","Add `undo` for the last command."],"local_only":false},{"slug":"password-generator","level":2,"order":7,"title":"Password generator","requires":29,"goal":"Generate random passwords that always contain every kind of character you ask for, and rate how strong a password is.","requirements":["`generate_password(length=12, digits=True, symbols=True)` returns a password of exactly `length` characters with at least one lower-case letter, one upper-case letter, one digit (if `digits`) and one symbol from `SYMBOLS` (if `symbols`).","If `length` is smaller than the number of required character kinds, raise `ValueError(\"password too short\")`.","`strength(password)` returns `\"weak\"` (under 8 characters), `\"strong\"` (12 or more characters containing all four kinds) or `\"medium\"`.","Use `random.SystemRandom` (already set up as `RNG`): it is suitable for passwords."],"milestones":[{"title":"The character pools","detail":"Use the string module for letters and digits."},{"title":"Guarantee one of each","detail":"Pick one character from every pool first, then fill up randomly and shuffle."},{"title":"Rate it","detail":"Count which kinds a password contains."}],"hints":["`string.ascii_lowercase`, `string.ascii_uppercase`, `string.digits`.","`RNG.choice(pool)` picks one character; `RNG.shuffle(list)` mixes the list.","Joining the pools with `\"\".join(pools)` gives you every allowed character."],"starter":"import random\nimport string\nSYMBOLS = '!@#$%^&*()-_=+'\nRNG = random.SystemRandom()\n\ndef generate_password(length=12, digits=True, symbols=True):\n    \"\"\"Return a random password of the given length containing every enabled kind of character.\"\"\"\n    pass\n\ndef strength(password):\n    \"\"\"Return 'weak', 'medium' or 'strong'.\"\"\"\n    pass\n\ndef main():\n    length = int(input('Length? '))\n    password = generate_password(length)\n    print(password)\n    print('strength:', strength(password))\nif __name__ == '__main__':\n    main()\n","solution":"import random\nimport string\n\nSYMBOLS = \"!@#$%^&*()-_=+\"\nRNG = random.SystemRandom()\n\n\ndef generate_password(length=12, digits=True, symbols=True):\n    pools = [string.ascii_lowercase, string.ascii_uppercase]\n    if digits:\n        pools.append(string.digits)\n    if symbols:\n        pools.append(SYMBOLS)\n    if length < len(pools):\n        raise ValueError(\"password too short\")\n    chars = [RNG.choice(pool) for pool in pools]\n    everything = \"\".join(pools)\n    chars += [RNG.choice(everything) for _ in range(length - len(chars))]\n    RNG.shuffle(chars)\n    return \"\".join(chars)\n\n\ndef strength(password):\n    classes = [\n        any(c.islower() for c in password),\n        any(c.isupper() for c in password),\n        any(c.isdigit() for c in password),\n        any(c in SYMBOLS for c in password),\n    ]\n    if len(password) < 8:\n        return \"weak\"\n    if len(password) >= 12 and all(classes):\n        return \"strong\"\n    return \"medium\"\n\n\ndef main():\n    length = int(input(\"Length? \"))\n    password = generate_password(length)\n    print(password)\n    print(\"strength:\", strength(password))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"16 True True True True\nTrue\npassword too short","append":"pw = generate_password(16)\nprint(len(pw), any(c.islower() for c in pw), any(c.isupper() for c in pw), any(c.isdigit() for c in pw), any(c in SYMBOLS for c in pw))\nprint(all(generate_password(8, digits=False, symbols=False).isalpha() for _ in range(30)))\ntry:\n    generate_password(3)\nexcept ValueError as e:\n    print(e)"},{"expected":"True","append":"ok = True\nfor _ in range(200):\n    p = generate_password(10)\n    ok = ok and len(p) == 10 and any(c.isdigit() for c in p) and any(c in SYMBOLS for c in p) and any(c.isupper() for c in p) and any(c.islower() for c in p)\nprint(ok)"},{"expected":"weak\nmedium\nstrong\nmedium","append":"print(strength('abc'))\nprint(strength('abcdefgh1'))\nprint(strength('Abcdefgh123!'))\nprint(strength('Abcdefghijklmnop'))"}],"extend":["Add a passphrase mode that joins random words.","Exclude look-alike characters such as `0`, `O`, `l`, `1`.","Copy the password to the clipboard (hint: it needs a third-party package)."],"local_only":false},{"slug":"hangman","level":2,"order":8,"title":"Hangman","requires":15,"goal":"Build hangman: guess a hidden word letter by letter before you run out of lives.","requirements":["`mask_word(word, guessed)` shows the word with `_` for letters not guessed yet, separated by spaces: `p _ _ _ o _`.","`play(word, letters, max_wrong=6)` processes the guessed letters in order and returns a tuple `(state, wrong)` where `state` is `\"won\"` (every letter found), `\"lost\"` (`max_wrong` wrong guesses) or `\"playing\"`.","Guessing the same letter again changes nothing; letters are case-insensitive.","`main()` plays interactively with a random word (given)."],"milestones":[{"title":"Show the word","detail":"Write mask_word with a set of guessed letters."},{"title":"Track guesses","detail":"Count wrong guesses and ignore repeats."},{"title":"Win or lose","detail":"Return the right state as early as possible."}],"hints":["A set is perfect for the guessed letters.","`letter not in word` means a wrong guess.","You have won when `all(ch in guessed for ch in word)`."],"starter":"import random\nWORDS = ['python', 'variable', 'function', 'program', 'keyboard', 'terminal']\n\ndef mask_word(word, guessed):\n    \"\"\"Return the word with unguessed letters shown as '_' separated by spaces.\"\"\"\n    pass\n\ndef play(word, letters, max_wrong=6):\n    \"\"\"Return (state, wrong): state is 'won', 'lost' or 'playing'.\"\"\"\n    pass\n\ndef main():\n    word = random.choice(WORDS)\n    guessed = set()\n    wrong = 0\n    while wrong < 6 and (not all((ch in guessed for ch in word))):\n        print(mask_word(word, guessed), f'({6 - wrong} lives left)')\n        letter = input('Letter? ').strip().lower()\n        if letter and letter not in guessed:\n            guessed.add(letter[0])\n            if letter[0] not in word:\n                wrong += 1\n    print('You won!' if wrong < 6 else f'You lost. The word was {word}.')\nif __name__ == '__main__':\n    main()\n","solution":"import random\n\nWORDS = [\"python\", \"variable\", \"function\", \"program\", \"keyboard\", \"terminal\"]\n\n\ndef mask_word(word, guessed):\n    return \" \".join(ch if ch in guessed else \"_\" for ch in word)\n\n\ndef play(word, letters, max_wrong=6):\n    guessed = set()\n    wrong = 0\n    for letter in letters:\n        letter = letter.lower()\n        if letter in guessed:\n            continue\n        guessed.add(letter)\n        if letter not in word:\n            wrong += 1\n        if wrong >= max_wrong:\n            return \"lost\", wrong\n        if all(ch in guessed for ch in word):\n            return \"won\", wrong\n    return \"playing\", wrong\n\n\ndef main():\n    word = random.choice(WORDS)\n    guessed = set()\n    wrong = 0\n    while wrong < 6 and not all(ch in guessed for ch in word):\n        print(mask_word(word, guessed), f\"({6 - wrong} lives left)\")\n        letter = input(\"Letter? \").strip().lower()\n        if letter and letter not in guessed:\n            guessed.add(letter[0])\n            if letter[0] not in word:\n                wrong += 1\n    print(\"You won!\" if wrong < 6 else f\"You lost. The word was {word}.\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"p _ _ _ o _\n_ _ _\nc a t","append":"print(mask_word('python', {'p', 'o'}))\nprint(mask_word('cat', set()))\nprint(mask_word('cat', {'c', 'a', 't'}))"},{"expected":"('won', 0)\n('lost', 6)\n('playing', 1)\n('playing', 1)\n('won', 1)","append":"print(play('cat', ['c', 'a', 't']))\nprint(play('cat', ['x', 'y', 'z', 'q', 'w', 'e']))\nprint(play('cat', ['c', 'x']))\nprint(play('cat', ['x', 'x', 'x']))\nprint(play('cat', ['X', 'C', 'A', 'T']))"}],"extend":["Draw the hangman with text art that grows with each wrong guess.","Load words from a file and choose by difficulty.","Reveal a hint after 3 wrong guesses."],"local_only":false},{"slug":"quiz-app","level":2,"order":9,"title":"Quiz app","requires":17,"goal":"Build a multiple-choice quiz where each question is a dictionary, with scoring and a final grade.","requirements":["A question is a dict: `{\"question\": text, \"options\": [..], \"answer\": index_of_correct_option}`.","`format_question(q)` returns the question text followed by the options numbered from 1 as `1) text`, one per line.","`check_answer(q, choice)` returns True when the 1-based `choice` is the correct option.","`run_quiz(questions, choices)` returns the score; missing answers count as wrong.","`grade(score, total)` returns `A` (90% or more), `B` (75%+), `C` (50%+) or `F`."],"milestones":[{"title":"Show a question","detail":"Number the options from 1."},{"title":"Score the answers","detail":"Compare each choice with the stored answer index."},{"title":"Grade","detail":"Turn the ratio into a letter."}],"hints":["Players count from 1 but `answer` is a list index: subtract 1.","`zip(questions, choices)` pairs them up and stops at the shorter list.","ratio = score / total."],"starter":"QUESTIONS = [{'question': 'What is 2 + 2?', 'options': ['3', '4', '5'], 'answer': 1}, {'question': 'Which keyword defines a function?', 'options': ['func', 'def', 'fn'], 'answer': 1}, {'question': \"What does len('abc') return?\", 'options': ['3', '2', 'abc'], 'answer': 0}]\n\ndef format_question(question):\n    \"\"\"Return the question followed by numbered options (1) ..., 2) ...), one per line.\"\"\"\n    pass\n\ndef check_answer(question, choice):\n    \"\"\"True if the 1-based choice is the correct option.\"\"\"\n    pass\n\ndef run_quiz(questions, choices):\n    \"\"\"Return how many of the choices are correct.\"\"\"\n    pass\n\ndef grade(score, total):\n    \"\"\"Return A, B, C or F.\"\"\"\n    pass\n\ndef main():\n    choices = []\n    for question in QUESTIONS:\n        print(format_question(question))\n        choices.append(int(input('Your answer: ')))\n    score = run_quiz(QUESTIONS, choices)\n    print(f'Score: {score}/{len(QUESTIONS)} ({grade(score, len(QUESTIONS))})')\nif __name__ == '__main__':\n    main()\n","solution":"QUESTIONS = [\n    {\"question\": \"What is 2 + 2?\", \"options\": [\"3\", \"4\", \"5\"], \"answer\": 1},\n    {\"question\": \"Which keyword defines a function?\", \"options\": [\"func\", \"def\", \"fn\"], \"answer\": 1},\n    {\"question\": \"What does len('abc') return?\", \"options\": [\"3\", \"2\", \"abc\"], \"answer\": 0},\n]\n\n\ndef format_question(question):\n    lines = [question[\"question\"]]\n    for number, option in enumerate(question[\"options\"], 1):\n        lines.append(f\"{number}) {option}\")\n    return \"\\n\".join(lines)\n\n\ndef check_answer(question, choice):\n    return choice - 1 == question[\"answer\"]\n\n\ndef run_quiz(questions, choices):\n    score = 0\n    for question, choice in zip(questions, choices):\n        if check_answer(question, choice):\n            score += 1\n    return score\n\n\ndef grade(score, total):\n    ratio = score / total\n    if ratio >= 0.9:\n        return \"A\"\n    if ratio >= 0.75:\n        return \"B\"\n    if ratio >= 0.5:\n        return \"C\"\n    return \"F\"\n\n\ndef main():\n    choices = []\n    for question in QUESTIONS:\n        print(format_question(question))\n        choices.append(int(input(\"Your answer: \")))\n    score = run_quiz(QUESTIONS, choices)\n    print(f\"Score: {score}/{len(QUESTIONS)} ({grade(score, len(QUESTIONS))})\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"2+2?\n1) 3\n2) 4\n3) 5\nTrue\nFalse","append":"q = {'question': '2+2?', 'options': ['3', '4', '5'], 'answer': 1}\nprint(format_question(q))\nprint(check_answer(q, 2))\nprint(check_answer(q, 1))"},{"expected":"2\n0\n1","append":"qs = [{'question': 'a', 'options': ['x', 'y', 'z'], 'answer': 1}, {'question': 'b', 'options': ['p', 'q'], 'answer': 0}]\nprint(run_quiz(qs, [2, 1]))\nprint(run_quiz(qs, [1, 2]))\nprint(run_quiz(qs, [2]))"},{"expected":"A\nB\nC\nF","append":"print(grade(9, 10))\nprint(grade(8, 10))\nprint(grade(5, 10))\nprint(grade(1, 10))"}],"extend":["Shuffle the questions and options each game.","Load the questions from a JSON file.","Keep a high-score table."],"local_only":false},{"slug":"tic-tac-toe","level":2,"order":10,"title":"Tic-tac-toe","requires":17,"goal":"Two players take turns on a 3x3 board stored as a list of lists. Detect wins, draws and illegal moves.","requirements":["`new_board()` returns a 3x3 list of lists filled with single spaces `\" \"` (each row must be its own list).","`place(board, row, col, mark)` puts the mark on the board; it raises `ValueError(\"off the board\")` outside 0-2 and `ValueError(\"cell taken\")` on an occupied cell.","`winner(board)` returns `\"X\"`, `\"O\"` or `None`; `is_full(board)` says whether no space is left.","`format_board(board)` returns the three rows joined as `X | O |  ` with a line of nine dashes between rows.","`play(moves)` takes a list of `(row, col)` moves (X starts, then O, alternating) and returns `\"X\"`, `\"O\"`, `\"draw\"` or `\"unfinished\"`; it stops at the first win."],"milestones":[{"title":"The board","detail":"Create it without sharing rows between lists."},{"title":"Winning lines","detail":"List the 8 winning lines and check them."},{"title":"Replay a game","detail":"Alternate marks and stop at a win or full board."}],"hints":["`[[\" \"] * 3 for _ in range(3)]` makes three separate rows.","A line wins when its 3 cells are equal and not a space.","Store the 8 lines as lists of `(row, col)` pairs."],"starter":"LINES = [[(0, 0), (0, 1), (0, 2)], [(1, 0), (1, 1), (1, 2)], [(2, 0), (2, 1), (2, 2)], [(0, 0), (1, 0), (2, 0)], [(0, 1), (1, 1), (2, 1)], [(0, 2), (1, 2), (2, 2)], [(0, 0), (1, 1), (2, 2)], [(0, 2), (1, 1), (2, 0)]]\n\ndef new_board():\n    \"\"\"Return a 3x3 list of lists of ' '.\"\"\"\n    pass\n\ndef place(board, row, col, mark):\n    \"\"\"Put mark on the board. Raise ValueError('off the board') or ValueError('cell taken') for illegal moves.\"\"\"\n    pass\n\ndef winner(board):\n    \"\"\"Return 'X', 'O' or None.\"\"\"\n    pass\n\ndef is_full(board):\n    \"\"\"True when no empty cell is left.\"\"\"\n    pass\n\ndef format_board(board):\n    \"\"\"Return the board as text: rows joined with ' | ', separated by a line of 9 dashes.\"\"\"\n    pass\n\ndef play(moves):\n    \"\"\"Replay (row, col) moves, X first. Return 'X', 'O', 'draw' or 'unfinished'.\"\"\"\n    pass\n\ndef main():\n    board = new_board()\n    mark = 'X'\n    while not winner(board) and (not is_full(board)):\n        print(format_board(board))\n        row, col = (int(n) for n in input(f'{mark} plays (row col, 0-2)? ').split())\n        try:\n            place(board, row, col, mark)\n        except ValueError as error:\n            print(error)\n            continue\n        mark = 'O' if mark == 'X' else 'X'\n    print(format_board(board))\n    print(f'{winner(board)} wins!' if winner(board) else 'It is a draw.')\nif __name__ == '__main__':\n    main()\n","solution":"LINES = [\n    [(0, 0), (0, 1), (0, 2)], [(1, 0), (1, 1), (1, 2)], [(2, 0), (2, 1), (2, 2)],\n    [(0, 0), (1, 0), (2, 0)], [(0, 1), (1, 1), (2, 1)], [(0, 2), (1, 2), (2, 2)],\n    [(0, 0), (1, 1), (2, 2)], [(0, 2), (1, 1), (2, 0)],\n]\n\n\ndef new_board():\n    return [[\" \"] * 3 for _ in range(3)]\n\n\ndef place(board, row, col, mark):\n    if not (0 <= row < 3 and 0 <= col < 3):\n        raise ValueError(\"off the board\")\n    if board[row][col] != \" \":\n        raise ValueError(\"cell taken\")\n    board[row][col] = mark\n\n\ndef winner(board):\n    for line in LINES:\n        marks = [board[r][c] for r, c in line]\n        if marks[0] != \" \" and marks.count(marks[0]) == 3:\n            return marks[0]\n    return None\n\n\ndef is_full(board):\n    return all(cell != \" \" for row in board for cell in row)\n\n\ndef format_board(board):\n    return \"\\n---------\\n\".join(\" | \".join(row) for row in board)\n\n\ndef play(moves):\n    board = new_board()\n    mark = \"X\"\n    for row, col in moves:\n        place(board, row, col, mark)\n        if winner(board):\n            return winner(board)\n        if is_full(board):\n            return \"draw\"\n        mark = \"O\" if mark == \"X\" else \"X\"\n    return \"unfinished\"\n\n\ndef main():\n    board = new_board()\n    mark = \"X\"\n    while not winner(board) and not is_full(board):\n        print(format_board(board))\n        row, col = (int(n) for n in input(f\"{mark} plays (row col, 0-2)? \").split())\n        try:\n            place(board, row, col, mark)\n        except ValueError as error:\n            print(error)\n            continue\n        mark = \"O\" if mark == \"X\" else \"X\"\n    print(format_board(board))\n    print(f\"{winner(board)} wins!\" if winner(board) else \"It is a draw.\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"X\nO\ndraw\nunfinished","append":"print(play([(0,0),(1,0),(0,1),(1,1),(0,2)]))\nprint(play([(0,0),(1,0),(0,1),(1,1),(2,2),(1,2)]))\nprint(play([(0,0),(0,1),(0,2),(1,1),(1,0),(1,2),(2,1),(2,0),(2,2)]))\nprint(play([(0,0),(1,1)]))"},{"expected":"cell taken\noff the board\nX |   |\n---------\n  | O |\n---------\n  |   |\nNone\nTrue","append":"b = new_board()\nplace(b, 0, 0, 'X')\ntry:\n    place(b, 0, 0, 'O')\nexcept ValueError as e:\n    print(e)\ntry:\n    place(b, 3, 0, 'O')\nexcept ValueError as e:\n    print(e)\nplace(b, 1, 1, 'O')\nprint(format_board(b))\nprint(winner(b))\nfull = [['X','O','X'],['X','O','O'],['O','X','X']]\nprint(is_full(full))"},{"expected":"True\nTrue","append":"b = new_board()\nb[0][0] = 'X'\nprint(b[1][0] == ' ')\nprint(len({id(r) for r in b}) == 3)"}],"extend":["Add a computer opponent that blocks your wins.","Make the board size configurable (4x4, 5x5).","Keep score over several games."],"local_only":false},{"slug":"contact-book","level":2,"order":11,"title":"Contact book (file storage)","requires":27,"goal":"Keep names and phone numbers in a dictionary that is saved to a JSON file, so contacts survive between runs.","requirements":["The book is a dict from name to phone number.","`add_contact(book, name, phone)` raises `ValueError(\"contact exists\")` if the name is already there.","`find(book, query)` returns a sorted list of `(name, phone)` pairs whose name contains `query`, ignoring case.","`delete_contact(book, name)` removes a contact (an unknown name raises `KeyError`).","`save(book, path)` writes JSON; `load(path)` reads it back and returns `{}` when the file does not exist."],"milestones":[{"title":"The in-memory book","detail":"Add, find and delete with a dict."},{"title":"Search","detail":"Case-insensitive partial matching."},{"title":"Persistence","detail":"Save and load with json."}],"hints":["`needle in name.lower()` does the matching.","`sorted(...)` on tuples sorts by name first.","Catch `FileNotFoundError` in `load`."],"starter":"import json\n\ndef add_contact(book, name, phone):\n    \"\"\"Add a contact. Raise ValueError('contact exists') for duplicates.\"\"\"\n    pass\n\ndef find(book, query):\n    \"\"\"Return a sorted list of (name, phone) whose name contains query (case-insensitive).\"\"\"\n    pass\n\ndef delete_contact(book, name):\n    \"\"\"Remove a contact (KeyError if missing).\"\"\"\n    pass\n\ndef save(book, path):\n    \"\"\"Write the book to path as JSON.\"\"\"\n    pass\n\ndef load(path):\n    \"\"\"Read the book from path; return {} if the file does not exist.\"\"\"\n    pass\n\ndef main():\n    path = 'contacts.json'\n    book = load(path)\n    while True:\n        parts = input('> ').split()\n        if not parts or parts[0] == 'quit':\n            break\n        if parts[0] == 'add' and len(parts) == 3:\n            try:\n                add_contact(book, parts[1], parts[2])\n            except ValueError as error:\n                print(error)\n        elif parts[0] == 'find' and len(parts) == 2:\n            for name, phone in find(book, parts[1]):\n                print(name, phone)\n        elif parts[0] == 'del' and len(parts) == 2:\n            try:\n                delete_contact(book, parts[1])\n            except KeyError:\n                print('no such contact')\n        else:\n            print('commands: add NAME PHONE | find TEXT | del NAME | quit')\n    save(book, path)\nif __name__ == '__main__':\n    main()\n","solution":"import json\n\n\ndef add_contact(book, name, phone):\n    if name in book:\n        raise ValueError(\"contact exists\")\n    book[name] = phone\n\n\ndef find(book, query):\n    needle = query.lower()\n    return sorted((name, phone) for name, phone in book.items() if needle in name.lower())\n\n\ndef delete_contact(book, name):\n    del book[name]\n\n\ndef save(book, path):\n    with open(path, \"w\") as f:\n        json.dump(book, f, indent=2)\n\n\ndef load(path):\n    try:\n        with open(path) as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return {}\n\n\ndef main():\n    path = \"contacts.json\"\n    book = load(path)\n    while True:\n        parts = input(\"> \").split()\n        if not parts or parts[0] == \"quit\":\n            break\n        if parts[0] == \"add\" and len(parts) == 3:\n            try:\n                add_contact(book, parts[1], parts[2])\n            except ValueError as error:\n                print(error)\n        elif parts[0] == \"find\" and len(parts) == 2:\n            for name, phone in find(book, parts[1]):\n                print(name, phone)\n        elif parts[0] == \"del\" and len(parts) == 2:\n            try:\n                delete_contact(book, parts[1])\n            except KeyError:\n                print(\"no such contact\")\n        else:\n            print(\"commands: add NAME PHONE | find TEXT | del NAME | quit\")\n    save(book, path)\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"[('Alan', '555-2')]\n[('Ada', '555-1'), ('Alan', '555-2')]\ncontact exists\n['Ada', 'Alan']\nmissing","append":"book = {}\nadd_contact(book, 'Ada', '555-1')\nadd_contact(book, 'Alan', '555-2')\nadd_contact(book, 'Bob', '555-3')\nprint(find(book, 'al'))\nprint(find(book, 'A'))\ntry:\n    add_contact(book, 'Ada', '000')\nexcept ValueError as e:\n    print(e)\ndelete_contact(book, 'Bob')\nprint(sorted(book))\ntry:\n    delete_contact(book, 'Bob')\nexcept KeyError:\n    print('missing')"},{"expected":"True\n{}","append":"book = {'Ada': '555-1'}\nsave(book, 'c.json')\nprint(load('c.json') == book)\nprint(load('nope.json'))"}],"extend":["Store extra fields (email, birthday) in nested dicts.","Export the book to CSV.","Warn about contacts with the same phone number."],"local_only":false},{"slug":"expense-tracker","level":3,"order":12,"title":"Expense tracker (CSV)","requires":27,"goal":"Read expenses from CSV text, summarise them by category and month, and write them back out as CSV.","requirements":["CSV format: a header `date,category,amount` then one row per expense (`2024-03-01,food,12.50`).","`parse_expenses(csv_text)` returns a list of dicts with the amount converted to `float`.","`total_by_category(expenses)` returns a dict of category to total (rounded to 2 decimals) with the categories in alphabetical order.","`monthly_total(expenses, month)` sums the expenses whose date starts with `month` (like `\"2024-03\"`), rounded to 2 decimals.","`biggest_category(expenses)` returns the category with the highest total (or None).","`to_csv(expenses)` returns CSV text with the header and amounts formatted with 2 decimals."],"milestones":[{"title":"Parse","detail":"Use csv.DictReader with io.StringIO."},{"title":"Summaries","detail":"Totals per category and per month."},{"title":"Round trip","detail":"Write CSV that parse_expenses can read again."}],"hints":["`csv.DictReader(io.StringIO(text))` reads CSV from a string.","A dict with `.get(key, 0)` is the easiest accumulator.","`max(totals, key=totals.get)` finds the key with the largest value."],"starter":"import csv\nimport io\nimport sys\n\ndef parse_expenses(csv_text):\n    \"\"\"Return a list of {'date','category','amount'} dicts (amount as float).\"\"\"\n    pass\n\ndef total_by_category(expenses):\n    \"\"\"Return {category: total} sorted by category, totals rounded to 2 decimals.\"\"\"\n    pass\n\ndef monthly_total(expenses, month):\n    \"\"\"Sum of the amounts whose date starts with month ('YYYY-MM'), rounded to 2 decimals.\"\"\"\n    pass\n\ndef biggest_category(expenses):\n    \"\"\"Category with the largest total, or None for no expenses.\"\"\"\n    pass\n\ndef to_csv(expenses):\n    \"\"\"Return CSV text: header date,category,amount then one row per expense with the amount as 12.50.\"\"\"\n    pass\n\ndef main():\n    expenses = parse_expenses(sys.stdin.read())\n    for category, total in total_by_category(expenses).items():\n        print(f'{category}: {total:.2f}')\n    print('biggest:', biggest_category(expenses))\nif __name__ == '__main__':\n    main()\n","solution":"import csv\nimport io\nimport sys\n\n\ndef parse_expenses(csv_text):\n    reader = csv.DictReader(io.StringIO(csv_text))\n    return [{\"date\": row[\"date\"], \"category\": row[\"category\"], \"amount\": float(row[\"amount\"])} for row in reader]\n\n\ndef total_by_category(expenses):\n    totals = {}\n    for expense in expenses:\n        totals[expense[\"category\"]] = totals.get(expense[\"category\"], 0) + expense[\"amount\"]\n    return {category: round(totals[category], 2) for category in sorted(totals)}\n\n\ndef monthly_total(expenses, month):\n    return round(sum(e[\"amount\"] for e in expenses if e[\"date\"].startswith(month)), 2)\n\n\ndef biggest_category(expenses):\n    totals = total_by_category(expenses)\n    return max(totals, key=totals.get) if totals else None\n\n\ndef to_csv(expenses):\n    out = io.StringIO()\n    writer = csv.writer(out, lineterminator=\"\\n\")\n    writer.writerow([\"date\", \"category\", \"amount\"])\n    for e in expenses:\n        writer.writerow([e[\"date\"], e[\"category\"], f\"{e['amount']:.2f}\"])\n    return out.getvalue()\n\n\ndef main():\n    expenses = parse_expenses(sys.stdin.read())\n    for category, total in total_by_category(expenses).items():\n        print(f\"{category}: {total:.2f}\")\n    print(\"biggest:\", biggest_category(expenses))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"4\n{'food': 19.75, 'rent': 500.0, 'transport': 3.2}\n22.95\nrent\n['date,category,amount', '2024-03-01,food,12.50']\nTrue","append":"SAMPLE = \"date,category,amount\\n2024-03-01,food,12.50\\n2024-03-02,transport,3.20\\n2024-03-05,food,7.25\\n2024-04-01,rent,500\\n\"\nex = parse_expenses(SAMPLE)\nprint(len(ex))\nprint(total_by_category(ex))\nprint(monthly_total(ex, '2024-03'))\nprint(biggest_category(ex))\nprint(to_csv(ex).splitlines()[:2])\nprint(parse_expenses(to_csv(ex)) == ex)"},{"expected":"food: 19.75\nrent: 500.00\ntransport: 3.20\nbiggest: rent","stdin":"date,category,amount\n2024-03-01,food,12.50\n2024-03-02,transport,3.20\n2024-03-05,food,7.25\n2024-04-01,rent,500\n"},{"expected":"None","append":"print(biggest_category([]))"}],"extend":["Add budgets per category and warn when one is exceeded.","Support several currencies.","Draw a text bar chart of the totals."],"local_only":false},{"slug":"text-adventure","level":3,"order":13,"title":"Text adventure","requires":17,"goal":"Build a small data-driven adventure: rooms are nested dictionaries, a `Game` object tracks where you are and what you carry.","requirements":["A room is a dict with `description`, `exits` (direction to room name), `items` (a list) and optionally `locked: True`. `ROOMS` is given.","`describe(room)` returns the description, followed by ` Items: a, b.` when the room has items (given).","`Game(rooms).do(command)` returns a list of output lines. Commands: `look`, `go DIRECTION`, `take ITEM`, `inventory`.","Going where there is no exit gives `You can't go that way.`; a locked room without the `key` in your inventory gives `The door is locked.`; unknown commands give `Unknown command.`.","`take X` moves the item to your inventory (`Taken: X.`) or says `No X here.`. Taking the `treasure` adds `You win!` and sets `game.won = True`.","`run_game(rooms, commands)` plays a list of commands and returns every output line, stopping after a win."],"milestones":[{"title":"Look around","detail":"look and describe."},{"title":"Move","detail":"go with exits and locked doors."},{"title":"Pick things up","detail":"take, inventory and winning."}],"hints":["`room[\"exits\"].get(direction)` is None for a missing exit.","Rooms hold their own item lists, so `list.remove` takes an item out of a room.","`self.rooms[target].get(\"locked\")` is falsy for rooms without the key."],"starter":"import copy\nROOMS = {'hall': {'description': 'A dusty hall.', 'exits': {'north': 'library'}, 'items': ['lamp']}, 'library': {'description': 'Books everywhere.', 'exits': {'south': 'hall', 'east': 'vault'}, 'items': ['key']}, 'vault': {'description': 'A vault full of treasure.', 'exits': {'west': 'library'}, 'items': ['treasure'], 'locked': True}}\n\ndef describe(room):\n    text = room['description']\n    if room['items']:\n        text += ' Items: ' + ', '.join(room['items']) + '.'\n    return text\n\nclass Game:\n\n    def __init__(self, rooms):\n        \"\"\"Remember the rooms, start in 'hall' with an empty inventory and won = False.\"\"\"\n        pass\n\n    def do(self, command):\n        \"\"\"Run one command and return a list of output lines.\"\"\"\n        pass\n\ndef run_game(rooms, commands):\n    \"\"\"Play every command (stop after a win) and return all output lines.\"\"\"\n    pass\n\ndef main():\n    game = Game(copy.deepcopy(ROOMS))\n    print(describe(game.rooms[game.current]))\n    while not game.won:\n        command = input('> ')\n        if command.strip().lower() == 'quit':\n            break\n        for line in game.do(command):\n            print(line)\nif __name__ == '__main__':\n    main()\n","solution":"import copy\n\nROOMS = {\n    \"hall\": {\"description\": \"A dusty hall.\", \"exits\": {\"north\": \"library\"}, \"items\": [\"lamp\"]},\n    \"library\": {\"description\": \"Books everywhere.\", \"exits\": {\"south\": \"hall\", \"east\": \"vault\"}, \"items\": [\"key\"]},\n    \"vault\": {\"description\": \"A vault full of treasure.\", \"exits\": {\"west\": \"library\"}, \"items\": [\"treasure\"], \"locked\": True},\n}\n\n\ndef describe(room):\n    text = room[\"description\"]\n    if room[\"items\"]:\n        text += \" Items: \" + \", \".join(room[\"items\"]) + \".\"\n    return text\n\n\nclass Game:\n    def __init__(self, rooms):\n        self.rooms = rooms\n        self.current = \"hall\"\n        self.inventory = []\n        self.won = False\n\n    def do(self, command):\n        parts = command.strip().lower().split(maxsplit=1)\n        verb = parts[0] if parts else \"\"\n        argument = parts[1] if len(parts) > 1 else \"\"\n        room = self.rooms[self.current]\n        if verb == \"look\":\n            return [describe(room)]\n        if verb == \"go\":\n            target = room[\"exits\"].get(argument)\n            if target is None:\n                return [\"You can't go that way.\"]\n            if self.rooms[target].get(\"locked\") and \"key\" not in self.inventory:\n                return [\"The door is locked.\"]\n            self.current = target\n            return [describe(self.rooms[target])]\n        if verb == \"take\":\n            if argument not in room[\"items\"]:\n                return [f\"No {argument} here.\"]\n            room[\"items\"].remove(argument)\n            self.inventory.append(argument)\n            lines = [f\"Taken: {argument}.\"]\n            if argument == \"treasure\":\n                self.won = True\n                lines.append(\"You win!\")\n            return lines\n        if verb == \"inventory\":\n            if self.inventory:\n                return [\"You carry: \" + \", \".join(self.inventory) + \".\"]\n            return [\"You carry nothing.\"]\n        return [\"Unknown command.\"]\n\n\ndef run_game(rooms, commands):\n    game = Game(rooms)\n    output = []\n    for command in commands:\n        output.extend(game.do(command))\n        if game.won:\n            break\n    return output\n\n\ndef main():\n    game = Game(copy.deepcopy(ROOMS))\n    print(describe(game.rooms[game.current]))\n    while not game.won:\n        command = input(\"> \")\n        if command.strip().lower() == \"quit\":\n            break\n        for line in game.do(command):\n            print(line)\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"A dusty hall. Items: lamp.\nTaken: lamp.\nBooks everywhere. Items: key.\nTaken: key.\nA vault full of treasure. Items: treasure.\nTaken: treasure.\nYou win!","append":"rooms = {'hall': {'description': 'A dusty hall.', 'exits': {'north': 'library'}, 'items': ['lamp']}, 'library': {'description': 'Books everywhere.', 'exits': {'south': 'hall', 'east': 'vault'}, 'items': ['key']}, 'vault': {'description': 'A vault full of treasure.', 'exits': {'west': 'library'}, 'items': ['treasure'], 'locked': True}}\nfor line in run_game(rooms, ['look', 'take lamp', 'go north', 'take key', 'go east', 'take treasure', 'look']):\n    print(line)"},{"expected":"Books everywhere. Items: key.\nThe door is locked.\nYou carry nothing.\nUnknown command.\nYou can't go that way.\nNo sword here.","append":"rooms = {'hall': {'description': 'A dusty hall.', 'exits': {'north': 'library'}, 'items': ['lamp']}, 'library': {'description': 'Books everywhere.', 'exits': {'south': 'hall', 'east': 'vault'}, 'items': ['key']}, 'vault': {'description': 'A vault full of treasure.', 'exits': {'west': 'library'}, 'items': ['treasure'], 'locked': True}}\nfor line in run_game(rooms, ['go north', 'go east', 'inventory', 'dance', 'go west', 'take sword']):\n    print(line)"},{"expected":"You carry: key.\nFalse\nTrue","append":"rooms = {'hall': {'description': 'A dusty hall.', 'exits': {'north': 'library'}, 'items': ['lamp']}, 'library': {'description': 'Books everywhere.', 'exits': {'south': 'hall', 'east': 'vault'}, 'items': ['key']}, 'vault': {'description': 'A vault full of treasure.', 'exits': {'west': 'library'}, 'items': ['treasure'], 'locked': True}}\ng = Game(rooms)\ng.do('go north')\ng.do('take key')\nprint(g.do('inventory')[0])\nprint(g.won)\ng.do('go east')\ng.do('take treasure')\nprint(g.won)"}],"extend":["Add a `drop` command and heavy items.","Add monsters and a simple fight.","Load the rooms from a JSON file so players can write their own worlds."],"local_only":false},{"slug":"bank-account-system","level":3,"order":14,"title":"Bank account system (OOP)","requires":38,"goal":"Model a bank with inheritance: a base `Account` and two special account types, plus a `Bank` that holds them and moves money safely.","requirements":["`InsufficientFunds` is a custom exception. `Account(owner, balance=0)` has `deposit(amount)` and `withdraw(amount)` that return the new balance and record `(\"deposit\", amount)` / `(\"withdraw\", amount)` in `history`.","Amounts must be positive (`ValueError(\"amount must be positive\")`); withdrawing more than `available()` raises `InsufficientFunds`.","`SavingsAccount.add_interest(rate_percent)` adds interest (rounded to 2 decimals), records `(\"interest\", amount)` and returns it.","`CheckingAccount(owner, balance=0, overdraft=100)` may go below zero down to `-overdraft`: override `available()`.","`Bank.open_account(kind, owner, balance=0)` (kind `savings` or `checking`), `get(owner)`, `transfer(source, target, amount)` (nothing changes if the withdrawal fails) and `total_deposits()`."],"milestones":[{"title":"Plain accounts","detail":"Account with deposit, withdraw and history."},{"title":"Special accounts","detail":"Subclasses that override or extend behaviour."},{"title":"The bank","detail":"A registry with safe transfers."}],"hints":["Put the \"how much can I spend\" rule in `available()` so only CheckingAccount overrides it.","`super().__init__(owner, balance)` sets up the shared attributes.","In `transfer`, withdraw first: if it raises, the deposit never happens."],"starter":"class InsufficientFunds(Exception):\n    \"\"\"Raised when an account does not hold enough money.\"\"\"\n\nclass Account:\n\n    def __init__(self, owner, balance=0):\n        \"\"\"Store owner, balance and an empty history list.\"\"\"\n        pass\n\n    def available(self):\n        \"\"\"How much may be withdrawn right now.\"\"\"\n        pass\n\n    def deposit(self, amount):\n        \"\"\"Add money (amount must be positive) and return the new balance.\"\"\"\n        pass\n\n    def withdraw(self, amount):\n        \"\"\"Remove money; raise InsufficientFunds if amount > available().\"\"\"\n        pass\n\nclass SavingsAccount(Account):\n\n    def add_interest(self, rate_percent):\n        \"\"\"Add rate_percent interest (rounded to 2 decimals) and return it.\"\"\"\n        pass\n\nclass CheckingAccount(Account):\n\n    def __init__(self, owner, balance=0, overdraft=100):\n        \"\"\"Like Account but also store overdraft.\"\"\"\n        pass\n\n    def available(self):\n        \"\"\"balance plus overdraft.\"\"\"\n        pass\n\nclass Bank:\n    KINDS = {'savings': SavingsAccount, 'checking': CheckingAccount}\n\n    def __init__(self):\n        \"\"\"Start with no accounts.\"\"\"\n        pass\n\n    def open_account(self, kind, owner, balance=0):\n        \"\"\"Create and register a 'savings' or 'checking' account.\"\"\"\n        pass\n\n    def get(self, owner):\n        \"\"\"Return the account of owner.\"\"\"\n        pass\n\n    def transfer(self, source, target, amount):\n        \"\"\"Move money between two owners' accounts.\"\"\"\n        pass\n\n    def total_deposits(self):\n        \"\"\"Sum of all balances.\"\"\"\n        pass\n\ndef main():\n    bank = Bank()\n    bank.open_account('savings', 'Ann', 100)\n    bank.open_account('checking', 'Bob', 20)\n    bank.transfer('Ann', 'Bob', 60)\n    for owner, account in bank.accounts.items():\n        print(owner, account.balance)\nif __name__ == '__main__':\n    main()\n","solution":"class InsufficientFunds(Exception):\n    \"\"\"Raised when an account does not hold enough money.\"\"\"\n\n\nclass Account:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n        self.history = []\n\n    def available(self):\n        return self.balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"amount must be positive\")\n        self.balance += amount\n        self.history.append((\"deposit\", amount))\n        return self.balance\n\n    def withdraw(self, amount):\n        if amount <= 0:\n            raise ValueError(\"amount must be positive\")\n        if amount > self.available():\n            raise InsufficientFunds(f\"cannot withdraw {amount}\")\n        self.balance -= amount\n        self.history.append((\"withdraw\", amount))\n        return self.balance\n\n\nclass SavingsAccount(Account):\n    def add_interest(self, rate_percent):\n        interest = round(self.balance * rate_percent / 100, 2)\n        self.balance += interest\n        self.history.append((\"interest\", interest))\n        return interest\n\n\nclass CheckingAccount(Account):\n    def __init__(self, owner, balance=0, overdraft=100):\n        super().__init__(owner, balance)\n        self.overdraft = overdraft\n\n    def available(self):\n        return self.balance + self.overdraft\n\n\nclass Bank:\n    KINDS = {\"savings\": SavingsAccount, \"checking\": CheckingAccount}\n\n    def __init__(self):\n        self.accounts = {}\n\n    def open_account(self, kind, owner, balance=0):\n        if kind not in self.KINDS:\n            raise ValueError(\"unknown account type\")\n        if owner in self.accounts:\n            raise ValueError(\"owner already has an account\")\n        account = self.KINDS[kind](owner, balance)\n        self.accounts[owner] = account\n        return account\n\n    def get(self, owner):\n        return self.accounts[owner]\n\n    def transfer(self, source, target, amount):\n        source_account, target_account = self.get(source), self.get(target)\n        source_account.withdraw(amount)\n        target_account.deposit(amount)\n\n    def total_deposits(self):\n        return sum(account.balance for account in self.accounts.values())\n\n\ndef main():\n    bank = Bank()\n    bank.open_account(\"savings\", \"Ann\", 100)\n    bank.open_account(\"checking\", \"Bob\", 20)\n    bank.transfer(\"Ann\", \"Bob\", 60)\n    for owner, account in bank.accounts.items():\n        print(owner, account.balance)\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"150\n120\ninsufficient\namount must be positive\n[('deposit', 50), ('withdraw', 30)]","append":"a = Account('Ann', 100)\nprint(a.deposit(50))\nprint(a.withdraw(30))\ntry:\n    a.withdraw(500)\nexcept InsufficientFunds:\n    print('insufficient')\ntry:\n    a.deposit(-5)\nexcept ValueError as e:\n    print(e)\nprint(a.history)"},{"expected":"10.0\n210.0\n-70\ninsufficient","append":"s = SavingsAccount('Sam', 200)\nprint(s.add_interest(5))\nprint(s.balance)\nc = CheckingAccount('Cy', 50)\nprint(c.withdraw(120))\ntry:\n    c.withdraw(100)\nexcept InsufficientFunds:\n    print('insufficient')"},{"expected":"40 80\nfailed\n40 80\n120\nTrue\nTrue","append":"bank = Bank()\nbank.open_account('savings', 'Ann', 100)\nbank.open_account('checking', 'Bob', 20)\nbank.transfer('Ann', 'Bob', 60)\nprint(bank.get('Ann').balance, bank.get('Bob').balance)\ntry:\n    bank.transfer('Ann', 'Bob', 500)\nexcept InsufficientFunds:\n    print('failed')\nprint(bank.get('Ann').balance, bank.get('Bob').balance)\nprint(bank.total_deposits())\nprint(isinstance(bank.get('Ann'), SavingsAccount))\nprint(issubclass(CheckingAccount, Account))"}],"extend":["Add monthly fees to CheckingAccount.","Print an account statement from the history.","Persist the bank to JSON."],"local_only":false},{"slug":"inventory-manager","level":3,"order":15,"title":"Inventory manager","requires":37,"goal":"Track a shop's stock with a class: add products, sell and restock them, find what is running low and print a report.","requirements":["`add_item(sku, name, qty, price)` registers a product; a duplicate SKU raises `ValueError(\"sku exists\")`; negative quantity or price raises `ValueError(\"qty and price must not be negative\")`.","`restock(sku, qty)` adds stock; `remove_stock(sku, qty)` removes it and returns what is left, raising `ValueError(\"not enough stock\")` when there is too little. Unknown SKUs raise `KeyError`.","`total_value()` is the sum of quantity times price, rounded to 2 decimals.","`low_stock(threshold)` returns the sorted SKUs whose quantity is at or below the threshold.","`report()` returns a table: a header line `SKU NAME QTY PRICE` and one line per product (sorted by SKU) with the columns aligned (`f\"{x:<6}\"`, `>4`, `>8.2f`)."],"milestones":[{"title":"Products","detail":"Store each product as a dict under its SKU."},{"title":"Stock changes","detail":"Validate before changing quantities."},{"title":"Reports","detail":"Totals, low stock and the aligned table."}],"hints":["A private helper `_get(sku)` that raises KeyError avoids repeating checks.","Validate first, change state last.","Format specs like `{name:<10}` pad on the right, `{qty:>4}` pad on the left."],"starter":"class Inventory:\n\n    def __init__(self):\n        \"\"\"Start with no items (a dict from sku to a dict with name, qty, price).\"\"\"\n        pass\n\n    def _get(self, sku):\n        \"\"\"Return the item for sku or raise KeyError.\"\"\"\n        pass\n\n    def add_item(self, sku, name, qty, price):\n        \"\"\"Register a new product (validate duplicates and negative values).\"\"\"\n        pass\n\n    def restock(self, sku, qty):\n        \"\"\"Add qty to the stock of sku.\"\"\"\n        pass\n\n    def remove_stock(self, sku, qty):\n        \"\"\"Remove qty from the stock and return what is left; ValueError('not enough stock') if too little.\"\"\"\n        pass\n\n    def total_value(self):\n        \"\"\"Sum of qty * price, rounded to 2 decimals.\"\"\"\n        pass\n\n    def low_stock(self, threshold):\n        \"\"\"Sorted SKUs with qty <= threshold.\"\"\"\n        pass\n\n    def report(self):\n        \"\"\"Aligned text table: header plus one line per product sorted by SKU.\"\"\"\n        pass\n\ndef main():\n    inv = Inventory()\n    inv.add_item('A1', 'Pen', 10, 1.5)\n    inv.add_item('B2', 'Notebook', 3, 4.25)\n    print(inv.report())\n    print('total value:', inv.total_value())\nif __name__ == '__main__':\n    main()\n","solution":"class Inventory:\n    def __init__(self):\n        self.items = {}\n\n    def _get(self, sku):\n        if sku not in self.items:\n            raise KeyError(f\"unknown sku {sku}\")\n        return self.items[sku]\n\n    def add_item(self, sku, name, qty, price):\n        if sku in self.items:\n            raise ValueError(\"sku exists\")\n        if qty < 0 or price < 0:\n            raise ValueError(\"qty and price must not be negative\")\n        self.items[sku] = {\"name\": name, \"qty\": qty, \"price\": price}\n\n    def restock(self, sku, qty):\n        self._get(sku)[\"qty\"] += qty\n\n    def remove_stock(self, sku, qty):\n        item = self._get(sku)\n        if qty > item[\"qty\"]:\n            raise ValueError(\"not enough stock\")\n        item[\"qty\"] -= qty\n        return item[\"qty\"]\n\n    def total_value(self):\n        return round(sum(i[\"qty\"] * i[\"price\"] for i in self.items.values()), 2)\n\n    def low_stock(self, threshold):\n        return sorted(sku for sku, i in self.items.items() if i[\"qty\"] <= threshold)\n\n    def report(self):\n        lines = [f\"{'SKU':<6}{'NAME':<10}{'QTY':>4}{'PRICE':>8}\"]\n        for sku in sorted(self.items):\n            item = self.items[sku]\n            lines.append(f\"{sku:<6}{item['name']:<10}{item['qty']:>4}{item['price']:>8.2f}\")\n        return \"\\n\".join(lines)\n\n\ndef main():\n    inv = Inventory()\n    inv.add_item(\"A1\", \"Pen\", 10, 1.5)\n    inv.add_item(\"B2\", \"Notebook\", 3, 4.25)\n    print(inv.report())\n    print(\"total value:\", inv.total_value())\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"27.75\n['B2', 'C3']\n7\n4\n['SKU', 'NAME', 'QTY', 'PRICE']\n['A1', 'Pen', '7', '1.50']\n4","append":"inv = Inventory()\ninv.add_item('A1', 'Pen', 10, 1.5)\ninv.add_item('B2', 'Notebook', 3, 4.25)\ninv.add_item('C3', 'Ink', 0, 7)\nprint(inv.total_value())\nprint(inv.low_stock(3))\nprint(inv.remove_stock('A1', 3))\ninv.restock('C3', 4)\nprint(inv.items['C3']['qty'])\nlines = inv.report().splitlines()\nprint(lines[0].split())\nprint(lines[1].split())\nprint(len(lines))"},{"expected":"sku exists\nnot enough stock\nKeyError\nqty and price must not be negative","append":"inv = Inventory()\ninv.add_item('A1', 'Pen', 1, 1)\ntry:\n    inv.add_item('A1', 'Pen', 1, 1)\nexcept ValueError as e:\n    print(e)\ntry:\n    inv.remove_stock('A1', 5)\nexcept ValueError as e:\n    print(e)\ntry:\n    inv.restock('ZZ', 1)\nexcept KeyError:\n    print('KeyError')\ntry:\n    inv.add_item('B', 'x', -1, 1)\nexcept ValueError as e:\n    print(e)"}],"extend":["Add a `sell(sku, qty)` method that returns the revenue.","Save and load the inventory as JSON.","Warn automatically when stock drops below a per-item minimum."],"local_only":false},{"slug":"library-manager","level":3,"order":16,"title":"Library manager (dataclasses)","requires":42,"goal":"Manage a library's books and members with dataclasses and a `Library` class that enforces the lending rules.","requirements":["`Book(isbn, title, author, available=True)` and `Member(name, borrowed=[])` are dataclasses (`borrowed` needs `field(default_factory=list)`).","`Library.add_book(book)` (duplicate ISBN raises `ValueError(\"duplicate isbn\")`), `join(name)` (duplicate raises `ValueError(\"already a member\")`).","`checkout(isbn, member_name)` raises `KeyError` for an unknown book or member, `ValueError(\"book not available\")` if lent out and `ValueError(\"loan limit reached\")` when the member already holds `MAX_LOANS` (3) books.","`return_book(isbn)` makes the book available again (`ValueError(\"book was not borrowed\")` if it was not lent out).","`search(text)` returns sorted titles whose title or author contains the text (case-insensitive); `available_titles()` and `member_books(name)` return sorted titles."],"milestones":[{"title":"Data classes","detail":"Book and Member."},{"title":"Lending rules","detail":"checkout and return_book with checks in the right order."},{"title":"Queries","detail":"search, available_titles, member_books."}],"hints":["Check existence first, then availability, then the loan limit.","A book is borrowed when `available` is False and its ISBN is in some member's `borrowed` list.","`sorted(generator)` keeps the code short."],"starter":"from dataclasses import dataclass, field\n\n@dataclass\nclass Book:\n    isbn: str\n    title: str\n    author: str\n    available: bool = True\n\n@dataclass\nclass Member:\n    name: str\n    borrowed: list = field(default_factory=list)\n\nclass Library:\n    MAX_LOANS = 3\n\n    def __init__(self):\n        \"\"\"Start with empty books and members dicts.\"\"\"\n        pass\n\n    def add_book(self, book):\n        \"\"\"Register a book by ISBN (no duplicates).\"\"\"\n        pass\n\n    def join(self, name):\n        \"\"\"Register a new member.\"\"\"\n        pass\n\n    def checkout(self, isbn, member_name):\n        \"\"\"Lend a book to a member, enforcing the rules.\"\"\"\n        pass\n\n    def return_book(self, isbn):\n        \"\"\"Take a book back.\"\"\"\n        pass\n\n    def search(self, text):\n        \"\"\"Sorted titles matching title or author text.\"\"\"\n        pass\n\n    def available_titles(self):\n        \"\"\"Sorted titles of books on the shelf.\"\"\"\n        pass\n\n    def member_books(self, name):\n        \"\"\"Sorted titles the member has borrowed.\"\"\"\n        pass\n\ndef main():\n    lib = Library()\n    lib.add_book(Book('1', 'Dune', 'Frank Herbert'))\n    lib.join('Ann')\n    lib.checkout('1', 'Ann')\n    print(lib.member_books('Ann'), lib.available_titles())\nif __name__ == '__main__':\n    main()\n","solution":"from dataclasses import dataclass, field\n\n\n@dataclass\nclass Book:\n    isbn: str\n    title: str\n    author: str\n    available: bool = True\n\n\n@dataclass\nclass Member:\n    name: str\n    borrowed: list = field(default_factory=list)\n\n\nclass Library:\n    MAX_LOANS = 3\n\n    def __init__(self):\n        self.books = {}\n        self.members = {}\n\n    def add_book(self, book):\n        if book.isbn in self.books:\n            raise ValueError(\"duplicate isbn\")\n        self.books[book.isbn] = book\n\n    def join(self, name):\n        if name in self.members:\n            raise ValueError(\"already a member\")\n        self.members[name] = Member(name)\n\n    def checkout(self, isbn, member_name):\n        book = self.books.get(isbn)\n        if book is None:\n            raise KeyError(\"no such book\")\n        member = self.members.get(member_name)\n        if member is None:\n            raise KeyError(\"no such member\")\n        if not book.available:\n            raise ValueError(\"book not available\")\n        if len(member.borrowed) >= self.MAX_LOANS:\n            raise ValueError(\"loan limit reached\")\n        book.available = False\n        member.borrowed.append(isbn)\n\n    def return_book(self, isbn):\n        book = self.books[isbn]\n        if book.available:\n            raise ValueError(\"book was not borrowed\")\n        for member in self.members.values():\n            if isbn in member.borrowed:\n                member.borrowed.remove(isbn)\n        book.available = True\n\n    def search(self, text):\n        needle = text.lower()\n        return sorted(b.title for b in self.books.values() if needle in b.title.lower() or needle in b.author.lower())\n\n    def available_titles(self):\n        return sorted(b.title for b in self.books.values() if b.available)\n\n    def member_books(self, name):\n        return sorted(self.books[isbn].title for isbn in self.members[name].borrowed)\n\n\ndef main():\n    lib = Library()\n    lib.add_book(Book(\"1\", \"Dune\", \"Frank Herbert\"))\n    lib.join(\"Ann\")\n    lib.checkout(\"1\", \"Ann\")\n    print(lib.member_books(\"Ann\"), lib.available_titles())\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"Book(isbn='9', title='T', author='A', available=True)\nMember(name='M', borrowed=[])\nTrue","append":"print(Book('9', 'T', 'A'))\nm = Member('M')\nprint(m)\nprint(Member('X').borrowed is not Member('Y').borrowed)"},{"expected":"['Emma', 'Hamlet', 'Persuasion', 'Ulysses']\n['Dune']\n['Emma', 'Persuasion']\nbook not available\nloan limit reached\n['Dune']\nbook was not borrowed","append":"lib = Library()\nfor isbn, title, author in [('1', 'Dune', 'Frank Herbert'), ('2', 'Emma', 'Jane Austen'), ('3', 'Persuasion', 'Jane Austen'), ('4', 'Ulysses', 'James Joyce'), ('5', 'Hamlet', 'William Shakespeare')]:\n    lib.add_book(Book(isbn, title, author))\nlib.join('Ann')\nlib.join('Bob')\nlib.checkout('1', 'Ann')\nprint(lib.available_titles())\nprint(lib.member_books('Ann'))\nprint(lib.search('jane'))\ntry:\n    lib.checkout('1', 'Bob')\nexcept ValueError as e:\n    print(e)\nlib.checkout('2', 'Ann')\nlib.checkout('3', 'Ann')\ntry:\n    lib.checkout('4', 'Ann')\nexcept ValueError as e:\n    print(e)\nlib.return_book('2')\nlib.return_book('3')\nprint(lib.member_books('Ann'))\ntry:\n    lib.return_book('5')\nexcept ValueError as e:\n    print(e)"},{"expected":"KeyError\nKeyError\nduplicate isbn\nalready a member","append":"lib = Library()\nfor isbn, title, author in [('1', 'Dune', 'Frank Herbert'), ('2', 'Emma', 'Jane Austen'), ('3', 'Persuasion', 'Jane Austen'), ('4', 'Ulysses', 'James Joyce'), ('5', 'Hamlet', 'William Shakespeare')]:\n    lib.add_book(Book(isbn, title, author))\nlib.join('Ann')\nlib.join('Bob')\ntry:\n    lib.checkout('99', 'Ann')\nexcept KeyError:\n    print('KeyError')\ntry:\n    lib.checkout('1', 'Zed')\nexcept KeyError:\n    print('KeyError')\ntry:\n    lib.add_book(Book('1', 'Again', 'X'))\nexcept ValueError as e:\n    print(e)\ntry:\n    lib.join('Ann')\nexcept ValueError as e:\n    print(e)"}],"extend":["Add due dates and fines using the datetime module.","Add a waiting list for books that are lent out.","Save the library to JSON using `dataclasses.asdict`."],"local_only":false},{"slug":"markdown-to-html","level":4,"order":17,"title":"Markdown to HTML converter","requires":46,"goal":"Write a small converter from a useful subset of Markdown to HTML using regular expressions.","requirements":["Blocks are separated by blank lines. `convert(markdown)` converts every block and joins the results with newlines.","A one-line block starting with `#`, `##` or `###` and a space becomes `<h1>`, `<h2>` or `<h3>`.","A block where every line starts with `- ` becomes `<ul>` with one `<li>` per line (each tag on its own line).","Any other block is a paragraph `<p>...<\/p>`; its lines are joined with a single space.","Inline: `**bold**` to `<strong>`, `*italic*` to `<em>`, `` `code` `` to `<code>`, `[text](url)` to `<a href=\"url\">text<\/a>`.","Special characters `&`, `<`, `>` in the text must be escaped (`&amp;`, `&lt;`, `&gt;`) *before* the inline rules run."],"milestones":[{"title":"Blocks","detail":"Split the text on blank lines and classify each block."},{"title":"Inline rules","detail":"One re.sub per rule; mind the order (bold before italic)."},{"title":"Escaping","detail":"html.escape first, so your own tags are not escaped."}],"hints":["`re.split(r\"\\n\\s*\\n\", text)` splits on blank lines.","Bold uses two stars, so convert `**x**` before `*x*`.","`html.escape(text, quote=False)` escapes & < >."],"starter":"import html\nimport re\nimport sys\n\ndef inline(text):\n    \"\"\"Escape the text, then convert `code`, **bold**, *italic* and [text](url).\"\"\"\n    pass\n\ndef convert_block(block):\n    \"\"\"Convert one block (heading, bullet list or paragraph) to HTML.\"\"\"\n    pass\n\ndef convert(markdown):\n    \"\"\"Convert a whole Markdown document to HTML.\"\"\"\n    pass\n\ndef main():\n    print(convert(sys.stdin.read()))\nif __name__ == '__main__':\n    main()\n","solution":"import html\nimport re\nimport sys\n\n\ndef inline(text):\n    text = html.escape(text, quote=False)\n    text = re.sub(r\"`(.+?)`\", r\"<code>\\1<\/code>\", text)\n    text = re.sub(r\"\\*\\*(.+?)\\*\\*\", r\"<strong>\\1<\/strong>\", text)\n    text = re.sub(r\"\\*(.+?)\\*\", r\"<em>\\1<\/em>\", text)\n    text = re.sub(r\"\\[([^\\]]+)\\]\\(([^)\\s]+)\\)\", r'<a href=\"\\2\">\\1<\/a>', text)\n    return text\n\n\ndef convert_block(block):\n    lines = block.split(\"\\n\")\n    heading = re.match(r\"(#{1,3}) (.+)\", lines[0])\n    if len(lines) == 1 and heading:\n        level = len(heading.group(1))\n        return f\"<h{level}>{inline(heading.group(2))}<\/h{level}>\"\n    if all(line.startswith(\"- \") for line in lines):\n        items = \"\\n\".join(f\"<li>{inline(line[2:])}<\/li>\" for line in lines)\n        return f\"<ul>\\n{items}\\n<\/ul>\"\n    return \"<p>\" + inline(\" \".join(line.strip() for line in lines)) + \"<\/p>\"\n\n\ndef convert(markdown):\n    blocks = [b for b in re.split(r\"\\n\\s*\\n\", markdown.strip()) if b.strip()]\n    return \"\\n\".join(convert_block(b) for b in blocks)\n\n\ndef main():\n    print(convert(sys.stdin.read()))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"<h1>Title<\/h1>\n<p>Hello <strong>world<\/strong> and <em>you<\/em>.<\/p>","append":"print(convert('# Title\\n\\nHello **world** and *you*.'))"},{"expected":"<ul>\n<li>one<\/li>\n<li>two <strong>b<\/strong><\/li>\n<\/ul>","append":"print(convert('- one\\n- two **b**'))"},{"expected":"<p>See <a href=\"https://python.org\">Python<\/a> and use <code>print()<\/code>.<\/p>","append":"print(convert('See [Python](https://python.org) and use `print()`.'))"},{"expected":"<p>1 &lt; 2 &amp; 3 &gt; 0<\/p>\n<p>line one line two<\/p>\n<h2>Sub<\/h2>\n<h3>Subsub<\/h3>","append":"print(convert('1 < 2 & 3 > 0\\n\\nline one\\nline two\\n\\n## Sub\\n\\n### Subsub'))"},{"expected":"<h1>Hi<\/h1>\n<p>text<\/p>","stdin":"# Hi\n\ntext\n"}],"extend":["Support numbered lists and block quotes.","Support fenced code blocks (three backticks).","Wrap the result in a complete HTML page and open it in your browser."],"local_only":false},{"slug":"log-analyzer","level":4,"order":18,"title":"Log file analyzer (regex)","requires":46,"goal":"Parse server log lines with a regular expression and answer questions about them: how many errors, which component fails most, which hours are busiest.","requirements":["A log line looks like `2024-03-01 12:10:00 ERROR [db] Connection lost`: date, time, level (`INFO`, `WARN` or `ERROR`), a component in square brackets and a message.","`parse_line(line)` returns a dict with keys `date`, `time`, `level`, `component`, `message`, or `None` for a line that does not match.","`parse_log(text)` returns the entries for all valid lines and silently skips the others.","`count_by_level(entries)` returns a dict of level to count, sorted by level.","`top_components(entries, n, level=\"ERROR\")` returns the `n` components with the most entries of that level as `(component, count)` pairs, highest count first, ties alphabetical.","`errors_per_hour(entries)` returns a dict like `{\"2024-03-01 13\": 2}` counting the ERROR entries per hour, sorted by key."],"milestones":[{"title":"One line","detail":"A regex with groups and fullmatch."},{"title":"Many lines","detail":"Parse a whole file and skip garbage."},{"title":"Questions","detail":"Counting with dicts and sorting."}],"hints":["Use groups: `(\\d{4}-\\d{2}-\\d{2}) (\\d{2}):(\\d{2}):(\\d{2}) (INFO|WARN|ERROR) \\[(\\w+)\\] (.+)`.","`sorted(counts.items(), key=lambda item: (-item[1], item[0]))` sorts by count descending, then name.","The hour key is the date plus the first two characters of the time."],"starter":"import re\nimport sys\nLINE = re.compile('(\\\\d{4}-\\\\d{2}-\\\\d{2}) (\\\\d{2}):(\\\\d{2}):(\\\\d{2}) (INFO|WARN|ERROR) \\\\[(\\\\w+)\\\\] (.+)')\n\ndef parse_line(line):\n    \"\"\"Return a dict (date, time, level, component, message) or None if the line does not match.\"\"\"\n    pass\n\ndef parse_log(text):\n    \"\"\"Return the parsed entries of every valid line.\"\"\"\n    pass\n\ndef count_by_level(entries):\n    \"\"\"Return {level: count} sorted by level.\"\"\"\n    pass\n\ndef top_components(entries, n, level='ERROR'):\n    \"\"\"Return the n most frequent components (component, count) for entries of the given level.\"\"\"\n    pass\n\ndef errors_per_hour(entries):\n    \"\"\"Return {'YYYY-MM-DD HH': number_of_errors} sorted by key.\"\"\"\n    pass\n\ndef main():\n    entries = parse_log(sys.stdin.read())\n    for level, count in count_by_level(entries).items():\n        print(f'{level}: {count}')\n    top = top_components(entries, 1)\n    print('top error source:', top[0][0] if top else 'none')\nif __name__ == '__main__':\n    main()\n","solution":"import re\nimport sys\n\nLINE = re.compile(r\"(\\d{4}-\\d{2}-\\d{2}) (\\d{2}):(\\d{2}):(\\d{2}) (INFO|WARN|ERROR) \\[(\\w+)\\] (.+)\")\n\n\ndef parse_line(line):\n    match = LINE.fullmatch(line.strip())\n    if not match:\n        return None\n    date, hour, minute, second, level, component, message = match.groups()\n    return {\"date\": date, \"time\": f\"{hour}:{minute}:{second}\", \"level\": level, \"component\": component, \"message\": message}\n\n\ndef parse_log(text):\n    entries = []\n    for line in text.splitlines():\n        entry = parse_line(line)\n        if entry:\n            entries.append(entry)\n    return entries\n\n\ndef count_by_level(entries):\n    counts = {}\n    for entry in entries:\n        counts[entry[\"level\"]] = counts.get(entry[\"level\"], 0) + 1\n    return dict(sorted(counts.items()))\n\n\ndef top_components(entries, n, level=\"ERROR\"):\n    counts = {}\n    for entry in entries:\n        if entry[\"level\"] == level:\n            counts[entry[\"component\"]] = counts.get(entry[\"component\"], 0) + 1\n    ranked = sorted(counts.items(), key=lambda item: (-item[1], item[0]))\n    return ranked[:n]\n\n\ndef errors_per_hour(entries):\n    counts = {}\n    for entry in entries:\n        if entry[\"level\"] == \"ERROR\":\n            key = f\"{entry['date']} {entry['time'][:2]}\"\n            counts[key] = counts.get(key, 0) + 1\n    return dict(sorted(counts.items()))\n\n\ndef main():\n    entries = parse_log(sys.stdin.read())\n    for level, count in count_by_level(entries).items():\n        print(f\"{level}: {count}\")\n    top = top_components(entries, 1)\n    print(\"top error source:\", top[0][0] if top else \"none\")\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"{'date': '2024-03-01', 'time': '12:00:05', 'level': 'INFO', 'component': 'web', 'message': 'Started'}\nNone\n6\n{'ERROR': 3, 'INFO': 2, 'WARN': 1}","append":"LOG = \"2024-03-01 12:00:05 INFO [web] Started\\n2024-03-01 12:10:00 ERROR [db] Connection lost\\n2024-03-01 12:15:30 WARN [web] Slow request\\n2024-03-01 13:01:00 ERROR [db] Timeout\\n2024-03-01 13:02:00 ERROR [auth] Bad token\\nthis line is garbage\\n2024-03-01 13:05:00 INFO [auth] Login ok\\n\"\nentries = parse_log(LOG)\nprint(parse_line(LOG.splitlines()[0]))\nprint(parse_line('garbage'))\nprint(len(entries))\nprint(count_by_level(entries))"},{"expected":"[('db', 2), ('auth', 1)]\n[('web', 1)]\n{'2024-03-01 12': 1, '2024-03-01 13': 2}","append":"LOG = \"2024-03-01 12:00:05 INFO [web] Started\\n2024-03-01 12:10:00 ERROR [db] Connection lost\\n2024-03-01 12:15:30 WARN [web] Slow request\\n2024-03-01 13:01:00 ERROR [db] Timeout\\n2024-03-01 13:02:00 ERROR [auth] Bad token\\nthis line is garbage\\n2024-03-01 13:05:00 INFO [auth] Login ok\\n\"\nentries = parse_log(LOG)\nprint(top_components(entries, 2))\nprint(top_components(entries, 5, level='WARN'))\nprint(errors_per_hour(entries))"},{"expected":"ERROR: 3\nINFO: 2\nWARN: 1\ntop error source: db","stdin":"2024-03-01 12:00:05 INFO [web] Started\n2024-03-01 12:10:00 ERROR [db] Connection lost\n2024-03-01 12:15:30 WARN [web] Slow request\n2024-03-01 13:01:00 ERROR [db] Timeout\n2024-03-01 13:02:00 ERROR [auth] Bad token\nthis line is garbage\n2024-03-01 13:05:00 INFO [auth] Login ok\n"}],"extend":["Add a `--level` filter with argparse.","Report the slowest hour of the day.","Read the log from a file given on the command line."],"local_only":false},{"slug":"mini-sqlite-notes","level":4,"order":19,"title":"Mini SQLite notes app","requires":53,"goal":"Build a notes store backed by SQLite with two tables (notes and tags), search and tagging.","requirements":["`NoteStore(path=\":memory:\")` opens the database and creates the tables `notes(id, title, body)` and `tags(note_id, tag)` if they do not exist.","`add(title, body, tags=())` inserts a note (tags stored lower-case) and returns its id.","`get(note_id)` returns `{\"id\", \"title\", \"body\", \"tags\"}` (tags sorted) or `None`.","`search(text)` returns the sorted titles of notes whose title or body contains the text; `by_tag(tag)` returns the sorted titles with that tag (case-insensitive).","`update(note_id, body)` and `delete(note_id)` return `True` when a note was changed/removed and `False` otherwise; `count()` returns the number of notes; `close()` closes the connection.","Always pass values with `?` placeholders. Data written to a file database must still be there after reopening."],"milestones":[{"title":"Schema","detail":"Create the two tables."},{"title":"Add and read","detail":"Insert with tags, fetch by id."},{"title":"Query","detail":"search, by_tag (a JOIN), update, delete."}],"hints":["`cursor.lastrowid` is the id of the row you just inserted.","`UPDATE`/`DELETE` cursors have `.rowcount` telling how many rows changed.","`SELECT n.title FROM notes n JOIN tags t ON t.note_id = n.id WHERE t.tag = ?` finds notes by tag."],"starter":"import sqlite3\n\nclass NoteStore:\n\n    def __init__(self, path=':memory:'):\n        \"\"\"Open the database and create the notes and tags tables if needed.\"\"\"\n        pass\n\n    def add(self, title, body, tags=()):\n        \"\"\"Insert a note with its tags (lower-cased); return the new id.\"\"\"\n        pass\n\n    def get(self, note_id):\n        \"\"\"Return {'id','title','body','tags'} (sorted tags) or None.\"\"\"\n        pass\n\n    def search(self, text):\n        \"\"\"Sorted titles of notes whose title or body contains text.\"\"\"\n        pass\n\n    def by_tag(self, tag):\n        \"\"\"Sorted titles of notes with the tag (case-insensitive).\"\"\"\n        pass\n\n    def update(self, note_id, body):\n        \"\"\"Change the body; True if a note was updated.\"\"\"\n        pass\n\n    def delete(self, note_id):\n        \"\"\"Delete the note and its tags; True if it existed.\"\"\"\n        pass\n\n    def count(self):\n        \"\"\"Number of notes.\"\"\"\n        pass\n\n    def close(self):\n        \"\"\"Close the connection.\"\"\"\n        pass\n\ndef main():\n    store = NoteStore()\n    store.add('Welcome', 'Your first note', ['start'])\n    print(store.get(1))\nif __name__ == '__main__':\n    main()\n","solution":"import sqlite3\n\n\nclass NoteStore:\n    def __init__(self, path=\":memory:\"):\n        self.con = sqlite3.connect(path)\n        self.con.execute(\"CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY, title TEXT NOT NULL, body TEXT NOT NULL)\")\n        self.con.execute(\"CREATE TABLE IF NOT EXISTS tags (note_id INTEGER, tag TEXT)\")\n        self.con.commit()\n\n    def add(self, title, body, tags=()):\n        cursor = self.con.execute(\"INSERT INTO notes (title, body) VALUES (?, ?)\", (title, body))\n        note_id = cursor.lastrowid\n        self.con.executemany(\"INSERT INTO tags (note_id, tag) VALUES (?, ?)\", [(note_id, tag.lower()) for tag in tags])\n        self.con.commit()\n        return note_id\n\n    def get(self, note_id):\n        row = self.con.execute(\"SELECT id, title, body FROM notes WHERE id = ?\", (note_id,)).fetchone()\n        if row is None:\n            return None\n        tags = [r[0] for r in self.con.execute(\"SELECT tag FROM tags WHERE note_id = ? ORDER BY tag\", (note_id,))]\n        return {\"id\": row[0], \"title\": row[1], \"body\": row[2], \"tags\": tags}\n\n    def search(self, text):\n        like = f\"%{text}%\"\n        rows = self.con.execute(\"SELECT title FROM notes WHERE title LIKE ? OR body LIKE ? ORDER BY title\", (like, like))\n        return [r[0] for r in rows]\n\n    def by_tag(self, tag):\n        rows = self.con.execute(\n            \"SELECT n.title FROM notes n JOIN tags t ON t.note_id = n.id WHERE t.tag = ? ORDER BY n.title\", (tag.lower(),))\n        return [r[0] for r in rows]\n\n    def update(self, note_id, body):\n        cursor = self.con.execute(\"UPDATE notes SET body = ? WHERE id = ?\", (body, note_id))\n        self.con.commit()\n        return cursor.rowcount == 1\n\n    def delete(self, note_id):\n        cursor = self.con.execute(\"DELETE FROM notes WHERE id = ?\", (note_id,))\n        self.con.execute(\"DELETE FROM tags WHERE note_id = ?\", (note_id,))\n        self.con.commit()\n        return cursor.rowcount == 1\n\n    def count(self):\n        return self.con.execute(\"SELECT COUNT(*) FROM notes\").fetchone()[0]\n\n    def close(self):\n        self.con.close()\n\n\ndef main():\n    store = NoteStore()\n    store.add(\"Welcome\", \"Your first note\", [\"start\"])\n    print(store.get(1))\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"1 2 3\n{'id': 1, 'title': 'Groceries', 'body': 'milk and eggs', 'tags': ['food', 'home']}\nNone\n['Dinner', 'Groceries']\n['Dinner', 'Groceries']","append":"s = NoteStore()\na = s.add('Groceries', 'milk and eggs', ['home', 'Food'])\nb = s.add('Python', 'learn sqlite', ['study'])\nc = s.add('Dinner', 'eggs and rice', ['food'])\nprint(a, b, c)\nprint(s.get(1))\nprint(s.get(99))\nprint(s.search('eggs'))\nprint(s.by_tag('FOOD'))"},{"expected":"True\nFalse\nlearn sql\nTrue\n2\nFalse\n['Groceries']","append":"s = NoteStore()\ns.add('Groceries', 'milk and eggs', ['home', 'Food'])\ns.add('Python', 'learn sqlite', ['study'])\ns.add('Dinner', 'eggs and rice', ['food'])\nprint(s.update(2, 'learn sql'))\nprint(s.update(99, 'x'))\nprint(s.get(2)['body'])\nprint(s.delete(3))\nprint(s.count())\nprint(s.delete(3))\nprint(s.by_tag('food'))"},{"expected":"1\n1\n2","append":"s = NoteStore('notes.db')\ns.add('A', 'b')\ns.close()\ns2 = NoteStore('notes.db')\nprint(s2.count())\ns2.add(\"x'; DROP TABLE notes; --\", 'y')\nprint(s2.search('DROP').__len__())\nprint(s2.count())\ns2.close()"}],"extend":["Add full-text search with SQLite's FTS5 (check `sqlite3.sqlite_version`).","Add a `created_at` timestamp and sort by it.","Build a small command-line interface with argparse."],"local_only":false},{"slug":"rest-api-client","level":4,"order":20,"title":"REST API client","requires":54,"goal":"Write a reusable client for a JSON web API using only `urllib`: query parameters, JSON bodies, clear errors and automatic retries.","requirements":["`ApiClient(base_url, timeout=10, retries=0)`; `get(path, **params)` and `post(path, data)` return the decoded JSON body.","Query parameters are URL-encoded (`q=\"a b\"` becomes `?q=a+b`); `post` sends the data as JSON with the right `Content-Type`.","HTTP errors raise `ApiError(status, message)` with `.status` and `.message` (take the message from the JSON `error` field when present). A server that cannot be reached raises `ApiError(0, reason)`.","Server errors (status 500 and above) are retried up to `retries` times before `ApiError` is raised; client errors (4xx) are never retried."],"milestones":[{"title":"One GET","detail":"Build the URL and decode the JSON."},{"title":"Errors","detail":"Turn HTTPError and URLError into ApiError."},{"title":"Retries","detail":"Loop on 5xx responses."}],"hints":["`urllib.parse.urlencode(params)` builds the query string.","`urllib.error.HTTPError` is raised for 4xx/5xx; it can be read like a response.","Use a `while True` loop with an attempt counter for the retries."],"starter":"import json\nimport time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n\nclass ApiError(Exception):\n\n    def __init__(self, status, message):\n        \"\"\"Store the status and message; the exception text is 'STATUS: MESSAGE'.\"\"\"\n        pass\n\nclass ApiClient:\n\n    def __init__(self, base_url, timeout=10, retries=0):\n        \"\"\"Remember base_url (without trailing slash), timeout and retries.\"\"\"\n        pass\n\n    def _request(self, method, path, data=None, params=None):\n        \"\"\"Send the request (JSON body for data, query string for params), retry 5xx responses, and return the decoded JSON. Raise ApiError on failure.\"\"\"\n        pass\n\n    def get(self, path, **params):\n        \"\"\"GET path with query parameters.\"\"\"\n        pass\n\n    def post(self, path, data):\n        \"\"\"POST data as JSON.\"\"\"\n        pass\n\ndef main():\n    client = ApiClient('http://127.0.0.1:8000')\n    try:\n        print(client.get('/api/health'))\n    except ApiError as error:\n        print('request failed:', error)\nif __name__ == '__main__':\n    main()\n","solution":"import json\nimport time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n\n\nclass ApiError(Exception):\n    def __init__(self, status, message):\n        super().__init__(f\"{status}: {message}\")\n        self.status = status\n        self.message = message\n\n\nclass ApiClient:\n    def __init__(self, base_url, timeout=10, retries=0):\n        self.base_url = base_url.rstrip(\"/\")\n        self.timeout = timeout\n        self.retries = retries\n\n    def _request(self, method, path, data=None, params=None):\n        url = self.base_url + path\n        if params:\n            url += \"?\" + urllib.parse.urlencode(params)\n        body = None\n        headers = {\"Accept\": \"application/json\"}\n        if data is not None:\n            body = json.dumps(data).encode()\n            headers[\"Content-Type\"] = \"application/json\"\n        attempt = 0\n        while True:\n            request = urllib.request.Request(url, data=body, headers=headers, method=method)\n            try:\n                with urllib.request.urlopen(request, timeout=self.timeout) as response:\n                    return json.load(response)\n            except urllib.error.HTTPError as error:\n                if error.code >= 500 and attempt < self.retries:\n                    attempt += 1\n                    time.sleep(0.01)\n                    continue\n                try:\n                    message = json.load(error).get(\"error\", error.reason)\n                except ValueError:\n                    message = error.reason\n                raise ApiError(error.code, message)\n            except urllib.error.URLError as error:\n                raise ApiError(0, str(error.reason))\n\n    def get(self, path, **params):\n        return self._request(\"GET\", path, params=params)\n\n    def post(self, path, data):\n        return self._request(\"POST\", path, data=data)\n\n\ndef main():\n    client = ApiClient(\"http://127.0.0.1:8000\")\n    try:\n        print(client.get(\"/api/health\"))\n    except ApiError as error:\n        print(\"request failed:\", error)\n\n\nif __name__ == \"__main__\":\n    main()\n","tests":[{"expected":"[{'id': 1}, {'id': 2}]\n/search?q=a+b&page=2\n404 not found\n{'created': {'name': 'x'}}","append":"import json, os, threading\nos.environ[\"NO_PROXY\"] = \"*\"\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nhits = {\"flaky\": 0}\nclass H(BaseHTTPRequestHandler):\n    def _send(self, status, payload):\n        body = json.dumps(payload).encode()\n        self.send_response(status)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def do_GET(self):\n        if self.path == \"/items\":\n            self._send(200, [{\"id\": 1}, {\"id\": 2}])\n        elif self.path.startswith(\"/search\"):\n            self._send(200, {\"path\": self.path})\n        elif self.path == \"/flaky\":\n            hits[\"flaky\"] += 1\n            if hits[\"flaky\"] <= 2:\n                self._send(500, {\"error\": \"try again\"})\n            else:\n                self._send(200, {\"ok\": True})\n        else:\n            self._send(404, {\"error\": \"not found\"})\n    def do_POST(self):\n        size = int(self.headers[\"Content-Length\"])\n        data = json.loads(self.rfile.read(size))\n        self._send(201, {\"created\": data})\n    def log_message(self, *args):\n        pass\nserver = HTTPServer((\"127.0.0.1\", 0), H)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nbase = f\"http://127.0.0.1:{server.server_port}\"\nc = ApiClient(base)\nprint(c.get('/items'))\nprint(c.get('/search', q='a b', page=2)['path'])\ntry:\n    c.get('/nope')\nexcept ApiError as e:\n    print(e.status, e.message)\nprint(c.post('/items', {'name': 'x'}))\nserver.shutdown()"},{"expected":"500\n{'ok': True}","append":"import json, os, threading\nos.environ[\"NO_PROXY\"] = \"*\"\nfrom http.server import BaseHTTPRequestHandler, HTTPServer\nhits = {\"flaky\": 0}\nclass H(BaseHTTPRequestHandler):\n    def _send(self, status, payload):\n        body = json.dumps(payload).encode()\n        self.send_response(status)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.end_headers()\n        self.wfile.write(body)\n    def do_GET(self):\n        if self.path == \"/items\":\n            self._send(200, [{\"id\": 1}, {\"id\": 2}])\n        elif self.path.startswith(\"/search\"):\n            self._send(200, {\"path\": self.path})\n        elif self.path == \"/flaky\":\n            hits[\"flaky\"] += 1\n            if hits[\"flaky\"] <= 2:\n                self._send(500, {\"error\": \"try again\"})\n            else:\n                self._send(200, {\"ok\": True})\n        else:\n            self._send(404, {\"error\": \"not found\"})
