t None:\n        text += f\" ({age})\"\n    liked = \", \".join(hobbies) if hobbies else \"nothing\"\n    return f\"{text} likes: {liked}\"","hint":"Parameters after *hobbies can only be passed by keyword.","tests":[{"expected":"Ana (30) likes: chess, golf\nBo likes: nothing\nCy (9) likes: lego","append":"print(describe('Ana', 'chess', 'golf', age=30))\nprint(describe('Bo'))\nprint(describe('Cy', 'lego', age=9))"}],"local_only":false}},{"id":20,"track":"CORE","slug":"return-scope","title":"return values and scope","terms":[{"term":"return value","def":"What a call evaluates to. A function can return any value, including a tuple of several."},{"term":"None","def":"The special value meaning \"nothing\". A function without return gives None."},{"term":"local variable","def":"Created inside a function; it exists only while the function runs."},{"term":"global variable","def":"Created at the top level of the file; every function can read it."},{"term":"scope","def":"The region of code where a name is visible."},{"term":"global keyword","def":"Lets a function assign to a global variable instead of creating a new local one."}],"explain":"Variables created inside a function are private to it. Functions can read globals but need the `global` keyword to change them. Prefer returning values over modifying globals: it keeps functions easy to test.","example":{"code":"def min_max(nums):\n    return min(nums), max(nums)      # returns a tuple of two values\nlow, high = min_max([4, 9, 2])       # unpack the result\nprint(low, high)                     # 2 9\ndef no_return():\n    x = 1                            # x is local: it exists only inside this function\nprint(no_return())                   # None: functions return None by default\ntotal = 0                            # a global variable\ndef add(n):\n    return total + n                 # reading a global is fine\nprint(add(5))                        # 5\n"},"mistakes":["UnboundLocalError: assigning to a name inside a function makes it local for the whole function, so reading it first fails.","Printing instead of returning: `print(x)` shows x but gives the caller None.","Code after `return` in the same block never runs."],"exercises":[{"title":"stats","prompt":"Write `stats(nums)` returning a tuple `(smallest, largest, average)`.","starter":"def stats(nums):\n    pass\n","solution":"def stats(nums):\n    return min(nums), max(nums), sum(nums) / len(nums)","hint":"","tests":[{"expected":"(2, 6, 4.0)","append":"print(stats([2, 4, 6]))"}],"local_only":false},{"title":"Fix the counter","prompt":"`increment()` should add 1 to the global `count`, but it crashes. Fix it.","starter":"count = 0\n\ndef increment():\n    count = count + 1\n","solution":"count = 0\n\ndef increment():\n    global count\n    count = count + 1","hint":"The function needs `global count`.","tests":[{"expected":"2","append":"increment()\nincrement()\nprint(_solution.count)"}],"local_only":false},{"title":"first_negative","prompt":"Write `first_negative(nums)` returning the first negative number, or None when there is none.","starter":"def first_negative(nums):\n    pass\n","solution":"def first_negative(nums):\n    for n in nums:\n        if n < 0:\n            return n\n    return None","hint":"","tests":[{"expected":"-2\nNone","append":"print(first_negative([3, -2, -5]))\nprint(first_negative([1, 2]))"}],"local_only":false}],"quiz":[{"q":"What does a function with no return statement return?","options":["\"\"","None","0"],"answer":1,"why":"None is the default."},{"q":"A variable created inside a function is...","options":["Global","Local to that function","Shared with other functions"],"answer":1,"why":"It disappears when the function ends."},{"q":"What does `return a, b` give?","options":["Two separate values","A tuple (a, b)","A list"],"answer":1,"why":"Multiple return values are packed in a tuple."},{"q":"How can a function assign to a global variable?","options":["It always can","It never can","Declare it with global"],"answer":2,"why":"Without global, an assignment creates a local."},{"q":"What happens to lines after return?","options":["They run","They are skipped","They run twice"],"answer":1,"why":"return ends the function immediately."}],"challenge":{"title":"safe_divide","prompt":"Write `safe_divide(a, b)` returning `(True, a / b)`, or `(False, None)` when b is 0.","starter":"def safe_divide(a, b):\n    pass\n","solution":"def safe_divide(a, b):\n    if b == 0:\n        return False, None\n    return True, a / b","hint":"","tests":[{"expected":"(True, 2.5)\n(False, None)","append":"print(safe_divide(10, 4))\nprint(safe_divide(1, 0))"}],"local_only":false}},{"id":21,"track":"CORE","slug":"lambda-map-filter-sorted","title":"lambda, map, filter and sorted","terms":[{"term":"lambda","def":"A tiny unnamed function written in one line: lambda x: x * 2."},{"term":"map(f, items)","def":"Applies f to every item. Returns an iterator; wrap it in list() to see the results."},{"term":"filter(f, items)","def":"Keeps the items for which f returns True."},{"term":"key function","def":"A function that tells sorted() (or min/max) what to compare: sorted(words, key=len)."},{"term":"higher-order function","def":"A function that takes another function as an argument or returns one."}],"explain":"Functions are values: you can pass them around. `map`, `filter` and `sorted(key=...)` are the classic examples. A `lambda` is handy for short functions you use once.","example":{"code":"square = lambda n: n * n               # a tiny unnamed function\nprint(square(5))                       # 25\nnums = [1, 2, 3, 4, 5, 6]\nprint(list(map(lambda n: n * 2, nums)))           # [2, 4, 6, 8, 10, 12]\nprint(list(filter(lambda n: n % 2 == 0, nums)))   # [2, 4, 6]\nwords = [\"pear\", \"fig\", \"banana\"]\nprint(sorted(words, key=len))                     # ['fig', 'pear', 'banana']\nprint(sorted(words, key=lambda w: w[-1]))         # by last letter: ['banana', 'fig', 'pear']\n"},"mistakes":["Printing a map/filter object directly shows `<map object ...>`. Wrap it: `list(map(...))`.","A lambda can only contain one expression, not several statements.","`key=len()` is wrong: pass the function itself, `key=len`, without calling it."],"exercises":[{"title":"double_all","prompt":"Write `double_all(nums)` that uses `map` to return a list with every number doubled.","starter":"def double_all(nums):\n    pass\n","solution":"def double_all(nums):\n    return list(map(lambda n: n * 2, nums))","hint":"","tests":[{"expected":"[2, 4, 6]\n[]","append":"print(double_all([1, 2, 3]))\nprint(double_all([]))"}],"local_only":false},{"title":"keep_long","prompt":"Write `keep_long(words)` that uses `filter` to keep only words longer than 3 letters.","starter":"def keep_long(words):\n    pass\n","solution":"def keep_long(words):\n    return list(filter(lambda w: len(w) > 3, words))","hint":"","tests":[{"expected":"['abcd', 'hello']","append":"print(keep_long(['a', 'abcd', 'xyz', 'hello']))"}],"local_only":false},{"title":"sort_by_score","prompt":"`players` is a list of `(name, score)` tuples. Write `sort_by_score(players)` returning them sorted by score, highest first.","starter":"def sort_by_score(players):\n    pass\n","solution":"def sort_by_score(players):\n    return sorted(players, key=lambda p: p[1], reverse=True)","hint":"","tests":[{"expected":"[('Cy', 9), ('Ann', 5), ('Bo', 2)]","append":"print(sort_by_score([('Ann', 5), ('Bo', 2), ('Cy', 9)]))"}],"local_only":false}],"quiz":[{"q":"What is (lambda x: x + 1)(4)?","options":["5","A function","4"],"answer":0,"why":"The lambda is called with 4."},{"q":"What does list(filter(lambda n: n > 2, [1, 2, 3, 4])) give?","options":["[3, 4]","[1, 2]","[True, True]"],"answer":0,"why":"filter keeps items for which the function is True."},{"q":"What does sorted([\"bb\", \"a\", \"ccc\"], key=len) give?","options":["['a', 'ccc', 'bb']","['a', 'bb', 'ccc']","['ccc', 'bb', 'a']"],"answer":1,"why":"Sorted by length, shortest first."},{"q":"What does map return?","options":["A string","A list","An iterator (use list() to see it)"],"answer":2,"why":"map is lazy."},{"q":"Which is correct?","options":["sorted(w, key=len())","sorted(w, len)","sorted(w, key=len)"],"answer":2,"why":"Pass the function, do not call it."}],"challenge":{"title":"top_words","prompt":"Write `top_words(words, n)` returning the n longest words, longest first; words of equal length in alphabetical order.","starter":"def top_words(words, n):\n    pass\n","solution":"def top_words(words, n):\n    return sorted(words, key=lambda w: (-len(w), w))[:n]","hint":"A key can return a tuple: (-len(w), w).","tests":[{"expected":"['banana', 'apple', 'kiwi']","append":"print(top_words(['pear', 'fig', 'banana', 'kiwi', 'apple'], 3))"}],"local_only":false}},{"id":22,"track":"CORE","slug":"reading-tracebacks","title":"Reading tracebacks","terms":[{"term":"traceback","def":"The report Python prints when an error stops your program."},{"term":"call stack","def":"The chain of functions that were running when the error happened."},{"term":"exception","def":"An error object, e.g. ZeroDivisionError. It has a type and a message."},{"term":"debugging","def":"Finding and fixing mistakes in a program."},{"term":"print debugging","def":"Adding print() lines to see what values your variables have."}],"explain":"Read a traceback from the **bottom up**. The last line names the error and explains it. The line above it shows the exact code that failed, with its line number. The lines above that show which functions called which.","example":{"code":"def divide(a, b):\n    return a / b\ndef average(nums):\n    return divide(sum(nums), len(nums))   # average() calls divide()\nprint(average([]))    # ZeroDivisionError: read the traceback from the BOTTOM up\n# last line:  what happened (division by zero)\n# above it:   the exact line that failed\n# higher up:  who called it (average -> divide)\n"},"mistakes":["Reading from the top and getting lost: always start at the last line.","Looking only at the line number shown: the real mistake is sometimes on the line before (a missing bracket).","Ignoring the message: `list index out of range` already tells you exactly what is wrong."],"exercises":[{"title":"Fix the NameError","prompt":"This program crashes with a NameError. Fix it so it prints `10`.","starter":"score = 10\nprint(scor)\n","solution":"score = 10\nprint(score)","hint":"Compare the two spellings.","tests":[{"expected":"10"}],"local_only":false},{"title":"Fix the IndexError","prompt":"Fix the program so it prints the last colour, `blue`.","starter":"colors = [\"red\", \"green\", \"blue\"]\nprint(colors[3])\n","solution":"colors = [\"red\", \"green\", \"blue\"]\nprint(colors[2])","hint":"The last valid index is len - 1 (or -1).","tests":[{"expected":"blue"}],"local_only":false},{"title":"Fix the TypeError","prompt":"Fix the program so it prints `I am 12 years old`.","starter":"age = 12\nprint(\"I am \" + age + \" years old\")\n","solution":"age = 12\nprint(\"I am \" + str(age) + \" years old\")","hint":"Convert the number to text.","tests":[{"expected":"I am 12 years old"}],"local_only":false}],"quiz":[{"q":"Where should you start reading a traceback?","options":["In the middle","At the last line","At the first line"],"answer":1,"why":"The last line names the error."},{"q":"What does \"IndexError: list index out of range\" mean?","options":["The list has duplicates","The list is empty text","You asked for a position that does not exist"],"answer":2,"why":"The index is bigger than the last valid position."},{"q":"A traceback line like File \"main.py\", line 7 tells you...","options":["Who wrote the file","How long it took","Where the error happened"],"answer":2,"why":"It names the file and line."},{"q":"What is print debugging?","options":["Printing values to see what is happening","Debugging the print function","Printing the code"],"answer":0,"why":"A simple way to inspect variables."},{"q":"What is a call stack?","options":["A list of variables","A kind of loop","The chain of calls leading to the error"],"answer":2,"why":"Each function that was running appears in the traceback."}],"challenge":{"title":"Fix the function","prompt":"`sum_to(n)` should return 1 + 2 + ... + n, but it gives the wrong total. Find the bug and fix it.","starter":"def sum_to(n):\n    total = 0\n    for i in range(n):\n        total += i\n    return total\n","solution":"def sum_to(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total","hint":"range(n) stops at n - 1 and starts at 0.","tests":[{"expected":"10\n1\n0","append":"print(sum_to(4))\nprint(sum_to(1))\nprint(sum_to(0))"}],"local_only":false}},{"id":23,"track":"BUILD","slug":"try-except-finally","title":"try / except / finally","terms":[{"term":"exception","def":"An error that happens while the program runs. If nothing handles it, the program stops."},{"term":"try","def":"Starts a block of code that might fail."},{"term":"except","def":"Catches a specific kind of exception and runs recovery code instead of crashing."},{"term":"else (in try)","def":"Runs only when the try block finished without an error."},{"term":"finally","def":"Always runs at the end, error or not: perfect for cleanup."},{"term":"handling","def":"Deciding what the program does when something goes wrong."}],"explain":"Do not hide errors: catch the specific ones you expect (like `ValueError` from bad input) and let surprises crash loudly so you can fix them. Never write a bare `except:` that swallows everything.","example":{"code":"try:\n    n = int(input(\"Number? \"))      # might raise ValueError\n    print(10 / n)                   # might raise ZeroDivisionError\nexcept ValueError:\n    print(\"That is not a number\")\nexcept ZeroDivisionError:\n    print(\"Cannot divide by zero\")\nelse:\n    print(\"No error happened\")      # runs only if the try block had no error\nfinally:\n    print(\"Done\")                   # always runs\n"},"mistakes":["A bare `except:` catches everything, even Ctrl+C. Name the exception: `except ValueError:`.","Putting too much code in `try`: keep it small so you know which line failed.","Catching an error and doing nothing (`pass`) hides bugs. At least print or log a message."],"exercises":[{"title":"to_int","prompt":"Write `to_int(text)` returning the integer in `text`, or `None` if the text is not a whole number.","starter":"def to_int(text):\n    pass\n","solution":"def to_int(text):\n    try:\n        return int(text)\n    except ValueError:\n        return None","hint":"","tests":[{"expected":"42\nNone\nNone","append":"print(to_int('42'))\nprint(to_int('x'))\nprint(to_int('3.5'))"}],"local_only":false},{"title":"Ask again","prompt":"Read lines until one of them is a valid whole number, then print that number.","starter":"# Write your code below\n","solution":"while True:\n    try:\n        n = int(input())\n        break\n    except ValueError:\n        continue\nprint(n)","hint":"","tests":[{"expected":"12","stdin":"abc\nx\n12\n"},{"expected":"5","stdin":"5\n"}],"local_only":false},{"title":"safe_get","prompt":"Write `safe_get(items, index, default)` returning `items[index]`, or `default` if the index does not exist.","starter":"def safe_get(items, index, default):\n    pass\n","solution":"def safe_get(items, index, default):\n    try:\n        return items[index]\n    except IndexError:\n        return default","hint":"","tests":[{"expected":"b\nnone","append":"print(safe_get(['a', 'b'], 1, 'none'))\nprint(safe_get(['a', 'b'], 5, 'none'))"}],"local_only":false}],"quiz":[{"q":"What does except ValueError: do?","options":["Runs when a ValueError happens in the try block","Creates a ValueError","Always runs"],"answer":0,"why":"It handles that specific error."},{"q":"When does finally run?","options":["Only without an error","Always","Only after an error"],"answer":1,"why":"finally is for cleanup that must happen either way."},{"q":"When does the else block of a try run?","options":["When an exception occurred","Never","When no exception occurred"],"answer":2,"why":"else runs after a successful try."},{"q":"Why avoid a bare except:?","options":["It is slower","It is not allowed","It hides every error, even bugs"],"answer":2,"why":"You should catch only what you expect."},{"q":"What does int(\"abc\") raise?","options":["ValueError","TypeError","KeyError"],"answer":0,"why":"The text is not a valid number."}],"challenge":{"title":"average_of_text","prompt":"Write `average_of_text(items)` that converts the strings in `items` to numbers (float), ignores the ones that are not numbers, and returns the average, or `None` if none were valid.","starter":"def average_of_text(items):\n    pass\n","solution":"def average_of_text(items):\n    values = []\n    for item in items:\n        try:\n            values.append(float(item))\n        except ValueError:\n            pass\n    if not values:\n        return None\n    return sum(values) / len(values)","hint":"","tests":[{"expected":"2.0\nNone","append":"print(average_of_text(['1', '2', 'x', '3']))\nprint(average_of_text(['a']))"}],"local_only":false}},{"id":24,"track":"BUILD","slug":"raising-custom-exceptions","title":"Raising and custom exceptions","terms":[{"term":"raise","def":"Stops the current function by creating an error on purpose."},{"term":"custom exception","def":"A new error type you define with class MyError(Exception): ..."},{"term":"as","def":"In `except X as err`, gives a name to the error object so you can read its message."},{"term":"re-raise","def":"Writing `raise` alone inside an except block to pass the error on after you looked at it."},{"term":"assert","def":"A quick check: `assert x > 0, \"message\"` raises AssertionError if the condition is false."}],"explain":"When your function receives something it cannot work with, raise an exception with a clear message instead of returning a strange value. Custom exceptions let callers catch your specific problem.","example":{"code":"class NegativeError(Exception):          # a custom exception inherits from Exception\n    \"\"\"Raised when a negative number is not allowed.\"\"\"\ndef sqrt_int(n):\n    if n < 0:\n        raise NegativeError(f\"{n} is negative\")   # raise stops the function with an error\n    return int(n ** 0.5)\ntry:\n    sqrt_int(-4)\nexcept NegativeError as err:             # 'as' gives a name to the error object\n    print(\"Caught:\", err)\n"},"mistakes":["Raising the class without a message: `raise ValueError` works, but `raise ValueError(\"age must be 0-130\")` helps the reader.","Forgetting to inherit from Exception: `class MyError:` cannot be raised.","Catching your own error too early so the caller never learns about it."],"exercises":[{"title":"withdraw","prompt":"Write `withdraw(balance, amount)`. Return the new balance, but raise `ValueError(\"insufficient funds\")` when `amount` is more than `balance`.","starter":"def withdraw(balance, amount):\n    pass\n","solution":"def withdraw(balance, amount):\n    if amount > balance:\n        raise ValueError(\"insufficient funds\")\n    return balance - amount","hint":"","tests":[{"expected":"70\nerror: insufficient funds","append":"print(withdraw(100, 30))\ntry:\n    withdraw(10, 50)\nexcept ValueError as e:\n    print('error:', e)"}],"local_only":false},{"title":"parse_age","prompt":"Write `parse_age(text)` returning the age as an int. Raise `ValueError(\"invalid age\")` if it is not a whole number from 0 to 130.","starter":"def parse_age(text):\n    pass\n","solution":"def parse_age(text):\n    try:\n        age = int(text)\n    except ValueError:\n        raise ValueError(\"invalid age\")\n    if not 0 <= age <= 130:\n        raise ValueError(\"invalid age\")\n    return age","hint":"","tests":[{"expected":"30\ninvalid age\ninvalid age\ninvalid age","append":"print(parse_age('30'))\nfor bad in ['abc', '-1', '200']:\n    try:\n        parse_age(bad)\n    except ValueError as e:\n        print(e)"}],"local_only":false},{"title":"EmptyStackError","prompt":"Define a custom exception `EmptyStackError` and a function `pop_item(stack)` that removes and returns the last item, raising `EmptyStackError` when the list is empty.","starter":"class EmptyStackError(Exception):\n    pass\n\ndef pop_item(stack):\n    pass\n","solution":"class EmptyStackError(Exception):\n    pass\n\ndef pop_item(stack):\n    if not stack:\n        raise EmptyStackError(\"stack is empty\")\n    return stack.pop()","hint":"","tests":[{"expected":"2\nempty","append":"print(pop_item([1, 2]))\ntry:\n    pop_item([])\nexcept EmptyStackError:\n    print('empty')"}],"local_only":false}],"quiz":[{"q":"What does raise do?","options":["Catches an error","Ignores an error","Creates an error on purpose"],"answer":2,"why":"raise stops the function with an exception."},{"q":"How do you define a custom exception?","options":["def MyError():","exception MyError","class MyError(Exception):"],"answer":2,"why":"It is a class that inherits from Exception."},{"q":"In `except ValueError as err`, what is err?","options":["A string with the line number","The error object","The function"],"answer":1,"why":"You can print it to see the message."},{"q":"What does assert x > 0 do when x is -1?","options":["Does nothing","Returns False","Raises AssertionError"],"answer":2,"why":"assert checks a condition."},{"q":"What does a bare `raise` inside except do?","options":["Creates a new type","Re-raises the same error","Ignores it"],"answer":1,"why":"It passes the original error upward."}],"challenge":{"title":"validate_password","prompt":"Define `WeakPasswordError(Exception)` and `validate_password(pw)`. Raise it with the message `too short` (fewer than 8 characters), `needs a digit`, or `needs an uppercase letter` (check in that order). Return True when all rules pass.","starter":"class WeakPasswordError(Exception):\n    pass\n\ndef validate_password(pw):\n    pass\n","solution":"class WeakPasswordError(Exception):\n    pass\n\ndef validate_password(pw):\n    if len(pw) < 8:\n        raise WeakPasswordError(\"too short\")\n    if not any(c.isdigit() for c in pw):\n        raise WeakPasswordError(\"needs a digit\")\n    if not any(c.isupper() for c in pw):\n        raise WeakPasswordError(\"needs an uppercase letter\")\n    return True","hint":"","tests":[{"expected":"too short\nneeds a digit\nneeds an uppercase letter\nTrue","append":"for pw in ['abc', 'abcdefgh', 'abcdefg1', 'Abcdefg1']:\n    try:\n        print(validate_password(pw))\n    except WeakPasswordError as e:\n        print(e)"}],"local_only":false}},{"id":25,"track":"BUILD","slug":"file-io","title":"File input and output","terms":[{"term":"file","def":"Data stored on disk under a name."},{"term":"path","def":"The location of a file, e.g. \"notes.txt\" (in the current folder)."},{"term":"open()","def":"Opens a file and returns a file object."},{"term":"mode","def":"How you open it: \"r\" read (default), \"w\" write (erases first), \"a\" append (adds at the end)."},{"term":".read() / .readline()","def":"Read the whole file as one string, or one line at a time."},{"term":".write()","def":"Writes a string to the file. It does not add a newline for you."},{"term":".close()","def":"Finishes writing and releases the file."}],"explain":"Files let a program remember things between runs. Every run in FLOWST starts in a fresh empty folder, so create the file first. Always close files (the next chapter shows the safe way).","example":{"code":"f = open(\"notes.txt\", \"w\")           # \"w\" creates the file (or empties it)\nf.write(\"first line\\n\")              # write text; \\n starts a new line\nf.write(\"second line\\n\")\nf.close()                            # close to make sure everything is saved\nf = open(\"notes.txt\")                # default mode is \"r\" (read)\nprint(f.read())                      # the whole file as one string\nf.close()\nlines = open(\"notes.txt\").read().splitlines()\nprint(lines)                         # ['first line', 'second line']\n"},"mistakes":["Mode `\"w\"` erases the file first. Use `\"a\"` to add to the end.","Forgetting `\\n`: `write(\"a\")` then `write(\"b\")` gives `ab` on one line.","Reading a file that does not exist raises FileNotFoundError."],"exercises":[{"title":"Write and sum","prompt":"Write the numbers 1 to 5 (one per line) into a file `nums.txt`, read them back and print their sum.","starter":"# Write your code below\n","solution":"with_file = open(\"nums.txt\", \"w\")\nfor n in range(1, 6):\n    with_file.write(f\"{n}\\n\")\nwith_file.close()\ntotal = 0\nfor line in open(\"nums.txt\").read().splitlines():\n    total += int(line)\nprint(total)","hint":"","tests":[{"expected":"15"}],"local_only":false},{"title":"Append","prompt":"Create `log.txt` with the line `x`, then add the line `y` by opening it in append mode. Finally print the whole file content.","starter":"# Write your code below\n","solution":"f = open(\"log.txt\", \"w\")\nf.write(\"x\\n\")\nf.close()\nf = open(\"log.txt\", \"a\")\nf.write(\"y\\n\")\nf.close()\nprint(open(\"log.txt\").read())","hint":"","tests":[{"expected":"x\ny"}],"local_only":false},{"title":"count_words","prompt":"Write `count_words(path)` returning how many words are in the file at `path`.","starter":"def count_words(path):\n    pass\n","solution":"def count_words(path):\n    f = open(path)\n    text = f.read()\n    f.close()\n    return len(text.split())","hint":"","tests":[{"expected":"3","append":"open('t.txt', 'w').write('one two\\nthree\\n')\nprint(count_words('t.txt'))"}],"local_only":false}],"quiz":[{"q":"What does mode \"w\" do?","options":["Reads the file","Adds to the end","Creates the file or erases it first"],"answer":2,"why":"Be careful: existing content is lost."},{"q":"Which mode adds to the end?","options":["\"r\"","\"w\"","\"a\""],"answer":2,"why":"a stands for append."},{"q":"What does f.read() return?","options":["A list of lines","The first line only","The whole file as a string"],"answer":2,"why":"Use readline() or splitlines() for lines."},{"q":"Does f.write(\"hi\") add a newline?","options":["No","Only on Windows","Yes"],"answer":0,"why":"You must add \\n yourself."},{"q":"What error appears when opening a missing file for reading?","options":["KeyError","OSError only on Linux","FileNotFoundError"],"answer":2,"why":"That is the specific exception."}],"challenge":{"title":"longest_line","prompt":"Write `longest_line(path)` returning the longest line of the file (without the newline). If two are equally long return the first.","starter":"def longest_line(path):\n    pass\n","solution":"def longest_line(path):\n    f = open(path)\n    lines = f.read().splitlines()\n    f.close()\n    best = lines[0]\n    for line in lines:\n        if len(line) > len(best):\n            best = line\n    return best","hint":"","tests":[{"expected":"hello world\nab","append":"open('a.txt', 'w').write('hi\\nhello world\\nyo\\n')\nprint(longest_line('a.txt'))\nopen('b.txt', 'w').write('ab\\ncd\\n')\nprint(longest_line('b.txt'))"}],"local_only":false}},{"id":26,"track":"BUILD","slug":"with-context-managers","title":"with and context managers","terms":[{"term":"context manager","def":"An object that sets something up when a with block starts and cleans up when it ends."},{"term":"with statement","def":"with open(...) as f: runs the block and then closes the file automatically, even after an error."},{"term":"as (in with)","def":"Names the object the context manager gives you."},{"term":"iterating a file","def":"A file object can be looped over: each pass gives one line."},{"term":"suppress()","def":"contextlib.suppress(Error) ignores that error inside the block."}],"explain":"`with` is the safe way to use files: no `close()` to forget. Any object that needs cleanup (files, locks, database connections) is used the same way.","example":{"code":"with open(\"log.txt\", \"w\") as f:      # the file is closed automatically at the end of the block\n    f.write(\"hello\\nworld\\n\")\nwith open(\"log.txt\") as f:\n    for line in f:                   # a file is iterable: one line per pass\n        print(line.strip())\nfrom contextlib import suppress\nwith suppress(FileNotFoundError):    # ignore this specific error inside the block\n    open(\"missing.txt\")\nprint(\"still running\")\n"},"mistakes":["Using the file after the `with` block: it is already closed, so `f.read()` raises ValueError.","Forgetting `as f`: you then have no name for the file.","Suppressing too much: `suppress(Exception)` hides real bugs."],"exercises":[{"title":"write_lines","prompt":"Write `write_lines(path, lines)` that writes every string of `lines` on its own line, using `with`.","starter":"def write_lines(path, lines):\n    pass\n","solution":"def write_lines(path, lines):\n    with open(path, \"w\") as f:\n        for line in lines:\n            f.write(line + \"\\n\")","hint":"","tests":[{"expected":"['x', 'y']","append":"write_lines('a.txt', ['x', 'y'])\nprint(open('a.txt').read().splitlines())"}],"local_only":false},{"title":"read_numbers","prompt":"Write `read_numbers(path)` returning the whole numbers stored one per line in the file, as a list of ints.","starter":"def read_numbers(path):\n    pass\n","solution":"def read_numbers(path):\n    with open(path) as f:\n        return [int(line) for line in f if line.strip()]","hint":"","tests":[{"expected":"[3, 4, 5]","append":"open('n.txt', 'w').write('3\\n4\\n5\\n')\nprint(read_numbers('n.txt'))"}],"local_only":false},{"title":"copy_upper","prompt":"Write `copy_upper(src, dst)` that copies the text of `src` into `dst` in upper case.","starter":"def copy_upper(src, dst):\n    pass\n","solution":"def copy_upper(src, dst):\n    with open(src) as a, open(dst, \"w\") as b:\n        b.write(a.read().upper())","hint":"","tests":[{"expected":"HI\nTHERE","append":"open('s.txt', 'w').write('hi\\nthere\\n')\ncopy_upper('s.txt', 'd.txt')\nprint(open('d.txt').read())"}],"local_only":false}],"quiz":[{"q":"What does with open(...) as f do at the end of the block?","options":["Closes the file automatically","Deletes the file","Does nothing"],"answer":0,"why":"That is the point of a context manager."},{"q":"Is the file still open after the with block?","options":["Yes","No","Only for reading"],"answer":1,"why":"It was closed when the block ended."},{"q":"What does `for line in f` give?","options":["The whole file","One character per pass","One line per pass"],"answer":2,"why":"Files are iterable by line."},{"q":"What does suppress(FileNotFoundError) do?","options":["Ignores that error inside the block","Raises the error","Creates the file"],"answer":0,"why":"The error is silently skipped."},{"q":"Which objects can be used with `with`?","options":["Only numbers","Only files","Context managers (files, locks, ...)"],"answer":2,"why":"Anything that supports setup and cleanup."}],"challenge":{"title":"safe_read","prompt":"Write `safe_read(path)` returning the text of the file, or an empty string `\"\"` when the file does not exist.","starter":"def safe_read(path):\n    pass\n","solution":"def safe_read(path):\n    try:\n        with open(path) as f:\n            return f.read()\n    except FileNotFoundError:\n        return \"\"","hint":"","tests":[{"expected":"'data'\n''","append":"open('d.txt', 'w').write('data')\nprint(repr(safe_read('d.txt')))\nprint(repr(safe_read('nope.txt')))"}],"local_only":false}},{"id":27,"track":"BUILD","slug":"json-csv","title":"JSON and CSV","terms":[{"term":"JSON","def":"A text format for data that looks like Python dicts and lists. Used by almost every web API."},{"term":"serialize / dumps","def":"Turn Python data into JSON text: json.dumps(data)."},{"term":"parse / loads","def":"Turn JSON text back into Python data: json.loads(text)."},{"term":"CSV","def":"Comma-separated values: a table stored as text, one row per line."},{"term":"csv module","def":"Reads and writes CSV correctly (quotes, commas inside values)."},{"term":"DictReader","def":"Reads CSV rows as dicts, using the header row as keys."}],"explain":"JSON and CSV are the two formats you will meet most. JSON keeps structure (nested lists and dicts); CSV is flat tables that spreadsheets understand. Values read from CSV are always strings.","example":{"code":"import json, csv\ndata = {\"name\": \"Ada\", \"langs\": [\"python\", \"c\"]}\ntext = json.dumps(data)              # dict -> JSON text\nprint(text)                          # {\"name\": \"Ada\", \"langs\": [\"python\", \"c\"]}\nback = json.loads(text)              # JSON text -> dict\nprint(back[\"langs\"][0])              # python\nwith open(\"people.csv\", \"w\", newline=\"\") as f:   # newline=\"\" is recommended for csv\n    writer = csv.writer(f)\n    writer.writerow([\"name\", \"age\"])\n    writer.writerow([\"Ana\", 31])\nwith open(\"people.csv\", newline=\"\") as f:\n    for row in csv.DictReader(f):    # each row is a dict keyed by the header\n        print(row[\"name\"], row[\"age\"])\n"},"mistakes":["CSV values are strings: `row[\"age\"] + 1` raises TypeError. Convert with `int(row[\"age\"])`.","JSON needs double quotes and has no trailing commas; `json.loads(\"{'a': 1}\")` fails.","Splitting CSV lines with `.split(\",\")` breaks on values that contain commas: use the csv module."],"exercises":[{"title":"to_json","prompt":"Write `to_json(d)` returning the dict as JSON text with the keys sorted alphabetically.","starter":"import json\n\ndef to_json(d):\n    pass\n","solution":"import json\n\ndef to_json(d):\n    return json.dumps(d, sort_keys=True)","hint":"","tests":[{"expected":"{\"a\": [1, 2], \"b\": 1}","append":"print(to_json({'b': 1, 'a': [1, 2]}))"}],"local_only":false},{"title":"total_age","prompt":"Write `total_age(json_text)`. The text is a JSON list of objects with an `age` field; return the sum of the ages.","starter":"import json\n\ndef total_age(json_text):\n    pass\n","solution":"import json\n\ndef total_age(json_text):\n    return sum(person[\"age\"] for person in json.loads(json_text))","hint":"","tests":[{"expected":"55","append":"print(total_age('[{\"name\": \"Ann\", \"age\": 30}, {\"name\": \"Bo\", \"age\": 25}]'))"}],"local_only":false},{"title":"csv_sum","prompt":"Write `csv_sum(path, column)` returning the sum of the numbers in the named column of a CSV file with a header row.","starter":"import csv\n\ndef csv_sum(path, column):\n    pass\n","solution":"import csv\n\ndef csv_sum(path, column):\n    with open(path, newline=\"\") as f:\n        return sum(float(row[column]) for row in csv.DictReader(f))","hint":"","tests":[{"expected":"7.5","append":"open('p.csv', 'w').write('item,price\\npen,2.5\\nbook,5\\n')\nprint(csv_sum('p.csv', 'price'))"}],"local_only":false}],"quiz":[{"q":"What does json.dumps(data) return?","options":["A file","A dict","A JSON string"],"answer":2,"why":"dumps = dump to string."},{"q":"What does json.loads(text) return?","options":["Nothing","Python data (dict/list/...)","A string"],"answer":1,"why":"loads parses JSON text."},{"q":"What type are values read by csv.DictReader?","options":["float","int","str"],"answer":2,"why":"CSV has no types, everything is text."},{"q":"Why use the csv module instead of split(\",\")?","options":["It handles quotes and commas inside values","split does not exist","It is shorter"],"answer":0,"why":"Real CSV is trickier than it looks."},{"q":"Which is valid JSON?","options":["{'a': 1}","{\"a\": 1}","{a: 1}"],"answer":1,"why":"JSON requires double-quoted keys."}],"challenge":{"title":"csv_to_json","prompt":"Write `csv_to_json(text)` which takes CSV text (with a header row) and returns a JSON string: a list of objects, keys sorted, values left as strings.","starter":"import csv, io, json\n\ndef csv_to_json(text):\n    pass\n","solution":"import csv, io, json\n\ndef csv_to_json(text):\n    rows = list(csv.DictReader(io.StringIO(text)))\n    return json.dumps(rows, sort_keys=True)","hint":"io.StringIO(text) lets csv read from a string.","tests":[{"expected":"[{\"age\": \"31\", \"name\": \"Ana\"}, {\"age\": \"25\", \"name\": \"Bo\"}]","append":"print(csv_to_json('name,age\\nAna,31\\nBo,25\\n'))"}],"local_only":false}},{"id":28,"track":"BUILD","slug":"modules-imports","title":"Modules and imports","terms":[{"term":"module","def":"A Python file whose functions and values you can reuse in another file."},{"term":"import","def":"Loads a module so you can use its contents: import math, then math.sqrt(9)."},{"term":"from ... import","def":"Brings specific names in directly: from math import sqrt."},{"term":"alias (as)","def":"A shorter name: import datetime as dt."},{"term":"package","def":"A folder of modules."},{"term":"__name__","def":"A variable that is \"__main__\" when the file is run directly and the module name when it is imported."},{"term":"standard library","def":"The modules that come with Python: math, random, datetime, json ..."}],"explain":"Python's strength is its huge library of ready-made modules. Your own files are modules too. The `if __name__ == \"__main__\":` guard lets a file be both a program and an importable module.","example":{"code":"import math                          # use the whole module: math.sqrt(...)\nprint(math.sqrt(16))                 # 4.0\nfrom random import randint           # take just one name\nimport datetime as dt                # give the module a shorter name\nprint(dt.date(2024, 1, 31).year)     # 2024\ndef main():\n    print(\"running as a program\")\nif __name__ == \"__main__\":           # true only when you run this file directly\n    main()\nprint(__name__)                      # __main__\n"},"mistakes":["Naming your file like a standard module (`random.py`, `math.py`) breaks `import random`: your file is found first.","`from module import *` hides where names come from. Import what you need by name.","Circular imports: two files importing each other at the top can fail. Move shared code into a third module."],"exercises":[{"title":"Hypotenuse","prompt":"Use the `math` module to print the length of the hypotenuse of a right triangle with sides 3 and 4 (it should show `5.0`).","starter":"# Write your code below\n","solution":"import math\nprint(math.hypot(3, 4))","hint":"","tests":[{"expected":"5.0"}],"local_only":false},{"title":"Make a module","prompt":"Write a file `shapes.py` from your program (open it for writing) containing `def area(w, h): return w * h`, then import it and print `area(3, 4)`.","starter":"# Write your code below\n","solution":"with open(\"shapes.py\", \"w\") as f:\n    f.write(\"def area(w, h):\\n    return w * h\\n\")\nimport shapes\nprint(shapes.area(3, 4))","hint":"Write the file first, then `import shapes`.","tests":[{"expected":"12"}],"local_only":false},{"title":"floor and ceil","prompt":"Use `from math import floor, ceil` and print the floor and the ceiling of 3.2 on two lines.","starter":"# Write your code below\n","solution":"from math import floor, ceil\nprint(floor(3.2))\nprint(ceil(3.2))","hint":"","tests":[{"expected":"3\n4"}],"local_only":false}],"quiz":[{"q":"What does `import math` give you?","options":["Access to math.sqrt, math.pi, ...","A variable named math with no content","Nothing until you call it"],"answer":0,"why":"You use the names with a dot."},{"q":"What is __name__ when a file is run directly?","options":["None","\"__main__\"","The file name"],"answer":1,"why":"That is how the guard works."},{"q":"What does `import datetime as dt` do?","options":["Lets you write dt.date(...)","Installs datetime","Renames the file"],"answer":0,"why":"as creates an alias."},{"q":"Which is part of the standard library?","options":["json","numpy","requests"],"answer":0,"why":"json ships with Python; the others must be installed."},{"q":"What happens if you name your file random.py?","options":["Python renames it","import random may load your file instead","Nothing"],"answer":1,"why":"The current folder is searched first."}],"challenge":{"title":"Days between","prompt":"Read two dates (one per line, `YYYY-MM-DD`) and print how many days apart they are (always a positive number).","starter":"# Write your code below\n","solution":"from datetime import date\na = date.fromisoformat(input())\nb = date.fromisoformat(input())\nprint(abs((a - b).days))","hint":"Subtracting two dates gives a timedelta with a .days attribute.","tests":[{"expected":"60","stdin":"2024-01-01\n2024-03-01\n"},{"expected":"0","stdin":"2023-12-25\n2023-12-25\n"},{"expected":"60","stdin":"2024-03-01\n2024-01-01\n"}],"local_only":false}},{"id":29,"track":"BUILD","slug":"stdlib-tour","title":"Standard library tour: math, random, datetime, collections","terms":[{"term":"math","def":"Functions for maths: sqrt, floor, ceil, pi, hypot, ..."},{"term":"random","def":"Random numbers and choices. random.seed(n) makes results repeatable."},{"term":"datetime","def":"Dates and times: date, datetime and timedelta (a length of time)."},{"term":"Counter","def":"A dict that counts things: Counter(\"banana\") gives a:3, n:2, b:1."},{"term":"defaultdict","def":"A dict that creates a default value for missing keys, e.g. an empty list."},{"term":"deque","def":"A list-like queue that is fast to add/remove at both ends."}],"explain":"Before writing something yourself, check the standard library: Python ships with tools for dates, counting, randomness and much more. Learn the names, then read the documentation when you need details.","example":{"code":"import math, random\nfrom collections import Counter, defaultdict\nfrom datetime import date, timedelta\nprint(math.floor(2.7), math.ceil(2.1), math.pi)   # 2 3 3.141592653589793\nrandom.seed(1)                       # a fixed seed makes \"random\" repeatable\nprint(random.randint(1, 6))          # a dice roll between 1 and 6\nprint(random.choice([\"a\", \"b\", \"c\"]))\nprint(Counter(\"banana\").most_common(1))          # [('a', 3)]\ngroups = defaultdict(list)           # missing keys start as an empty list\ngroups[\"x\"].append(1)\nprint(dict(groups))                  # {'x': [1]}\nprint(date(2024, 2, 28) + timedelta(days=2))     # 2024-03-01\n"},"mistakes":["Using `random` for secrets or passwords: use the `secrets` module for security.","`randint(1, 6)` includes both ends; `randrange(1, 6)` stops before 6.","Forgetting that Counter returns 0 for missing keys: it never raises KeyError."],"exercises":[{"title":"most_common_word","prompt":"Write `most_common_word(text)` returning the word that appears most often in `text` (split on spaces).","starter":"from collections import Counter\n\ndef most_common_word(text):\n    pass\n","solution":"from collections import Counter\n\ndef most_common_word(text):\n    return Counter(text.split()).most_common(1)[0][0]","hint":"","tests":[{"expected":"the\nz","append":"print(most_common_word('the cat and the dog and the bird'))\nprint(most_common_word('z z a'))"}],"local_only":false},{"title":"add_days","prompt":"Write `add_days(iso, n)` taking a date like `\"2024-02-28\"` and returning the date `n` days later in the same `YYYY-MM-DD` format.","starter":"from datetime import date, timedelta\n\ndef add_days(iso, n):\n    pass\n","solution":"from datetime import date, timedelta\n\ndef add_days(iso, n):\n    return (date.fromisoformat(iso) + timedelta(days=n)).isoformat()","hint":"","tests":[{"expected":"2024-03-01\n2024-01-01","append":"print(add_days('2024-02-28', 2))\nprint(add_days('2023-12-31', 1))"}],"local_only":false},{"title":"group_by_first_letter","prompt":"Write `group_by_first_letter(words)` returning a dict from first letter to the list of words starting with it (use `defaultdict`, then convert with `dict()`).","starter":"from collections import defaultdict\n\ndef group_by_first_letter(words):\n    pass\n","solution":"from collections import defaultdict\n\ndef group_by_first_letter(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[w[0]].append(w)\n    return dict(groups)","hint":"","tests":[{"expected":"{'a': ['apple', 'avocado'], 'b': ['banana', 'blueberry'], 'c': ['cherry']}","append":"print(group_by_first_letter(['apple', 'avocado', 'banana', 'blueberry', 'cherry']))"}],"local_only":false}],"quiz":[{"q":"What does random.seed(5) do?","options":["Picks 5","Makes the random numbers repeatable","Makes them truly random"],"answer":1,"why":"The same seed gives the same sequence."},{"q":"What does Counter(\"aab\")[\"a\"] give?","options":["KeyError","1","2"],"answer":2,"why":"It counts occurrences."},{"q":"What does a defaultdict(list) do for a missing key?","options":["Raises KeyError","Creates an empty list","Returns None"],"answer":1,"why":"The default factory is called."},{"q":"What is date(2024, 1, 1) + timedelta(days=1)?","options":["2024-02-01","An error","2024-01-02"],"answer":2,"why":"A timedelta is a length of time."},{"q":"What does math.ceil(2.1) return?","options":["3","2","2.1"],"answer":0,"why":"ceil rounds up."}],"challenge":{"title":"deal","prompt":"Write `deal(n)` that returns a list of `n` different cards from a 52-card deck. A card is a string like `\"AS\"` or `\"10H\"`: rank (A,2-10,J,Q,K) followed by suit (S,H,D,C).","starter":"import random\n\ndef deal(n):\n    pass\n","solution":"import random\n\ndef deal(n):\n    ranks = [\"A\"] + [str(r) for r in range(2, 11)] + [\"J\", \"Q\", \"K\"]\n    deck = [r + s for r in ranks for s in \"SHDC\"]\n    return random.sample(deck, n)","hint":"random.sample(population, k) picks k different items.","tests":[{"expected":"52\n5\n5\nTrue","append":"cards = deal(52)\nprint(len(set(cards)))\nprint(len(deal(5)))\nprint(len(set(deal(5))))\nprint(all(c[-1] in 'SHDC' for c in cards))"}],"local_only":false}},{"id":30,"track":"BUILD","slug":"venv-pip","title":"Virtual environments and pip","terms":[{"term":"package","def":"Code written by someone else that you install and import."},{"term":"pip","def":"Python's installer: pip install requests downloads a package from PyPI."},{"term":"PyPI","def":"The Python Package Index, the public catalogue pip downloads from."},{"term":"virtual environment (venv)","def":"A private folder with its own Python and packages so projects do not interfere with each other."},{"term":"requirements.txt","def":"A text file listing the packages (and versions) a project needs."},{"term":"dependency","def":"A package your project needs in order to work."}],"explain":"Without virtual environments every project shares one pile of packages and versions clash. Create one `.venv` per project, activate it, then `pip install` into it. The commands run in your own terminal; this chapter's exercises practise the same ideas in Python code that works offline.","example":{"code":"# In a terminal (not this practice terminal) you would run:\n#   python -m venv .venv                create an isolated environment\n#   source .venv/bin/activate           (Windows: .venv\\Scripts\\activate)\n#   pip install requests               install a package from PyPI\n#   pip freeze > requirements.txt      save the exact versions\nimport sys, venv, os\nprint(sys.prefix == sys.base_prefix)     # True when NOT inside a virtual environment\nvenv.create(\"demo_env\", with_pip=False)  # make one from Python code (works offline)\nprint(os.path.exists(\"demo_env/pyvenv.cfg\"))   # True\n"},"mistakes":["Installing packages globally and breaking another project: always use a venv.","Forgetting to activate: `pip install` then goes to the wrong Python. Check `which python` / `where python`.","Committing the .venv folder to git: keep only requirements.txt."],"exercises":[{"title":"in_venv","prompt":"Write `in_venv()` returning True when the program runs inside a virtual environment (`sys.prefix` differs from `sys.base_prefix`).","starter":"import sys\n\ndef in_venv():\n    pass\n","solution":"import sys\n\ndef in_venv():\n    return sys.prefix != sys.base_prefix","hint":"","tests":[{"expected":"True","append":"import sys\nprint(in_venv() == (sys.prefix != sys.base_prefix) and isinstance(in_venv(), bool))"}],"local_only":true},{"title":"parse_requirements","prompt":"Write `parse_requirements(text)`. Each line looks like `name==version`; ignore blank lines and lines starting with `#`. Return a dict from name to version.","starter":"def parse_requirements(text):\n    pass\n","solution":"def parse_requirements(text):\n    result = {}\n    for line in text.splitlines():\n        line = line.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n        name, version = line.split(\"==\")\n        result[name] = version\n    return result","hint":"","tests":[{"expected":"{'requests': '2.31.0', 'flask': '3.0.0'}","append":"print(parse_requirements('requests==2.31.0\\n# web\\n\\nflask==3.0.0\\n'))"}],"local_only":false},{"title":"Create a venv","prompt":"Create a virtual environment in a folder called `myenv` with the `venv` module (use `with_pip=False` so it works offline) and print whether the file `myenv/pyvenv.cfg` exists.","starter":"# Write your code below\n","solution":"import os, venv\nvenv.create(\"myenv\", with_pip=False)\nprint(os.path.exists(\"myenv/pyvenv.cfg\"))","hint":"","tests":[{"expected":"True"}],"local_only":true}],"quiz":[{"q":"Why use a virtual environment?","options":["To make Python faster","To keep each project's packages separate","To avoid typing import"],"answer":1,"why":"Different projects can need different versions."},{"q":"What does pip install requests do?","options":["Downloads the package from PyPI","Imports it","Creates a file"],"answer":0,"why":"pip installs; import uses."},{"q":"What is requirements.txt for?","options":["Running tests","Storing passwords","Listing the packages a project needs"],"answer":2,"why":"Others can recreate your environment with pip install -r."},{"q":"Which command creates a venv?","options":["python -m venv .venv","pip venv .venv","python venv"],"answer":0,"why":"venv is a module run with -m."},{"q":"What is PyPI?","options":["The public package catalogue","A text editor","A Python version"],"answer":0,"why":"pip downloads from it by default."}],"challenge":{"title":"format_requirements","prompt":"Write `format_requirements(deps)`. `deps` is a dict from package name to version. Return the text of a requirements file: one `name==version` line per package, sorted by name, joined with newlines.","starter":"def format_requirements(deps):\n    pass\n","solution":"def format_requirements(deps):\n    return \"\\n\".join(f\"{name}=={deps[name]}\" for name in sorted(deps))","hint":"","tests":[{"expected":"click==8.1.7\nflask==3.0.0","append":"print(format_requirements({'flask': '3.0.0', 'click': '8.1.7'}))"}],"local_only":false}},{"id":31,"track":"BUILD","slug":"comprehensions","title":"Comprehensions","terms":[{"term":"list comprehension","def":"A compact way to build a list: [expression for item in items if condition]."},{"term":"condition","def":"The optional `if` at the end that filters which items are included."},{"term":"dict comprehension","def":"{key: value for ...} builds a dictionary."},{"term":"set comprehension","def":"{expression for ...} builds a set."},{"term":"generator expression","def":"Like a list comprehension in round brackets; produces values one at a time without building a list."}],"explain":"A comprehension is a loop that builds a collection, written on one line. Read it like English: \"give me n squared, for each n in the range, if n is even\". Use it when it stays readable; use a normal loop when it does not.","example":{"code":"squares = [n * n for n in range(1, 6)]            # [1, 4, 9, 16, 25]\nevens = [n for n in range(10) if n % 2 == 0]       # filter: [0, 2, 4, 6, 8]\nwords = [\"apple\", \"fig\", \"kiwi\"]\nlengths = {w: len(w) for w in words}               # {'apple': 5, 'fig': 3, 'kiwi': 4}\nunique = {c for c in \"hello\"}                      # a set comprehension\npairs = [(x, y) for x in range(2) for y in range(2)]   # [(0, 0), (0, 1), (1, 0), (1, 1)]\ntotal = sum(n * n for n in range(4))               # generator expression: 14\n"},"mistakes":["Cramming too much into one comprehension. If it needs more than one line to understand, use a loop.","Putting the filter in the wrong place: `[x if x > 0 for x in xs]` is a SyntaxError; the condition goes at the end.","Using a comprehension just for side effects like printing: use a for loop."],"exercises":[{"title":"cubes","prompt":"Write `cubes(n)` returning `[1, 8, 27, ...]`: the cubes of 1..n, using a list comprehension.","starter":"def cubes(n):\n    pass\n","solution":"def cubes(n):\n    return [i ** 3 for i in range(1, n + 1)]","hint":"","tests":[{"expected":"[1, 8, 27, 64]\n[]","append":"print(cubes(4))\nprint(cubes(0))"}],"local_only":false},{"title":"lengths_dict","prompt":"Write `lengths_dict(words)` returning a dict from each word to its length, using a dict comprehension.","starter":"def lengths_dict(words):\n    pass\n","solution":"def lengths_dict(words):\n    return {w: len(w) for w in words}","hint":"","tests":[{"expected":"{'apple': 5, 'fig': 3}","append":"print(lengths_dict(['apple', 'fig']))"}],"local_only":false},{"title":"vowels_only","prompt":"Write `vowels_only(text)` returning a string with only the vowels (a, e, i, o, u) of `text`, in order.","starter":"def vowels_only(text):\n    pass\n","solution":"def vowels_only(text):\n    return \"\".join(c for c in text if c in \"aeiou\")","hint":"","tests":[{"expected":"euaio\n","append":"print(vowels_only('education'))\nprint(vowels_only('rhythm'))"}],"local_only":false}],"quiz":[{"q":"What does [n * 2 for n in [1, 2, 3]] give?","options":["[6]","[2, 4, 6]","[1, 2, 3]"],"answer":1,"why":"Each n is doubled."},{"q":"Where does the filter go?","options":["Inside the brackets of range","At the end: [x for x in xs if x > 0]","At the start"],"answer":1,"why":"The if comes after the for part."},{"q":"What does {w: len(w) for w in [\"a\", \"bb\"]} give?","options":["{'a': 1, 'bb': 2}","{1, 2}","['a', 'bb']"],"answer":0,"why":"A dict comprehension."},{"q":"What is sum(n for n in range(4))?","options":["6","4","10"],"answer":0,"why":"0 + 1 + 2 + 3."},{"q":"When should you prefer a normal loop?","options":["When you use numbers","Never","When the comprehension gets hard to read"],"answer":2,"why":"Readability wins."}],"challenge":{"title":"transpose","prompt":"Write `transpose(matrix)` returning the transposed list of lists (rows become columns).","starter":"def transpose(matrix):\n    pass\n","solution":"def transpose(matrix):\n    return [[row[i] for row in matrix] for i in range(len(matrix[0]))]","hint":"A comprehension inside a comprehension.","tests":[{"expected":"[[1, 4], [2, 5], [3, 6]]","append":"print(transpose([[1, 2, 3], [4, 5, 6]]))"}],"local_only":false}},{"id":32,"track":"BUILD","slug":"generators","title":"Generators","terms":[{"term":"generator","def":"A function that produces values one at a time and remembers where it stopped."},{"term":"yield","def":"Hands one value to the caller and pauses the function until the next value is asked for."},{"term":"lazy evaluation","def":"Doing work only when the result is needed, so huge or infinite sequences use almost no memory."},{"term":"next()","def":"Asks an iterator or generator for its next value."},{"term":"StopIteration","def":"The signal raised when there are no more values; a for loop handles it for you."}],"explain":"A normal function returns once. A generator function uses `yield` to hand out many values over time. It is perfect for big files, endless sequences and pipelines where you do not want a giant list in memory.","example":{"code":"def countdown(n):\n    while n > 0:\n        yield n                    # yield hands out one value and pauses here\n        n -= 1\ngen = countdown(3)\nprint(next(gen))                   # 3\nprint(next(gen))                   # 2\nprint(list(gen))                   # [1]  (the rest)\ndef evens():\n    n = 0\n    while True:                    # an endless sequence is fine: values are made on demand\n        yield n\n        n += 2\nfor i, e in zip(range(3), evens()):\n    print(e)                       # 0 2 4\n"},"mistakes":["Reusing a generator: once it is used up it is empty. Make a new one to start again.","Calling `list()` on an infinite generator never ends. Limit it with `zip(range(n), gen)` or `itertools.islice`.","Using `return value` where you meant `yield value`."],"exercises":[{"title":"squares_up_to","prompt":"Write a generator `squares_up_to(n)` that yields the squares of 1..n.","starter":"def squares_up_to(n):\n    pass\n","solution":"def squares_up_to(n):\n    for i in range(1, n + 1):\n        yield i * i","hint":"","tests":[{"expected":"[1, 4, 9, 16]","append":"print(list(squares_up_to(4)))"}],"local_only":false},{"title":"fibonacci","prompt":"Write an endless generator `fibonacci()` yielding 0, 1, 1, 2, 3, 5, ...","starter":"def fibonacci():\n    pass\n","solution":"def fibonacci():\n    a, b = 0, 1\n    while True:\n        yield a\n        a, b = b, a + b","hint":"","tests":[{"expected":"[0, 1, 1, 2, 3, 5, 8, 13]","append":"g = fibonacci()\nprint([next(g) for _ in range(8)])"}],"local_only":false},{"title":"chunks","prompt":"Write a generator `chunks(items, size)` yielding successive lists of `size` items (the last one may be shorter).","starter":"def chunks(items, size):\n    pass\n","solution":"def chunks(items, size):\n    for i in range(0, len(items), size):\n        yield items[i:i + size]","hint":"","tests":[{"expected":"[[1, 2], [3, 4], [5]]","append":"print(list(chunks([1, 2, 3, 4, 5], 2)))"}],"local_only":false}],"quiz":[{"q":"What does yield do?","options":["Ends the program","Hands out a value and pauses","Prints a value"],"answer":1,"why":"The function resumes after the yield on the next request."},{"q":"What is special about a generator?","options":["It makes values on demand","It stores all values","It cannot be looped over"],"answer":0,"why":"That is lazy evaluation."},{"q":"What does list(countdown(3)) give for the example?","options":["3","[3, 2, 1]","[1, 2, 3]"],"answer":1,"why":"list() collects every yielded value."},{"q":"What happens when next() is called on a finished generator?","options":["None","StopIteration","It restarts"],"answer":1,"why":"There is nothing left to give."},{"q":"Which is a generator expression?","options":["[n * n for n in range(3)]","{n * n for n in range(3)}","(n * n for n in range(3))"],"answer":2,"why":"Round brackets, no list is built."}],"challenge":{"title":"running_total","prompt":"Write a generator `running_total(nums)` yielding the cumulative sums: for `[1, 2, 3, 4]` it yields 1, 3, 6, 10.","starter":"def running_total(nums):\n    pass\n","solution":"def running_total(nums):\n    total = 0\n    for n in nums:\n        total += n\n        yield total","hint":"","tests":[{"expected":"[1, 3, 6, 10]\n[]","append":"print(list(running_total([1, 2, 3, 4])))\nprint(list(running_total([])))"}],"local_only":false}},{"id":33,"track":"BUILD","slug":"iterators","title":"Iterators","terms":[{"term":"iterable","def":"Anything you can loop over: lists, strings, dicts, files, ranges."},{"term":"iterator","def":"An object that hands out items one by one with next() and remembers its position."},{"term":"iter()","def":"Turns an iterable into an iterator."},{"term":"enumerate()","def":"Loops with a counter: gives (position, item) pairs."},{"term":"zip()","def":"Walks several iterables in step, giving tuples."},{"term":"iterator protocol","def":"A class with __iter__ (returns itself) and __next__ (returns the next item or raises StopIteration)."}],"explain":"A `for` loop secretly calls `iter()` on the thing and then `next()` until StopIteration. Knowing this lets you build your own iterable objects and use tools like `enumerate` and `zip` with confidence.","example":{"code":"items = [\"a\", \"b\"]\nit = iter(items)                   # an iterator remembers where it is\nprint(next(it))                    # a\nprint(next(it))                    # b\n# next(it) would now raise StopIteration: nothing left\nfor i, item in enumerate([\"x\", \"y\"], start=1):   # (position, item) pairs\n    print(i, item)\nnames, ages = [\"Ana\", \"Bo\"], [31, 25]\nfor name, age in zip(names, ages): # zip walks several iterables together\n    print(name, age)\nclass Countdown:                   # your own iterator (classes: chapter 35)\n    def __init__(self, n):\n        self.n = n\n    def __iter__(self):\n        return self\n    def __next__(self):\n        if self.n <= 0:\n            raise StopIteration\n        self.n -= 1\n        return self.n + 1\nprint(list(Countdown(3)))          # [3, 2, 1]\n"},"mistakes":["Looping twice over an iterator: the second loop finds it already used up.","`zip` stops at the shortest input; extra items are silently dropped.","Forgetting `raise StopIteration` in `__next__`: the loop never ends."],"exercises":[{"title":"with_index","prompt":"Write `with_index(items)` returning strings like `\"1: a\"`, numbering from 1 (use `enumerate`).","starter":"def with_index(items):\n    pass\n","solution":"def with_index(items):\n    return [f\"{i}: {item}\" for i, item in enumerate(items, start=1)]","hint":"","tests":[{"expected":"['1: a', '2: b']","append":"print(with_index(['a', 'b']))"}],"local_only":false},{"title":"pair_up","prompt":"Write `pair_up(keys, values)` returning a dict that pairs each key with the value in the same position (use `zip`).","starter":"def pair_up(keys, values):\n    pass\n","solution":"def pair_up(keys, values):\n    return dict(zip(keys, values))","hint":"","tests":[{"expected":"{'x': 1, 'y': 2}","append":"print(pair_up(['x', 'y'], [1, 2]))"}],"local_only":false},{"title":"first_or_none","prompt":"Write `first_or_none(iterable)` returning its first item, or `None` when it is empty (use `iter` and `next` with a default).","starter":"def first_or_none(iterable):\n    pass\n","solution":"def first_or_none(iterable):\n    return next(iter(iterable), None)","hint":"","tests":[{"expected":"5\nNone\nh","append":"print(first_or_none([5, 6]))\nprint(first_or_none([]))\nprint(first_or_none('hey'))"}],"local_only":false}],"quiz":[{"q":"What does iter([1, 2]) return?","options":["The number 1","An iterator","A list"],"answer":1,"why":"It prepares the list for step-by-step reading."},{"q":"What happens when next() runs out of items?","options":["None is returned","It starts over","StopIteration is raised"],"answer":2,"why":"A for loop catches it silently."},{"q":"What does list(enumerate(\"ab\")) give?","options":["['a', 'b']","[0, 1]","[(0, 'a'), (1, 'b')]"],"answer":2,"why":"(position, item) pairs."},{"q":"What does zip([1, 2], [\"a\", \"b\", \"c\"]) stop at?","options":["It raises an error","The longest input","The shortest input"],"answer":2,"why":"The extra \"c\" is dropped."},{"q":"Which method makes an object an iterator?","options":["__len__","__str__","__next__ (with __iter__ returning self)"],"answer":2,"why":"That is the iterator protocol."}],"challenge":{"title":"Repeat","prompt":"Define a class `Repeat(item, times)` that is an iterator giving `item` exactly `times` times, so `list(Repeat(\"hi\", 3))` is `['hi', 'hi', 'hi']`.","starter":"class Repeat:\n    def __init__(self, item, times):\n        pass\n","solution":"class Repeat:\n    def __init__(self, item, times):\n        self.item = item\n        self.left = times\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.left <= 0:\n            raise StopIteration\n        self.left -= 1\n        return self.item","hint":"Count down how many items are left; raise StopIteration at zero.","tests":[{"expected":"['hi', 'hi', 'hi']\n[]","append":"print(list(Repeat('hi', 3)))\nprint(list(Repeat(1, 0)))"}],"local_only":false}},{"id":34,"track":"BUILD","slug":"decorators","title":"Decorators","terms":[{"term":"decorator","def":"A function that takes a function and returns a new, usually extended, version of it."},{"term":"wrapper","def":"The inner function a decorator builds. It runs extra code before/after calling the original."},{"term":"@ syntax","def":"@name above a def is shorthand for func = name(func)."},{"term":"closure","def":"An inner function that remembers variables of the outer function that created it."},{"term":"functools.wraps","def":"A helper that copies the original function's name and docstring onto the wrapper."},{"term":"decorator factory","def":"A function that takes arguments and returns a decorator: @repeat(3)."}],"explain":"Functions are values, so a function can receive another function, wrap it with extra behaviour and return the wrapped version. Decorators are used everywhere: timing, logging, caching, access checks and web routes.","example":{"code":"def shout(func):                    # a decorator takes a function...\n    def wrapper(*args, **kwargs):\n        result = func(*args, **kwargs)\n        return result.upper()\n    return wrapper                  # ...and returns a new one\n@shout                              # same as: greet = shout(greet)\ndef greet(name):\n    return \"hello \" + name\nprint(greet(\"ada\"))                 # HELLO ADA\nimport time\ndef timer(func):\n    def wrapper(*args, **kwargs):\n        start = time.perf_counter()\n        value = func(*args, **kwargs)\n        print(f\"{func.__name__} took {time.perf_counter() - start:.4f}s\")\n        return value\n    return wrapper\n"},"mistakes":["Forgetting to return the wrapper: the decorated name becomes None.","Not passing through `*args, **kwargs`: the wrapper then breaks functions with arguments.","Forgetting `return func(...)` inside the wrapper, which swallows the result."],"exercises":[{"title":"double_result","prompt":"Write a decorator `double_result` that makes the decorated function return twice its normal result.","starter":"def double_result(func):\n    pass\n","solution":"def double_result(func):\n    def wrapper(*args, **kwargs):\n        return func(*args, **kwargs) * 2\n    return wrapper","hint":"","tests":[{"expected":"6","append":"@double_result\ndef f(x):\n    return x + 1\nprint(f(2))"}],"local_only":false},{"title":"count_calls","prompt":"Write a decorator `count_calls` that counts how often the function is called and stores the number in `wrapper.calls`.","starter":"def count_calls(func):\n    pass\n","solution":"def count_calls(func):\n    def wrapper(*args, **kwargs):\n        wrapper.calls += 1\n        return func(*args, **kwargs)\n    wrapper.calls = 0\n    return wrapper","hint":"Functions can have attributes: wrapper.calls = 0.","tests":[{"expected":"2","append":"@count_calls\ndef hi():\n    pass\nhi()\nhi()\nprint(hi.calls)"}],"local_only":false},{"title":"log_calls","prompt":"Write a decorator `log_calls` that prints `calling NAME` (the function's name) before running it and still returns the result.","starter":"def log_calls(func):\n    pass\n","solution":"def log_calls(func):\n    def wrapper(*args, **kwargs):\n        print(f\"calling {func.__name__}\")\n        return func(*args, **kwargs)\n    return wrapper","hint":"","tests":[{"expected":"calling add\n3","append":"@log_calls\ndef add(a, b):\n    return a + b\nprint(add(1, 2))"}],"local_only":false}],"quiz":[{"q":"What does @shout above def greet do?","options":["greet = shout(greet)","Calls greet","Deletes greet"],"answer":0,"why":"It is syntax sugar for wrapping."},{"q":"What does a decorator return?","options":["A function","Nothing","A string"],"answer":0,"why":"Usually a new wrapper function."},{"q":"Why use *args, **kwargs in a wrapper?","options":["So it works for any function signature","It is required by Python","It is faster"],"answer":0,"why":"The wrapper forwards whatever it receives."},{"q":"What is a closure?","options":["A closed file","A kind of loop","An inner function remembering outer variables"],"answer":2,"why":"The wrapper remembers func."},{"q":"What is @repeat(3)?","options":["A loop","A decorator factory call","A syntax error"],"answer":1,"why":"repeat(3) returns the real decorator."}],"challenge":{"title":"repeat","prompt":"Write a decorator factory `repeat(n)`: a function decorated with `@repeat(3)` runs 3 times each time it is called.","starter":"def repeat(n):\n    pass\n","solution":"def repeat(n):\n    def decorator(func):\n        def wrapper(*args, **kwargs):\n            for _ in range(n):\n                func(*args, **kwargs)\n        return wrapper\n    return decorator","hint":"Three levels: repeat(n) -> decorator(func) -> wrapper(...).","tests":[{"expected":"hi\nhi\nhi","append":"@repeat(3)\ndef hello():\n    print('hi')\nhello()"}],"local_only":false}},{"id":35,"track":"OOP","slug":"classes-objects","title":"Classes and objects","terms":[{"term":"class","def":"A blueprint that describes what a kind of thing is and does."},{"term":"object (instance)","def":"One concrete thing made from a class, with its own data."},{"term":"attribute","def":"A variable that belongs to an object: dog.name."},{"term":"method","def":"A function that belongs to a class (next chapters)."},{"term":"instantiate","def":"To create an object from a class by calling it: Dog()."},{"term":"class attribute","def":"A value stored on the class and shared by every object of it."}],"explain":"Object-oriented programming bundles data and the code that works on it. A class is the plan; each object built from it holds its own values. `type(x)` tells you which class an object came from and `isinstance(x, Class)` checks it.","example":{"code":"class Dog:                           # a class is a blueprint\n    species = \"Canis familiaris\"     # class attribute: shared by all dogs\nd = Dog()                            # create an object (an instance) from the class\nd.name = \"Rex\"                       # attach data (an attribute) to this object\nd.age = 3\nprint(d.name, d.age)                 # Rex 3\nprint(type(d))                       # <class '__main__.Dog'>\nprint(isinstance(d, Dog))            # True\nprint(d.species)                     # Canis familiaris\n"},"mistakes":["Forgetting the parentheses: `d = Dog` stores the class itself; `d = Dog()` creates an object.","Reading an attribute that was never set raises AttributeError.","Class names use CapWords (Dog, BankAccount); variables and functions use snake_case."],"exercises":[{"title":"A Book object","prompt":"Create an object `b` from the class `Book`, give it a `title` of \"Dune\" and an `author` of \"Frank Herbert\" and print `Dune by Frank Herbert`.","starter":"class Book:\n    pass\n","solution":"class Book:\n    pass\n\nb = Book()\nb.title = \"Dune\"\nb.author = \"Frank Herbert\"\nprint(f\"{b.title} by {b.author}\")","hint":"","tests":[{"expected":"Dune by Frank Herbert"}],"local_only":false},{"title":"Class attribute","prompt":"Give the class `Circle` a class attribute `pi` equal to 3.14159, then print `Circle.pi`.","starter":"class Circle:\n    pass\n","solution":"class Circle:\n    pi = 3.14159\n\nprint(Circle.pi)","hint":"","tests":[{"expected":"3.14159"}],"local_only":false},{"title":"make_point","prompt":"The class `Point` is ready. Write `make_point(x, y)` returning a Point whose attributes `x` and `y` are set.","starter":"class Point:\n    pass\n\ndef make_point(x, y):\n    pass\n","solution":"class Point:\n    pass\n\ndef make_point(x, y):\n    p = Point()\n    p.x = x\n    p.y = y\n    return p","hint":"","tests":[{"expected":"2 3","append":"p = make_point(2, 3)\nprint(p.x, p.y)"}],"local_only":false}],"quiz":[{"q":"What is an object?","options":["A function","One thing made from a class","A blueprint"],"answer":1,"why":"Objects are instances of classes."},{"q":"What does Dog() do?","options":["Defines the class","Deletes a dog","Creates a new Dog object"],"answer":2,"why":"Calling a class instantiates it."},{"q":"What does isinstance(d, Dog) check?","options":["Whether d was made from Dog","Whether d is empty","Whether Dog exists"],"answer":0,"why":"It returns True or False."},{"q":"Where does a class attribute live?","options":["On the class, shared by all objects","Only in functions","On every object separately"],"answer":0,"why":"Objects can read it through the class."},{"q":"Which is the usual style for a class name?","options":["bank_account","BankAccount","BANKACCOUNT"],"answer":1,"why":"CapWords."}],"challenge":{"title":"Shadowing","prompt":"The class `Cat` has a class attribute `legs = 4`. Make two cats `a` and `b`, set `a.legs = 3` on only the first one, then print `a.legs`, `b.legs` and `Cat.legs` on one line, separated by spaces.","starter":"class Cat:\n    legs = 4\n","solution":"class Cat:\n    legs = 4\n\na = Cat()\nb = Cat()\na.legs = 3\nprint(a.legs, b.legs, Cat.legs)","hint":"Setting an attribute on the object creates a new one on that object only.","tests":[{"expected":"3 4 4"}],"local_only":false}},{"id":36,"track":"OOP","slug":"init-self","title":"__init__ and self","terms":[{"term":"__init__","def":"A special method that runs automatically when an object is created. It sets up the object."},{"term":"self","def":"The first parameter of every method: the object the method is working on."},{"term":"constructor","def":"Another name for __init__ (or for the call Dog(...) that triggers it)."},{"term":"instance attribute","def":"A value stored on one object with self.name = value."},{"term":"default value","def":"A fallback for a parameter so the caller may leave it out."}],"explain":"`__init__` gives every new object its starting data in one place. Python passes the new object as `self` automatically, so you never write it when calling; you only write it when defining.","example":{"code":"class Dog:\n    def __init__(self, name, age=1):     # runs automatically when you create a Dog\n        self.name = name                 # self is the object being built\n        self.age = age\na = Dog(\"Rex\", 3)\nb = Dog(\"Pip\")\nprint(a.name, a.age)                     # Rex 3\nprint(b.name, b.age)                     # Pip 1\n"},"mistakes":["Forgetting `self.`: `name = name` inside `__init__` only sets a local variable, not an attribute.","Forgetting `self` as the first parameter: TypeError about \"takes 1 positional argument but 2 were given\".","Spelling it `__innit__` or `_init_`: Python will not call it."],"exercises":[{"title":"Rectangle","prompt":"Give `Rectangle` an `__init__(self, width, height)` that stores both values as attributes.","starter":"class Rectangle:\n    pass\n","solution":"class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height","hint":"","tests":[{"expected":"12","append":"r = Rectangle(3, 4)\nprint(r.width * r.height)"}],"local_only":false},{"title":"Player","prompt":"Write `Player` with `__init__(self, name, health=100)`.","starter":"class Player:\n    pass\n","solution":"class Player:\n    def __init__(self, name, health=100):\n        self.name = name\n        self.health = health","hint":"","tests":[{"expected":"Ana 100\nBo 40","append":"a = Player('Ana')\nb = Player('Bo', 40)\nprint(a.name, a.health)\nprint(b.name, b.health)"}],"local_only":false},{"title":"Account","prompt":"Write `Account` with `__init__(self, owner, balance=0)` storing both values.","starter":"class Account:\n    pass\n","solution":"class Account:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance","hint":"","tests":[{"expected":"Ada 0\nBo 50","append":"a = Account('Ada')\nb = Account('Bo', 50)\nprint(a.owner, a.balance)\nprint(b.owner, b.balance)"}],"local_only":false}],"quiz":[{"q":"When does __init__ run?","options":["When the file starts","When you print it","When an object is created"],"answer":2,"why":"It is called by Dog(...)."},{"q":"What is self?","options":["The class","A keyword for loops","The object the method works on"],"answer":2,"why":"Python passes it automatically."},{"q":"What does self.name = name do?","options":["Prints the name","Creates a local variable","Stores the value on the object"],"answer":2,"why":"It creates an instance attribute."},{"q":"Do you pass self when calling Dog(\"Rex\")?","options":["Yes, always first","Only for methods","No, Python does"],"answer":2,"why":"It is automatic."},{"q":"What happens if __init__ forgets self.?","options":["The value is lost when __init__ ends","It works fine","A SyntaxError"],"answer":0,"why":"A plain local variable disappears."}],"challenge":{"title":"Temperature","prompt":"Write `Temperature(celsius)` whose `__init__` stores `celsius` and also a computed attribute `fahrenheit` (celsius * 9 / 5 + 32).","starter":"class Temperature:\n    pass\n","solution":"class Temperature:\n    def __init__(self, celsius):\n        self.celsius = celsius\n        self.fahrenheit = celsius * 9 / 5 + 32","hint":"","tests":[{"expected":"100 212.0\n0 32.0","append":"t = Temperature(100)\nprint(t.celsius, t.fahrenheit)\nz = Temperature(0)\nprint(z.celsius, z.fahrenheit)"}],"local_only":false}},{"id":37,"track":"OOP","slug":"methods-attributes","title":"Methods and attributes","terms":[{"term":"method","def":"A function defined inside a class. Its first parameter is self."},{"term":"state","def":"The data an object currently holds in its attributes."},{"term":"behaviour","def":"What an object can do: its methods."},{"term":"encapsulation","def":"Keeping an object's data and the code that changes it together, so outside code uses methods instead of poking at attributes."},{"term":"_private (convention)","def":"A leading underscore says \"internal, do not use from outside\"."},{"term":"hasattr / getattr","def":"Check for or read an attribute by its name given as a string."}],"explain":"Methods give objects behaviour. They read and change `self`'s attributes, so an object's state always changes through code you control. That makes bugs easier to find.","example":{"code":"class Counter:\n    def __init__(self):\n        self.count = 0\n    def increment(self, by=1):       # a method: a function in a class; self comes first\n        self.count += by\n        return self.count\n    def reset(self):\n        self.count = 0\nc = Counter()\nc.increment()\nc.increment(5)\nprint(c.count)                       # 6\nc.reset()\nprint(c.count)                       # 0\nprint(hasattr(c, \"count\"), getattr(c, \"count\"))   # True 0\n"},"mistakes":["Calling `increment()` without the object: write `c.increment()`, not `increment()`.","Changing `self.count` in one method and expecting a local variable `count` in another to see it.","Returning nothing from a method and then using its result: it is None."],"exercises":[{"title":"BankAccount","prompt":"Write `BankAccount` (starting balance 0) with `deposit(amount)` and `withdraw(amount)`. Both return the new balance. `withdraw` raises `ValueError(\"insufficient funds\")` when the amount is more than the balance.","starter":"class BankAccount:\n    pass\n","solution":"class BankAccount:\n    def __init__(self):\n        self.balance = 0\n\n    def deposit(self, amount):\n        self.balance += amount\n        return self.balance\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n        return self.balance","hint":"","tests":[{"expected":"100\n70\ninsufficient funds","append":"a = BankAccount()\nprint(a.deposit(100))\nprint(a.withdraw(30))\ntry:\n    a.withdraw(500)\nexcept ValueError as e:\n    print(e)"}],"local_only":false},{"title":"Stack","prompt":"Write a `Stack` class with `push(item)`, `pop()` (returns the last pushed item) and `size()`.","starter":"class Stack:\n    pass\n","solution":"class Stack:\n    def __init__(self):\n        self.items = []\n\n    def push(self, item):\n        self.items.append(item)\n\n    def pop(self):\n        return self.items.pop()\n\n    def size(self):\n        return len(self.items)","hint":"","tests":[{"expected":"2\n1","append":"s = Stack()\ns.push(1)\ns.push(2)\nprint(s.pop())\nprint(s.size())"}],"local_only":false},{"title":"Light","prompt":"Write `Light` with an attribute `is_on` that starts False and a method `toggle()` that flips it.","starter":"class Light:\n    pass\n","solution":"class Light:\n
