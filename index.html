/* FLOWST theme: Wispr Flow dark mode. Warm near-black ink, cream text, lavender accent,
   fathom-green for progress, rounded 16px cards, Garamond display + Figtree UI.
   Every colour is a token. Dark is the default; the toggle switches to the cream light mode. */

:root {
  --bg: #efeedb;
  --panel: #fffff0;
  --bg-soft: #f6f5e2;
  --surface: #f6f5e2;
  --surface-2: #e8e7d3;
  --block: #f3f2df;
  --fg: #1a1a1a;
  --fg-2: #3a3a32;
  --muted: #666656;
  --faint: #8f8f7c;
  --line: rgba(26, 26, 15, .14);
  --line-muted: rgba(26, 26, 15, .08);
  --line-strong: rgba(26, 26, 15, .28);
  --accent: #9a6f00;
  --accent-hover: #7a5700;
  --accent-text: #8a6200;
  --accent-soft: rgba(154, 111, 0, .10);
  --on-accent: #1a1a1a;
  --btn-bg: rgba(26, 26, 15, .05);
  --btn-hover: rgba(26, 26, 15, .09);
  --btn-border: rgba(26, 26, 15, .14);
  --btn-primary: #f7d54a;
  --btn-primary-hover: #ffe066;
  --btn-primary-border: rgba(26, 26, 15, .14);
  --btn-primary-fg: #1a1a1a;
  --hover: rgba(26, 26, 15, .06);
  --counter-bg: rgba(26, 26, 15, .08);
  --code-bg: rgba(26, 26, 15, .07);
  --ok: #114e0b;
  --ok-solid: #034f46;
  --ok-soft: rgba(17, 78, 11, .10);
  --err: #7f1c34;
  --err-soft: rgba(127, 28, 52, .08);
  --warn: #5e5515;
  --warn-soft: rgba(160, 140, 30, .14);
  --info: #1f4fb0;
  --info-soft: rgba(31, 79, 176, .08);
  --sel: rgba(154, 111, 0, .2);
  --shadow: 0 1px 2px rgba(26, 26, 15, .05);
  --shadow-lg: 0 24px 48px -12px rgba(26, 26, 15, .18);

  /* syntax highlighting */
  --t-kw: #9a6f00;
  --t-str: #1d7a3a;
  --t-num: #1f5fa8;
  --t-com: #888878;
  --t-bi: #b0245e;
  --t-def: #1a1a1a;
  --t-dec: #9a6f00;

  --font-sans: Figtree, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "EB Garamond", "Tiempos Text", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --topbar-h: 60px;
  --sidebar-w: 280px;
  --radius: 14px;
  --radius-sm: 10px;
  color-scheme: light;
}

:root[data-theme="dark"], #dock, #footer {
  --bg: #0e0e0c;
  --panel: #151513;
  --bg-soft: #1b1b18;
  --surface: #1b1b18;
  --surface-2: #25251f;
  --block: #0d0d0b;
  --fg: #f6f4e8;
  --fg-2: #d6d4c6;
  --muted: #98978a;
  --faint: #67665b;
  --line: rgba(255, 255, 235, .10);
  --line-muted: rgba(255, 255, 235, .06);
  --line-strong: rgba(255, 255, 235, .20);
  --accent: #f2c94c;
  --accent-hover: #ffe066;
  --accent-text: #ffe27a;
  --accent-soft: rgba(255, 214, 64, .12);
  --on-accent: #1a1a1a;
  --btn-bg: rgba(255, 255, 235, .07);
  --btn-hover: rgba(255, 255, 235, .12);
  --btn-border: rgba(255, 255, 235, .10);
  --btn-primary: #f7d54a;
  --btn-primary-hover: #ffe066;
  --btn-primary-border: transparent;
  --btn-primary-fg: #1a1a1a;
  --hover: rgba(255, 255, 235, .06);
  --counter-bg: rgba(255, 255, 235, .10);
  --code-bg: rgba(255, 255, 235, .08);
  --ok: #8fd9a0;
  --ok-solid: #034f46;
  --ok-soft: rgba(143, 217, 160, .12);
  --err: #ff9aa8;
  --err-soft: rgba(255, 154, 168, .12);
  --warn: #e8c872;
  --warn-soft: rgba(232, 200, 114, .12);
  --info: #9fc8ff;
  --info-soft: rgba(159, 200, 255, .10);
  --sel: rgba(255, 214, 64, .28);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, .6);
  --t-kw: #ffd666;
  --t-str: #a8e6b8;
  --t-num: #9fd4ff;
  --t-com: #7d7c6e;
  --t-bi: #ffb3c8;
  --t-def: #f6f4e8;
  --t-dec: #ffd666;
  color-scheme: dark;
}

/* The practice terminal and the floating pill are always dark, like Wispr's capsule. */
#dock, #footer { --bg: #0a0a09; --bg-soft: #161614; }

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body {
  font: 400 16px/1.65 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--sel); }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

h1, h2, h3 { margin: 0; font-family: var(--font-serif); font-weight: 500; color: var(--fg); text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 2.4rem; line-height: 1.15; }
h2 { font-size: 1.55rem; line-height: 1.25; }
h3 { font-size: 1.15rem; line-height: 1.3; }
p { margin: 0 0 1em; }
ul, ol { margin: 0 0 1em; padding-left: 1.4em; }
li { margin: .25em 0; }
li::marker { color: var(--faint); }

code, kbd, pre { font-family: var(--font-mono); }
code { font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: .08em .35em; color: var(--fg); }
kbd {
  font-size: 12px; line-height: 1; padding: 3px 6px; border: 1px solid var(--line-strong);
  border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--muted);
}
b, strong { font-weight: 600; }

.muted { color: var(--muted); }
.ok { color: var(--ok); }
.bad { color: var(--err); }
.warn { color: var(--warn); }

/* syntax highlighting tokens */
.t-kw { color: var(--t-kw); }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-bi { color: var(--t-bi); }
.t-def { color: var(--t-def); font-weight: 600; }
.t-dec { color: var(--t-dec); }
.t-self { color: var(--t-num); }
.t-err { color: var(--err); }
.t-in { color: var(--fg); }
.t-dim { color: var(--muted); }

* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; border: 2px solid transparent; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* FLOWST layout and components: top bar, sidebar, article column, right-hand table of contents. */

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#body { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

/* ---- top bar ---------------------------------------------------------------------------- */
#topbar {
  flex: none; height: var(--topbar-h); display: flex; align-items: center; gap: 20px;
  padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
}
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); font-family: var(--font-serif); font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
.brand:hover { text-decoration: none; }
.brand small { font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 8px; }
.logo-mark { display: block; flex: none; }
.tabs { display: flex; gap: 4px; margin-left: 12px; height: 100%; }
.tab { display: inline-flex; align-items: center; padding: 0 12px; color: var(--muted); font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--fg); text-decoration: none; }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.top-spacer { flex: 1; }
.search-btn {
  display: inline-flex; align-items: center; gap: 10px; width: min(300px, 32vw); height: 36px; padding: 0 8px 0 12px;
  font: inherit; font-size: 14px; color: var(--muted); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 9px; cursor: pointer;
}
.search-btn:hover { border-color: var(--faint); }
.search-btn span { flex: 1; text-align: left; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.pill:hover { text-decoration: none; border-color: var(--line-strong); }
.pill .ico { color: var(--accent-text); }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0; color: var(--muted);
  background: transparent; border: 1px solid transparent; border-radius: 9px; cursor: pointer; font: inherit;
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent-text); }
#navtoggle { display: none; }

/* ---- sidebar ---------------------------------------------------------------------------- */
#sidebar { overflow-y: auto; padding: 20px 14px 40px 20px; border-right: 1px solid var(--line); background: var(--bg); }
.nav-group { margin-bottom: 18px; }
.nav-group > summary {
  display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; padding: 4px 10px 4px 8px; margin: 0 -8px 2px;
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-radius: 6px; user-select: none;
}
.nav-group > summary::-webkit-details-marker { display: none; }
.nav-group > summary:hover { color: var(--fg); }
.nav-group > summary .ico { transition: transform .15s; margin-left: auto; }
.nav-group[open] > summary .ico { transform: rotate(90deg); }
.nav-group > summary .count { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px; margin: 1px 0 1px -2px; border-radius: 7px;
  font-size: 14px; line-height: 1.35; color: var(--fg-2);
}
.nav-item:hover { background: var(--surface-2); text-decoration: none; color: var(--fg); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
.nav-item .num { flex: none; width: 22px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
.nav-item.active .num { color: var(--accent-text); }
.nav-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .st { flex: none; display: inline-flex; color: var(--faint); }
.nav-item.done .st { color: var(--ok); }
.nav-item.locked { color: var(--faint); }

/* ---- article column --------------------------------------------------------------------- */
#main { overflow-y: auto; min-width: 0; scroll-behavior: smooth; outline: none; }
.page { display: grid; grid-template-columns: minmax(0, 740px) 210px; justify-content: center; gap: 56px; padding: 44px 32px 120px; max-width: 1180px; margin: 0 auto; }
.page.wide { grid-template-columns: minmax(0, 940px); }
.page.center { grid-template-columns: minmax(0, 560px); text-align: center; padding-top: 12vh; }
.doc { min-width: 0; }
.doc > header { margin-bottom: 28px; }
.crumb { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; font-weight: 500; color: var(--muted); }
.crumb a { color: var(--muted); }
.crumb .ico { color: var(--faint); }
.lead { font-size: 1.125rem; line-height: 1.65; color: var(--fg-2); margin: 14px 0 0; }
.doc section { margin-top: 48px; scroll-margin-top: 24px; }
.doc section > h2 { margin-bottom: 16px; display: flex; align-items: baseline; gap: 10px; }
.doc section > h2 .anchor { opacity: 0; font-family: var(--font-sans); font-size: 1rem; color: var(--faint); }
.doc section > h2:hover .anchor { opacity: 1; text-decoration: none; }
.doc section > h3 { margin: 28px 0 10px; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; font-size: 12px; font-weight: 600; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.status-chip.done { background: var(--ok-soft); color: var(--ok); }
.status-chip.open { background: var(--accent-soft); color: var(--accent-text); }

/* on this page */
.toc { position: sticky; top: 44px; align-self: start; max-height: calc(100vh - var(--topbar-h) - 88px); overflow-y: auto; font-size: 13.5px; }
.toc-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.toc a { display: block; padding: 4px 0 4px 14px; margin-left: 1px; border-left: 1px solid var(--line); color: var(--muted); line-height: 1.4; }
.toc a:hover { color: var(--fg); text-decoration: none; }
.toc a.on { color: var(--accent-text); border-left-color: var(--accent); font-weight: 500; }

/* ---- buttons ---------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px;
  font: inherit; font-size: 14px; font-weight: 500; color: var(--on-accent); background: var(--accent);
  border: 1px solid var(--accent); border-radius: 9px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not([disabled]) { background: var(--accent-hover); border-color: var(--accent-hover); text-decoration: none; }
.btn.alt { color: var(--fg); background: var(--surface); border-color: var(--line-strong); }
.btn.alt:hover:not([disabled]) { background: var(--surface-2); border-color: var(--faint); }
.btn.ghost { color: var(--muted); background: transparent; border-color: transparent; }
.btn.ghost:hover:not([disabled]) { background: var(--surface-2); color: var(--fg); border-color: transparent; }
.btn.danger { color: var(--err); background: transparent; border-color: var(--line-strong); }
.btn.danger:hover:not([disabled]) { background: var(--err-soft); border-color: var(--err); }
.btn.small { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn.on { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 14px 0; }

/* ---- code blocks ------------------------------------------------------------------------ */
.codeblock { margin: 0 0 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-soft); overflow: hidden; }
.codeblock-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.codeblock-bar .sp { flex: 1; }
pre.code { margin: 0; padding: 14px 16px; overflow: auto; font-size: 13.5px; line-height: 22px; tab-size: 4; white-space: pre; color: var(--fg); }
pre.code code { font: inherit; background: none; border: 0; padding: 0; color: inherit; }

/* ---- callouts, terms, tables ------------------------------------------------------------ */
.callout { display: flex; gap: 12px; padding: 14px 16px; margin: 0 0 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.callout > .ico { flex: none; margin-top: 3px; }
.callout > div { min-width: 0; }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout.warn > .ico { color: var(--warn); }
.callout.info { background: var(--info-soft); border-color: transparent; }
.callout.info > .ico { color: var(--info); }
.callout.tip { background: var(--accent-soft); border-color: transparent; }
.callout.tip > .ico { color: var(--accent-text); }
.callout ul { padding-left: 1.2em; }
.terms { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr); margin: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.terms dt, .terms dd { margin: 0; padding: 10px 16px; border-top: 1px solid var(--line); }
.terms dt:first-of-type, .terms dt:first-of-type + dd { border-top: 0; }
.terms dt { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; color: var(--fg); background: var(--bg-soft); overflow-wrap: anywhere; }
.terms dd { font-size: 15px; color: var(--fg-2); }

/* ---- cards ------------------------------------------------------------------------------ */
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px 20px 16px; margin-bottom: 18px; }
.card.pass { border-color: var(--ok); }
.card > .card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.card > .card-h .t { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 500; }
.card .prompt p:last-child { margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
a.tcard { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
a.tcard:hover { text-decoration: none; border-color: var(--accent); box-shadow: var(--shadow); }
a.tcard .h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--font-serif); font-size: 1.15rem; font-weight: 500; }
a.tcard .h .range { font-family: var(--font-sans); font-size: 12px; font-weight: 500; color: var(--muted); }
a.tcard p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
a.tcard .meter { margin-top: auto; padding-top: 10px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter small { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 28px 0 0; }
.stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.stat .k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.stat .v { margin-top: 4px; font-family: var(--font-serif); font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat .v small { font-family: var(--font-sans); font-size: 13px; color: var(--muted); }
.stat .k .ico { color: var(--accent-text); }

.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { position: relative; margin: 0; padding: 0 0 20px 44px; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: 50%; }
.steps li::after { content: ""; position: absolute; left: 13.5px; top: 34px; bottom: 6px; width: 1px; background: var(--line-strong); }
.steps li:last-child::after { display: none; }
.steps b { display: block; font-weight: 600; }
.steps span { color: var(--muted); }

.map-grid { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.tile { position: relative; display: grid; place-items: center; width: 42px; height: 38px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.tile:hover { text-decoration: none; border-color: var(--accent); color: var(--fg); }
.tile.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.tile.open { border-color: var(--accent); color: var(--accent-text); }
.tile.locked { opacity: .55; }
.track-t { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); }
.track-t span { font-weight: 400; color: var(--muted); }

.plist { list-style: none; padding: 0; margin: 0 0 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.plist li { display: flex; align-items: center; gap: 12px; margin: 0; padding: 11px 16px; border-top: 1px solid var(--line); }
.plist li:first-child { border-top: 0; }
.plist li .st { display: inline-flex; flex: none; color: var(--faint); }
.plist li.done .st { color: var(--ok); }
.plist li .sub { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.plist li a { font-weight: 500; }

/* ---- check results ---------------------------------------------------------------------- */
.result { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0; background: var(--bg-soft); }
.result.pass { border-color: var(--ok); background: var(--ok-soft); }
.result.fail { border-color: var(--err); background: var(--err-soft); }
.result .head { display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; }
.result .xp { margin-left: auto; font-size: 13px; color: var(--accent-text); }
.result .tests { display: flex; gap: 6px; margin: 8px 0 4px; }
.result .tests span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; }
.result .tests .ok { background: var(--ok-soft); }
.result .tests .bad { background: var(--err-soft); }
.result .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 4px; }
.result .cmp > div { min-width: 0; }
.result pre { margin: 4px 0 0; padding: 8px 12px; font-size: 13px; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 2.2em; }
.result .lab { font-size: 12px; font-weight: 500; color: var(--muted); }
.hintbox { padding: 10px 14px; margin: 10px 0; border-radius: var(--radius-sm); background: var(--warn-soft); font-size: 14.5px; }
.hintbox b { color: var(--warn); }

/* ---- quiz ------------------------------------------------------------------------------- */
.q { margin: 0 0 22px; }
.q .qt { font-weight: 600; margin-bottom: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 9px 14px; margin: 6px 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; font-size: 15px; }
.opt:hover { border-color: var(--faint); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 2px 0 0; border: 1.5px solid var(--faint); border-radius: 50%; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.opt input[type=checkbox] { border-radius: 5px; }
.opt input:checked { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.opt input[type=checkbox]:checked { box-shadow: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--err); background: var(--err-soft); }
.why { margin: 6px 2px 0; font-size: 14px; color: var(--muted); }

/* ---- editor ----------------------------------------------------------------------------- */
.ed { position: relative; display: flex; height: 220px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg-soft); overflow: hidden; font-size: 13.5px; }
.ed:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ed-gutter { flex: none; width: 46px; padding: 10px 10px 10px 0; text-align: right; color: var(--faint); border-right: 1px solid var(--line); overflow: hidden; white-space: pre; font-family: var(--font-mono); line-height: 22px; user-select: none; }
.ed-body { position: relative; flex: 1; min-width: 0; }
.ed-hl, .ed-ta { position: absolute; inset: 0; margin: 0; padding: 10px 14px; border: 0; font-family: var(--font-mono); font-size: inherit; line-height: 22px; white-space: pre; tab-size: 4; letter-spacing: 0; word-spacing: 0; }
.ed-hl { overflow: hidden; pointer-events: none; color: var(--fg); }
.ed-hl code { font: inherit; background: none; border: 0; padding: 0; color: inherit; }
.ed-ta { overflow: auto; resize: none; outline: none; background: transparent; color: transparent; caret-color: var(--accent); -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: var(--sel); }

/* ---- pager ------------------------------------------------------------------------------ */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 64px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 14px 18px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.pager a:hover { text-decoration: none; border-color: var(--accent); }
.pager a small { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pager a b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager a.next { text-align: right; align-items: flex-end; grid-column: 2; }
.pager a.next small { flex-direction: row-reverse; }
.pager a.locked { opacity: .6; }

/* ---- terminal dock ---------------------------------------------------------------------- */
#dock { flex: none; display: flex; flex-direction: column; height: var(--dock-h, 380px); background: var(--bg); color: var(--fg); border-top: 1px solid var(--line-strong); position: relative; z-index: 20; font-size: 14px; }
#dock.hidden { display: none; }
#dock.full { position: fixed; inset: var(--topbar-h) 0 0 0; height: auto; z-index: 45; }
#dock-resize { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; z-index: 2; }
#dock.full #dock-resize { display: none; }
.dock-bar { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--bg-soft); flex-wrap: wrap; }
.dock-bar .sp { flex: 1; }
.dock-title { display: inline-flex; align-items: center; gap: 8px; margin-right: 6px; font-weight: 600; font-size: 13px; color: var(--fg); }
.dock-bar .state { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dock-bar .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dock-bar .state.run::before { background: var(--ok); }
.dock-bar .btn.alt { background: var(--surface); }
.dock-body { flex: 1; min-height: 0; display: grid; }
.dock-pane { display: none; min-height: 0; }
.dock-pane.on { display: grid; }
.pane-script { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.pane-script .ed { height: 100%; border-width: 0 1px 0 0; border-radius: 0; background: var(--bg); }
.pane-script .ed:focus-within { box-shadow: none; }
.pane-repl { grid-template-columns: minmax(0, 1fr); }

.term { height: 100%; min-height: 0; overflow: auto; padding: 12px 16px; background: #0a0a09; color: #f6f4e8; outline: none; font-family: var(--font-mono); font-size: 13.5px; }
.term-out { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 22px; }
.term-line-in { white-space: pre; }
.term-prompt { color: #ffe27a; }
.term-in { font: inherit; color: #fff; background: transparent; border: 0; outline: 0; padding: 0; margin: 0; caret-color: #ffe27a; width: 1ch; min-width: 1ch; }
.term .t-dim { color: #8f8e80; }
.term .t-err { color: #f08a7e; }
.term .t-in { color: #fff; }
.term .hint { border-left: 3px solid #e5b567; background: rgba(229, 181, 103, .1); padding: 6px 12px; margin: 8px 0; white-space: normal; overflow-wrap: normal; font-family: var(--font-sans); font-size: 13.5px; line-height: 1.5; border-radius: 0 6px 6px 0; }
.term .hint b { color: #e5b567; font-weight: 600; }

/* ---- overlays and toasts ---------------------------------------------------------------- */
#overlay[hidden], #scrim[hidden] { display: none; }
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .62); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; backdrop-filter: blur(2px); }
.modal { width: min(640px, 100%); max-height: 70vh; overflow: auto; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); padding: 8px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); }
.modal-head input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent; border: 0; outline: 0; padding: 6px 0; }
.modal-body { padding: 8px 4px 4px; }
.modal h3 { padding: 10px 12px 4px; font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
.hit { display: block; padding: 9px 12px; border-radius: 9px; color: var(--fg); }
.hit.sel, .hit:hover { background: var(--accent-soft); text-decoration: none; }
.hit .sn { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit .kind { float: right; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.empty { padding: 18px 12px; color: var(--muted); font-size: 14.5px; }
.keys { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px 16px; padding: 12px; align-items: center; font-size: 14.5px; }
.filter { width: 100%; height: 40px; padding: 0 14px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; outline: 0; margin: 0 0 20px; }
.filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { padding: 10px 16px; max-width: 420px; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); }
.toast.err { border-color: var(--err); color: var(--err); }
#scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .62); }

.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 12px; }
.big-lock { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 18px; border-radius: 18px; background: var(--accent-soft); color: var(--accent-text); }

/* ---- responsive ------------------------------------------------------------------------- */
@media (max-width: 1120px) {
  .page { grid-template-columns: minmax(0, 740px); }
  .toc { display: none; }
}
@media (max-width: 900px) {
  #body { grid-template-columns: minmax(0, 1fr); }
  #navtoggle { display: inline-grid; }
  .tabs, .brand small, .pill.hide-sm { display: none; }
  #topbar { gap: 10px; padding: 0 12px; }
  .search-btn { width: auto; flex: 1; max-width: 260px; margin-left: auto; }
  .search-btn kbd { display: none; }
  .top-spacer { display: none; }
  #sidebar { position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: min(320px, 88vw); z-index: 44; transform: translateX(-102%); transition: transform .2s; border-right: 1px solid var(--line-strong); box-shadow: var(--shadow); }
  body.nav-open #sidebar { transform: none; }
  .page { padding: 28px 16px 100px; }
  h1 { font-size: 1.9rem; }
  .pane-script { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
  .pane-script .ed { border-width: 0 0 1px 0; }
  .result .cmp { grid-template-columns: 1fr; }
  .terms { grid-template-columns: 1fr; }
  .terms dd { border-top: 0; padding-top: 0; }
  .pager { grid-template-columns: 1fr; }
  .pager a.next { grid-column: 1; }
  #dock.full { inset: var(--topbar-h) 0 0 0; }
}

.intro > p:first-child { font-size: 1.125rem; line-height: 1.65; color: var(--fg-2); }
.page.wide-less { grid-template-columns: minmax(0, 740px); }
.ico { flex: none; vertical-align: -3px; }
.nav-group > summary > span:last-child { margin-left: auto; display: inline-flex; }
.nav-group > summary > span:last-child .ico { margin-left: 0; }
.callout.warn, .callout.info, .callout.tip { color: var(--fg-2); }

/* ================= Wispr Flow dark mode overrides ================= */
html, body { font-size: 15px; }
body { font: 400 15px/1.55 var(--font-sans); background: var(--bg); }
a { color: var(--accent-text); }
code { font-size: 86%; padding: .15em .45em; background: var(--code-bg); border: 0; border-radius: 7px; }
kbd { font: 11px/10px var(--font-mono); padding: 4px 6px; color: var(--muted); background: var(--surface-2); border: 0; border-radius: 7px; box-shadow: none; }

/* logo: lavender tile with ink bars */
.logo-mark rect { fill: #f7d54a; }
.logo-mark path { stroke: #1a1a1a; }
.logo-mark circle { fill: #1a1a1a; }

/* top bar sits on the same dark ground as the sidebar */
#topbar { padding: 0 20px 0 20px; gap: 16px; background: transparent; border-bottom: 0; }
.brand { gap: 10px; font-family: var(--font-serif); font-size: 1.65rem; font-weight: 500; letter-spacing: .01em; }
.tabs { height: auto; align-items: center; margin-left: 12px; gap: 4px; }
.tab { height: 36px; align-self: center; margin: 0; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--muted); border: 0; border-radius: 999px; }
.tab:hover { color: var(--fg); background: var(--hover); }
.tab.active { color: var(--fg); background: var(--surface-2); }
.search-btn { width: min(280px, 30vw); height: 38px; padding: 0 8px 0 14px; gap: 10px; font-size: 14px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; }
.search-btn:hover { border-color: var(--line-strong); }
.search-btn b { font-weight: 400; white-space: nowrap; }
.search-btn .ss { display: none; }
.pill { height: 36px; padding: 0 14px; font-size: 13px; font-weight: 500; color: var(--fg-2); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; }
.pill:hover { background: var(--surface-2); border-color: var(--line); }
.pill .ico { color: var(--accent-text); }
.icon-btn { width: 38px; height: 38px; border-radius: 999px; color: var(--muted); background: transparent; border: 0; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent-text); }

/* sidebar: part of the dark ground, rounded nav items */
#body { padding: 0 12px 8px 0; }
#sidebar { padding: 8px 12px 32px 16px; background: transparent; border-right: 0; }
.nav-group { margin-bottom: 14px; }
.nav-group > summary { padding: 6px 12px; margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); border-radius: 10px; }
.nav-group > summary:hover { color: var(--fg); background: var(--hover); }
.nav-group > summary .count { padding: 0; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); background: none; }
.nav-item { padding: 8px 12px; margin: 1px 0; border-radius: 10px; font-size: 14.5px; color: var(--fg-2); }
.nav-item:hover { background: var(--hover); color: var(--fg); }
.nav-item.active { background: var(--surface-2); color: var(--fg); font-weight: 500; }
.nav-item.active::before { content: none; }
.nav-item .num, .nav-item.active .num { color: var(--faint); }
.nav-item.locked { color: var(--faint); }

/* main content: one big rounded panel floating on the ground */
#main { background: var(--panel); border: 1px solid var(--line-muted); border-radius: 20px; }
.page { gap: 56px; padding: 48px 40px 112px; }
.doc { font-size: 16px; line-height: 1.65; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 500; letter-spacing: -.005em; line-height: 1.12; text-wrap: balance; }
h1 { font-size: 3rem; } h2 { font-size: 2.1rem; } h3 { font-size: 1.5rem; }
.doc > header > h1, .doc section > h2 { padding-bottom: 0; border-bottom: 0; }
.page.center h1 { padding: 0; border: 0; }
.doc section { margin-top: 56px; }
.doc section > h2 { margin-bottom: 18px; }
.lead { font-size: 1.15rem; line-height: 1.6; color: var(--muted); }
.crumb { font-size: 13px; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--fg); }
.toc a { border-left-color: var(--line); }
.toc a.on { color: var(--fg); border-left-color: var(--accent-text); font-weight: 500; }
.toc-title { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 500; }

/* chips and labels are soft pills */
.eyebrow { display: inline-block; padding: 4px 14px; margin-bottom: 18px; font-size: 12.5px; font-weight: 600; line-height: 1.4; letter-spacing: .02em; text-transform: none; color: var(--accent-text); background: var(--accent-soft); border: 0; border-radius: 999px; }
.status-chip { padding: 3px 12px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 0; border-radius: 999px; }
.status-chip.done { color: var(--ok); background: var(--ok-soft); }
.status-chip.open { color: var(--accent-text); background: var(--accent-soft); }

/* buttons: lavender pill-ish primary, quiet secondary */
.btn { height: 42px; padding: 0 22px; font: 600 15px var(--font-sans); color: var(--btn-primary-fg); background: var(--btn-primary); border: 1px solid var(--btn-primary-border); border-radius: 12px; box-shadow: none; }
.btn:hover:not([disabled]) { background: var(--btn-primary-hover); border-color: var(--btn-primary-border); box-shadow: none; }
.btn.alt { color: var(--fg); background: var(--btn-bg); border-color: var(--btn-border); font-weight: 500; }
.btn.alt:hover:not([disabled]) { background: var(--btn-hover); border-color: var(--btn-border); }
.btn.ghost { color: var(--muted); background: transparent; border-color: transparent; }
.btn.ghost:hover:not([disabled]) { background: var(--hover); color: var(--fg); border-color: transparent; }
.btn.danger { color: var(--err); background: var(--btn-bg); border-color: var(--btn-border); }
.btn.danger:hover:not([disabled]) { color: #fff; background: #7f1c34; border-color: transparent; }
.btn.small { height: 34px; padding: 0 14px; font-size: 13px; border-radius: 10px; }
.btn.on { color: var(--accent-text); background: var(--accent-soft); border-color: transparent; }

/* code */
.codeblock { border: 1px solid var(--line-muted); border-radius: 16px; background: var(--block); }
.codeblock-bar { background: transparent; border-bottom-color: var(--line-muted); }
pre.code { padding: 18px 20px; font-size: 13.5px; }
.ed { border-color: var(--line); border-radius: 14px; background: var(--block); }
.ed:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ed-gutter { border-right-color: var(--line-muted); }

/* callouts become soft rounded notes */
.callout { gap: 12px; padding: 16px 20px; border: 0; border-radius: 16px; background: var(--bg-soft); color: var(--fg-2); }
.callout.warn { background: var(--warn-soft); }
.callout.info { background: var(--info-soft); }
.callout.tip { background: var(--accent-soft); }

/* cards */
.card { padding: 22px 24px; background: var(--bg-soft); border: 1px solid var(--line-muted); border-radius: 16px; }
.card > .card-h .t { font-size: 1.35rem; font-weight: 500; }
a.tcard { padding: 22px 24px; background: var(--bg-soft); border: 1px solid var(--line-muted); border-radius: 16px; }
a.tcard:hover { background: var(--surface-2); border-color: var(--line); box-shadow: none; }
a.tcard .h { font-size: 1.35rem; font-weight: 500; }
a.tcard .h .range { font-family: var(--font-sans); font-size: 12px; }
a.tcard p { font-size: 14px; }
.stat { padding: 16px 20px; background: var(--bg-soft); border: 1px solid var(--line-muted); border-radius: 16px; }
.stat .v { font-size: 2rem; font-weight: 500; }
.stat .v small { font-size: 13px; }
.terms { border-color: var(--line-muted); border-radius: 16px; background: var(--bg-soft); }
.terms dt { font-size: 13px; font-weight: 500; background: transparent; }
.terms dt, .terms dd { border-top-color: var(--line-muted); }
.plist { border-color: var(--line-muted); border-radius: 16px; background: var(--bg-soft); }
.plist li { border-top-color: var(--line-muted); }
.pager a { border-color: var(--line-muted); border-radius: 16px; background: var(--bg-soft); }
.pager a:hover { background: var(--surface-2); border-color: var(--line); }
.result { border-radius: 16px; }
.steps li::before { color: var(--accent-text); background: var(--accent-soft); border: 0; }
.steps li::after { background: var(--line); }
.tile { border-radius: 10px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line-muted); }
.tile:hover { border-color: var(--accent-text); color: var(--fg); }
.tile.open { color: var(--accent-text); border-color: var(--accent-text); background: var(--accent-soft); }
.tile.done { color: #f6f4e8; background: var(--ok-solid); border-color: transparent; }
.bar { height: 6px; border-radius: 99px; background: var(--counter-bg); }
.bar > i { border-radius: 99px; background: var(--accent-text); }
.opt { border-color: var(--line); border-radius: 12px; background: var(--bg-soft); }
.filter { height: 42px; background: var(--bg-soft); border-radius: 999px; padding: 0 18px; }
.filter:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* dock: rounded sheet, like a panel */
#dock { margin: 0 12px 8px; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
#dock.full { margin: 0; border-radius: 0; }

/* menus, dialogs, toasts */
.overlay { background: rgba(10, 10, 8, .6); backdrop-filter: blur(6px); }
.modal { border: 1px solid var(--line); border-radius: 22px; background: var(--bg-soft); box-shadow: var(--shadow-lg); }
.modal-head { border-bottom-color: var(--line-muted); }
.hit { border-radius: 12px; }
.toast { padding: 10px 20px; color: #f6f4e8; background: #0a0a09; border: 1px solid rgba(255, 255, 235, .12); border-radius: 999px; box-shadow: var(--shadow-lg); }
#toasts { bottom: 84px; }

/* ---- mode banner and mode page ---- */
.mode-banner { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; padding: 6px 16px 6px 8px; font-size: 14px; color: var(--muted); background: var(--bg-soft); border: 1px solid var(--line-muted); border-radius: 999px; }
.mode-chip { padding: 3px 12px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--btn-primary-fg); background: var(--btn-primary); border-radius: 999px; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; margin-top: 28px; }
.mode-card { display: flex; flex-direction: column; gap: 10px; padding: 32px; background: var(--bg-soft); border: 1px solid var(--line-muted); border-radius: 24px; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
.mode-card:hover { background: var(--surface-2); border-color: var(--line); transform: translateY(-2px); box-shadow: none; }
.mode-card.on { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.mode-num { font: 500 12px var(--font-mono); letter-spacing: .1em; color: var(--faint); }
.mode-name { font: 500 2.6rem/1 var(--font-serif); letter-spacing: 0; }
.mode-tag { align-self: flex-start; padding: 3px 12px; font: 600 12px/1.4 var(--font-sans); letter-spacing: .02em; text-transform: none; color: var(--accent-text); background: var(--accent-soft); border: 0; border-radius: 999px; }
.mode-card p { margin: 6px 0 0; color: var(--fg-2); }
.mode-card ul { margin: 0 0 10px; padding-left: 1.2em; font-size: 14.5px; color: var(--muted); }
.mode-card .btn { align-self: flex-start; margin-top: auto; }

/* ---- footer: a floating dark capsule, like the Wispr Flow pill ---- */
#footer { flex: none; align-self: center; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 22px; max-width: calc(100% - 24px); margin: 0 12px 12px; padding: 7px 10px 7px 18px; font: 500 13px/1.4 var(--font-sans); color: var(--muted); background: #0a0a09; border: 1px solid rgba(255, 255, 235, .10); border-radius: 999px; box-shadow: var(--shadow-lg); position: relative; z-index: 25; }
#footer a, #footer .linkbtn { color: var(--muted); }
#footer a:hover, #footer .linkbtn:hover { color: var(--fg); text-decoration: none; }
.f-left, .f-mode, .f-right { display: flex; align-items: center; gap: 12px; }
.f-left { gap: 10px; color: var(--fg); font-weight: 600; letter-spacing: .04em; }
.f-dim { color: var(--faint); font-weight: 500; }
.f-right { gap: 18px; padding-right: 8px; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.wave { display: inline-flex; align-items: center; gap: 3px; height: 20px; }
.wave i { display: block; width: 3px; border-radius: 3px; background: #f6f4e8; }
.wave i:nth-child(1) { height: 6px; } .wave i:nth-child(2) { height: 12px; } .wave i:nth-child(3) { height: 18px; } .wave i:nth-child(4) { height: 10px; } .wave i:nth-child(5) { height: 5px; }
#footer:hover .wave i { animation: wv 0.9s ease-in-out infinite; }
#footer:hover .wave i:nth-child(2) { animation-delay: .12s; } #footer:hover .wave i:nth-child(3) { animation-delay: .24s; }
#footer:hover .wave i:nth-child(4) { animation-delay: .36s; } #footer:hover .wave i:nth-child(5) { animation-delay: .48s; }
@keyframes wv { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1.15); } }
.seg { display: inline-flex; padding: 3px; background: rgba(255, 255, 235, .08); border: 0; border-radius: 999px; }
.seg button { height: 28px; padding: 0 16px; font: 600 12px var(--font-sans); letter-spacing: .06em; color: var(--fg-2); background: transparent; border: 0; border-radius: 999px; cursor: pointer; }
.seg button:hover { color: var(--fg); background: rgba(255, 255, 235, .08); }
.seg button.on { color: #1a1a1a; background: #f7d54a; }
.seg.unset { animation: segpulse 2s infinite; }
@keyframes segpulse { 0% { box-shadow: 0 0 0 0 rgba(247, 213, 74, .35); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .seg.unset, #footer:hover .wave i { animation: none; } }

@media (max-width: 900px) {
  #body { padding: 0 8px 6px; }
  #sidebar { background: var(--bg); border: 1px solid var(--line); border-radius: 0 18px 18px 0; }
  #topbar { padding: 0 12px; }
  .search-btn .sl { display: none; }
  .search-btn .ss { display: inline; }
  .page { padding: 28px 18px 96px; }
  h1 { font-size: 2.3rem; } h2 { font-size: 1.75rem; }
  #footer { padding: 6px 10px; gap: 8px; }
  .f-left span:not(.wave), .f-count, .f-right { display: none; }
}

/* no decorative symbols: icons stay only on controls that have no text label */
.stat .k .ico, .pill .ico, .btn .ico, .callout > span:first-child, .big-lock, .toc-title .ico, .dock-title .ico, .search-btn .ico { display: none; }
.stat .k { margin-bottom: 0; }
.steps li::before { font-family: var(--font-sans); }

/* ================= practice terminal as an overlay (like a new tab over the page) ================= */
#dock-backdrop { position: fixed; inset: 0; z-index: 52; background: rgba(5, 5, 4, .68); backdrop-filter: blur(8px); animation: dock-fade .18s ease-out; }
#dock.hidden + #dock-backdrop { display: none; }
#dock { position: fixed; inset: 4vh 0; width: min(1240px, 94vw); height: auto; margin: 0 auto; z-index: 55; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 18px; overflow: hidden; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, .85), 0 0 0 1px rgba(0, 0, 0, .5); animation: dock-in .22s cubic-bezier(.2, .8, .2, 1); }
#dock.hidden { display: none; }
#dock.full { inset: 0; width: auto; height: auto; margin: 0; border: 0; border-radius: 0; z-index: 55; }
#dock-resize { display: none; }
.dock-bar { display: block; padding: 0; background: var(--bg-soft); border-bottom: 1px solid var(--line); }
.dock-top { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px 0 12px; background: #050504; }
.dock-tab { display: inline-flex; align-items: center; padding: 9px 22px 10px; font-size: 13px; font-weight: 600; color: var(--fg); background: var(--bg-soft); border-radius: 12px 12px 0 0; }
.dock-top .sp { flex: 1; }
.dock-top .icon-btn { width: 32px; height: 32px; margin-bottom: 4px; }
.dock-hint { align-self: center; margin: 0 4px 4px 0; font-size: 12px; color: var(--faint); }
.dock-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; }
.dock-tools .sp { display: none; }
/* hairline, minimal dividers: always faint, never highlighted on focus */
#dock { border-color: rgba(255, 255, 235, .09); }
.dock-bar { border-bottom-color: rgba(255, 255, 235, .06); }
.pane-script .ed, .pane-script .ed:focus-within { border-color: rgba(255, 255, 235, .07); box-shadow: none; }
.ed-gutter { border-right-color: rgba(255, 255, 235, .05); }
@keyframes dock-in { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes dock-fade { from { opacity: 0; } to { opacity: 1; } }
@media (max-width: 900px) {
  #dock, #dock.full { inset: 0; width: auto; height: auto; margin: 0; border: 0; border-radius: 0; z-index: 55; }
  .dock-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { #dock, #dock-backdrop { animation: none; } }



/* ================= IDE theme: code-editor look =================
   Explorer sidebar, editor tabs, status bar, panel terminal. Dark+ style syntax colours,
   yellow accent, system UI font for reading and JetBrains Mono for code and chrome. */
:root {
  --bg: #f3f3f3; --panel: #ffffff; --bg-soft: #f7f7f7; --surface: #f3f3f3; --surface-2: #e8e8e8; --block: #f7f7f7;
  --fg: #2b2b2b; --fg-2: #3f3f3f; --muted: #616161; --faint: #8a8a8a;
  --line: #e2e2e2; --line-muted: #ebebeb; --line-strong: #cbcbcb;
  --accent: #bf8803; --accent-hover: #a37300; --accent-text: #7a5800; --accent-soft: rgba(191, 136, 3, .12);
  --btn-bg: rgba(0, 0, 0, .05); --btn-hover: rgba(0, 0, 0, .09); --btn-border: #d0d0d0;
  --btn-primary: #f2c94c; --btn-primary-hover: #e6b92f; --btn-primary-border: #d9ae2a; --btn-primary-fg: #1b1b1b;
  --hover: rgba(0, 0, 0, .05); --counter-bg: rgba(0, 0, 0, .09); --code-bg: rgba(0, 0, 0, .06); --code-fg: #7a5800; --code-block: #f7f7f7; --row-active: #e4e6f1;
  --ok: #1a7f37; --ok-soft: rgba(26, 127, 55, .10); --err: #cd3131; --err-soft: rgba(205, 49, 49, .08);
  --warn: #795e26; --warn-soft: rgba(191, 136, 3, .12); --info: #0451a5; --info-soft: rgba(4, 81, 165, .08);
  --sel: rgba(173, 214, 255, .6); --shadow: 0 1px 2px rgba(0, 0, 0, .06); --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, .22);
  --t-kw: #0000ff; --t-str: #a31515; --t-num: #098658; --t-com: #008000; --t-bi: #267f99; --t-def: #795e26; --t-dec: #795e26;
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: var(--font-sans);
  --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --topbar-h: 38px; --sidebar-w: 272px; --radius: 6px; --radius-sm: 4px;
}
:root[data-theme="dark"], #dock, #footer {
  --bg: #181818; --panel: #1e1e1e; --bg-soft: #202020; --surface: #252526; --surface-2: #2d2d2e; --block: #181818;
  --fg: #cccccc; --fg-2: #bdbdbd; --muted: #9d9d9d; --faint: #6e7681;
  --line: #2b2b2b; --line-muted: #262626; --line-strong: #3c3c3c;
  --accent: #f2c94c; --accent-hover: #ffe066; --accent-text: #f2c94c; --accent-soft: rgba(242, 201, 76, .12);
  --btn-bg: #313131; --btn-hover: #3c3c3c; --btn-border: #3c3c3c;
  --btn-primary: #f2c94c; --btn-primary-hover: #ffe066; --btn-primary-border: transparent; --btn-primary-fg: #1b1b1b;
  --hover: rgba(255, 255, 255, .05); --counter-bg: rgba(255, 255, 255, .10); --code-bg: rgba(255, 255, 255, .08); --code-fg: #e5c07b; --code-block: #181818; --row-active: #37373d;
  --ok: #89d185; --ok-soft: rgba(137, 209, 133, .12); --err: #f48771; --err-soft: rgba(244, 135, 113, .12);
  --warn: #e5c07b; --warn-soft: rgba(229, 192, 123, .12); --info: #75beff; --info-soft: rgba(117, 190, 255, .10);
  --sel: rgba(38, 79, 120, .75); --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 16px 40px -10px rgba(0, 0, 0, .6);
  --t-kw: #569cd6; --t-str: #9ece6a; --t-num: #e5c07b; --t-com: #6b7280; --t-bi: #4ec9b0; --t-def: #dcdcaa; --t-dec: #dcdcaa;
}
#dock, #footer { --bg: #181818; --bg-soft: #202020; }

html, body { font-size: 14px; }
body { font: 400 14px/1.6 var(--font-sans); }
::selection { background: var(--sel); }
.t-self { color: #9cdcfe; }
:root:not([data-theme="dark"]) .t-self { color: #001080; }
.t-def { font-weight: 500; }
code { font-family: var(--font-mono); font-size: .86em; padding: .12em .4em; background: var(--code-bg); border-radius: 4px; color: var(--code-fg); }
kbd { font: 11px/10px var(--font-mono); border-radius: 4px; padding: 4px 6px; background: var(--surface-2); color: var(--muted); }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, .35); border-radius: 0; border: 0; }
::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, .6); border: 0; }

/* title bar with editor tabs */
#topbar { height: var(--topbar-h); padding: 0 8px 0 0; gap: 0; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { align-self: center; padding: 0 16px 0 14px; font: 700 12px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent-text); }
.tabs { height: auto; margin: 0; gap: 0; align-items: stretch; }
.tab { height: auto; align-self: stretch; margin: 0; padding: 0 18px; font: 400 13px var(--font-sans); color: var(--muted); background: var(--bg); border: 0; border-right: 1px solid var(--line); border-top: 2px solid transparent; border-radius: 0; }
.tab:first-child { border-left: 1px solid var(--line); }
.tab:hover { color: var(--fg); background: var(--surface); }
.tab.active { color: var(--fg); background: var(--panel); border-top-color: var(--accent); margin-bottom: -1px; height: calc(100% + 1px); position: relative; z-index: 2; }
.search-btn { align-self: center; width: min(340px, 32vw); height: 26px; margin: 0 10px; padding: 0 6px 0 10px; gap: 8px; font: 12px var(--font-mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; }
.search-btn:hover { border-color: var(--faint); }
.search-btn kbd { background: transparent; border: 1px solid var(--line-strong); padding: 2px 5px; }
.pill { align-self: center; height: 22px; padding: 0 9px; font: 11.5px var(--font-mono); color: var(--muted); background: transparent; border: 0; border-radius: 4px; }
.pill:hover { background: var(--hover); color: var(--fg); border: 0; }
.icon-btn { align-self: center; width: 30px; height: 28px; border-radius: 5px; }

/* explorer sidebar */
#body { padding: 0; }
#sidebar { padding: 0 0 24px; background: var(--bg); border-right: 1px solid var(--line); }
#sidebar::before { content: "Explorer"; display: block; padding: 12px 20px 8px; font: 600 11px var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.nav-group { margin: 0 0 2px; }
.nav-group > summary { gap: 4px; padding: 3px 12px 3px 8px; margin: 0; font: 700 11px var(--font-sans); letter-spacing: .05em; color: var(--fg-2); border-radius: 0; background: transparent; }
.nav-group > summary:hover { color: var(--fg); background: var(--hover); }
.nav-group > summary > span:last-child { order: -1; display: inline-flex; margin: 0; }
.nav-group > summary .count { margin-left: auto; font: 500 11px var(--font-mono); letter-spacing: 0; color: var(--faint); }
.nav-item { gap: 8px; padding: 2px 12px 2px 30px; margin: 0; border-radius: 0; font-size: 13px; line-height: 22px; color: var(--fg-2); }
div.nav-group .nav-item { padding-left: 20px; }
.nav-item:hover { background: var(--hover); color: var(--fg); }
.nav-item.active { background: var(--row-active); color: var(--fg); font-weight: 500; box-shadow: inset 2px 0 0 var(--accent); }
.nav-item .num { width: 22px; font: 11px var(--font-mono); color: var(--faint); }
.nav-item .st svg { width: 13px; height: 13px; }

/* editor area */
#main { background: var(--panel); border: 0; border-radius: 0; }
.page { padding: 32px 44px 96px; gap: 48px; }
@media (min-width: 1121px) { .page { grid-template-columns: minmax(0, 780px) 200px; } }
.doc { font-size: 15px; line-height: 1.7; }
h1, h2, h3 { font-family: var(--font-sans); font-weight: 600; letter-spacing: -.012em; line-height: 1.25; }
h1 { font-size: 2rem; } h2 { font-size: 1.4rem; } h3 { font-size: 1.12rem; }
.doc > header > h1 { font-size: 2.1rem; }
.doc section { margin-top: 40px; }
.doc section > h2 { margin-bottom: 16px; padding-bottom: .4em; border-bottom: 1px solid var(--line); }
.page.center h1 { font-size: 2.4rem; }
.crumb { font: 12px var(--font-mono); color: var(--faint); }
.lead { font-size: 1.05rem; color: var(--fg-2); }
.eyebrow { padding: 2px 8px; margin-bottom: 14px; font: 600 11px/1.6 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); background: var(--accent-soft); border-radius: 4px; }
.status-chip, .mode-chip { padding: 2px 8px; font: 600 11px var(--font-mono); border-radius: 4px; }
.toc-title { font: 600 11px var(--font-sans); letter-spacing: .09em; }
.toc a { font: 12px/1.5 var(--font-mono); }

/* buttons, cards, notes */
.btn { height: 32px; padding: 0 14px; font: 500 13px var(--font-sans); border-radius: 4px; }
.btn.small { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 4px; }
.card, a.tcard, .stat, .terms, .plist, .pager a, .result, .modal { border-radius: 6px; }
.card, a.tcard, .stat, .terms, .plist, .pager a { background: var(--surface); border-color: var(--line); }
.card { padding: 18px 20px; }
.card > .card-h .t, a.tcard .h { font-size: 1.1rem; font-weight: 600; }
.stat .v { font-size: 1.6rem; font-weight: 600; }
.stat .k { font: 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.terms dt { font-family: var(--font-mono); }
.callout { padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px; }
.callout.warn { background: var(--warn-soft); border-color: var(--line); border-left-color: var(--warn); }
.callout.info { background: var(--info-soft); border-color: var(--line); border-left-color: var(--info); }
.callout.tip { background: var(--accent-soft); border-color: var(--line); border-left-color: var(--accent); }
.hintbox { border-radius: 4px; }
.opt { border-radius: 4px; }
.tile { border-radius: 4px; }
.bar { border-radius: 0; height: 4px; }
.mode-card { border-radius: 8px; padding: 26px; background: var(--surface); }
.mode-card:hover { transform: none; }
.mode-name { font: 600 2rem/1.1 var(--font-sans); }
.mode-num { font-family: var(--font-mono); }
.mode-tag { border-radius: 4px; font-family: var(--font-mono); font-size: 11px; }

/* code: editor look with a line-number gutter */
.codeblock { border: 1px solid var(--line); border-radius: 6px; background: var(--code-block); }
.codeblock-bar { padding: 3px 6px 3px 14px; background: var(--surface); border-bottom: 1px solid var(--line); font: 11.5px var(--font-mono); }
pre.code { padding: 12px 0; font-size: 13px; line-height: 21px; }
pre.code .gut { float: left; position: sticky; left: 0; margin-right: 16px; padding: 0 14px; text-align: right; color: var(--faint); background: var(--code-block); border-right: 1px solid var(--line-muted); user-select: none; }
pre.code code { padding-right: 18px; }
.ed { border-color: var(--line); border-radius: 6px; background: var(--code-block); }
.ed:focus-within { border-color: var(--accent); box-shadow: none; }
.ed-gutter { color: var(--faint); border-right-color: var(--line-muted); }
.ed-ta { caret-color: var(--accent); }
.result { border-radius: 6px; }

/* status bar */
#footer { align-self: stretch; flex-wrap: nowrap; justify-content: space-between; gap: 16px; width: auto; max-width: none; height: 24px; margin: 0; padding: 0 10px 0 0; font: 500 11.5px/24px var(--font-mono); color: var(--muted); background: var(--bg); border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; backdrop-filter: none; }
.wave { display: none; }
.f-left { padding-left: 14px; font: 700 11px var(--font-mono); letter-spacing: .16em; color: var(--accent-text); }
.f-mode { gap: 10px; }
.f-dim { color: var(--faint); font-weight: 400; }
.f-right { gap: 16px; padding-right: 0; }
.seg { padding: 0; gap: 1px; background: transparent; border-radius: 0; }
.seg button { height: 24px; padding: 0 12px; font: 600 11px var(--font-mono); letter-spacing: .08em; color: var(--muted); background: var(--surface); border-radius: 0; }
.seg button:hover { color: var(--fg); background: var(--surface-2); }
.seg button.on { color: #1b1b1b; background: var(--accent); }
.seg.unset { border-radius: 0; }
#toasts { bottom: 36px; right: 14px; }
.toast { padding: 8px 14px; font: 12.5px/1.5 var(--font-mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); border-radius: 4px; box-shadow: var(--shadow-lg); }
.toast.err { color: var(--err); border-left-color: var(--err); }

/* terminal panel */
#dock-backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(3px); }
#dock { inset: 5vh 0; border-radius: 8px; background: var(--panel); border-color: var(--line-strong); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .85); }
.dock-top { align-items: stretch; padding: 0 6px 0 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.dock-tab { padding: 9px 18px; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg); background: var(--panel); border-radius: 0; border-top: 2px solid var(--accent); }
.dock-top .icon-btn { align-self: center; margin: 0; width: 28px; height: 26px; }
.dock-bar { background: var(--panel); border-bottom-color: var(--line-muted); }
.dock-tools { padding: 8px 12px; }
.dock-hint { font-family: var(--font-mono); font-size: 11px; }
.term { background: #181818; color: #cccccc; font-size: 13px; }
.term-prompt { color: #f2c94c; }
.term-in { caret-color: #f2c94c; }
.term .t-err { color: #f48771; }
#dock.full { border-radius: 0; }

/* overlays and dialogs */
.modal { border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-lg); }
@media (max-width: 900px) {
  #sidebar { border: 0; border-right: 1px solid var(--line-strong); border-radius: 0; }
  #topbar { padding: 0 6px 0 0; }
  .tab { padding: 0 10px; font-size: 12.5px; }
  .brand { padding: 0 8px 0 10px; font-size: 11px; letter-spacing: .1em; }
  .page { padding: 22px 16px 80px; }
  h1 { font-size: 1.7rem; } h2 { font-size: 1.25rem; }
  #footer { padding: 0; }
  .f-mode { padding-left: 10px; }
  .f-left { display: none; }
  #dock, #dock.full { border-radius: 0; }
}



/* ================= Pixel skin: retro game-style learning (Codedex inspired) =================
   Pixelify Sans for headings and chrome, stepped pixel corners, chunky buttons, a faint
   16px pixel grid, segmented XP bars, quest-log sidebar. Code and body text stay readable. */
:root {
  --font-pixel: "Pixelify Sans", "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  --font-serif: var(--font-pixel);
  --topbar-h: 46px; --radius: 0px; --radius-sm: 0px;
  --notch: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
  --notch2: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
  /* light: warm paper */
  --bg: #ebe4cf; --panel: #fbf7ea; --bg-soft: #f4eed9; --surface: #f3edda; --surface-2: #e6dfc9; --block: #f3edda; --code-block: #f3edda;
  --fg: #1f1d16; --fg-2: #3a372b; --muted: #6a6552; --faint: #8f8a74;
  --line: #d6cfb5; --line-muted: #e2dcc4; --line-strong: #7b7560; --grid: rgba(60, 50, 10, .05);
  --accent: #e0a800; --accent-hover: #c99700; --accent-text: #6b4f00; --accent-soft: rgba(224, 168, 0, .16);
  --btn-primary: #ffd23f; --btn-primary-hover: #ffdd66; --btn-primary-fg: #1b1500; --btn-edge: #b8860b;
  --btn-bg: #e6dfc9; --btn-hover: #ddd5bb; --btn-alt-edge: #8f8a74; --code-fg: #6b4f00; --row-active: #eadfb8;
  --ok: #167a34; --ok-soft: rgba(22, 122, 52, .12); --ok-solid: #2fbf55; --err: #c0263d; --err-soft: rgba(192, 38, 61, .10);
  --warn: #7a5a00; --warn-soft: rgba(224, 168, 0, .16); --info: #0b63c5; --info-soft: rgba(11, 99, 197, .09);
  --sel: rgba(255, 210, 63, .45);
  --t-kw: #0b63c5; --t-str: #1f7a35; --t-num: #946a00; --t-com: #7a7664; --t-bi: #b01e55; --t-def: #4a3a00; --t-dec: #946a00;
}
:root[data-theme="dark"], #dock, #footer {
  --bg: #07070b; --panel: #0d0d13; --bg-soft: #12121a; --surface: #15151e; --surface-2: #1e1e2a; --block: #07070b; --code-block: #08080d;
  --fg: #ececf3; --fg-2: #c6c6d3; --muted: #8e8ea3; --faint: #5f5f75;
  --line: #22222e; --line-muted: #1a1a24; --line-strong: #3a3a4d; --grid: rgba(255, 255, 255, .022);
  --accent: #ffd23f; --accent-hover: #ffe27a; --accent-text: #ffd23f; --accent-soft: rgba(255, 210, 63, .12);
  --btn-primary: #ffd23f; --btn-primary-hover: #ffe27a; --btn-primary-fg: #1b1500; --btn-edge: #b8860b;
  --btn-bg: #1e1e2a; --btn-hover: #282838; --btn-alt-edge: #000000; --code-fg: #ffd23f; --row-active: #1f1f2c;
  --ok: #5af078; --ok-soft: rgba(90, 240, 120, .12); --ok-solid: #5af078; --err: #ff6b81; --err-soft: rgba(255, 107, 129, .12);
  --warn: #ffd23f; --warn-soft: rgba(255, 210, 63, .10); --info: #5ad1ff; --info-soft: rgba(90, 209, 255, .10);
  --sel: rgba(90, 209, 255, .30);
  --t-kw: #5ad1ff; --t-str: #8dff9e; --t-num: #ffd23f; --t-com: #6b6b85; --t-bi: #ff8fb3; --t-def: #f9f2b4; --t-dec: #ffd23f;
}
#dock, #footer { --bg: #07070b; --bg-soft: #12121a; }
:root:not([data-theme="dark"]) .t-self { color: #0b63c5; }
.t-self { color: #8ad8ff; }

:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 0; }
::selection { background: var(--sel); }
.ed-ta:focus-visible, .term-in:focus-visible, .term:focus-visible, .modal-head input:focus-visible { outline: none; }
::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border: 3px solid var(--bg); border-radius: 0; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); border: 3px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* headings and chrome use the pixel face */
h1, h2, h3 { font-family: var(--font-pixel); font-weight: 600; letter-spacing: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 2.7rem; font-weight: 700; } h2 { font-size: 1.8rem; } h3 { font-size: 1.3rem; }
.doc > header > h1 { font-size: 2.8rem; }
.doc section > h2 { padding-bottom: .35em; border-bottom: 2px dashed var(--line-strong); }
.brand { font: 700 24px/1 var(--font-pixel); letter-spacing: .04em; text-transform: none; color: var(--accent); }
.tab, .nav-group > summary, #sidebar::before, .pill, .search-btn, .crumb, .toc-title, .stat .k, .eyebrow, .status-chip, .mode-chip, .mode-tag, .mode-num, .dock-tab, .dock-hint, .codeblock-bar, .seg button, .f-left, .f-mode, .f-right, .toast, .terms dt { font-family: var(--font-pixel); }
.tab { font-size: 15px; font-weight: 500; letter-spacing: .02em; }
.tab.active { border-top-color: transparent; box-shadow: inset 0 -4px 0 var(--accent); }
.search-btn { border: 2px solid var(--line-strong); border-radius: 0; font-size: 14px; clip-path: var(--notch2); height: 30px; }
.search-btn kbd { font-family: var(--font-pixel); }
.pill { font-size: 14px; color: var(--accent-text); }
.icon-btn { border-radius: 0; }

/* quest log sidebar */
#sidebar::before { content: "Quest log"; padding: 14px 20px 10px; font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: none; color: var(--accent-text); }
.nav-group > summary { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--fg-2); }
.nav-group > summary .count { font-family: var(--font-pixel); font-size: 13px; color: var(--faint); }
.nav-item { font-family: var(--font-pixel); font-size: 14.5px; line-height: 24px; padding-top: 2px; padding-bottom: 2px; }
.nav-item.active { box-shadow: inset 4px 0 0 var(--accent); }
.nav-item .num { display: inline-grid; place-items: center; width: 26px; height: 20px; flex: none; font: 600 12px/1 var(--font-pixel); color: var(--muted); border: 2px solid var(--line-strong); }
.nav-item.active .num { color: var(--accent-text); border-color: var(--accent); }
.nav-item.done .num { color: #06210d; background: var(--ok-solid); border-color: var(--ok-solid); }
.nav-item.locked .num { border-style: dashed; }

/* pixel grid ground behind the lessons */
#main { background-color: var(--panel); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; }
.doc { font-size: 15.5px; }
.eyebrow { padding: 3px 10px; font-size: 13px; font-weight: 500; letter-spacing: .06em; clip-path: var(--notch2); }
.status-chip, .mode-chip, .mode-tag { padding: 3px 10px; font-size: 13px; font-weight: 500; border-radius: 0; clip-path: var(--notch2); }
.crumb { font-size: 14px; }
.toc a { font-family: var(--font-pixel); font-size: 14px; }
.toc-title { font-size: 13px; letter-spacing: .08em; }

/* chunky buttons with a pixel-stepped corner and a hard bottom edge */
.btn { height: 40px; padding: 0 20px; font: 600 16px/1 var(--font-pixel); letter-spacing: .02em; border: 0; border-bottom: 4px solid var(--btn-edge); border-radius: 0; clip-path: var(--notch2); transition: none; }
.btn:hover:not([disabled]) { filter: brightness(1.1); border-bottom-color: var(--btn-edge); }
.btn:active:not([disabled]) { transform: translateY(2px); border-bottom-width: 2px; }
.btn:focus-visible { outline-offset: -5px; outline-color: #1b1500; }
.btn.alt, .btn.danger { color: var(--fg); background: var(--btn-bg); border: 0; border-bottom: 4px solid var(--btn-alt-edge); }
.btn.alt:hover:not([disabled]) { background: var(--btn-hover); border-bottom-color: var(--btn-alt-edge); }
.btn.danger { color: var(--err); }
.btn.ghost { color: var(--muted); background: transparent; border: 0; border-bottom: 4px solid transparent; }
.btn.ghost:hover:not([disabled]) { background: var(--hover); color: var(--fg); filter: none; }
.btn.on { color: var(--accent-text); background: var(--accent-soft); border-bottom-color: var(--accent); }
.btn.small { height: 32px; padding: 0 14px; font-size: 14px; border-bottom-width: 3px; border-radius: 0; }
.btn[disabled] { opacity: .45; }

/* blocks: 2px frames with notched corners */
.card, a.tcard, .stat, .terms, .plist, .pager a, .result, .callout, .opt, .hintbox, .codeblock, .modal, .mode-card, .ed, .tile, .toast {
  border-width: 2px; border-style: solid; border-radius: 0; clip-path: var(--notch);
}
.card, a.tcard, .stat, .terms, .plist, .pager a, .opt, .codeblock, .ed, .mode-card { border-color: var(--line-strong); }
.card, a.tcard, .stat, .terms, .plist, .pager a, .mode-card { background: var(--surface); }
a.tcard:hover, .pager a:hover { border-color: var(--accent); background: var(--surface-2); }
.card > .card-h .t, a.tcard .h { font-weight: 600; font-size: 1.4rem; }
.callout { border-color: var(--line-strong); border-left-width: 6px; }
.callout.warn { border-color: var(--line-strong); border-left-color: var(--warn); }
.callout.info { border-color: var(--line-strong); border-left-color: var(--info); }
.callout.tip { border-color: var(--line-strong); border-left-color: var(--accent); }
.hintbox { border-color: var(--warn); }
.opt:has(input:checked) { border-color: var(--accent); }
.opt.right { border-color: var(--ok); } .opt.wrong { border-color: var(--err); }
.opt input, .opt input[type=checkbox] { border-radius: 0; }
.stat .v { font: 700 2.1rem/1.15 var(--font-pixel); color: var(--accent-text); }
.stat .v small { font-family: var(--font-pixel); color: var(--muted); }
.stat .k { font-size: 13px; letter-spacing: .08em; }
.terms dt { font-size: 14px; }
.mode-card { padding: 28px; }
.mode-card:hover { background: var(--surface-2); border-color: var(--accent); }
.mode-card.on { border-color: var(--accent); box-shadow: none; }
.mode-name { font: 700 2.8rem/1 var(--font-pixel); }
.modal { border-color: var(--line-strong); }
.codeblock-bar { font-size: 13px; letter-spacing: .02em; }
.ed:focus-within { border-color: var(--accent); }
kbd { font-family: var(--font-pixel); font-size: 12px; border-radius: 0; border: 2px solid var(--line-strong); padding: 2px 5px; background: var(--surface); }
code { border-radius: 0; }

/* game-style progress: segmented XP bar, level tiles, numbered steps */
.bar { height: 16px; padding: 2px; background: var(--surface); border: 2px solid var(--line-strong); border-radius: 0; }
.bar > i { height: 100%; border-radius: 0; background: repeating-linear-gradient(90deg, var(--ok-solid) 0 8px, transparent 8px 10px); }
.meter small { font-family: var(--font-pixel); font-size: 13px; }
.tile { width: 42px; height: 42px; font: 600 15px var(--font-pixel); color: var(--muted); background: var(--surface); border-color: var(--line-strong); }
.tile:hover { border-color: var(--accent); color: var(--fg); }
.tile.open { color: var(--accent-text); border-color: var(--accent); background: var(--accent-soft); }
.tile.done { color: #06210d; background: var(--ok-solid); border-color: var(--ok-solid); }
.tile.locked { opacity: .6; border-style: dashed; background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(128, 128, 128, .10) 3px 6px); }
.steps li::before { width: 30px; height: 30px; font: 700 15px var(--font-pixel); color: var(--accent-text); background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 0; }
.steps li::after { background: none; border-left: 2px dashed var(--line-strong); width: 0; left: 14px; }
.track-t { font-family: var(--font-pixel); font-size: 15px; }

/* status bar */
#footer { height: 30px; font: 500 14px/28px var(--font-pixel); border-top: 2px solid var(--line-strong); }
.f-left { font: 700 15px/28px var(--font-pixel); letter-spacing: .08em; }
.seg button { height: 28px; font: 600 14px var(--font-pixel); letter-spacing: .08em; border-radius: 0; }
.seg button.on { color: #1b1500; }
#toasts { bottom: 42px; }
.toast { padding: 8px 16px; font-size: 15px; background: var(--surface); border-color: var(--line-strong); border-left: 6px solid var(--accent); }
.toast.err { border-left-color: var(--err); }

/* terminal panel */
#dock { border: 2px solid var(--line-strong); border-radius: 0; }
.dock-tab { font-size: 14px; letter-spacing: .08em; border-top: 0; box-shadow: inset 0 -4px 0 var(--accent); }
.dock-hint { font-size: 13px; }
.term { background-color: #05050a; background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); }
.term-prompt { color: #ffd23f; }
.term .t-err { color: #ff6b81; }

@media (max-width: 900px) {
  :root { --topbar-h: 44px; }
  .brand { font-size: 19px; }
  .tab { font-size: 14px; }
  h1, .doc > header > h1 { font-size: 2.1rem; } h2 { font-size: 1.5rem; }
  .mode-name { font-size: 2.2rem; }
}


/* ---- pixel pets ---- */
.pet { position: fixed; left: 0; bottom: 30px; z-index: 40; width: 48px; cursor: pointer; transition: left var(--dur, 0s) linear, opacity .3s; outline-offset: 2px; user-select: none; -webkit-tap-highlight-color: transparent; }
.pet.main { z-index: 41; }
.pet.guide { width: 40px; }
.pet.bye { opacity: 0; pointer-events: none; }
.pet svg { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.pet .pe { fill: var(--pe); }
.pet:not(.sleep) .pe { animation: pet-blink 4.2s steps(1, end) infinite; }
.pet.sleep .pe { fill: var(--pb); }
.pet-body { transform-origin: 50% 100%; }
.pet.walk .pet-body { animation: pet-hop .42s steps(2, end) infinite; }
.pet.idle .pet-body { animation: pet-breathe 1.8s steps(2, end) infinite; }
.pet.sleep .pet-body { transform: translateY(2px); }
.pet.happy .pet-body { animation: pet-jump .5s steps(5, end) 3; }
.pet.oops .pet-body { animation: pet-shake .3s steps(2, end) 5; }
.pet-bubble { position: absolute; bottom: 100%; margin-bottom: 10px; width: max-content; max-width: min(240px, calc(100vw - 24px)); padding: 7px 11px; font: 500 14px/1.35 var(--font-pixel); color: var(--fg); background: var(--surface); border: 2px solid var(--line-strong); cursor: default; z-index: 2; }
.pet-bubble::after { content: ""; position: absolute; left: var(--tail, 18px); bottom: -8px; width: 8px; height: 8px; background: var(--line-strong); }
.pet-bubble[hidden] { display: none; }
.pet-who { display: block; margin-bottom: 2px; font: 600 12px var(--font-pixel); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.pet-bubble a { color: var(--accent); text-decoration: underline; word-break: break-all; }
.pet-q { display: block; }
.pet-q-b { display: flex; gap: 8px; margin-top: 8px; }
.pet-q-b .btn { min-height: 28px; padding: 2px 12px; }
.pet-fx { position: absolute; left: 0; right: 0; top: 0; height: 0; pointer-events: none; }
.pet-float { position: absolute; top: 4px; font: 700 15px var(--font-pixel); color: var(--faint); animation: pet-up 1.8s steps(8, end) both; }
.pet .pet-float svg { width: 14px; height: 12px; }
@keyframes pet-hop { 50% { transform: translateY(-5px); } }
@keyframes pet-breathe { 50% { transform: translateY(-1px); } }
@keyframes pet-jump { 40% { transform: translateY(-16px); } 60% { transform: translateY(-16px); } }
@keyframes pet-shake { 0% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
@keyframes pet-up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }
@keyframes pet-blink { 0%, 94%, 100% { fill: var(--pe); } 95%, 97% { fill: var(--pb); } }
@media (prefers-reduced-motion: reduce) { .pet, .pet * { animation: none !important; transition: none !important; } }
@media (max-width: 900px) { .pet { width: 36px; } .pet.guide { width: 32px; } }

.pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.pet-card, .pet-gear-i { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 12px; background: var(--surface); border: 2px solid var(--line-strong); clip-path: var(--notch); }
.pet-card.on, .pet-gear-i.on { border-color: var(--accent); }
.pet-card b, .pet-gear-i b { font: 600 17px var(--font-pixel); }
.pet-gear-i span { font: 14px var(--font-pixel); color: var(--muted); }
.pet-gear-i:not(.on) .pet-prev { opacity: .35; }
.pet-gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.pet-prev svg { display: block; image-rendering: pixelated; }
.pet-card .pet-prev { animation: pet-breathe 1.8s steps(2, end) infinite; }
.pet-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.pet-name { height: 36px; width: min(260px, 100%); padding: 0 12px; font: 500 16px var(--font-pixel); color: var(--fg); background: var(--code-block); border: 2px solid var(--line-strong); border-radius: 0; }
.pet-name:focus { outline: none; border-color: var(--accent); }
.pet-check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.pet-check input { width: 18px; height: 18px; accent-color: var(--accent); }

.pet-card.unmet .pet-prev { filter: brightness(0) opacity(.55); }
.pet-sub { font: 13px var(--font-pixel); color: var(--muted); text-align: center; }


/* ---- data tables (props-table look): hairline grid, bold header, striped rows, code chips ---- */
